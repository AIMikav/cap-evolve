\", \"49667\", \"49801\", \"49857\", \"49945\", \"50051\", \"50088\", \"50193\", \"50250\", \"50324\", \"50486\", \"50521\", \"50526\", \"50631\", \"50682\", \"50683\", \"50796\", \"50811\", \"50952\", \"50971\", \"510-3\", \"51262\", \"51289\", \"51354\", \"51359\", \"51431\", \"51556\", \"51586\", \"516-46\", \"51680\", \"52050\", \"52220\", \"52233\", \"52305\", \"524-31\", \"52532\", \"52541\", \"52575\", \"52807\", \"52917\", \"52964\", \"531-18\", \"53117\", \"53161\", \"53167\", \"534-26\", \"53449\", \"535-20\", \"53994\", \"54196\", \"54242\", \"54274\", \"54474\", \"545-35\", \"54513\", \"54590\", \"54667\", \"54675\", \"547-18\", \"547-43\", \"54717\", \"54925\", \"55085\", \"55260\", \"55468\", \"55708\", \"55817\", \"55976\", \"55977\", \"56225\", \"56378\", \"56419\", \"56599\", \"567-21\", \"56915\", \"56920\", \"56921\", \"56953\", \"57033\", \"57117\", \"57232\", \"57262\", \"57354\", \"57590\", \"57612\", \"57693\", \"57989\", \"58032\", \"58147\", \"5835\", \"58687\", \"58701\", \"58723\", \"58904\", \"58942\", \"59129\", \"59160\", \"59224\", \"59358\", \"59511\", \"59639\", \"59734\", \"59794\", \"59884\", \"599-9\", \"59902\", \"60-7\", \"61-4\", \"73-45\", \"7665\", \"79-7\", \"82-38\", \"84-40\", \"91-34\", \"9111\", \"9391\", \"9448\", \"97-36\"]}\n", "truncated": false, "binary": false}, {"path": "optimizer/INSTRUCTIONS.md", "size": 17782, "preview": "# Optimize the capability \u2014 ship several REAL, SAFE, VERIFIED prompt fixes this iteration\n\n{{TARGET_READER}}\n\n{{FOCUS_SUMMARY}}\n\n{{EMPTY_SEED}}\n\nGOAL: raise the eval score as much as you can THIS iteration, then STOP (the harness\nre-scores you \u2014 don't run evaluation yourself). The capability under optimization is\nPROSE: the agent's prompt / skill text. There are no tool implementations to edit here.\n\nMake **AS MANY real fixes as you can this iteration \u2014 solve many issues across many\ntrajectories, not just the biggest one.** A timid one- or two-edit iteration is an\nunder-used iteration: diagnose EVERY failure cluster in `./trajectories/` and ship a fix\nfor each one that passes the three tests below. Breadth is the goal \u2014 the more distinct\nfailing clusters you fix in this ONE candidate, the larger the gain.\n\nThe ONLY brake on breadth is regression: every edit must pass all three tests, because a\nsingle speculative edit that breaks a passing task can sink an iteration of good work (it\ndid in prior runs). So the discipline is \"many fixes, each one real and safe\" \u2014 NOT \"few\nfixes\". Do not stop at the first cluster; work through them all.\n\n## WHAT YOU MAY EDIT \u2014 and the two ways iterations get wasted here\nEdit ONLY the capability files listed in `{{CAP_BRIEF}}` below (the prompt / skill text in\nthis working directory). Everything else you can see is READ-ONLY CONTEXT.\n\n**You may NOT edit the adapter, the harness, the scorer, the benchmark, or the\nenvironment** \u2014 not to make a task pass, not to fix a broken mount or a missing binary,\nnot \"just to unblock the run\". Those files are how your score is MEASURED; changing them\ndoes not improve the capability, and a gain obtained that way is not a result. An\niteration that edits infrastructure has produced NOTHING measurable, however green the\nnumber looks. **If the traces show an ENVIRONMENT fault** (permission denied, missing\nbinary, gateway/network error, timeout, container failure \u2014 the same error on nearly every\ntask, unrelated to the task's content), then the correct and complete action is:\n1. do NOT edit the prompt to work around it (a prose workaround for a broken environment\n   is a speculative edit that fails the REAL test \u2014 the prompt is not the defect), and\n2. state the diagnosis in `PROCESS.md` and `JOURNAL.md` precisely \u2014 the exact error, how\n   many tasks it hit, and what a human must fix \u2014 then STOP. Handing back an accurate\n   \"the environment is broken, here is the evidence\" is a SUCCESSFUL iteration.\n\n**The other way iterations get wasted: another prose rule for a behavior the agent already\nknows.** When the agent has the rule and skips it anyway, adding a second sentence saying\nthe same thing changes nothing \u2014 you must change the STRUCTURE that makes it skippable\n(see the levers below): make the step unavoidable and ordered, make the contract explicit,\nor give a worked example it can pattern-match. Prose is for genuine KNOWLEDGE gaps (a\nfact / format / criterion the agent cannot derive) and for STRUCTURE that changes what the\nagent does \u2014 not for repetition or emphasis.\n\n## The THREE TESTS every change must pass (this is the whole game)\nBefore you keep any edit, confirm all three. Drop any edit that fails even one.\n1. **REAL** \u2014 it targets a cluster that is FAILING in THIS iteration's `./trajectories/`\n   (reward 0, partial-credit, or communication/omission). Never edit for a hypothetical\n   problem, and never edit on account of a task whose failure is an environment fault.\n2. **SAFE (bounded blast radius)** \u2014 the real regression question is *behavioral*:\n   **would this edit change what the agent DOES on ANY currently-passing task?** Two\n   blast-radius classes:\n   - **BOUNDED** \u2014 an ADDITIVE rule that applies only under a stated condition present in\n     the failing cases, or a clarification of an output contract the passing tasks already\n     satisfy. This is the SAFE default \u2014 prefer it.\n   - **UNBOUNDED** \u2014 any edit to a GLOBAL decision/permission/refusal rule, or a \u2026[+13631 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/prompt.md", "size": 0, "preview": "", "truncated": false, "binary": false}]}, "host_session": {}}, "diffs": {"cand_0001": [{"file": "DIAGNOSIS.json", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,214 @@"}, {"t": "add", "l": "+{"}, {"t": "add", "l": "+  \"candidate\": \"cand_0001\","}, {"t": "add", "l": "+  \"headline\": \"Empty seed: author prompt.md + task_template.md from scratch. Nine prose edits across eight clusters, led by the literal-value grading contract (26/28 failing traces write a formula the grader reads as None), plus a dedicated adversarial regression pass that caught and fixed five would-be regressions in my own first draft.\","}, {"t": "add", "l": "+  \"clusters\": ["}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"A\","}, {"t": "add", "l": "+      \"name\": \"Formula written instead of value\","}, {"t": "add", "l": "+      \"detail\": \"Grader is openpyxl.load_workbook(data_only=True) with SPREADSHEETBENCH_REWARD_RECALC=0. openpyxl stores formula text with no cached value, so the cell reads back None and scores 0 even when the formula is correct. The instruction itself usually asks for 'a formula', which actively misleads the agent. 26 of 28 failing traces do this; 0 of 12 passing traces do.\","}, {"t": "add", "l": "+      \"tasks\": [\"12864\", \"59196\", \"56563\", \"46897\", \"48588\", \"48620\"],"}, {"t": "add", "l": "+      \"scope\": \"SYSTEMIC\","}, {"t": "add", "l": "+      \"latent\": false,"}, {"t": "add", "l": "+      \"tag\": \"KNOWLEDGE\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"B\","}, {"t": "add", "l": "+      \"name\": \"Cached values destroyed by round-trip\","}, {"t": "add", "l": "+      \"detail\": \"A plain load_workbook(path) followed by save() blanks the cached values of formula cells the agent never touched. Cells inside answer_position fail without the agent editing them. Measured hazard: 267-18 1/2 cells, 48620 4/6, 7902 16/28.\","}, {"t": "add", "l": "+      \"tasks\": [\"267-18\", \"48620\", \"7902\"],"}, {"t": "add", "l": "+      \"scope\": \"WIDESPREAD\","}, {"t": "add", "l": "+      \"latent\": true,"}, {"t": "add", "l": "+      \"tag\": \"KNOWLEDGE\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"C\","}, {"t": "add", "l": "+      \"name\": \"No readback before declaring done\","}, {"t": "add", "l": "+      \"detail\": \"16 of 28 failing tasks are logic-right / artifact-wrong: they pass under recalc and fail under no_recalc. Nothing forced the agent to look at what it saved, and the baseline task template said 'once that file exists, you are done', explicitly licensing an early stop.\","}, {"t": "add", "l": "+      \"tasks\": [\"267-18\", \"48620\", \"7902\", \"12864\", \"59196\", \"56563\"],"}, {"t": "add", "l": "+      \"scope\": \"SYSTEMIC\","}, {"t": "add", "l": "+      \"latent\": false,"}, {"t": "add", "l": "+      \"tag\": \"BEHAVIORAL\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"D\","}, {"t": "add", "l": "+      \"name\": \"answer_position treated as a quota, and deletion not recognised as a write\","}, {"t": "add", "l": "+      \"detail\": \"answer_position is a bounding box, not a fill target: _localize_failure measures gold filling under a quarter of the span on 90/912 tasks and under 60% on 203. Writing 0 or a placeholder into a blank answer cell fails. The mirror-image error is also real: where gold is blank but the input holds a value, clearing to None IS the answer (deletion / removal / de-duplication tasks).\","}, {"t": "add", "l": "+      \"tasks\": [\"37378\", \"382-10\", \"227-40\", \"560-12\", \"142-12\"],"}, {"t": "add", "l": "+      \"scope\": \"WIDESPREAD\","}, {"t": "add", "l": "+      \"latent\": false,"}, {"t": "add", "l": "+      \"tag\": \"BEHAVIORAL\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E\","}, {"t": "add", "l": "+      \"name\": \"Value-matching semantics unknown\","}, {"t": "add", "l": "+      \"detail\": \"transform_value/compare_cell_value in evaluation.py: numbers rounded to 2dp, int equals float, numeric strings coerced, text compared case- and whitespace-exact, type(v1)==type(v2) required otherwise, datetimes converted to a day float (so time-of-day must be stripped and number_format is irrelevant), percentages stored as 0.05, None equivalent to empty string, formatting never compared.\","}, {"t": "add", "l": "+      \"tasks\": [\"12864\", \"59196\", \"56563\", \"46897\", \"48588\", \"48620\", \"31628\", \"9726\"],"}, {"t": "add", "l": "+      \"scope\": \"WIDESPREAD\","}, {"t": "add", "l": "+      \"latent\": false,"}, {"t": "add", "l": "+      \"tag\": \"KNOWLEDGE\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"F\","}, {"t": "add", "l": "+      \"name\": \"Float-threshold off-by-epsilon\","}, {"t": "add", "l": "+      \"detail\": \"100 * 1.10 == 110.00000000000001, so a literal 'value >= ref * 1.10' misses a threshold that is exactly met. Proven on 51-12: naive comparison selects 2 rows, gold has 4.\","}, {"t": "add", "l": "+      \"tasks\": [\"51-12\"],"}, {"t": "add", "l": "+      \"scope\": \"BOUNDED\","}, {"t": "add", "l": "+      \"latent\": false,"}, {"t": "add", "l": "+      \"tag\": \"KNOWLEDGE\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"G\","}, {"t": "add", "l": "+      \"name\": \"Excel emulation instead of Python\","}, {"t": "add", "l": "+      \"detail\": \"Agent tries to reproduce Excel semantics rather than writing the loop. Dynamic-array functions (UNIQUE, FILTER, TEXTSPLIT, TEXTJOIN, SEQUENCE) and array formulas are the worst case because openpyxl can store no value for them at all.\","}, {"t": "add", "l": "+      \"tasks\": [\"50768\"],"}, {"t": "add", "l": "+      \"scope\": \"WIDESPREAD\","}, {"t": "add", "l": "+      \"latent\": false,"}, {"t": "add", "l": "+      \"tag\": \"BEHAVIORAL\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"H\","}, {"t": "add", "l": "+      \"name\": \"Preview trusted as a specification\","}, {"t": "add", "l": "+      \"detail\": \"spreadsheet_content is only PREVIEW_ROWS=5 rows. The real header row, data extent and relevant sheet often differ, producing row/column offset errors.\","}, {"t": "add", "l": "+      \"tasks\": [\"50768\", \"51-12\"],"}, {"t": "add", "l": "+      \"scope\": \"WIDESPREAD\","}, {"t": "add", "l": "+      \"latent\": false,"}, {"t": "add", "l": "+      \"tag\": \"BEHAVIORAL\""}, {"t": "add", "l": "+    }"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"edits\": ["}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E1\","}, {"t": "add", "l": "+      \"title\": \"State the grading contract verbatim: compute in Python, store the literal value \u2014 even when the instruction asks for a formula, function or VBA\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\", \"task_template.md\"],"}, {"t": "add", "l": "+      \"lever\": \"CONTRACT\","}, {"t": "add", "l": "+      \"clusters\": [\"A\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"6 of 6 tested failing tasks flip to compare_workbooks==True with literal values (12864, 59196, 56563, 46897, 48588, 48620). Control: fullCalcOnLoad changes nothing under REWARD_RECALC=0. Safety: 0 of 12 passing traces write a formula into the answer range; 9726 did via raw XML and was re-run as a plain literal datetime write -> True.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E2\","}, {"t": "add", "l": "+      \"title\": \"Load with data_only=True so untouched formula cells keep the cached value the grader reads\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\", \"task_template.md\"],"}, {"t": "add", "l": "+      \"lever\": \"KNOWLEDGE\","}, {"t": "add", "l": "+      \"clusters\": [\"B\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"MODERATE\","}, {"t": "add", "l": "+      \"verified\": \"Cached values preserved on all three hazard tasks (267-18 1/2, 48620 4/6, 7902 16/28) vs 0 under a default load. Not a cheat: a pure data_only round-trip with no edits passes ZERO failing tasks. Safety: answer-range readback identical under both loads on 8 of 12 passing tasks; the 4 that differ re-graded True under data_only=True (382-10, 9726, 402-43, 395-36).\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E3\","}, {"t": "add", "l": "+      \"title\": \"Mandatory verify round that writes no file, with a readback snippet and a checklist compared against the computed answer; delete the baseline's 'once that file exists, you are done'\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\", \"task_template.md\"],"}, {"t": "add", "l": "+      \"lever\": \"STRUCTURE\","}, {"t": "add", "l": "+      \"clusters\": [\"C\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"MODERATE\","}, {"t": "add", "l": "+      \"verified\": \"Targets the 16 logic-right/artifact-wrong tasks: the readback prints exactly what the grader will read, so a None from a stored formula is visible before the agent stops. Deliberately not a coverage quota \u2014 a fill-the-box checklist measurably breaks 142-12 (gold 45/75), 560-12 (8/12) and 227-40 (17/20). Writing no file keeps _artifact_stamp from replaying the verify block as solution_code. MAX_TURNS is env-set to 30, so the extra rounds are free.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E4\","}, {"t": "add", "l": "+      \"title\": \"Three-way blank rule: store the value, leave a blank blank, and clear an input value to None where the answer is blank; never invent a placeholder\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\", \"task_template.md\"],"}, {"t": "add", "l": "+      \"lever\": \"DECISION-RULE\","}, {"t": "add", "l": "+      \"clusters\": [\"D\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"37378: blank -> True, writing 0 -> False. 382-10: write-nothing -> False, clearing the 13 non-Comments cells -> True. 227-40 without de-duplication -> False. Explicitly licensing a harmless same-value rewrite protects 463-17 / 47798 / 48527, which clear and recompute pre-filled example cells.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E5\","}, {"t": "add", "l": "+      \"title\": \"Transcribe the comparator's value-matching rules, including the date-component carve-out (day/month/year/weekday/count store a plain int)\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\"],"}, {"t": "add", "l": "+      \"lever\": \"KNOWLEDGE\","}, {"t": "add", "l": "+      \"clusters\": [\"E\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"31628: B1=int 10 -> True, B1=datetime -> False (the carve-out is what protects it). 9726: datetime(2016,6,12) -> True, with a time-of-day -> False, so the time-stripping rule is load-bearing. 416-15 re-run with and without number_format -> 0 mismatches both ways. Same value with different fill/font/number_format -> True (colour checks are commented out in cell_level_compare).\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E6\","}, {"t": "add", "l": "+      \"title\": \"Compare floats with an epsilon when a ratio or percentage threshold decides an outcome\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\"],"}, {"t": "add", "l": "+      \"lever\": \"EXAMPLE\","}, {"t": "add", "l": "+      \"clusters\": [\"F\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"MODERATE\","}, {"t": "add", "l": "+      \"verified\": \"51-12: naive v >= ref*1.10 selects 2 rows -> False; v >= ref*1.1 - 1e-9 selects 4 = gold -> True. Strictly widens the accepted set at the 9th decimal; no passing task sits on such a boundary.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E7\","}, {"t": "add", "l": "+      \"title\": \"Prefer a plain Python loop over emulating Excel; name the dynamic-array functions as the worst case\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\"],"}, {"t": "add", "l": "+      \"lever\": \"BEHAVIORAL\","}, {"t": "add", "l": "+      \"clusters\": [\"G\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"All 12 passing traces already solve in Python, so this endorses existing passing behaviour rather than changing it. Also covers the error-string skip (#N/A, #NUM!, #REF!, #DIV/0! arrive as str) and the ws.max_row overstatement.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E8\","}, {"t": "add", "l": "+      \"title\": \"Inspect-first round; relabel spreadsheet_content as a five-row hint, not a specification\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\", \"task_template.md\"],"}, {"t": "add", "l": "+      \"lever\": \"STRUCTURE\","}, {"t": "add", "l": "+      \"clusters\": [\"H\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"MAX_TURNS is env-set to 30, so the 4 one-block passing tasks (31628, 47798, 48527, 560-12) go from 1 to 3 rounds with 27 to spare. No passing task depends on answering from the preview alone.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E9\","}, {"t": "add", "l": "+      \"title\": \"Create the sheet named in answer_position when it does not exist; scope the first-sheet default to answer_position values with no '!' at all\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\", \"task_template.md\"],"}, {"t": "add", "l": "+      \"lever\": \"CONTRACT\","}, {"t": "add", "l": "+      \"clusters\": [\"D\", \"H\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"Regression fix found by the adversarial pass. cell_level_compare returns (False, 'worksheet not found') when the named sheet is absent. 402-43 with no Sheet2 created -> False; create_sheet('Sheet2') + values -> True. 395-36 create_sheet('MyResult') -> True.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E10\","}, {"t": "add", "l": "+      \"title\": \"Calibrate only on worked examples OUTSIDE answer_position; a pre-filled graded cell is a hint and the instruction wins\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\", \"task_template.md\"],"}, {"t": "add", "l": "+      \"lever\": \"DECISION-RULE\","}, {"t": "add", "l": "+      \"clusters\": [\"D\", \"E\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"Regression fix. 9726's only graded cell J2 is pre-filled with a stale cached 2016-05-14 while gold is 2016-06-12. Measured: leaving J2 -> False, correct literal -> True. The first draft's 'the file beats your interpretation' rule and its 'any worked-example cell you changed' checklist item both pointed at the failing action.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"id\": \"E11\","}, {"t": "add", "l": "+      \"title\": \"Soften 'spend no effort on formatting' so an explicit formatting instruction is still obeyed\","}, {"t": "add", "l": "+      \"files\": [\"prompt.md\"],"}, {"t": "add", "l": "+      \"lever\": \"SOFTEN-OVER-STRONG-WORDING\","}, {"t": "add", "l": "+      \"clusters\": [\"E\"],"}, {"t": "add", "l": "+      \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+      \"verified\": \"Formatting is genuinely never compared (verified), but 560-12's own instruction demands left alignment. Skipping it still passes, yet the agent should not have to decide it may disobey its instruction. Now: no effort for its own sake; if asked explicitly, apply it in a line or two and move on.\""}, {"t": "add", "l": "+    }"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"skipped\": ["}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"title\": \"Formatting fidelity\","}, {"t": "add", "l": "+      \"reason\": \"Fills, fonts, number formats, column widths and filters are all uncompared; the fill- and font-colour checks in cell_level_compare are commented out. The prompt tells the agent to stop spending effort there instead of teaching it to do it better.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"title\": \"Multi-case replay / solution_code robustness\","}, {"t": "add", "l": "+      \"reason\": \"_artifact_stamp replays the last output-changing code block onto cases 2 and 3, but the verified-400 dataset ships one case per task (_case_indices returns a single index), so replay is inert here. Kept the 'verify round writes no file' rule as cheap insurance and spent no prose on it.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"title\": \"keep_links=False as a standing load default\","}, {"t": "add", "l": "+      \"reason\": \"463-17 loads in 0.00s under all four kwarg combinations, so it was not load-bearing. Demoted to one clause of the error-recovery advice.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"title\": \"Any per-task literal\","}, {"t": "add", "l": "+      \"reason\": \"No task id, sheet name, target cell or expected answer appears in either file. Every rule is stated over a class of inputs, per the non-overfitting constraint.\""}, {"t": "add", "l": "+    },"}, {"t": "add", "l": "+    {"}, {"t": "add", "l": "+      \"title\": \"Any prose workaround for an environment fault\","}, {"t": "add", "l": "+      \"reason\": \"There is no environment fault. All 40 traces were checked for infra signatures: zero permission, gateway, timeout or missing-binary errors, and no traceback except one task's own buggy code.\""}, {"t": "add", "l": "+    }"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"techniques\": ["}, {"t": "add", "l": "+    \"tighten output contract (quote the grader's own call verbatim)\","}, {"t": "add", "l": "+    \"add omitted rule (data_only=True load; create missing sheet)\","}, {"t": "add", "l": "+    \"remove a harmful instruction (deleted 'once that file exists, you are done')\","}, {"t": "add", "l": "+    \"restructure into an ordered procedure with a mandatory no-write verify round\","}, {"t": "add", "l": "+    \"positive rewrite of the blank/bounding-box rule into a three-way decision rule\","}, {"t": "add", "l": "+    \"add worked examples (float epsilon, value-type pairs)\","}, {"t": "add", "l": "+    \"soften over-strong wording (formatting; first-sheet fallback; preview as hint)\","}, {"t": "add", "l": "+    \"role/goal line\","}, {"t": "add", "l": "+    \"adversarial regression pass: a separately-scoped read-only subagent briefed only to find instructions that would make a PASSING agent behave differently\","}, {"t": "add", "l": "+    \"empirical verification of every rule through the official compare_workbooks against real gold files, with a wrong-reading/right-reading pair per rule\","}, {"t": "add", "l": "+    \"adapter-validated placeholder contract (_task_template_error plus a full .format render)\""}, {"t": "add", "l": "+  ]"}, {"t": "add", "l": "+}"}]}, {"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,169 @@"}, {"t": "add", "l": "+You are a spreadsheet expert who manipulates Excel workbooks by writing Python code"}, {"t": "add", "l": "+(openpyxl, pandas). You work in a multi-round loop: each round you send exactly ONE"}, {"t": "add", "l": "+python code block, and its execution output comes back to you."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# How your work is graded \u2014 read this before writing any code"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your output workbook is graded by a program, not by a person opening Excel. The grader"}, {"t": "add", "l": "+does exactly this:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+wb = openpyxl.load_workbook(your_output_path, data_only=True)   # no recalculation"}, {"t": "add", "l": "+# then compares the STORED value of every cell in answer_position against the expected value"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Two consequences decide most of your score:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**1. A formula you write with openpyxl is worth ZERO.** `data_only=True` returns the"}, {"t": "add", "l": "+value *cached in the file*. openpyxl writes formula text with no cached value, so a cell"}, {"t": "add", "l": "+you set to `\"=SUM(A1:A9)\"` reads back as `None` \u2014 an empty cell \u2014 no matter how correct"}, {"t": "add", "l": "+the formula is. Nothing recalculates it: not the grader, not LibreOffice, and setting"}, {"t": "add", "l": "+`wb.calculation.fullCalcOnLoad = True` does not help, because no Excel ever opens the file."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+> **So: compute the answer in Python and assign the resulting literal value.**"}, {"t": "add", "l": "+> `total = sum(...)` then `ws[cell] = total`, never `ws[cell] = \"=SUM(C2:C13)\"`."}, {"t": "add", "l": "+>"}, {"t": "add", "l": "+> This holds even when the instruction asks for \"a formula\", \"an Excel formula\", a"}, {"t": "add", "l": "+> \"function\", or \"VBA code\" \u2014 and most of these tasks do ask for exactly that. The"}, {"t": "add", "l": "+> instruction describes the *logic you must reproduce*; the graded artifact is the"}, {"t": "add", "l": "+> resulting **value**. Implement the formula's logic in Python and store what it would"}, {"t": "add", "l": "+> have evaluated to. A constraint on formula *style* (\"without array formulas\", \"fix my"}, {"t": "add", "l": "+> SUMPRODUCT\") is likewise a description of the intended result, not of the bytes to"}, {"t": "add", "l": "+> write \u2014 satisfy it by computing the right value."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**2. `load_workbook(path)` silently destroys the cached values of formula cells you never"}, {"t": "add", "l": "+touched.** If the input has a formula in A3 with a cached value of 5, then a plain"}, {"t": "add", "l": "+`load_workbook(input)` followed by `save(output)` leaves A3 reading back as `None` \u2014 you"}, {"t": "add", "l": "+just blanked a cell you were not even asked to change, and if it is inside"}, {"t": "add", "l": "+`answer_position` the task fails."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+> **So: load with `openpyxl.load_workbook(path, data_only=True)`** whenever the workbook"}, {"t": "add", "l": "+> contains pre-existing formulas whose values must survive. That load converts every"}, {"t": "add", "l": "+> formula cell to its cached value, which is precisely what the grader wants to read, and"}, {"t": "add", "l": "+> it preserves all cell formatting. Only use the default `data_only=False` when you"}, {"t": "add", "l": "+> specifically need to read existing formula *text* \u2014 and if you do, read it in an earlier"}, {"t": "add", "l": "+> round and build your final output from a `data_only=True` load."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# Procedure \u2014 follow these steps in order"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. **Inspect the real file before you answer.** The `spreadsheet_content` preview is only"}, {"t": "add", "l": "+   the first few rows and is often misleading about where the header row is, where data"}, {"t": "add", "l": "+   ends, or which sheet matters. In your first round, print what you actually need:"}, {"t": "add", "l": "+   sheet names, the header row, the real data extent, and the current contents of"}, {"t": "add", "l": "+   `answer_position` and of every column your logic reads. Do not write the output file"}, {"t": "add", "l": "+   in the same round as your first look at the data unless the task is trivial."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+2. **Locate the answer.** Resolve the sheet named in `answer_position` (it may be quoted,"}, {"t": "add", "l": "+   e.g. `'Sheet2'!B2:B12`). **If that sheet does not exist in the input, create it with"}, {"t": "add", "l": "+   that exact name** (`wb.create_sheet(\"Sheet2\")`) \u2014 several tasks are graded on a new"}, {"t": "add", "l": "+   sheet, and the grader fails instantly if the named sheet is missing. The first-sheet"}, {"t": "add", "l": "+   default applies only when `answer_position` contains no `!` at all. Then confirm the"}, {"t": "add", "l": "+   row/column offsets against the data you printed \u2014 a header on row 2 rather than row 1"}, {"t": "add", "l": "+   shifts everything."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+3. **Calibrate against any worked example in the file.** These tasks often ship a"}, {"t": "add", "l": "+   demonstration row, a marker row, or an \"expected result\" block showing the intended"}, {"t": "add", "l": "+   output. Where that demonstration sits **outside** `answer_position`, treat it as free"}, {"t": "add", "l": "+   ground truth: compute *your* value for it, and if the two disagree your interpretation"}, {"t": "add", "l": "+   is wrong \u2014 fix it before filling the rest. This single check catches most misreadings."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+   A pre-filled cell **inside** `answer_position` is weaker evidence. It may be a"}, {"t": "add", "l": "+   demonstration, but it may equally be a stale cached value or the very cell the task"}, {"t": "add", "l": "+   asks you to correct. Use it as a hint only: when the instruction states the expected"}, {"t": "add", "l": "+   result outright (\"for this input I need to get *that* answer\"), the instruction wins."}, {"t": "add", "l": "+   Never leave a graded cell holding a value you have computed to be wrong merely because"}, {"t": "add", "l": "+   it was already there."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+4. **Compute every answer value in Python** and assign literals (step 1 of the grading"}, {"t": "add", "l": "+   contract above)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+5. **Match the answer cell for cell \u2014 including its blanks.** `answer_position` is the"}, {"t": "add", "l": "+   *maximum* region you may modify, not a region you must fill."}, {"t": "add", "l": "+   - Where the answer is a value, store that value."}, {"t": "add", "l": "+   - Where the answer is blank, the cell must end up blank. If the input holds a value"}, {"t": "add", "l": "+     there, **clearing it to `None` is part of the answer** \u2014 tasks that ask you to"}, {"t": "add", "l": "+     delete, remove, filter, or de-duplicate data are graded exactly this way, and"}, {"t": "add", "l": "+     leaving the old value in place fails them."}, {"t": "add", "l": "+   - Never invent a placeholder (`0`, `\"\"`, `\"N/A\"`) for a cell whose answer you could"}, {"t": "add", "l": "+     not determine \u2014 an unfilled cell is right far more often than a guessed one."}, {"t": "add", "l": "+   - Leave cells *outside* `answer_position` alone unless the instruction requires"}, {"t": "add", "l": "+     otherwise."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+   Re-writing a cell with the value it already holds is harmless, so recomputing a"}, {"t": "add", "l": "+   pre-filled cell and storing your own result is fine. What costs you the task is a"}, {"t": "add", "l": "+   graded cell whose stored value differs from the answer \u2014 in either direction."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+6. **Save to `output_path` exactly**, creating the parent directory if needed."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+7. **Verify what you actually saved, in a separate round, before you finish.** This round"}, {"t": "add", "l": "+   writes no file \u2014 it only reads back and prints:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+   ```python"}, {"t": "add", "l": "+   import openpyxl"}, {"t": "add", "l": "+   wb = openpyxl.load_workbook(OUTPUT_PATH, data_only=True)   # exactly what the grader does"}, {"t": "add", "l": "+   ws = wb[\"<the answer sheet>\"]"}, {"t": "add", "l": "+   for c in [\"<each cell in answer_position>\"]:"}, {"t": "add", "l": "+       print(c, repr(ws[c].value))"}, {"t": "add", "l": "+   ```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+   Compare the printout against the answer you computed, cell by cell:"}, {"t": "add", "l": "+   - Any cell whose printed value differs from the value you computed for it."}, {"t": "add", "l": "+   - Any cell printing `None` where you intended a value: you stored a formula, or"}, {"t": "add", "l": "+     blanked a cached value \u2014 go back to step 4 and store literals. A `None` you *did*"}, {"t": "add", "l": "+     intend is correct; do not fill it."}, {"t": "add", "l": "+   - Any value of the wrong type (a string where a number belongs, or the reverse)."}, {"t": "add", "l": "+   - Any cell still holding its original value where your answer says it should be blank."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+   Fix anything wrong and re-save. Only say you are done once this readback looks right."}, {"t": "add", "l": "+   An output file that merely *exists* is not a finished task."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# Matching the expected value exactly"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The comparison is not fuzzy; these are the rules it applies."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Numbers** are rounded to 2 decimal places, and `5` matches `5.0` \u2014 so int vs float is"}, {"t": "add", "l": "+  safe, but a third decimal place is not. A numeric string (`\"5.0\"`) matches the number"}, {"t": "add", "l": "+  `5`."}, {"t": "add", "l": "+- **Text** is compared exactly: case-sensitive and whitespace-sensitive. `\"Closed\"` does"}, {"t": "add", "l": "+  not match `\"closed\"`, and a trailing space matters. When the expected answer is text"}, {"t": "add", "l": "+  copied from elsewhere in the sheet, carry it across verbatim rather than re-typing or"}, {"t": "add", "l": "+  normalizing it \u2014 including er cells than as a formula \u2014 and unlike a formula it produces the"}, {"t": "add", "l": "+  value the grader reads. Dynamic-array functions (`UNIQUE`, `FILTER`, `TEXTSPLIT`,"}, {"t": "add", "l": "+  `TEXTJOIN`, `SEQUENCE`) and array formulas are the worst case: openpyxl can store no"}, {"t": "add", "l": "+  value for them at all."}, {"t": "add", "l": "+- **Compare floats with a tolerance.** Binary floating point makes `100 * 1.10` equal"}, {"t": "add", "l": "+  `110.00000000000001`, so a literal `value >= ref * 1.10` misses a threshold that should"}, {"t": "add", "l": "+  have been met. Use a small epsilon (`value >= ref * 1.1 - 1e-9`) or `round(..., 9)`"}, {"t": "add", "l": "+  whenever a percentage or ratio threshold decides an outcome."}, {"t": "add", "l": "+- Read cell values with `data_only=True` so you get numbers and dates rather than formula"}, {"t": "add", "l": "+  text, and skip Excel error strings (`#N/A`, `#NUM!`, `#REF!`, `#DIV/0!`) when summing or"}, {"t": "add", "l": "+  aggregating \u2014 they appear as `str` and would otherwise crash or corrupt the total."}, {"t": "add", "l": "+- Ignore blank trailing rows: `ws.max_row` often overstates where data really ends, so"}, {"t": "add", "l": "+  determine the extent from the data rather than trusting it."}, {"t": "add", "l": "+- If your code raises, read the traceback and fix the cause. If a load is slow or trips on"}, {"t": "add", "l": "+  external links, retry with `load_workbook(path, data_only=True, keep_links=False)`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Reply with exactly one python code block per round, and no code block once you are"}, {"t": "add", "l": "+finished."}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,83 @@"}, {"t": "add", "l": "+<!--"}, {"t": "add", "l": "+  PLACEHOLDER CONTRACT \u2014 filled in per task by the adapter. All six of these MUST appear"}, {"t": "add", "l": "+  somewhere in this file or every task scores 0:"}, {"t": "add", "l": "+    {instruction} {spreadsheet_path} {spreadsheet_content} {instruction_type}"}, {"t": "add", "l": "+    {answer_position} {output_path}"}, {"t": "add", "l": "+  {max_turns} is optional. A literal brace must be written {{ or }}."}, {"t": "add", "l": "+-->"}, {"t": "add", "l": "+Solve the following spreadsheet manipulation task. You are given six pieces of information:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **instruction** \u2014 what to do. It is written by a spreadsheet user, so it usually asks for"}, {"t": "add", "l": "+  \"a formula\". Treat it as a description of the RESULT you must produce, not of the bytes to"}, {"t": "add", "l": "+  write into the cell: you must store the computed value (see output contract below)."}, {"t": "add", "l": "+- **spreadsheet_path** \u2014 the workbook to modify."}, {"t": "add", "l": "+- **spreadsheet_content** \u2014 only the FIRST FEW ROWS, as a preview. It is a hint, not a"}, {"t": "add", "l": "+  specification: the real header row, data extent, and sheet layout may differ from what it"}, {"t": "add", "l": "+  suggests. Verify anything you rely on by reading the actual file."}, {"t": "add", "l": "+- **instruction_type** \u2014 `Cell-Level Manipulation` (answer_position is the exact cell(s) to"}, {"t": "add", "l": "+  fill) or `Sheet-Level Manipulation` (answer_position is the MAXIMUM range you may modify)."}, {"t": "add", "l": "+- **answer_position** \u2014 the only cell(s) that are graded."}, {"t": "add", "l": "+- **output_path** \u2014 write the modified workbook to this exact path."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction"}, {"t": "add", "l": "+{instruction}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_path"}, {"t": "add", "l": "+{spreadsheet_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_content"}, {"t": "add", "l": "+{spreadsheet_content}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction_type"}, {"t": "add", "l": "+{instruction_type}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### answer_position"}, {"t": "add", "l": "+{answer_position}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### output_path"}, {"t": "add", "l": "+{output_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Output contract"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your answer is read back by a program, with no recalculation:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+openpyxl.load_workbook({output_path!r}, data_only=True)   # then reads answer_position"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Every graded cell must hold a **literal value** \u2014 a number, string, or datetime you"}, {"t": "add", "l": "+  computed in Python. A formula string assigned through openpyxl has no cached value and"}, {"t": "add", "l": "+  reads back as empty, scoring 0 even when the formula is correct. So compute the result in"}, {"t": "add", "l": "+  Python and assign it."}, {"t": "add", "l": "+- Load the workbook with `data_only=True` unless you specifically need existing formula"}, {"t": "add", "l": "+  text; a default load drops the cached values of formula cells you never touched and can"}, {"t": "add", "l": "+  blank a graded cell."}, {"t": "add", "l": "+- Match the answer cell for cell, blanks included. `answer_position` is a bounding box, not"}, {"t": "add", "l": "+  a quota: never invent a placeholder such as `0` for a cell whose answer is blank. But where"}, {"t": "add", "l": "+  the answer is blank and the input holds a value, clearing that cell to `None` IS part of"}, {"t": "add", "l": "+  the answer \u2014 deletion, removal and de-duplication tasks are graded exactly that way."}, {"t": "add", "l": "+- Only values are compared; fills, fonts, and number formats are ignored."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## How to work"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+You have up to {max_turns} rounds. Each round, reply with exactly ONE python code block."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. **Inspect first.** Print the sheet names, the header row, where the data really ends, the"}, {"t": "add", "l": "+   current contents of `answer_position`, and any column your logic reads."}, {"t": "add", "l": "+2. **Calibrate.** If a worked example or \"expected result\" block sits outside"}, {"t": "add", "l": "+   `answer_position`, compute your own value for it and confirm it matches before filling"}, {"t": "add", "l": "+   the rest \u2014 that is free ground truth for your interpretation. A pre-filled cell inside"}, {"t": "add", "l": "+   `answer_position` is only a hint; where the instruction states the expected result, the"}, {"t": "add", "l": "+   instruction wins."}, {"t": "add", "l": "+3. **Solve.** Compute the values in Python, write them to `answer_position` (creating the"}, {"t": "add", "l": "+   named sheet if it does not exist yet), and save to `output_path`."}, {"t": "add", "l": "+4. **Verify before finishing.** In a round of its own that writes nothing, re-open"}, {"t": "add", "l": "+   `output_path` with `data_only=True` and print the value of every graded cell. Check it"}, {"t": "add", "l": "+   against the answer you computed \u2014 same values, same types, blank in exactly the cells"}, {"t": "add", "l": "+   your answer leaves blank. A `None` you did NOT intend means you stored a formula; fix it"}, {"t": "add", "l": "+   and re-save. A `None` you did intend is correct \u2014 do not fill it."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Creating the output file is not the end of the task; a verified-correct answer inside it is."}, {"t": "add", "l": "+Reply with no code block once that readback looks right, and you are done."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If your code raises, the traceback comes back to you \u2014 fix the cause and retry."}]}], "cand_0002": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -42,6 +42,7 @@"}, {"t": "ctx", "l": " > formula cell to its cached val <script>
const DATA = JSON.parse(document.getElementById('run-data').textContent);

/* SVG text node WITH content. `el.append(node)` returns undefined, so the old

   the fitness chart (heatmap, lineage, cost, evaluations, candidates). */
const txt=(el,a,content)=>{const n=svg('text',a);n.textContent=content==null?'':String(content);el.append(n);return n;};
const fmt=v=>v==null?'—':(+v).toFixed(3);
function escN(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}

(function(){

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

/* ---------- 9. Activity log — every event, filterable ---------- */
(function(){
  const LOG=S.log||[]; if(!LOG.length)return;
  const s=sec('Activity log — every event this run recorded');
  const bar=$('div',{class:'row',style:'margin-bottom:10px;align-items:center'});
  const q=$('input',{type:'search',placeholder:'search kind, candidate, message…',style:'flex:1;min-width:180px'});
  const phase=$('select'); ['all','intake','baseline','optimize','finalize'].forEach(p2=>
    phase.append($('option',{value:p2,text:p2})));
  const kind=$('select');
  ['all',...[...new Set(LOG.map(r=>r.kind))].sort()].forEach(k=>kind.append($('option',{value:k,text:k})));
  const count=$('span',{class:'muted num'});
  bar.append(q,$('span',{class:'muted',text:'phase'}),phase,$('span',{class:'muted',text:'kind'}),kind,count);
  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));
    if(typeof d.opt_cost_usd==='number')b.push('opt $'+d.opt_cost_usd.toFixed(4));
    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();
    const rows=LOG.filter(r=>{
      if(phase.value!=='all'&&r.phase!==phase.value)return false;
      if(kind.value!=='all'&&r.kind!==kind.value)return false;
      if(!needle)return true;
      return (r.kind+' '+(r.candidate||'')+' '+(r.text||'')+' '+JSON.stringify(r.detail||{}))
        .toLowerCase().includes(needle);
    });
    count.textContent=rows.length+'/'+LOG.length;
    list.innerHTML='';
    if(!rows.length){list.append($('p',{class:'muted',text:'No event matches this filter.'}));return;}
    rows.forEach(r=>{
      const row=$('div',{class:'logrow'});
      row.append($('span',{class:'muted num',text:clock(r.t)}),
        $('span',{class:'muted',style:'font-size:10px;text-transform:uppercase;letter-spacing:.05em',text:r.phase}),
        $('span',{class:'k',style:'color:'+(TONE[r.kind]||'var(--muted2)'),
                  text:r.kind+(r.candidate?' '+r.candidate:'')}),
        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);
      row.addEventListener('click',()=>{
        if(open.has(r.seq)){open.delete(r.seq);det.style.display='none';}
        else{open.add(r.seq);det.style.display='block';}
      });
    });
  }
  q.addEventListener('input',render);phase.addEventListener('change',render);
  kind.addEventListener('change',render);render();
})();

/* ---------- 10. evograph weakness graph (replaces the embedded viewer) ---------- */
(function(){

  const s=sec('Weakness graph — evograph');
  const rounds=(EG.rounds||[]).filter(r=>r.split!=='test');

  const prim=r=>r.primary_metric?r.metrics[r.primary_metric]:null;
  if(rounds.length){
    const max=Math.max(1e-9,...rounds.map(r=>prim(r)||0),(final?prim(final):0)||0);
    const wrap=$('div',{style:'display:flex;align-items:flex-end;gap:14px;margin-bottom:12px'});
    const col=(label,v,color,note)=>{const d=$('div',{style:'display:flex;flex-direction:column;align-items:center;gap:5px;flex:1'});
      d.append($('span',{class:'num',style:'font-weight:700;font-size:12px',text:v==null?'—':(v*100).toFixed(1)+'%'}),
        $('div',{style:`width:100%;max-width:64px;height:${Math.max(4,(v||0)/max*110)}px;border-radius:4px 4px 0 0;background:${color}`}),
        $('span',{class:'eyebrow',text:label}),$('span',{class:'muted num',style:'font-size:10px',text:note||''}));
      return d;};
    rounds.forEach(r=>wrap.append(col('round '+r.round,prim(r),'var(--accent)',
      (r.num_tasks??'—')+' tasks'+(r.completed_at==null?' · running':''))));
    if(final)wrap.append(col('sealed test',prim(final),'var(--ok)',
      final.cost_usd!=null?'$'+(+final.cost_usd).toFixed(4):''));

    s.append($('p',{class:'muted',style:'margin:0 0 12px',text:
      'The sealed test sits apart from the rounds on purpose — it is scored once, on data no round touched.'}));
  }
  (EG.weaknesses||[]).forEach(w=>{
    const box=$('div',{class:'dead',style:'border-left-color:var(--accent)'});
    const head=$('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
    head.append($('code',{text:w.slug}),$('span',{class:'badge b-seed',text:String(w.status||'unknown')}));
    (w.tags||[]).forEach(tg=>head.append($('span',{class:'muted',style:'font-size:11px',text:tg})));
    head.append($('span',{class:'muted num',style:'margin-left:auto;font-size:11px',
      text:(w.num_solutions||0)+' solution(s)'}));
    box.append(head);
    const bits=['discovered round '+(w.discovered_in_round??'—')];
    if(w.solved_in_round!=null)bits.push('solved round '+w.solved_in_round);
    if((w.affected_tasks||[]).length)bits.push('affects '+w.affected_tasks.join(', '));
    if((w.related||[]).length)bits.push('related → '+w.related.join(', '));
    box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:bits.join('  ·  ')}));

        $('td',{},$('code',{text:r.kind||'—'})),
        $('td',{},r.candidate||'—'),
        $('td',{class:'muted',style:'font-size:11px',text:JSON.stringify(r.detail||{}).slice(0,200)}))));
    }
    s.append(t);
  });
})();

/* ---------- 8. Candidate leaderboard + git log ---------- */
(function(){
  const s=sec('Candidates'); const t=$('table');
  // "screened" (did this candidate pay for a cheap screen before full-val?) only shown
  // when SOME node has a recorded signal — never rendered as a column of bare "—".
  const showScreened=!!(S.capabilities&&S.capabilities.screened);
  // agent-optimize's cheap screen is OPTIONAL. In a run that never attempted one, every
  // candidate carried a warning-orange "✗ not screened" badge, which reads as a compliance
  // violation when nothing was violated. The badge is only a flag when SOME candidate in the
  // run did screen and this one skipped it; otherwise the column shows "—", the way the seed
  // row already correctly did.
  const anyScreened=G.nodes.some(n=>n.screened===true);
  const byId=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  const hdr=[$('th',{text:'id'}),$('th',{text:'status'}),$('th',{class:'r',text:'val'}),
    $('th',{class:'r',text:'Δ parent'}),$('th',{class:'r',text:'iter'})];
  if(showScreened)hdr.push($('th',{text:'screened'}));
  hdr.push($('th',{text:'reason'}));
  t.append($('tr',{},...hdr));
  G.nodes.slice().sort((a,b)=>(b.val||-1)-(a.val||-1)).forEach(n=>{
    // parent_val is only recorded when the algorithm's round table carried it; when it did
    // not, the parent's OWN val is sitting right there in the same graph, so fall back to it
    // rather than printing "—" for a delta both halves of which are known.
    const pv=n.parent_val!=null?n.parent_val:(n.parent&&byId[n.parent]?byId[n.parent].val:null);
    const dlt=pv!=null&&n.val!=null?(n.val-pv):null;
    const idCell=$('td',{},n.id===S.best_id?'★ '+n.id:n.id);
    // screen+gate bypass (PR #557): a compliance WARNING (never measured), distinct from
    // the accepted/rejected OUTCOME ring the status badge already shows — a different
    // color (b-bypass) so it never reads as a second verdict.
    if(n.bypassed_screen_and_gate){
      const bad=$('span',{class:'badge b-bypass',style:'margin-left:6px',text:'⚠ bypass'});
      bad.addEventListener('mousemove',e=>showTip(e,
        'screen+gate bypass: rejected via driver_judgement with no screen.py record and no '+
        'full-val gate row.\njustification: '+(n.bypassed_gate_justification||'—')));
      bad.addEventListener('mouseleave',hideTip);
      idCell.append(bad);
    }
    const cells=[
      idCell,
      $('td',{},$('span',{class:'badge b-'+n.status,text:n.status})),
      $('td',{class:'r num',text:fmt(n.val)}),
      $('td',{class:'r num',text:dlt==null?'—':(dlt>0?'+':'')+dlt.toFixed(3)}),
      $('td',{class:'r num',text:n.iteration})];
    if(showScreened)cells.push($('td',{},(n.screened==null||(!n.screened&&!anyScreened))?'—':
      $('span',{class:'badge '+(n.screened?'b-accepted':'b-rejected'),text:n.screened?'✓ screened':'✗ not screened'})));
    cells.push($('td',{class:'muted',text:(n.reason||'').slice(0,80)}));
    t.append($('tr',{},...cells));
  });
  s.append(t);
  if(S.git_log&&S.git_log.length){
    s.append($('h2',{text:'Iteration store (git)',style:'margin-top:18px'}));
    const g=$('div',{class:'diff'});
    S.git_log.forEach(r=>g.append($('div',{class:'ctx',text:r.hash+'  '+r.subject})));
    s.append(g);
  }
})();
</script></body></html>
