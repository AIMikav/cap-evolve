order, against the sheet's labels** | 50768 | the sheet labels its axes (`D12='Impact'` heading the row-level strip `E12:E14`=3,2,1; `F16='Liklihood'` heading the column-level strip `F15:H15`=1,2,3). The agent printed all of that and then wrote: *\"Despite labels in the sheet appearing swapped vs prompt wording, the worked value F14='1, 3, 5' proves F:H correspond to Impact\"*. F14 is the **diagonal** cell (Impact 1, Likelihood 1) \u2014 invariant under transposition, so it proves nothing. | KNOWLEDGE + reasoning rule | 1.0 |\n\n**Environment faults: none.** Both traces ran all three rounds, executed every code block\nwithout error, completed the mandated verify round, and printed a clean checklist. Nothing\ninfrastructural; these are capability failures.\n\n**No other clusters exist this iteration.** The other 38 tasks score exactly 1.0 (binary\nreward, 1 trial each); there is no partial-credit or communication/omission failure to cluster.\nI did not invent a third cluster to pad the candidate \u2014 the prior run lost three consecutive\niterations to exactly that reflex (see META_INSIGHTS).\n\n## Changes made this iteration (one row per edit)\n| # | cluster | edit class (from `guidance/system-prompt/SKILL.md`) | file | what it does |\n| --- | --- | --- | --- | --- |\n| A | 1b | **4. add a rule the source requires** + **5. add an example** | `prompt.md` \u2014 new \u00a7\"A 2-D grid: the sheet's own labels fix which axis is which\" | defines *level strip* (the label run bordering the grid, explicitly **including below/right**, because an upward-increasing matrix puts its column labels underneath), gives the 3-line lookup idiom, and states: the strips are the authority, the instruction's word order is not. Carries the **no-strip fallback** (then the wording *is* the authority) and the diagonal-invariance caution. |\n| B | 1a | **consolidate a contradiction** (tighten in place, delete nothing) | `prompt.md` \u00a7\"Change only what was asked\", the \"one exception\" e where both readings give the same answer \u2026 may not be cited as the reason for your choice.\" |\n| G | 1a | **8. tighten the output contract** (checklist item 2) | `task_template.md` step 3 | a provenance requirement: for every non-numeric string the rule produced in a range whose other cells hold numbers, print the **source cell outside `answer_position`** it came from; if none can be named, delete the branch, compute the number, rewrite and re-verify. |\n| H | 1b | **8. tighten the contract** (checklist item 4) | `task_template.md` step 3 | adds the \"both sides agree\" arm: agreement confirms the rule only if the rejected reading would have differed there, else print `non-discriminating`. |\n\n**Seven distinct edit classes** from the capability skill \u2014 added sourced rule, worked example,\nreason-for-rule, consolidation of a contradiction, restructure-into-ordered-precondition (\u00d72),\noutput-contract tightening (\u00d72). No lever repeated mechanically, and **nothing deleted**: edit B\nis the only change to existing text and it adds a qualifying clause rather than removing a\nconstraint (constraint-line count rises in both files).\n\n## Verify-the-fix + blast radius (one line per edit)\n\n- **A, E, H (grid axes) \u2014 VERIFIED against a measured 1.0 trajectory.** The failing trace's own\n  comment is the evidence: `# Matrix labels: Impact levels down E12:E14, Likelihood levels\n  across F15:H15.` immediately followed by `col_to_impact = {... ws.cell(15, c).value ...}` and\n  `row_to_likelihood = {r: ws.cell(r, 5).value ...}` \u2014 it named the strips correctly and then\n  bound them backwards. The **passing** run of the identical prompt\n  (`reused_seed_run/.../50768__cand_0003__t0.json`) wrote exactly what edit A prescribes:\n  `impact_label = ws.cell(row, 5).value` / `likelihood_label = ws.cell(15, col).value`, producing\n  `F14='1, 3, 5'`, `G14='2'`, `H12='4, 6'` \u2192 **reward 1.0**. The failing run put the `'2'` at\n  `F13` instead of `G14`;  contradicted by the scorer ('once that file exists, you are done') rather than adding a competing rule beside it\""}, {"t": "add", "l": "+  ]"}, {"t": "add", "l": "+}"}]}, {"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,223 @@"}, {"t": "add", "l": "+# Role"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+You are an expert spreadsheet engineer. You are given a question about an Excel workbook"}, {"t": "add", "l": "+and you deliver **a modified workbook file**, produced by running Python (openpyxl and"}, {"t": "add", "l": "+pandas are available) in a sandbox."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+You are not asked to teach the user a formula. Most questions are phrased as \"what formula"}, {"t": "add", "l": "+can I use to \u2026\", \"could you suggest a formula\", \"how can I create an Excel 365 formula\"."}, {"t": "add", "l": "+That phrasing describes the **result** the user wants to see in the cells. Your deliverable"}, {"t": "add", "l": "+is that result, already computed and stored as a value. Answering with a formula in the"}, {"t": "add", "l": "+cell delivers nothing that can be graded."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# How your work is graded \u2014 read this before writing any code"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+An automated grader opens your output file with"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+openpyxl.load_workbook(output_path, data_only=True)"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+and compares, cell by cell, **every** cell of `answer_position` against a gold workbook."}, {"t": "add", "l": "+It never opens Excel and **never recalculates anything**."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Three consequences decide almost every task:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. **A formula in an answer cell scores zero.** `data_only=True` returns a cell's *cached*"}, {"t": "add", "l": "+   value. A cell you set to `\"=SUM(B2:B9)\"` through openpyxl is saved with no cached"}, {"t": "add", "l": "+   value, so the grader reads `None` and the cell is wrong \u2014 even when the formula logic"}, {"t": "add", "l": "+   is perfect. The invariant you must satisfy is: *every graded answer cell holds a"}, {"t": "add", "l": "+   literal value that `data_only=True` can read.* Compute the answer in Python and assign"}, {"t": "add", "l": "+   the literal."}, {"t": "add", "l": "+2. **Cells you were not asked to change are compared too.** For those the gold holds the"}, {"t": "add", "l": "+   cell's **original input value**, so writing anything into them fails the task exactly"}, {"t": "add", "l": "+   as hard as a wrong answer does."}, {"t": "add", "l": "+3. **Python types must match** after the grader's normalisation (below). A date written as"}, {"t": "add", "l": "+   the string `\"12-Jun-16\"` never matches a real date."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## The grader's value comparison, exactly"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Both values are normalised, then compared with `==`, and **a type mismatch after"}, {"t": "add", "l": "+normalisation is an automatic fail**."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+| Value you wrote | How the grader normalises it |"}, {"t": "add", "l": "+| --- | --- |"}, {"t": "add", "l": "+| `int`, `float`, `bool` | `round(float(v), 2)` |"}, {"t": "add", "l": "+| `str` that parses as a number (`\"3.5\"`) | `round(float(v), 2)` \u2014 so it matches `3.5` |"}, {"t": "add", "l": "+| `str` that does not parse as a number | compared **exactly**: case-sensitive and whitespace-sensitive |"}, {"t": "add", "l": "+| `datetime.datetime` / `date` | Excel serial day number, **rounded** to a whole day |"}, {"t": "add", "l": "+| `datetime.time` | the string `\"HH:MM:SS\"` |"}, {"t": "add", "l": "+| `None` | equal to `None` and to `\"\"`, nothing else |"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+What follows from the table:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Do not round.** Write the exact computed number; the grader rounds both sides to 2"}, {"t": "add", "l": "+  decimals. Rounding to 0 or 1 decimal yourself turns a correct answer into a wrong one."}, {"t": "add", "l": "+- `3`, `3.0` and `\"3\"` are interchangeable, so int-vs-float is never a problem."}, {"t": "add", "l": "+- **Where text is expected, keep the source text byte for byte** \u2014 same case, same"}, {"t": "add", "l": "+  internal and trailing spaces. Do not strip it, title-case it, or parse it into a number"}, {"t": "add", "l": "+  or a date. If the cell you are copying from holds the string `\"25\"`, copying the string"}, {"t": "add", "l": "+  is safe; converting it to `25` is also safe; but converting a non-numeric label is a"}, {"t": "add", "l": "+  guaranteed mismatch."}, {"t": "add", "l": "+- **Where a date or time is expected, write a real `datetime`/`date`/`time` object**, not a"}, {"t": "add", "l": "+  formatted string. Setting `number_format` changes only how Excel displays a cell; it"}, {"t": "add", "l": "+  does not change the stored value the grader reads. For a date, carry **no time of day**:"}, {"t": "add", "l": "+  the serial number is rounded to a whole day, so a stray `14:30` rounds the date up to the"}, {"t": "add", "l": "+  next day and fails. Use `d.date()` or `datetime(y, m, d)` when the answer is a date."}, {"t": "add", "l": "+- An Excel error string (`\"#N/A\"`, `\"#NUM!\"`, `\"#VALUE!\"`, `\"#REF!\"`, `\"#DIV/0!\"`) is"}, {"t": "add", "l": "+  almost never the expected answer. If your computation yields one, the logic is wrong \u2014"}, {"t": "add", "l": "+  fix the logic instead of writing the error text into the cell."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## \"Open at time T\" means not yet closed at T"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+This applies when each record carries a **start** date (created / opened / hired / received)"}, {"t": "add", "l": "+and an **end** date (closed / resolved / completed / left, often blank for the live ones),"}, {"t": "add", "l": "+and the cell you are filling is labelled with a **single moment** \u2014 \"open as of today\","}, {"t": "add", "l": "+\"still open by the end of July\", \"outstanding at year end\", \"headcount at 31 Dec\", \"WIP at"}, {"t": "add", "l": "+month end\". Count a record only if it had started by that moment and had not yet ended:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+open_at_T = start <= T and (end is None or end > T)   # an end date on or before T = closed at T"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+A record that ended *during* the period is **closed** at the end of that period. The other"}, {"t": "add", "l": "+reading \u2014 \"was open at some point during the period\" \u2014 is a different and always-larger"}, {"t": "add", "l": "+quantity:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+open_during = start <= period_end and (end is None or end >= period_start)   # NOT the same count"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Users routinely write the second while asking for the first: a predicate like \"not closed"}, {"t": "add", "l": "+before the first day of the month and not created after the last day of the month\" describes"}, {"t": "add", "l": "+the whole span, and it admits every record that closed mid-month \u2014 records that were *not*"}, {"t": "add", "l": "+open at month end. **When the quantity the cell's own label names is a moment, the moment"}, {"t": "add", "l": "+governs**, even where the instruction's own predicate describes a span; the span reading"}, {"t": "add", "l": "+makes the whole column come out uniformly too high, which is the most common way a counting"}, {"t": "add", "l": "+column fails. If the label genuinely names a window (\"open during July\", \"active at any time"}, {"t": "add", "l": "+in Q3\", \"tickets touched in the month\"), use `open_during`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Test it against the data before you save, not against your own intention. A moment-in-time"}, {"t": "add", "l": "+count taken at a moment later than the last end date anywhere in the sheet must equal the"}, {"t": "add", "l": "+plain number of records that never ended. And across a row of columns labelled at increasing"}, {"t": "add", "l": "+moments, a record may drop out of the count only once its own end date has gone by \u2014 so if a"}, {"t": "add", "l": "+record is still in your count for a moment that is *after* its end date, the rule is wrong."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Writing the literal value: wrong and right"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+# WRONG \u2014 the grader reads None in D2, the task scores 0."}, {"t": "add", "l": "+ws[\"D2\"] = \"=VLOOKUP(A2,Data!A:B,2,FALSE)\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# RIGHT \u2014 do the lookup in Python, assign the result."}, {"t": "add", "l": "+lookup = {ws_data.cell(r, 1).value: ws_data.cell(r, 2).value"}, {"t": "add", "l": "+          for r in range(2, ws_data.max_row + 1)}"}, {"t": "add", "l": "+ws[\"D2\"] = lookup.get(ws[\"A2\"].value)      # a real str / int / float / datetime"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Reimplement Excel semantics in Python rather than delegating to Excel. Common"}, {"t": "add", "l": "+translations: `VLOOKUP`/`INDEX+MATCH` \u2192 a dict or a linear scan; `SUMIFS`/`COUNTIFS` \u2192"}, {"t": "add", "l": "+a filtered loop with `sum()`/`len()`; `TEXTJOIN` \u2192 `\", \".join(...)`; `UNIQUE` \u2192 an"}, {"t": "add", "l": "+order-preserving dedupe; `IFERROR` \u2192 `try`/`except`; `TEXTSPLIT` \u2192 `str.split`;"}, {"t": "add", "l": "+`MAXIFS` \u2192 `max(...)` over the filtered rows. Dynamic-array functions (`FILTER`,"}, {"t": "add", "l": "+`UNIQUE`, `TEXTSPLIT`, `SEQUENCE`, `LET`) and `AGGREGATE` must be reimplemented \u2014 there is"}, {"t": "add", "l": "+no spreadsheet engine behind your output file at all."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If a cell **inside** the answer range already holds a formula that must keep its current"}, {"t": "add", "l": "+result, do not leave the formula in place: re-opening and saving the workbook with openpyxl"}, {"t": "add", "l": "+discards every cached formula value. Read the cached value from the input with"}, {"t": "add", "l": "+`load_workbook(input_path, data_only=True)` and write that literal back."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# Change only what was asked"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The gold workbook is the input workbook with the answer filled in \u2014 nothing else moved."}, {"t": "add", "l": "+So:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Load the given input file and edit it in place.** Never build a fresh workbook or a"}, {"t": "add", "l": "+  fresh sheet when you can modify the existing one; styles, column widths, untouched"}, {"t": "add", "l": "+  columns and other sheets must survive."}, {"t": "add", "l": "+- **Decide cell by cell whether the instruction asks you to change that cell.** The answer"}, {"t": "add", "l": "+  range frequently spans more cells than the task fills. A cell that the instruction does"}, {"t": "add", "l": "+  not ask about must come out of your code holding exactly the value it had on the way in,"}, {"t": "add", "l": "+  and a cell the gold leaves empty must stay empty \u2014 do not pad the range to its last row."}, {"t": "add", "l": "+- **Treat values already present in the answer range as ground truth, not as cells to"}, {"t": "add", "l": "+  overwrite.** Instructions such as \"as I have manually done in column B\", or a header like"}, {"t": "add", "l": "+  \"Expected Result\", mean the user filled in part of the answer by hand. Leave those cells"}, {"t": "add", "l": "+  untouched and use them to check the values you compute for the cells that are still"}, {"t": "add", "l": "+  empty. If your rule disagrees with the user's own worked rows, your rule is wrong."}, {"t": "add", "l": "+- **A worked illustration that lives OUTSIDE `answer_position` is a check, never the cells"}, {"t": "add", "l": "+  you copy.** Sheets often carry a hand-drawn picture of the wanted output somewhere else \u2014"}, {"t": "add", "l": "+  a block lower down under a caption like \"THE ABOVE TABLE WOULD BECOME:\", a mock-up on"}, {"t": "add", "l": "+  another sheet, a few rows beside the data. Use it to work out the rule and the shape, then"}, {"t": "add", "l": "+  build every graded cell by running that rule over the **source data**. Do not transcribe"}, {"t": "add", "l": "+  the block cell by cell into the graded range: it was typed by hand and is allowed to be"}, {"t": "add", "l": "+  incomplete, while the gold is what the rule produces from the real data."}, {"t": "add", "l": "+- **The one exception to that: a cell whose existing text cannot possibly match.** So that"}, {"t": "add", "l": "+  you can tell, compute your rule's value for every cell the instruction asks you to produce"}, {"t": "add", "l": "+  a value for \u2014 pre-filled or not, so that an already-populated cell is a comparison you make"}, {"t": "add", "l": "+  rather than a cell you silently skip \u2014 and compare it, cell by cell, with what is already"}, {"t": "add", "l": "+  there. The exception fires on exactly one"}, {"t": "add", "l": "+  combination: **your rule produces a number or a date for that cell, and the cell holds text"}, {"t": "add", "l": "+  that does not parse as one** (`n/a`, `-`, `?`, `TBD`, an empty string, a leftover `#VALUE!`"}, {"t": "add", "l": "+  or `#NUM!`). By the normalisation table above that cell is *already* scored wrong whatever"}, {"t": "add", "l": "+  you do, because non-numeric text can never normalise to a number or a serial date \u2014 so it"}, {"t": "add", "l": "+  is not a worked answer, it is a stand-in the user left behind. **Write your computed value"}, {"t": "add", "l": "+  into it.**"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  Everywhere else the bullet above still governs. Two separate things are not covered by it"}, {"t": "add", "l": "+  at all and are not this exception either: a cell holding a **formula** (replace it with the"}, {"t": "add", "l": "+  literal value the task wants, as described above \u2014 a formula left in place reads as empty),"}, {"t": "add", "l": "+  and a cell the instruction explicitly tells you to **update or correct**. The exception"}, {"t": "add", "l": "+  itself is per cell and per type, and it is not a licence to tidy a column: it does not apply to a"}, {"t": "add", "l": "+  cell your rule produces no value for (a header or label sitting inside the range, an input"}, {"t": "add", "l": "+  column inside the range, a row the instruction excludes), and it does not apply when your"}, {"t": "add", "l": "+  rule's own output for that cell is text \u2014 if your rule copies the source text `N/A`"}, {"t": "add", "l": "+  through, then your rule *produces* `N/A` and there is no type conflict to resolve. Two"}, {"t": "add", "l": "+  numbers that merely differ a little are also no conflict: that is normally the user"}, {"t": "add", "l": "+  hand-rounding or float noise, which the grader's 2-decimal rounding already forgives."}, {"t": "add", "l": "+- **Cells your rule does not cover keep their input value exactly.** That includes headers"}, {"t": "add", "l": "+  and labels inside the range, input columns inside the range, rows the instruction's"}, {"t": "add", "l": "+  condition excludes, and **data already sitting in a region you were asked to *append* to**"}, {"t": "add", "l": "+  \u2014 append below it; finding the first free row by testing cells for emptiness is the"}, {"t": "add", "l": "+  correct way to locate the append point, and regenerating or reordering the rows already"}, {"t": "add", "l": "+  there is a loss even when you would rewrite them with identical content."}, {"t": "add", "l": "+- Clearing a cell is a legitimate change when the instruction asks for it: write `None`,"}, {"t": "add", "l": "+  not `\"\"` or `0`. A cell whose correct answer is \"nothing\" must come out empty \u2014 the gold"}, {"t": "add", "l": "+  for an answer range is frequently mostly empty, so never pad cells just to fill the range."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# Check your logic against the examples you were given"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Instructions in this benchmark routinely state a concrete case: \"if the submission date is"}, {"t": "add", "l": "+21-Jun-16 the answer is 12-Jun-16\", \"A2 should display 1 if B2 is not empty\", \"an Impact of"}, {"t": "add", "l": "+1 and a Likelihood of 1 goes in the bottom-left box\". Before you accept your own"}, {"t": "add", "l": "+computation, evaluate it on every such case stated in the instruction and on every example"}, {"t": "add", "l": "+row already present in the sheet, and print the comparison. A rule that disagrees with a"}, {"t": "add", "l": "+stated example is wrong no matter how reasonable it looks."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Only the cells an example actually fills are evidence.** An example disagrees with you"}, {"t": "add", "l": "+when it holds a value, you computed a value for the same cell, and the two values differ \u2014"}, {"t": "add", "l": "+that is the signal that your rule is wrong, and you fix the rule and recompute. An example"}, {"t": "add", "l": "+that is simply **blank or truncated** where you computed a value is not that signal: a"}, {"t": "add", "l": "+hand-typed illustration is allowed to be missing cells, and omitting a cell is not a rule."}, {"t": "add", "l": "+So when the example is empty there but the **source data plainly holds a value** for it,"}, {"t": "add", "l": "+keep your computed value \u2014 the gold comes from the data, not from the gaps in someone's"}, {"t": "add", "l": "+typing. Never delete a value you computed, and never copy an example's blank over it, just"}, {"t": "add", "l": "+to make a comparison print clean."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# `answer_position` and sheets"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+`answer_position` is one or more comma-separated ranges. A part may be prefixed with a"}, {"t": "add", "l": "+sheet name \u2014 `'Report'!D3:D10` \u2014 and the quotes are not part of the name. A part with **no**"}, {"t": "add", "l": "+sheet prefix is graded on the workbook's **first** sheet, whatever that sheet happens to be"}, {"t": "add", "l": "+called, so resolve it as `wb.worksheets[0]` / `wb.sheetnames[0]` rather than assuming"}, {"t": "add", "l": "+`\"Sheet1\"`. A single cell such as `C14` is a range of one cell. The sheet must exist in"}, {"t": "add", "l": "+your output under exactly that name."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+`instruction_type` tells you how to read the range:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Cell-Level Manipulation** \u2014 `answer_position` is the exact set of cells that is graded."}, {"t": "add", "l": "+- **Sheet-Level Manipulation** \u2014 `answer_position` is the *maximum* region you may touch."}, {"t": "add", "l": "+  Stay inside it; it is still compared in full, so the parts of it your answer does not"}, {"t": "add", "l": "+  occupy must keep their original values."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Cell formatting, fill colour and fonts are **not** graded. Spend your effort on values."}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,140 @@"}, {"t": "add", "l": "+<!--"}, {"t": "add", "l": "+  Per-task user message. The {placeholders} below are filled in by the adapter and are"}, {"t": "add", "l": "+  load-bearing. REQUIRED: {instruction} {spreadsheet_path} {spreadsheet_content}"}, {"t": "add", "l": "+  {instruction_type} {answer_position} {output_path}. OPTIONAL: {max_turns}."}, {"t": "add", "l": "+  A literal brace must be written {{ or }}."}, {"t": "add", "l": "+-->"}, {"t": "add", "l": "+Solve the following spreadsheet manipulation task. It is described by six fields:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **instruction** \u2014 what the user wants. It is usually phrased as a request for a formula;"}, {"t": "add", "l": "+  what is graded is the resulting *values*, so read it as a description of the result."}, {"t": "add", "l": "+- **spreadsheet_path** \u2014 the input workbook. Load this file and edit it; do not rebuild it."}, {"t": "add", "l": "+- **spreadsheet_content** \u2014 a partial preview: the first few rows of each sheet, plus the"}, {"t": "add", "l": "+  size of the target. It is lossy. It does not show you exact cell types, trailing spaces,"}, {"t": "add", "l": "+  merged cells, which cells hold formulas, or any row past the preview \u2014 so do not plan"}, {"t": "add", "l": "+  your solution from the preview alone."}, {"t": "add", "l": "+- **instruction_type** \u2014 `Cell-Level Manipulation`: answer_position is the exact graded"}, {"t": "add", "l": "+  cells. `Sheet-Level Manipulation`: answer_position is the maximum region you may modify."}, {"t": "add", "l": "+- **answer_position** \u2014 the graded range(s). Every cell in it is compared against the gold"}, {"t": "add", "l": "+  workbook, including cells the instruction does not ask you to change."}, {"t": "add", "l": "+- **output_path** \u2014 write the finished workbook to exactly this path."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction"}, {"t": "add", "l": "+{instruction}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_path"}, {"t": "add", "l": "+{spreadsheet_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_content"}, {"t": "add", "l": "+{spreadsheet_content}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction_type"}, {"t": "add", "l": "+{instruction_type}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### e plus the entries that matter (if it is large,"}, {"t": "add", "l": "+print the first and last few, never all of it). `mine` is the set checklist items 2 and 4"}, {"t": "add", "l": "+below are judged against, so do not shrink it by skipping cells that look already-done \u2014 a"}, {"t": "add", "l": "+cell that already holds something is a comparison to make, not a cell to skip. Then write:"}, {"t": "add", "l": "+assign the literal values (never a string beginning with `=`), leaving alone every cell your"}, {"t": "add", "l": "+rule produces no value for, and save to `output_path` (create its parent directory first)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Step 3 \u2014 Verify (required; do not declare yourself finished before this round has run).**"}, {"t": "add", "l": "+Re-open the file you just wrote the way the grader does and look at what it actually"}, {"t": "add", "l": "+contains:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+from openpyxl import load_workbook"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+SHEET, RNG = \"<the graded sheet>\", \"<the graded range>\"   # wb.worksheets[0] if unprefixed"}, {"t": "add", "l": "+graded = load_workbook(OUTPUT_PATH, data_only=True)[SHEET]  # exactly how the grader reads it"}, {"t": "add", "l": "+raw    = load_workbook(OUTPUT_PATH)[SHEET]                  # reveals formulas left behind"}, {"t": "add", "l": "+_in    = load_workbook(INPUT_PATH,  data_only=True)"}, {"t": "add", "l": "+src    = _in[SHEET] if SHEET in _in.sheetnames else None    # the original values (may be a"}, {"t": "add", "l": "+                                                            # sheet you had to create)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+cells = [c.coordinate for row in graded[RNG] for c in row]"}, {"t": "add", "l": "+shown = cells if len(cells) <= 24 else cells[:12] + cells[-12:]   # big range: just the ends"}, {"t": "add", "l": "+for co in shown:"}, {"t": "add", "l": "+    g = graded[co].value"}, {"t": "add", "l": "+    print(co, \"graded:\", repr(g), type(g).__name__,"}, {"t": "add", "l": "+          \"| raw:\", repr(raw[co].value),"}, {"t": "add", "l": "+          \"| input:\", repr(src[co].value) if src is not None else \"(new sheet)\")"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# A formula is invisible to the grader: data_only reads it as None, so check the raw copy."}, {"t": "add", "l": "+left = [co for co in cells"}, {"t": "add", "l": "+        if isinstance(raw[co].value, str) and raw[co].value.startswith(\"=\")]"}, {"t": "add", "l": "+assert not left, f\"formulas the grader will read as empty: {{left}}\""}, {"t": "add", "l": "+print(\"graded non-empty:\", sum(graded[co].value is not None for co in cells),"}, {"t": "add", "l": "+      \"of\", len(cells))"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# For every cell your rule covered that ALREADY held something, show the decision you made."}, {"t": "add", "l": "+# Cap the output: print the first and last few, then the totals."}, {"t": "add", "l": "+clashes = [] if src is None else [(co, src[co].value, mine[co]) for co in mine"}, {"t": "add", "l": "+                                  if co in cells and src[co].value is not None]"}, {"t": "add", "l": "+for co, old, new in (clashes if len(clashes) <= 12 else clashes[:6] + clashes[-6:]):"}, {"t": "add", "l": "+    print(co, \"was\", repr(old), type(old).__name__, \"-> my rule\", repr(new),"}, {"t": "add", "l": "+          type(new).__name__, \"-> wrote\", repr(graded[co].value))"}, {"t": "add", "l": "+print(\"pre-filled cells my rule covers:\", len(clashes))"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Then read that output against this checklist. Every item must be answered from a value you"}, {"t": "add", "l": "+actually printed \u2014 a line that restates your rule and ends in \"checked\" does not satisfy"}, {"t": "add", "l": "+any item:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. No cell in the graded r <script>
const DATA = JSON.parse(document.getElementById('run-data').textContent);
const G = DATA.graph, S = DATA.summary, DIFFS = DATA.diffs||{};
const $ = (t,a={},...k)=>{const e=document.createElement(t);for(const[p,v]of Object.entries(a)){
  if(p==='html')e.innerHTML=v;else if(p==='text')e.textContent=v;else e.setAttribute(p,v);}
  for(const c of k)if(c!=null)e.append(c);return e;};
const NS='http://www.w3.org/2000/svg';
const svg=(t,a={})=>{const e=document.createElementNS(NS,t);for(const[p,v]of Object.entries(a))e.setAttribute(p,v);return e;};
/* SVG text node WITH content. `el.append(node)` returns undefined, so the old
   `el.append(svg('text',...)).textContent = x` threw a TypeError on the very first axis
   label — which aborted the whole inline script and silently dropped every panel below
   the fitness chart (heatmap, lineage, cost, evaluations, candidates). */
const txt=(el,a,content)=>{const n=svg('text',a);n.textContent=content==null?'':String(content);el.append(n);return n;};
const fmt=v=>v==null?'—':(+v).toFixed(3);
function escN(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}
const main=document.getElementById('main'), tip=document.getElementById('tip');
const STATUS_META={running:['running','var(--accent)'],awaiting_agent:['awaiting agent','var(--idk)'],
  completed:['completed','var(--ok)'],budget_exhausted:['budget exhausted','var(--warn)'],
  stalled:['stalled','var(--warn)'],interrupted:['interrupted','var(--fail)'],failed:['failed','var(--bad)']};
document.getElementById('hdr').textContent =
  `${S.run_id} · ${S.algorithm||'algorithm not recorded'} · ${S.counts.total-1} candidates · ` +
  `${S.test_sealed?'test sealed':'test not sealed'}`;
function showTip(e,txt){tip.textContent=txt;tip.style.display='block';
  tip.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.style.display='none';}
function sec(title){const s=$('section');s.append($('h2',{text:title}));main.append(s);return s;}
function dsecs(v){v=Math.max(0,Math.round(v||0));if(v<60)return v+'s';
  const m=Math.floor(v/60);if(m<60)return m+'m '+(v%60)+'s';return Math.floor(m/60)+'h '+(m%60)+'m';}

/* ---------- 1. KPI strip ---------- */
(function(){
  const s=sec('Summary'); const g=$('div',{class:'kpis'});
  const dpct=S.delta_pct!=null?`${S.delta_pct>0?'+':''}${S.delta_pct}%`:
            (S.delta_abs!=null?`${S.delta_abs>0?'+':''}${S.delta_abs.toFixed(3)}`:'—');
  const kp=(l,v,cls='',s2='')=>{const k=$('div',{class:'kpi'});k.append($('div',{class:'l',text:l}),
    $('div',{class:'v '+cls,text:v}));if(s2)k.append($('div',{class:'s',text:s2}));return k;};
  const c=S.counts, cost=S.cost;
  g.append(
    kp('best val',fmt(S.best_val),'champ',S.best_id),
    kp('baseline',fmt(S.baseline_val)),
    kp('Δ vs baseline',dpct,(S.delta_abs>0?'ok':'')),
    kp('held-out test',fmt(S.test_reward),'',
       // The raw sealed score alone is not the result — the DELTA against the seed's own test
       // score is, and both were already in final.json. A run can lift val and lose test.
       (S.test_delta!=null||S.test_baseline_reward!=null)
         ?((S.test_delta!=null?(S.test_delta>0?'+':'')+S.test_delta.toFixed(3)+' vs seed ':'')+
           (S.test_baseline_reward!=null?fmt(S.test_baseline_reward):'')+
           (S.test_sealed?' · sealed once':''))
         :(S.test_sealed?'sealed once':'not finalized')),
    kp('candidates',c.total-(c.seed||0),'',
       `${c.accepted} accept · ${c.rejected} reject · ${c.indecisive||0} indecisive · ${c.failed} no-measure`),
    kp('frontier',S.frontier,'','gated leaves with no accepted child'),
    kp('wall clock',`${S.wall_clock_seconds}s`,'',`opt ${S.optimizer_seconds}s · run ${S.runner_seconds}s`),
    kp('cost',`$${cost.total_usd.toFixed(4)}`,'',`opt $${cost.optimizer_usd.toFixed(4)} · run $${cost.runner_usd.toFixed(4)}`),
    // Token count without its split reads as implausible next to the dollar figure (a real run:
    // 206M tokens for $4.80). The split explains it: nearly all of them are RUNNER tokens on a
    // self-hosted endpoint that bills $0, and the dollars are the optimizer's.
    kp('tokens',S.tokens.toLocaleString(),'',S.tokens_by_role?
       `run ${S.tokens_by_role.runner.toLocaleString()} · opt ${S.tokens_by_role.optimizer.toLocaleString()}`:''),
    kp('unattributed $',
       S.cost_ledger?`$${S.cost_ledger.unattributed_usd.toFixed(4)}`:'—',
       (S.cost_ledger&&Math.abs(S.cost_ledger.unattributed_usd)>0.0005?'champ':''),
       'recorded spend the events cannot explain'),
    kp('events',S.event_count!=null?S.event_count:'—','','every line in events.jsonl')
  );
  s.append(g);
})();

/* ---------- 1b. Run status + split honesty ---------- */
(function(){
  const s=sec('Run status');
  const meta=STATUS_META[S.status]||['unknown','var(--muted)'];
  const head=$('div',{style:'display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px'});
  const pill=$('span',{class:'pill',style:`color:${meta[1]};border-color:${meta[1]}66`});
  pill.append($('span',{style:`width:8px;height:8px;border-radius:50%;background:${meta[1]}`}),
              $('span',{text:meta[0]}));
  head.append(pill);
  if(S.algorithm)head.append($('span',{class:'pill',style:'color:var(--accent);border-color:#7c5cff66',
    text:S.algorithm+(S.algorithm_source?' · from '+S.algorithm_source:'')}));
  head.append($('span',{class:'pill',text:S.test_sealed?'test sealed':'test not sealed'}));
  if(S.elapsed_seconds!=null)head.append($('span',{class:'muted num',text:dsecs(S.elapsed_seconds)+(S.elapsed_open?' elapsed so far':' elapsed')}));
  s.append(head);
  if(S.status_reason)s.append($('p',{class:'muted',style:'margin:0 0 10px',text:S.status_reason}));
  const sp=S.splits;
  if(sp&&sp.no_holdout){
    s.append($('div',{class:'banner',html:'<b>No holdout.</b> train, val and test hold the same tasks, so the '+
      '&ldquo;test&rdquo; number is NOT a generalization estimate &mdash; the optimizer saw those tasks. '+
      'Read it as a sanity check only.'}));
  }
  if(sp&&sp.warning)s.append($('div',{class:'banner',text:sp.warning}));
  // Background-task mass-kill (PR #558): 2+ backgrounded Bash calls the harness evicted
  // at the identical millisecond — a compliance WARNING distinct from an outcome, so it
  // gets the 'bad' banner treatment (No holdout above uses the same class).
  (S.background_mass_kills||[]).forEach(mk=>{
    s.append($('div',{class:'banner bad',html:
      `<b>Background task mass-kill.</b> ${mk.count} background tasks were evicted at the `+
      `identical timestamp <code>${mk.timestamp}</code> — the harness's concurrent-`+
      `background-task ceiling, not ${mk.count} tasks coincidentally finishing at once. `+
      `Task ids: ${(mk.task_ids||[]).join(', ')}.`}));
  });
  if(sp)s.append($('p',{class:'muted num',style:'margin:10px 0 0',
    text:`splits · train ${sp.train??'—'} · val ${sp.val??'—'} · test ${sp.test??'—'}`+
         (sp.seed!=null?` · seed ${sp.seed}`:'')+
         '   —   val decides selection; test is scored exactly once and never optimized against.'}));
})();

/* ---------- 1c. Phases timeline ---------- */
(function(){
  const c=S.counts, total=c.total, evaluated=c.accepted+c.rejected;
  const hasBase=S.baseline_val!=null, finalized=(S.test_reward!=null)||S.test_sealed;
  const D=b=>b?'done':'pending';
  const phases=[
    {nm:'Intake',st:D(total>0||hasBase),d:'Interview + scaffold project, adapter, seed.'},
    {nm:'Implement & check',st:D(total>0||hasBase),d:'Hard gate before any budget is spent.'},
    {nm:'Baseline',st:D(hasBase),d:`Freeze splits; seed val ${fmt(S.baseline_val)}.`},
    {nm:'Optimize'+(S.algorithm?' · '+S.algorithm:''),st:finalized?'done':(hasBase?'active':'pending'),
     d:`${evaluated} iters · ${c.accepted} accepted · best ${fmt(S.best_val)}.`},
    {nm:'Finalize',st:D(finalized),d:`Sealed test ${fmt(S.test_reward)}.`},
    {nm:'Report',st:D(finalized),d:'This dashboard.'},
  ];
  const s=sec('Pipeline phases'); const g=$('div',{class:'phases'});
  for(const p of phases){const e=$('div',{class:'phase '+p.st});
    e.append($('div',{class:'nm',text:p.nm}),$('div',{class:'st',text:p.st}),$('div',{class:'d',text:p.d}));
    g.append(e);}
  s.append(g);
})();

/* ---------- 1d. Rejected edits, deduplicated by reason ---------- */
(function(){
  const norm=r=>(r||'rejected').replace(/-?\d+\.\d+/g,'N').replace(/-?\d+/g,'N').trim();
  const map=new Map();
  for(const n of G.nodes){ if(n.status!=='rejected')continue;
    const k=norm(n.reason); const cur=map.get(k)||{reason:k,count:0,ex:[]};
    cur.count++; if(cur.ex.length<3)cur.ex.push(n.id); map.set(k,cur);}
  const ends=[...map.values()].sort((a,b)=>b.count-a.count);
  if(!ends.length)return;
  const s=sec('Rejected edits, grouped by the gate reason');
  for(const d of ends){const e=$('div',{class:'dead'});
    if(d.count>1)e.append($('span',{class:'x',text:'×'+d.count}));
    e.append($('div',{class:'muted',text:d.ex.join(', ')}),$('div',{text:d.reason}));
    s.append(e);}
})();

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

/* ---------- 3. tasks × iterations pass/fail heatmap ---------- */
(function(){
  const tasks=S.tasks||[];
  const iters=G.nodes.filter(n=>Object.keys(n.per_task||{}).length).sort((a,b)=>a.iteration-b.iteration);
  if(!tasks.length||iters.length<1)return;
  const s=sec('Per-task pass/fail across iterations');
  // sort rows worst-first by mean reward
  const meanFor=t=>{let sum=0,n=0;iters.forEach(it=>{if(it.per_task[t]!=null){sum+=it.per_task[t];n++;}});return n?sum/n:0;};
  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));
  const cw=Math.max(10,Math.min(26,Math.floor(1000/iters.length))),ch=16,labW=120;
  const W=labW+iters.length*cw+10,H=rows.length*ch+24;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'heat'});
  iters.forEach((it,j)=>txt(el,{x:labW+j*cw+cw/2,y:12,'text-anchor':'middle'},it.iteration));
  rows.forEach((t,i)=>{
    txt(el,{x:labW-6,y:24+i*ch+11,'text-anchor':'end'},t.length>16?t.slice(0,15)+'…':t);
    iters.forEach((it,j)=>{
      const v=it.per_task[t];
      const col=v==null?'var(--card3)':v>=0.999?'var(--ok)':v<=0.001?'var(--bad)':'var(--warn)';
      const rect=svg('rect',{x:labW+j*cw,y:24+i*ch,width:cw-1.5,height:ch-1.5,rx:2,fill:col});
      const fb=(it.feedback&&it.feedback[t])||'';
      rect.addEventListener('mousemove',e=>showTip(e,`${t} @ iter ${it.iteration} (${it.id})\nreward=${v==null?'—':v.toFixed(3)}\n${fb.slice(0,180)}`));
      rect.addEventListener('mouseleave',hideTip);
      el.append(rect);
    });
  });
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>pass</span><span><i style="background:var(--bad)"></i>fail</span>'+
    '<span><i style="background:var(--warn)"></i>partial</span><span><i style="background:var(--card3)"></i>not run</span>'+
    '<span class="muted">rows sorted worst-first · hover a cell for feedback</span>'}));
})();

/* ---------- 4. Per-iteration diff view ---------- */
(function(){
  const ids=Object.keys(DIFFS); if(!ids.length)return;
  const s=sec('Diff vs parent');
  const bar=$('div',{class:'row'});
  const sel=$('select'); ids.forEach(id=>sel.append($('option',{value:id,text:id})));
  const mode=$('select'); mode.append($('option',{value:'unified',text:'unified'}),$('option',{value:'split',text:'split'}));
  bar.append($('span',{class:'muted',text:'candidate '}),sel,$('span',{class:'muted',text:' view '}),mode);
  s.append(bar);
  const out=$('div',{class:'diff'}); s.append(out);
  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
  function render(){
    const id=sel.value, files=DIFFS[id]||[], split=mode.value==='split';
    out.innerHTML='';
    files.forEach(f=>{
      out.append($('div',{class:'file',text:'━ '+f.file}));
      if(!split){
        f.rows.forEach(r=>out.append($('div',{class:r.t,text:r.l})));
      }else{
        const tbl=$('div'); f.rows.forEach(r=>{
          if(r.t==='hunk'){tbl.append($('div',{class:'hunk',text:r.l}));return;}
          const cls=r.t; const line=$('div',{class:cls});
          line.textContent=(r.t==='del'?'◀ ':r.t==='add'?'▶ ':'  ')+r.l.slice(1);
          tbl.append(line);
        }); out.append(tbl);
      }
    });
  }
  sel.addEventListener('change',render); mode.addEventListener('change',render); render();
})();

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

/* ---------- 6d. Evaluations (split-oriented, distinct from per-iteration) ---------- */
(function(){
  const evals=S.evaluations||[];
  if(!evals.length)return;
  const s=sec('Evaluations');

/* ---------- 9. Activity log — every event, filterable ---------- */
(function(){
  const LOG=S.log||[]; if(!LOG.length)return;
  const s=sec('Activity log — every event this run recorded');
  const bar=$('div',{class:'row',style:'margin-bottom:10px;align-items:center'});
  const q=$('input',{type:'search',placeholder:'search kind, candidate, message…',style:'flex:1;min-width:180px'});
  const phase=$('select'); ['all','intake','baseline','optimize','finalize'].forEach(p2=>
    phase.append($('option',{value:p2,text:p2})));
  const kind=$('select');
  ['all',...[...new Set(LOG.map(r=>r.kind))].sort()].forEach(k=>kind.append($('option',{value:k,text:k})));
  const count=$('span',{class:'muted num'});
  bar.append(q,$('span',{class:'muted',text:'phase'}),phase,$('span',{class:'muted',text:'kind'}),kind,count);
  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));
    if(typeof d.opt_cost_usd==='number')b.push('opt $'+d.opt_cost_usd.toFixed(4));
    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();
    const rows=LOG.filter(r=>{
      if(phase.value!=='all'&&r.phase!==phase.value)return false;
      if(kind.value!=='all'&&r.kind!==kind.value)return false;
      if(!needle)return true;
      return (r.kind+' '+(r.candidate||'')+' '+(r.text||'')+' '+JSON.stringify(r.detail||{}))
        .toLowerCase().includes(needle);
    });
    count.textContent=rows.length+'/'+LOG.length;
    list.innerHTML='';
    if(!rows.length){list.append($('p',{class:'muted',text:'No event matches this filter.'}));return;}
    rows.forEach(r=>{
      const row=$('div',{class:'logrow'});
      row.append($('span',{class:'muted num',text:clock(r.t)}),
        $('span',{class:'muted',style:'font-size:10px;text-transform:uppercase;letter-spacing:.05em',text:r.phase}),
        $('span',{class:'k',style:'color:'+(TONE[r.kind]||'var(--muted2)'),
                  text:r.kind+(r.candidate?' '+r.candidate:'')}),
        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);
      row.addEventListener('click',()=>{
        if(open.has(r.seq)){open.delete(r.seq);det.style.display='none';}
        else{open.add(r.seq);det.style.display='block';}
      });
    });
  }
  q.addEventListener('input',render);phase.addEventListener('change',render);
  kind.addEventListener('change',render);render();
})();

(function(){
  const HS=S.host_session; if(!HS)return;
  const s=sec('Host session — optimizer transcript');
  s.append($('p',{class:'muted',style:'margin:0 0 12px',text:
    'For an agent-driven run, this is the ONLY full record of what the optimizer actually did — '+
    'every tool call, bash command, file edit and reasoning turn between the coarse accept/reject '+
    'events above.'}));
  const h3t=(t)=>$('h2',{style:'margin:16px 0 6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)',text:t});
  if(HS.driver_prompt){
    s.append(h3t('Driver prompt'));
    s.append($('div',{class:'narrative-box md',style:'margin-bottom:14px',html:mdToHtml(HS.driver_prompt)}));
  }
  if(HS.transcript_too_large){
    s.append($('div',{class:'banner',text:
      'transcript.jsonl is '+(HS.transcript_bytes/1e6).toFixed(1)+' MB — too large to parse into '+
      'this dashboard. Read it directly at '+HS.transcript_path}));
    return;
  }
  const turns=HS.transcript_turns||[];
  if(!turns.length)return;
  s.append(h3t('Turns ('+turns.length+(HS.transcript_truncated?' of '+HS.transcript_total_lines+', truncated':'')+')'));
  const list=$('div'); s.append(list);
  turns.forEach(tn=>{
    const row=$('div',{class:'logrow',style:'grid-template-columns:100px 90px 1fr'});
    const clock=tn.t?new Date(tn.t).toLocaleTimeString([],{hour12:false}):'--:--:--';
    const gist=tn.text.split('\n')[0].slice(0,140);
    row.append($('span',{class:'muted num',text:clock}),
      $('span',{class:'k',style:'color:var(--accent)',text:tn.role}),
      $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                text:gist}));
    list.append(row);
    const det=$('div',{class:'logdet'});
    det.textContent=tn.text; // model-authored — never parsed as markup
    det.style.display='none';
    list.append(det);
    row.addEventListener('click',()=>{det.style.display=det.style.display==='block'?'none':'block';});
  });
  if(HS.transcript_truncated)s.append($('p',{class:'muted',style:'margin-top:8px',text:
    'Showing the first '+turns.length+' of '+HS.transcript_total_lines+' turns — full record at '+
    HS.transcript_path}));
})();

/* ---------- 10e. agent-optimize internals — screens/compliance/minibatch/gepa/skillopt/parallel (#433) ---------- */
(function(){
  const C=S.capabilities||{}, AE=S.algo_extra||{};
  if(!(C.screens||C.compliance||C.minibatch||C.gepa||C.skillopt||C.parallel||
       C.round_batches||C.merge_rejects))return;
  const s=sec('agent-optimize internals');
  s.append($('p',{class:'muted',style:'margin:0 0 12px',text:
    "Signals the algorithm computed about its own process — which subset of tasks a cheap screen "+
    "evaluated, whether the discipline of screening before a full-val eval was actually followed, "+
    "and any minibatch/gepa/skillopt/parallel bookkeeping this run recorded."}));
  const h3=(t)=>$('h2',{style:'margin:16px 0 6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)',text:t});

  if(C.compliance){
    s.append(h3('Screen-before-full-val compliance'));
    const t=$('table');
    t.append($('tr',{},$('th',{text:'candidate'}),$('th',{class:'r',text:'iteration'}),
      $('th',{text:'screened before full-val'}),$('th',{text:'why skipped'})));
    (AE.compliance||[]).forEach(r=>t.append($('tr',{},
      $('td',{},$('code',{text:r.candidate})),
      $('td',{class:'r num',text:r.iteration}),
      $('td',{},$('span',{class:'badge '+(r.screened_before_fullval?'b-accepted':'b-rejected'),
        text:r.screened_before_fullval?'✓ yes':'✗ no'})),
      $('td',{class:'muted',style:'font-size:11px',text:r.skip_justification||'—'}))));
    s.append(t);
  }

  if(C.round_batches){
    s.append(h3('Round batches — sibling-count enforcement'));
    s.append($('p',{class:'muted',style:'margin:0 0 8px;font-size:11.5px',text:
      'agent-optimize\'s default is N≥ 3 sibling candidates per round.py invocation; '+
      'fewer requires a recorded reason (an explicit justification, or an unaffordable budget '+
      'detected from spend.py).'}));
    const t=$('table');
    t.append($('tr',{},$('th',{text:'batch'}),$('th',{class:'r',text:'siblings'}),
      $('th',{text:'candidates'}),$('th',{text:'why < 3'})));
    (AE.round_batches||[]).forEach(r=>{
      const below3=r.n_candidates<3;
      t.append($('tr',{},
        $('td',{},$('code',{text:r.batch_id||'—'})),
        $('td',{class:'r num',text:r.n_candidates},
          below3?$('span',{class:'badge b-rejected',style:'margin-left:6px',text:'<3'}):null),
        $('td',{class:'muted',style:'font-size:11px',text:(r.candidates||[]).join(', ')}),
        $('td',{class:'muted',style:'font-size:11px',text:below3?
          `${r.single_candidate_justification||'—'} (${r.single_candidate_justification_source||'unrecorded'})`
          :'—'})));
    });
    s.append(t);
  }

  if(C.merge_rejects){
    s.append(h3('Merge opportunity — safe-but-rejected candidates'));
    const w=AE.merge_rejects_warning;
    const box=$('div',{class:'dead',style:'border-left-color:'+(w.acted_on?'var(--ok)':'var(--warn)')});
    box.append($('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'},
      $('span',{text:w.safe_reject_candidates.length+' disjoint safe rejects never tried together: '}),
      ...w.safe_reject_candidates.map(cid=>$('code',{style:'margin-right:4px',text:cid})),
      $('span',{class:'badge '+(w.acted_on?'b-accepted':'b-rejected'),
        text:w.acted_on?'✓ merge proposed':'✗ unmerged'})));
    box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:
      'each individually zero-regression with a non-negative gate Δ — run merge_rejects.py '+
      '--propose on a disjoint subset to combine them.'}));
    s.append(box);
    (AE.merge_rejects_proposals||[]).forEach(p=>{
      s.append($('div',{class:'muted',style:'font-size:11px;margin:4px 0 0',text:
        'proposed: '+p.tag+' = '+p.rejects.join(' + ')+(p.built?' (built)':' (failed)')}));
    });
  }

  if(C.screens){
    s.append(h3('Screens — cheap subset evals'));
    (AE.screens||[]).forEach(sc=>{
      const box=$('div',{class:'dead',style:'border-left-color:var(--accent)'});
      const head=$('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
      head.append($('code',{text:sc.candidate}),
        $('span',{class:'badge '+(sc.decision==='pass'?'b-accepted':sc.decision==='fail'?'b-rejected':'b-indecisive'),
          text:String(sc.decision||'—')+(sc.inconclusive?' (inconclusive)':'')}));
      if(sc.tier!=null)head.append($('span',{class:'muted',style:'font-size:11px',text:'tier '+sc.tier}));
      box.append(head);
      const bits=[];
      if((sc.ids||[]).length)bits.push('subset ('+sc.ids.length+'): '+sc.ids.join(', '));
      if((sc.fixed||[]).length)bits.push('fixed: '+sc.fixed.join(', '));
      if((sc.regressed||[]).length)bits.push('regressed: '+sc.regressed.join(', '));
      if(sc.mean_delta!=null)bits.push('Δ='+(+sc.mean_delta).toFixed(3)+(sc.se!=null?' ± '+(+sc.se).toFixed(3):''));
      if(sc.threshold!=null)bits.push('threshold='+sc.threshold);
      box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:bits.join('  ·  ')}));
      if(sc.rationale)box.append($('div',{class:'muted',style:'font-size:11px;margin-top:4px',text:'why this subset: '+sc.rationale}));
      s.append(box);
    });
  }

  [['minibatch','Minibatch'],['gepa','GEPA'],['skillopt','SkillOpt'],['parallel','Parallel']].forEach(([key,label])=>{
    if(!C[key])return;
    s.append(h3(label));
    const rows=AE[key]||[];
    const t=$('table');
    if(key==='minibatch'){
      t.append($('tr',{},$('th',{text:'candidate'}),$('th',{class:'r',text:'reward'}),
        $('th',{class:'r',text:'n tasks'}),$('th',{text:'tasks'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.candidate||'—'})),
        $('td',{class:'r num',text:fmt(r.reward)}),
        $('td',{class:'r num',text:r.n_tasks==null?'—':r.n_tasks}),
        $('td',{class:'muted',text:(r.tasks||[]).join(', ').slice(0,120)}))));
    }else{
      t.append($('tr',{},$('th',{text:'kind'}),$('th',{text:'candidate'}),$('th',{text:'detail'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.kind||'—'})),
        $('td',{},r.candidate||'—'),
        $('td',{class:'muted',style:'font-size:11px',text:JSON.stringify(r.detail||{}).slice(0,200)}))));
    }
    s.append(t);
  });
})();

/* ---------- 8. Candidate leaderboard + git log ---------- */
(function(){
  const s=sec('Candidates'); const t=$('table');
  // "screened" (did this candidate pay for a cheap screen before full-val?) only shown
  // when SOME node has a recorded signal — never rendered as a column of bare "—".
  const showScreened=!!(S.capabilities&&S.capabilities.screened);
  // agent-optimize's cheap screen is OPTIONAL. In a run that never attempted one, every
  // candidate carried a warning-orange "✗ not screened" badge, which reads as a compliance
  // violation when nothing was violated. The badge is only a flag when SOME candidate in the
  // run did screen and this one skipped it; otherwise the column shows "—", the way the seed
  // row already correctly did.
  const anyScreened=G.nodes.some(n=>n.screened===true);
  const byId=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  const hdr=[$('th',{text:'id'}),$('th',{text:'status'}),$('th',{class:'r',text:'val'}),
    $('th',{class:'r',text:'Δ parent'}),$('th',{class:'r',text:'iter'})];
  if(showScreened)hdr.push($('th',{text:'screened'}));
  hdr.push($('th',{text:'reason'}));
  t.append($('tr',{},...hdr));
  G.nodes.slice().sort((a,b)=>(b.val||-1)-(a.val||-1)).forEach(n=>{
    // parent_val is only recorded when the algorithm's round table carried it; when it did
    // not, the parent's OWN val is sitting right there in the same graph, so fall back to it
    // rather than printing "—" for a delta both halves of which are known.
    const pv=n.parent_val!=null?n.parent_val:(n.parent&&byId[n.parent]?byId[n.parent].val:null);
    const dlt=pv!=null&&n.val!=null?(n.val-pv):null;
    const idCell=$('td',{},n.id===S.best_id?'★ '+n.id:n.id);
    // screen+gate bypass (PR #557): a compliance WARNING (never measured), distinct from
    // the accepted/rejected OUTCOME ring the status badge already shows — a different
    // color (b-bypass) so it never reads as a second verdict.
    if(n.bypassed_screen_and_gate){
      const bad=$('span',{class:'badge b-bypass',style:'margin-left:6px',text:'⚠ bypass'});
      bad.addEventListener('mousemove',e=>showTip(e,
        'screen+gate bypass: rejected via driver_judgement with no screen.py record and no '+
        'full-val gate row.\njustification: '+(n.bypassed_gate_justification||'—')));
      bad.addEventListener('mouseleave',hideTip);
      idCell.append(bad);
    }
    const cells=[
      idCell,
      $('td',{},$('span',{class:'badge b-'+n.status,text:n.status})),
      $('td',{class:'r num',text:fmt(n.val)}),
      $('td',{class:'r num',text:dlt==null?'—':(dlt>0?'+':'')+dlt.toFixed(3)}),
      $('td',{class:'r num',text:n.iteration})];
    if(showScreened)cells.push($('td',{},(n.screened==null||(!n.screened&&!anyScreened))?'—':
      $('span',{class:'badge '+(n.screened?'b-accepted':'b-rejected'),text:n.screened?'✓ screened':'✗ not screened'})));
    cells.push($('td',{class:'muted',text:(n.reason||'').slice(0,80)}));
    t.append($('tr',{},...cells));
  });
  s.append(t);
  if(S.git_log&&S.git_log.length){
    s.append($('h2',{text:'Iteration store (git)',style:'margin-top:18px'}));
    const g=$('div',{class:'diff'});
    S.git_log.forEach(r=>g.append($('div',{class:'ctx',text:r.hash+'  '+r.subject})));
    s.append(g);
  }
})();
</script></body></html>
