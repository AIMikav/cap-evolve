<html lang="en"><head>
<meta charset="utf-8"/>

<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}

ur entry. So do NOT write 'what worked' as a guess. To learn what actually worked, READ the framework RESULT lines of prior entries (and LEDGER.md): an entry whose RESULT says `rejected` with `broke={...}` tells you which specific edits to drop or redesign \u2014 its diff.patch is in ./prior_iterations/<id>/.\n\nAppend your entry for THIS iteration below the marker, using this shape (INTENT only \u2014 the framework appends the RESULT):\n\n    ## Iteration <your candidate id> \u2014 <one-line headline of what you tried>\n    - Changes I made (1 line per edit; name the file/tool + cluster it targets):\n    - Per change, the EXPECTED effect + why it's safe (which failing task it should fix;\n      why no passing task changes behavior):\n    - Building on prior RESULTS: which prior entries' broke/fixed I used, and what I\n      did NOT re-try because a prior RESULT showed it regressed (cite ids):\n    - Refuted hypotheses (a prior RESULT proved this is NOT the fix \u2014 never re-test):\n    - High-value clusters still NOT cracked (and the guard/tool designs already tried):\n    - Plateau signal (are the last few RESULTs flat/negative? if so, which LEVER to switch\n      to \u2014 e.g. a NEW composite tool instead of another guard, or prompt instead of code):\n    - Focus next iteration:\n\n## Iteration cand_0001 \u2014 create the capability from the empty seed around ONE grading fact: the grader never recalculates, so write literal values, never formulas\n\n- **Changes I made** (the seed was EMPTY \u2014 `prompt.md` was 0 bytes and there was no\n  `task_template.md`, so this creates both):\n  1. `prompt.md` \u00a7\"Role\" + \u00a7\"How your work is graded\" \u2014 **cluster A (formula-in-answer-cell,\n     24 of 26 failures)**: states the grader's reader (`openpyxl.load_workbook(data_only=True)`,\n     never recalculates) and the invariant that follows \u2014 *every graded answer cell holds a\n     literal value* \u2014 plus the reframing that a question phrased \"what formula can I use\" is\n     describing a wanted *result*, not asking for a formula.\n  2. `prompt.md` \u00a7\"The grader's value comparison, exactly\" \u2014 **cluster C (wrong type /\n     Excel error text)**: the normalisation table transcribed from `transform_value` and\n     `compare_cell_value`, including the two non-obvious consequences (*do not round yourself*;\n     a date must carry *no time of day* because the serial is rounded to a whole day).\n  3. `prompt.md` \u00a7\"Writing the literal value: wrong and right\" \u2014 **cluster A**: a WRONG/RIGHT\n     pair plus the Excel\u2192Python translation table (`VLOOKUP`/`INDEX+MATCH`\u2192dict, `SUMIFS`\u2192\n     filtered loop, `TEXTJOIN`\u2192`join`, and dynamic arrays must be reimplemented because there\n     is no spreadsheet engine behind the output file).\n  4. `prompt.md` \u00a7\"Change only what was asked\" + \u00a7\"Check your logic against the examples\" \u2014\n     **cluster D (wrote past the answer / over the user's worked example)**: per-cell rules\n     for what must come out unchanged, and the rule that pre-filled cells inside the range\n     are the user's ground truth to check against, not cells to overwrite.\n  5. `prompt.md` \u00a7\"Open at time T\" \u2014 **cluster E (moment-vs-span counting)**: `open_at_T` vs\n     `open_during` with the rationale and a falsifiable invariant.\n  6. `task_template.md` \u00a7\"How to work\" \u2014 **cluster B (no verification round, all 26\n     failures)**: DELETES the adapter built-in's *\"once that file exists, you are done\"* and\n     replaces it with four ordered steps where step 3 is a mandatory grader-identical read-back\n     (`data_only=True` + a raw read that reveals leftover formulas + `assert not left`) and a\n     4-item checklist, and step 4 permits a no-code reply only once all four items hold.\n- **Expected effect + why each is safe.** Cluster A alone is 24 of 26 failures, so the\n  literal-value contract is the bulk of the expected gain val=0.950 \u0394=+0.600 \u00b7 fixed={12864, 267-18, 2768, 37378, 37456, 39046, 43436, 45635, 46897, 48588, 48620, 48921, 51-12, 53383, 53647, 54144, 55049, 55979, 56563, 59196, 7902, 8942, 9569, 9726} \u00b7 broke={\u2014} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0001: ACCEPTED val=0.950 \u0394=+0.600 -->\n\n## Iteration cand_0002 \u2014 both remaining failures are one defect: a cell INSIDE `answer_position` was used to DEFINE the rule instead of to check it\n\n- **Changes I made** (8 edits, all additive; nothing deleted; one existing clause tightened):\n  1. `prompt.md` \u2014 NEW \u00a7\"A 2-D grid: the sheet's own labels fix which axis is which\"\n     (**cluster 1b, 50768**): defines the *level strip* bordering a cross-tab \u2014 explicitly\n     including **below/right**, since an upward-increasing matrix puts its column labels\n     underneath \u2014 gives the lookup idiom, and rules that the strips beat the instruction's word\n     order. Carries a no-strip fallback and the diagonal-invariance caution.\n  2. `prompt.md` \u00a7\"Change only what was asked\", the \"one exception\" clause (**1a, 59595**):\n     escape hatch tightened to text \"**that the rule took from the source data**\", with \"text\n     your rule emits only because the answer cell already held it is **not** that case\".\n  3. `prompt.md` same section, NEW bullet (**cluster 1, both**): \"**A pre-filled answer cell\n     CHECKS your rule; it never DEFINES it**\" \u2014 forbids only a literal/threshold/cut-off/branch\n     that exists to reproduce a pre-filled **value**, and names the reads that stay legal\n     (append point, existing column layout, pre-filled *formula*, in-place transform). Then the\n     numeric-column case: never emit a carried-over `n/a`/`-`/`?`/`TBD` where the instruction\n     asks for a sum/count/total/rate \u2014 compute the number.\n  4. `prompt.md` \u00a7\"Check your logic against the examples\" (**cluster 1, both**): \"an agreeing\n     example confirms your rule only where a wrong rule would have disagreed\" \u2014 run both\n     readings, print where they differ, classify the example as decisive / non-discriminating /\n     moot.\n  5. `task_template.md` step 1 (**1b**): for a multi-row AND multi-column `answer_position`,\n     printing all four bordering strips and emitting `rows = <var> \u2026, columns = <var> \u2026` is now\n     a precondition of step 2.\n  6. `task_template.md` step 2 (**cluster 1**): when a reading had to be chosen, build both,\n     print the disagreeing coordinates, and name the evidence that picked the winner.\n  7. `task_template.md` checklist item 2 (**1a**): provenance \u2014 for any non-numeric string in a\n     range whose other cells hold numbers, print the **source cell outside `answer_position`**\n     it came from; if none exists, drop the branch, compute the number, rewrite, re-verify.\n  8. `task_template.md` checklist item 4 (**1b**): new \"both sides agree\" arm \u2014 agreement\n     confirms nothing unless the rejected reading would have differed there; else print\n     `non-discriminating`.\n- **Expected effect + why each is safe.** Both failures are the same root cause with two faces.\n  59595 wrote `if <early row>: return \"n/a\"` \u2014 a branch whose only purpose was to reproduce\n  `C4:C6='n/a'` \u2014 and scored 0 on \"3 cell(s) hold str where int was expected\"; the existing\n  \"one exception\" had a loophole (it \"does not apply when your rule's own output \u2026 is text\"),\n  so making the rule *output* the placeholder switched the exception off, and the mandated\n  verify round then printed `agree? True` on a wrong answer. 50768 printed the sheet's axis\n  labels, wrote *\"Despite labels in the sheet appearing swapped vs prompt wording, the worked\n  value F14='1, 3, 5' proves \u2026\"*, and bound the axes backwards \u2014 F14 is the **diagonal** cell,\n  invariant under transposition, so it proved nothing; the two readings differ on exactly one\n  of the nine cells and no example sits there. Safety: edits 5\u20138 fire only under stated\n  conditions (a 2-D range; a forced choice; a non-numeric string in a numeric range) and only\n  add printing to rounds that do not write `output_path`. Edits 1\u20134 are additive knowledge.\n  Two parallel read-only subagents did the behavioural blast-radius check: **all 10 passing\n  tasks with a 2-D `answer_position`** (142-12, 227-40, 37456, 395-36, 402-43, 43436, 45635,\n  560-12, 7902, 80-42) \u2014 six are flat tables with no axis question and the four\n  orientation-dependent ones (37456, 43436, 7902, 45635) **already read the sheet's strips**, so\n  none flips; and the **8 passing tasks with the most pre-filled answer cells** (142-12, 382-10,\n  416-15, 463-17, 48588, 55049, 7902, 2768) \u2014 none reads a pre-filled answer *value* as a rule\n  input and none emits a placeholder. Those audits changed the wording: 560-12 (`I2:J7`, no\n  labels anywhere) is why edit 1 carries the no-strip fallback, and 142-12/382-10/416-15/80-42\n  are why edit 3 explicitly permits in-place transforms, `number_format` reads, pre-filled\n  formula reads and matching an existing column layout.\n- **Building on prior RESULTS.** Built on cand_0001's ACCEPT (+0.600, broke nothing) and left\n  every load-bearing part of it untouched: the literal-value contract, the normalisation table,\n  the four-step procedure, \u00a7\"Open at time T\". **Did NOT re-try** the two edits cand_0001's entry\n  records as measured regressions in the prior run: the openpyxl single-cell-range `TypeError`\n  guard (prior cand_0005, val 1.000 \u2192 0.975) and the defensive sheet-prefix quote-stripping\n  (prior cand_0004, 1.000 \u2192 0.950). This run's `rejected.jsonl` is empty, so nothing here can be\n  a re-proposal within this run.\n- **Refuted hypotheses \u2014 never re-test.** (a) The two guards above: both factually correct, both\n  measured as losing tasks. (b) cand_0001's inference that \"val is saturated, so propose\n  nothing\" \u2014 **this iteration's own measurement refutes the premise**: the identical artifact\n  scores 0.950 here, not 1.000, and the prior run's per-candidate rollouts show 50768 failing\n  3/5 and 59595 failing 2/5 across candidates. These are flaky decision points, not a ceiling,\n  so there *is* measurable headroom on val and \"stop editing\" was the wrong read.\n- **High-value clusters still NOT cracked.** None failing this iteration beyond the two above.\n  The structural gap remains the **val\u2192test gap** (prior run: val 1.000 vs sealed test 0.875) \u2014\n  invisible from this split's trajectories. Designs already tried against it: nothing, because\n  nothing on val can measure it.\n- **Plateau signal.** Not a plateau yet \u2014 only one RESULT exists in this run and it was\n  +0.600. The risk here is the opposite one: with 38/40 passing, the gate's significance bar\n  means a 2-task gain is roughly the minimum detectable move, so a single regression cancels the\n  whole candidate. That is why I shipped eight edits that all serve **two** target tasks rather\n  than broadening into speculative territory. If this is REJECTED with `broke={}`, the\n  conclusion is that these two tasks are irreducibly flaky and the lever to switch to is\n  variance reduction (making the verify round's checklist *falsify* a wrong answer rather than\n  confirm it), not more rules. If it is rejected with a non-empty `broke`, drop the edit naming\n  the regressed task's class and keep the rest.\n- **Focus next iteration.** Read this entry's RESULT first. If ACCEPTED at ~1.000, propose\n  nothing further on val \u2014 at that point the artifact genuinely is capped and prior-run history\n  says every further addition regressed. If REJECTED, diff the new trajectories for 50768/59595\n  against `reused_seed_run/run_suite/rollouts/val/*__cand_0003__t0.json` (the measured 1.0 runs\n  of this same prompt) to see which of the eight edits the agent actually acted on.\n\n> **RESULT (framework, measured):** ACCEPTED (new champion) \u00b7 val=1.000 \u0394=+0.050 \u00b7 fixed={50768, 59595} \u00b7 broke={\u2014} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0002: ACCEPTED val=1.000 \u0394=+0.050 -->\n\n## Iteration cand_0003 \u2014 NO capability edit: val is saturated at 40/40 so no edit can pass the REAL test, and the gate's own arithmetic makes ACCEPT impossible; shipping the evidence instead\n\n- **Changes I made:** **none.** `prompt.md` and `task_template.md` are byte-identical to\n  `cand_0002`. This is a deliberate no-op candidate, not an oversight.\n- **Why, verified from this iteration's own data (not inherited):**\n  1. **No failing cluster exists.** All 40 val tasks: `reward = 1.0`, all four metrics\n     (`soft_no_recalc`, `hard_no_recalc`, `soft_restriction`, `hard_restriction`) `= 1.0`,\n     `test_case_results = test_case_results_no_recalc = [1]`. Zero reward-0, zero partial-credit,\n     zero failing sub-case. The **REAL** test requires an edit to target a cluster *failing in\n     this iteration's trajectories*; no available edit qualifies.\n  2. **ACCEPT is arithmetically impossible, for this iteration and for 4 and 5.** The gate is\n     `\u0394\u0304 = mean_i(cand_i \u2212 parent_i) > 0.2\u00b7SE` (verbatim from the gate's reason strings). The\n     parent is stored at 1.0 on all 40 tasks, per-task reward is capped at 1.0, and the parent is\n     **not re-measured** (`state.json`: `metric_calls = 80` over `iterations = 2` with `n_val = 40`\n     \u2192 40 calls/iteration = candidate only). So `cand_i \u2212 parent_i \u2264 0` \u2200i \u21d2 `\u0394\u0304 \u2264 0 \u2264 0.2\u00b7SE`.\n     No prose can clear the bar. I checked this *before* designing any edit.\n- **The one REAL latent defect I found t. The agent was doing what the template told it.\n- The enabling fact that makes the verify round free, and that the agent will not infer: the\n  graded solution is the **last code block that wrote `output_path`**, so a read-only\n  inspection round cannot cost it its answer. Say this explicitly or the agent treats\n  verifying as a risk.\n- **Promising but not yet tried:** nothing \u2014 see the saturation note in META_INSIGHTS.md.\n\n## Val is NOT capped at 1.000 \u2014 the same artifact scores 0.950 here, and the two misses are coin-flips\n- **What worked (confirmed by cand_0001's RESULT):** the transferred artifact measured\n  **val=0.950, \u0394=+0.600, broke nothing** \u2014 it reproduced 38/40, not 40/40. So cand_0001's own\n  conclusion (\"val is capped, propose nothing\") rested on a number from a *different run of the\n  same artifact*. **Per-task reward on this benchmark is not deterministic**; a prior run's score\n  for a prompt is an estimate of this run's score, not a prediction of it. Never argue \"no\n  headroom\" from a prior run's total \u2014 argue it from *this* iteration's per-task pass list.\n- **What didn't (confirmed by RESULTs in the prior run, cited in JOURNAL cand_0001):** two\n  factually-correct defensive additions each lost tasks \u2014 the openpyxl single-cell-range\n  `TypeError` guard (val 1.000 \u2192 0.975) and sheet-prefix quote-stripping (1.000 \u2192 0.950). The\n  pattern worth carrying forward is narrower than \"stop editing\": **an edit that only adds\n  defensive code advice to an agent already passing has no upside and a real downside.** Edits\n  that *resolve an ambiguity the agent is currently coin-flipping* are a different bet entirely.\n- **The flakiness measurement that proves it.** Across the prior run's five candidates on the\n  same val split: 50768 passed 2/5, 59595 passed 3/5 \u2014 and crucially the *same* prompt pair\n  (its cand_0003) passed BOTH at reward 1.0 while my cand_0001 (byte-identical prose) failed\n  both. A task that flips with no prompt change is an unresolved decision point inside the\n  agent's reasoning, and that is the highest-value thing a prompt can fix: the agent already\n  finds the right answer half the time and has no rule telling it which half is right.\n- **Promising but not yet tried:** quantify flakiness *first*, before diagnosis. Any task that\n  both passes and fails across candidates with near-identical prompts is a prose-fixable\n  ambiguity; any task that fails under every candidate is a capability wall. Those deserve\n  different levers and the rollout archive separates them for free.\n\n## `reused_seed_run/run_suite/rollouts/val/` gives you a SCORED PASSING run of a task you are failing\n- **What worked (used for both clusters this iteration; the fix text is derived from it, not\n  guessed):** that directory holds per-candidate rollouts for the same 40 tasks, so a task\n  failing under the current champion usually has a sibling rollout at **reward 1.0** \u2014 sometimes\n  of a *byte-identical* prompt. Diffing failing-vs-passing trajectory yields (a) the gold values\n  directly, and (b) the exact code line that differs. For 50768 the passing run's\n  `impact_label = ws.cell(row, 5).value` / `likelihood_label = ws.cell(15, col).value` gave the\n  gold `F14='1, 3, 5'`, `G14='2'`, `H12='4, 6'`; for 59595 the passing run's single uniform\n  `sum(...)` with no placeholder branch gave `C4=4, C5=6, C6=12` as ints.\n- **Why this beats the usual method:** inferring a contract from scorer feedback strings (\"3\n  cell(s) hold str where int was expected\") tells you a cell is wrong but not what is right, and\n  the feedback is generated *post*-recalculation while scoring is pre-recalculation. A scored\n  passing trajectory is ground truth about both.\n- **What didn't:** the gold workbooks themselves were not readable from here, and `openpyxl` is\n  not importable in this session's Python \u2014 so trajectory diffing was the *only* route to gold\n  values. Do not plan on inspecting `.xlsx` files locally.\n- **Promising but not yet tried:** mine the passing rollouts of *currently passing* tasks the\n  same way, to extract the behaviours an edit must not disturb \u2014 a cheaper, more direct blast\n  radius check than reasoning about what a rule \"might\" do.\n\n## Agreement in a self-check is not evidence unless disagreement was possible\n- **What worked:** diagnosis-level confirmation in both failing traces. 59595's mandated verify\n  round printed `C4 | worked value 'n/a' | my rule's value 'n/a' | agree? True` and passed its\n  own checklist **on a wrong answer**, because the rule had been reshaped to emit the pre-filled\n  value. 50768 cited `F14` agreeing as \"proof\" of its axis binding \u2014 but `F14` is the matrix\n  **diagonal** (level 1 on both axes), identical under transposition, and the two readings\n  differ at exactly one of nine cells with no example there. A checklist that compares a rule\n  against a value the rule was fitted to is a tautology, and a mandatory verify round built\n  that way *manufactures* false confidence rather than catching error.\n- **The generalizable design rule for any verify step (not just this benchmark):** a check only\n  has power where the hypothesis you rejected would have produced a different observation.\n  Require the agent to print the coordinates/cases where its two candidate rules **differ**, and\n  to classify each check as decisive / non-discriminating / moot. Adding a \"they agree\" arm to a\n  checklist branch costs nothing and removes the tautology.\n- **Promising but not yet tried:** a provenance requirement as a general anti-fitting device \u2014\n  \"for any output your rule produced, name the *input* cell it came from; if the only cell you\n  can name is the output cell itself, the rule is fitted, not derived.\" Shipped here (edit G)\n  but not yet measured.\n\n## The step-3 verify snippet crashes on every single-cell `answer_position` (a defect in the capability text itself, found iteration 3)\n- **What worked:** the *diagnosis* method \u2014 cross-tabulate a trace property against an **input**\n  property over all tasks at once, instead of reading traces. Tabulating \"does `answer_position`\n  contain a part with no `:`\" against \"does the trace contain `TypeError: 'Cell' object is not\n  iterable`\" over all 40 val tasks gives a **perfect 7/7 match, 0 false positives, 0 false\n  negatives**. That single table converted 9 scattered tracebacks into one deterministic defect\n  (7 tasks) plus two unrelated one-offs.\n- **The defect, exactly.** `task_template.md:97` gives the agent\n  `cells = [c.coordinate for row in graded[RNG] for c in row]`. openpyxl's `Worksheet.__getitem__`\n  returns a **bare `Cell`** when the range names exactly one cell (`\"B1\"`, `\"C14\"`, `\"'Calc'!B7\"`)\n  and a tuple of row tuples for anything larger, so the double comprehension raises. The agent\n  copies the snippet verbatim \u2014 the tracebacks reproduce lines 97-98 character for character,\n  including `shown = cells if len(cells) <= 24 else cells[:12] + cells[-12:]` \u2014 so this is **the\n  capability's bug, not the agent's**. Affected val tasks: 31628, 46897, 51-12, 55979, 56563, 8942,\n  9726 (17.5%). All 7 recovered within one round and scored 1.0, so on val it is worth 0.000.\n- **What didn't:** nothing new was tested. Prior-run `cand_0005` shipped the fix\n  (`rng_obj = graded[RNG]; cells = ([rng_obj.coordinate] if hasattr(rng_obj, \"coordinate\") else \u2026`)\n  and was rejected \u2014 but see the next entry: that rejection does **not** show the fix is harmful.\n- **Promising but not yet tried:** ship this fix in the first run that has val headroom, together\n  with a create-if-absent sheet idiom for the second latent defect (`answer_position` naming a\n  sheet the input lacks \u2192 `wb[name]` raises `KeyError`; seen on 402-43, which recovered). Both cost\n  the agent a round today, which is free only because every ore? If either answer is no, record it as *untested*, not as *refuted*. A false refutation is\n  more expensive than a failed experiment: it permanently removes a good edit from the search space\n  for every later iteration, and it is the one error an append-only handover cannot self-correct.\n- **Promising but not yet tried:** when the parent is at the ceiling, state the arithmetic and ship\n  nothing. No prose lever exists; the binding constraint is the measurement, not the artifact.\n\n## Iteration 3 was a measured NULL CONTROL \u2014 the strongest single fact this run produced\n- **What worked (confirmed by LEDGER row 3 + the absence of a file):** `prior_iterations/cand_0003/`\n  contains a `PROCESS.md` and **no `diff.patch`**. That candidate shipped the **empty edit** \u2014 prose\n  byte-identical to the champion \u2014 and was measured at **val 0.975, `broke={50768}`**. A run almost\n  never gets a free null control; this one did, and it should be cited rather than re-derived:\n  1. **The saturation argument is now empirical, not just arithmetic.** Identical prose measured\n     1.000 (as cand_0002) and 0.975 (as cand_0003). So for a parent stored at per-task 1.0, a tie\n     (`\u0394\u0304 = 0`, itself already a rejection under the strict `>`) is only *one* of several draws \u2014 a\n     candidate that is genuinely **more robust** is still more likely to measure BELOW the parent.\n     At the ceiling the gate cannot register an improvement, and it *can* fabricate a regression.\n  2. **`broke={50768}` in LEDGER row 3 was caused by nothing at all.** LEDGER's own rule already\n     calls |\u0394\u0304|=0.025 < 2\u00b7SE=0.050 `unresolved`; the null control turns that statistical caution\n     into a demonstrated fact. 50768 is also the archive's flakiest task (2/5 across the prior\n     run's five candidates). **Never attribute an effect to an edit on the strength of 50768.**\n  3. **`rejected.jsonl`'s only row rejects the empty diff.** Future runs read that file as the list\n     of already-refuted approaches. Before treating any row in it as a refutation, open the\n     candidate's `prior_iterations/<id>/diff.patch` \u2014 **if there is no diff.patch, nothing was\n     tested.**\n- **How to reproduce the check in ~4 commands (do this as step 0, before reading any trace):**\n  per-task `score.reward` over all `trajectories/*.json`; `state.json` `metric_calls \u00f7 iterations`\n  vs `n_val` (equal \u21d2 parent stored, never re-measured); `rejected.jsonl` reason string; and\n  reconstruct the stored parent vector from it \u2014 39 diffs of 0 plus one of \u22121 gives \u0394\u0304=\u22120.025,\n  sd=0.1581, SE=0.0250, which matched cand_0003's `SE=0.0250` to 4 dp and *proves* the parent is\n  all-1.0 without being able to read it.\n- **What didn't:** nothing was tried. The iteration's own conclusion is that nothing *could* be.\n- **Promising but not yet tried:** when the parent is at the ceiling, treat `rejected.jsonl` as the\n  thing to protect. **Do not ship a correct-but-unmeasurable edit into a saturated gate** \u2014 it buys\n  a guaranteed rejection row that later runs will read as a refutation, and an append-only handover\n  can annotate but never retract it. That is exactly how the single-cell `TypeError` fix (prior\n  cand_0005) became \"refuted hypothesis (a)\" in two earlier JOURNAL entries while never having been\n  tested at all. Correct status for it and for the sheet-`KeyError` fix: **UNTESTED.**\n\n## Iteration cand_0005 \u2014 CONFIRMED findings from the sealed-test corpus (the first iteration to open it)\n\n**Where this evidence comes from (any future run can re-read it):** `reused_seed_run/run_suite/`\nis a completed prior run whose `splits.json` is byte-identical to the current one (`seed: 0`;\ntrain/val/test id sets AND order all compare equal) and whose `test_used` is `true`. Its\n`final.json` holds a **full 280-task sealed-test evaluation at 0.875 with per-task feedback**, plus\na `test_baseline` vector for the unoptimized seed, plus 280 rollouts under `rollouts/test/`. By\nchecksum its champion prose is **byte-identical to this run's `cand_0001`**. Four iterations went\nby without anyone opening it; it is the only real diagnostic corpus in this project.\n\n### CONFIRMED 1 \u2014 4 held-out tasks are unpassable by ANY output, and 1 passes for free (benchmark fault)\nScoring runs through the un-patched vendored `third_party/spreadsheetbench/evaluation/evaluation.py`\n`compare_workbooks`, which splits `answer_position` on `,` and strips **quotes only, never\nwhitespace**. Replaying those functions verbatim over all 280 test + 40 val positions:\n`283-32` (`A:G`, no row digits \u2192 `int('')` ValueError), `130-9` (**sheet name contains commas**),\n`49300` (**U+00A0** before the quote \u2192 \"worksheet not found\"), `45944` (**spaces after commas** \u2192\nnegative column index) all return False for every possible output; `73-45` (`BD2:308` \u2192 empty\n`cell_names`) returns True vacuously. **Val is affected 0 of 40**, so val 1.000 is sound.\n*Confirmed by:* direct replay of the scorer's own code, cross-checked against each task's feedback.\n*Consequence:* the test metric is understated by ~4 tasks and overstated by ~1 (0.875 \u2192 \u22480.886 over\nthe 276 well-formed tasks). The adapter's own `_range_cells` already handles six such families but\nfeeds **feedback only, never the grade** \u2014 which is why this stayed invisible.\n\n### CONFIRMED 2 \u2014 the optimized prose broke 9 held-out tasks relative to the seed\n146 gains, **9 regressions**, net +0.489 (0.386 \u2192 0.875): `177-6, 188-39, 230-16, 343-20, 41348,\n486-17, 51680, 524-31, 5835`. The optimization is a big net win but **not monotone**, and the\nregressions cluster in whitespace/case fidelity and under-fill \u2014 things the seed prose got right.\n*Confirmed by:* per-task diff of `final.json`'s `test` vs `test_baseline`.\n**Corollary \u2014 the current champion is untested off-val.** The measured prose is `cand_0001`;\n`cand_0002`'s 8 edits (all strengthening \"a pre-filled answer cell checks your rule, never defines\nit\") are **unmeasured on held-out data**, and 2 of the 9 regressions are failures of exactly that\nover-conservatism (`343-20` left the answer sheet byte-identical to the input; `51680` reasoned\n*\"preserve already-worked cells\"* and lost). Treat `cand_0002`'s off-val direction as unvalidated.\n\n### CONFIRMED 3 \u2014 the single-cell `TypeError` is NOT a scoring lever (settles a 3-iteration argument)\n`task_template.md:97` (`[c.coordinate for row in graded[RNG] for c in row]`) raises\n`TypeError: 'Cell' object is not iterable` whenever `answer_position` names one cell. Scope:\n**7 of 40 val rollouts** (perfect 7/0/0/33 cross-tab, same line and same trace index every time)\nand **23 of 280 test rollouts** \u2014 and **21 of those 23 still pass**. The 2 that fail (`37900`,\n`49036`) fail for unrelated value reasons (month-only lookup; `\"\u2026% WIN RATE\"` written as text).\n**Cost is ~1 wasted round; reward recovered is 0 on \u2026[+2551 chars truncated]", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001 (and a pre-emptive read of the whole run)\n- **Strategy tried:** diagnose first, mechanically, before reading any prose. A single\n  scripted scan over all 40 trajectories (does the final code write a string starting with\n  `=`?) cross-tabulated against pass/fail collapsed what looked like five different scorer\n  complaints \u2014 \"holds FORMULAS\", \"#N/A error text\", \"int where str expected\", \"written past\n  where the answer ends\" \u2014 into ONE root cause present in 24 of 26 failures. The varied\n  feedback wording is an artifact of the scorer recalculating the file *for the diagnostic\n  message* after scoring it un-recalculated; reading the feedback strings alone would have\n  produced four clusters and four weaker edits. **Lesson: cluster on the agent's ACTION, not\n  on the grader's description of the symptom.**\n- **The highest-leverage move was reading the environment, not writing prose.** This project\n  dir contains a completed prior run (`reused_seed_run/run_suite/`) with a capability measured\n  on the *set-identical* val split at 1.000 and sealed test 0.875, plus its `history.jsonl`\n  and `rejected.jsonl`. Transferring a measured artifact beats drafting an unmeasured one.\n  **Lesson for future runs: before writing a single line, enumerate what in the working tree\n  has already been SCORED.** The framework copies `prior_iterations/` for the current run but\n  says nothing about sibling runs in the same project dir, and that is where the signal was.\n- **Plateau signal, identified pre-emptively rather than after burning iterations.** The prior\n  run's record shows val saturating at 1.000 and then three consecutive rejections\n  (cand_0002 0.900, cand_0004 0.950, cand_0005 0.975), each a regression from an addition that\n  was *factually correct* \u2014 a real openpyxl single-cell `TypeError` guard, and real defensive\n  quote-stripping for a malformed sheet prefix that genuinely occurs in this split. **Lesson:\n  on a capped metric, \"correct and relevant\" stops predicting \"accepted\". Once the artifact\n  saturates val, every further edit is a blind bet with a real downside and no measurable\n  upside.** The lever to switch to is not a different edit class \u2014 it is stopping.\n- **What to try next iteration:** propose nothing, or at most one surgical edit, and expect\n  rejection. If a future run wants genuine headroom it has to attack the val\u2192test gap\n  (+0.125), which is structurally invisible from val trajectories \u2014 that needs more val tasks\n  or a train split, not a better prompt. Watch for the inverse failure mode too: an iteration\n  that *must* produce a diff will manufacture a speculative one, which is exactly how the\n  prior run lost three iterations.\n\n## Iteration cand_0002\n- **Strategy tried, and what it moved.** Only one RESULT exists so far (LEDGER row 1: cand_0001\n  ACCEPTED, val 0.950, \u0394=+0.600, broke nothing), so nothing here is yet measured. The strategy\n  this iteration was: **re-measure the premise before inheriting the conclusion.** cand_0001\n  handed over a confident \"val is saturated at 1.000, propose nothing, expect rejection\". The\n  first thing I did was check that against this iteration's own trajectories \u2014 and it is false\n  here: the identical artifact measures **0.950, with 2 live failures**. The predecessor's\n  handover was reasoning from a *different run's* score for the same prose. **Meta-lesson: treat\n  an inherited \"there is no headroom\" as a hypothesis with an owner and a date, and re-derive it\n  from the current iteration's per-task results before spending the iteration on it.** A handover\n  that is persuasive and wrong costs a whole iteration, and this file is exactly where that gets\n  propagated.\n- **The strategy that actually produced the edits: separate FLAKY tasks from WALLS first.** The\n  prior run's rollout archive lets you tabulate each task's pass/fail across five candidates\n  before reading a single trace. 50768 (2/5) and 59595 (3/5) both flip *with no prompt change* \u2014\n  so neither is a capability wall; each is an unresolved decision point the agent coin-flips.\n  That reframing is what made this iteration worth running at all, and it changed the edit class:\n  not \"teach a missing skill\" but \"**remove an ambiguity and make the self-check able to detect\n  the wrong branch**\". Recommended as a standard first move whenever a rollout archive exists.\n- **What I did differently from cand_0001's advice, deliberately.** cand_0001 said the lever was\n  \"leaving the artifact alone\", generalising from three prior rejections. I think that\n  generalisation over-fits: all three were **defensive-code additions to an agent that was\n  already passing** (a `TypeError` guard, quote-stripping) \u2014 upside only in a hypothetical, real\n  downside in context length and distraction. An edit that resolves a measured coin-flip is a\n  structurally different bet: the downside is bounded by an audit of the affected class, and the\n  upside is observed in the data. The honest refinement of cand_0001's rule is **\"near the\n  ceiling, only ship edits whose target task is currently, measurably failing\"** \u2014 which is just\n  the REAL test, applied strictly, rather than a blanket stop.\n- **Process note on subagents: use them for the SAFE test, not for diagnosis, when failures are\n  few.** With 2 failures I read both traces myself in minutes; delegating that would have added\n  a summarisation layer over the one thing I most needed verbatim (the agent's own rationalising\n  comment, which *was* the diagnosis in 50768). Where the two parallel read-only agents paid for\n  themselves was blast radius \u2014 enumerating all 10 passing 2-D-range tasks and the 8 most\n  pre-filled ones, work that is wide, mechanical and summarisable. Both returned \"zero would\n  flip\" *and* a wording caution that changed the shipped text (the no-strip fallback for 560-12;\n  the in-place-transform / formula-read / column-layout allowances). **An audit that cannot\n  change the edit is theatre; budget for the audit to send you back to the text.**\n- **Plateau signal, if any, and the lever switched to.** No plateau (one RESULT, +0.600). The\n  live risk is the ceiling-adjacent one instead: at 38/40, the significance bar means a 2-task\n  gain is about the minimum detectable move, so one regression zeroes the candidate. The lever\n  that follows is **concentration, not breadth** \u2014 eight edits, every one serving the same two\n  failing tasks from two angles (state the rule in the system prompt; make the per-task procedure\n  *print* the evidence for it). I read the breadth mandate as \"many edits\", not \"many clusters\",\n  since inventing a third cluster with no failing task is precisely the reflex that lost the\n  prior run three iterations.\n- **What to try next iteration.** (1) Read this entry's RESULT before anything else; the two\n  branches are written out in JOURNAL. (2) If rejected with `broke={}`, do **not** add more\n  rules \u2014 switch the lever to variance reduction, i.e. make step 3's checklist capable of\n  *falsifying* a wrong answer (the 59595 trace passed its own checklist while wrong, which is a\n  verification-design bug, not a knowledge gap). (3) If rejected with a non-empty `broke`, the\n  eight edits are individually attributable to clusters 1a/1b in PROCESS.md \u2014 drop only the one\n  whose class contains the regressed task. (4) Either way, run the flakiness table again against\n  the new rollouts: if 50768/59595 now pass but something else flipped, the task set's variance\n  is the dominant term and no further prose edit will clear a 2\u00b7SE bar.\n\n## Iteration cand_0003\n- **Strategy tried, and whether it moved val: establish the metric's own arithmetic BEFORE\n  designing anything.** Two commands \u2014 the per-task reward table over all 40 trajectories, and\n  `state.json`'s `metric_calls`/`iterations` \u2014 settled the iteration. The table shows 40/40 at\n  `reward = 1.0` on all four metrics with no partial credit anywhere (LEDGER rows 1-2: 0.950 \u2192\n  1.000). `metric_calls = 80` over 2 iterations at `n_val = 40` proves the parent is scored **once\n  and stored, never re-measured**, and the gate's own reason strings give the rule\n  `ACCEPT iff \u0394\u0304 = mean_i(cand_i \u2212 parent_i) > 0.2\u00b7SE`. With the parent pinned at 1.0 per task and\n  reward capped at 1.0, `\u0394\u0304 \u2264 0` for every possible candidate. **ACCEPT is impossible, this\n  iteration and the next two.** Knowing that first changed the deliverable from \"an edit\" to \"the\n  evidence\", which is the only thing left that can carry value forward.\n- **The generalizable process rule: diagnose the MEASUREMENT before the capability.** Every prior\n  entry in this file diagnoses the artifact. None asked whether the gate could still register a\n  win. That question is cheaper than reading a single trace and it strictly dominates: if the answer\n  is no, all downstream work is unscoreable. Recommend it as step 0 of every iteration, alongside\n  the per-task reward table.\n- **A saturated metric manufactures false refutations, and this run had one.** At the ceiling every\n  rejection reads as \"your edit regressed\", so the handover fills with edits marked refuted that\n  were never actually tested. Prior `cand_0005` (the single-cell `TypeError` fix) is recorded as\n  refuted hypothesis (a) in both earlier JOURNAL entries; its real move was **\u22120.025 against its own\n  resolvable effect size of 2\u00b7SE = 0.050**, i.e. `unresolved` by LEDGER's definition, and it was\n  doomed regardless of content because its parent was at 1.000. **Before writing an edit off, check\n  whether the candidate could have been accepted at all.** A false refutation is worse than a failed\n  experiment \u2014 it removes a good edit from the search space permanently, and an append-only handover\n  cannot retract it, only annotate it (which is what I did).\n- **What I got right by inheriting the *narrow* form of a predecessor's rule, not the broad one.**\n  `cand_0001` said \"val is saturated, propose nothing\"; `cand_0002` refuted that and was right to\n  (+0.050, two tasks fixed) because the premise came from a different run's score. The durable form\n  of the rule is neither of those: **only ship an edit whose target task is currently, measurably\n  failing.** At 0.950 that licensed `cand_0002`'s eight edits; at 1.000 it licenses nothing. Both\n  iterations were correct under one rule, applied to different data \u2014 which is what a handover\n  should transmit instead of a verdict.\n- **Resisting the diff-producing reflex is a skill this run now has evidence for.** Three prior-run\n  rejections and this iteration all sit at the ceiling. I designed two edits (the single-cell guard,\n  a create-the-sheet idiom), ran them through the THREE TESTS, found both recover **0.000** on val,\n  and dropped both. Writing the designs down in PROCESS.md with their verification *and* their\n  blast-radius analysis means the next run with headroom can ship them in minutes \u2014 the work is not\n  lost, it is just not submittable here.\n- **Subagents: correctly skipped.** The brief pushes fan-out per trajectory group. With zero failing\n  tasks the entire signal was two cross-tabulations over all 40 traces at once, and the decisive\n  evidence was a verbatim traceback line \u2014 exactly what a summarising layer destroys. Iteration 2\n  reached the same boundary from the other side (subagents paid off for *wide mechanical* blast-radius\n  audits). Combined rule for this benchmark: **fan out for breadth of audit, never for depth of\n  evidence.**\n- **What to try next iteration (4 of 5).** Run step 0 first: (1) per-task reward table \u2014 if any task\n  has *dropped* below 1.0 it is a live failure, the REAL test is satisfiable again, and you should\n  diagnose and fix it; (2) `state.json` `metric_calls`/`iterations` + `best_val` \u2014 if the framework\n  begins re-measuring the parent, ties become winnable and cluster 1's fix (PROCESS.md, fully\n  designed and blast-radius-checked) is the first thing to ship. If both come back unchanged, ship\n  nothing and say so in one short entry; do not re-derive this analysis from scratch and do not\n  invent a cluster. The binding constraint for the rest of this run is the measurement, not the\n  prompt \u2014 that is a framework matter and is filed in `FRAMEWORK_IMPROVEMENTS.md`.\n\n## Iteration cand_0004\n- **Strategy tried, and whether it moved val: re-derive step 0 independently, then look for a\n  CONTROL rather than for a cluster.** cand_0003 handed over a persuasive \"ACCEPT is arithmetically\n  impossible\". Per this run's own hard-won lesson I did not inherit it \u2014 cand_0001 handed over the\n  same claim from a *different run's* score and cand_0002 refuted it for +0.050. Four commands\n  re-derived it (40/40 at reward 1.0, `metric_calls=120/3 iterations=40=n_val` \u21d2 parent stored not\n  re-measured, gate `\u0394\u0304 > 0.2\u00b7SE`, reward capped at 1.0 \u21d2 `\u0394\u0304 \u2264 0` always). This time the inherited\n  claim held. **Both outcomes came from the same 4-command check, which is the real lesson: the\n  check is cheap enough that re-deriving an inherited premise is never the expensive option.**\n- **The move that added value beyond re-derivation: notice that the previous iteration WAS an\n  experiment.** cand_0003 shipped no `diff.patch` and still measured 0.975 / `broke={50768}`. A free\n  null control is rare and nobody had named it as one. It converts \"ACCEPT is impossible\" from an\n  arithmetic argument into a measured one, and it retroactively voids a LEDGER `broke` entry.\n  **Generalizable process heuristic: before designing anything, ask what the prior iterations\n  already measured *as experiments* \u2014 including the ones that shipped nothing.** An iteration that\n  produces no diff still produces a data point, and at a saturated metric it may be the most\n  informative one available.\n- **A new rule for ceiling conditions, and the first thing in this run to argue *against* shipping a\n  verified edit.** Prior entries framed the choice as \"ship nothing vs manufacture a speculative\n  diff\". There is a third option that is strictly worse than both and looks virtuous: **shipping a\n  correct, verified, zero-leverage edit.** The step-3 single-cell `TypeError` fix is real (7/7 tasks,\n  perfect cross-tab, verbatim traceback reproducing `task_template.md:97-98`) and recovers 0.000.\n  Shipping it would add a *second* `rejected.jsonl` row for the one known-good edit in the project \u2014\n  prior cand_0005's row already got mis-filed as \"refuted hypothesis (a)\" in two JOURNAL entries.\n  **At a saturated gate, `rejected.jsonl` is the artifact to protect; a rejection row is a cost, not\n  a neutral outcome.** Zero upside against permanent search-space damage.\n- **Plateau/stall signal, and the lever switched to.** +0.600, +0.050, then pinned; and an empty diff\n  loses 0.025. This is a hard ceiling. The lever is not a different edit class \u2014 it is **stop editing\n  and spend the iteration on the handover and on FRAMEWORK_IMPROVEMENTS**, which is the only place\n  value can still accrue. Three of the prior run's five iterations were lost to the opposite reflex.\n- **Subagents: correctly skipped again (third iteration in a row the boundary held).** The decisive\n  evidence was a **verbatim traceback** and **an absent file** \u2014 the two things a summarising layer\n  destroys. Combined rule for this benchmark, now thrice confirmed: **fan out for breadth of audit\n  (iteration 2's blast-radius enumeration paid for itself), never for depth of evidence.**\n- **What to try next iteration (5/5, last).** Run the 4-command step 0 and nothing else first. (1) If\n  any task has **dropped** below 1.0, that is a live failure, the REAL test is satisfiable, and the\n  calculus flips entirely \u2014 diagnose it (the null control says this has non-trivial probability;\n  50768 is likeliest). (2) If `metric_calls/iterations > n_val`, the parent is being re-measured,\n  ties become winnable, and the single-cell fix (fully designed + blast-radius-checked in\n  `prior_iterations/cand_0003/PROCESS.md`) is the first thing to ship. (3) Otherwise ship nothing in\n  **two short paragraphs** \u2014 do not re-derive this analysis a third time \u2014 and put the iteration into\n  FRAMEWORK_IMPROVEMENTS. The binding constraint for this entire run was the measurement, never the\n  prompt.\n\n## Iteration cand_0005 (and a retrospective on the whole 5-iteration run)\n\n- **Strategy tried, and whether it moved val.** I did not try to move val, because iterations 3\n  and 4 had already proved it unmovable and I re-verified that proof from scratch in two cheap\n  checks (LEDGER rows 3 and 4; `state.json` `metric_calls=160/iterations=4` at `n_val=40`). Instead\n  I asked the question none of the four prior iterations asked: *where is the failure signal that a\n  saturated split is hiding?* The answer was in the working tree all along \u2014\n  `reused_seed_run/run_suite/final.json` holds a **280-task sealed-test evaluation with per-task\n  feedback, a seed baseline vector, and 280 rollouts**, on a `splits.json` byte-identical to this\n  run's, for prose byte-identical to this run's `cand_0001`. That single file produced every\n  finding this iteration has.\n- **The meta-lesson, which is the opposite of the one the run had been repeating.** Iterations 3\n  and 4 each concluded correctly that no edit could be ACCEPTED, and then each spent the iteration\n  *writing up that same conclusion again*. Three nulls is two too many. **When the gate is provably\n  unwinnable, the iteration's job changes from \"propose\" to \"produce signal the next run cannot get\n  cheaply\" \u2014 and that is a different activity with its own backlog, not a shorter version of\n  proposing.** The marginal value of a second identical no-op entry is zero; the marginal value of\n  opening the one unexplored data source was four confirmed findings, two of which **retire\n  hypotheses the run had been circling for three iterations**.\n- **Specific process failure worth naming: the run talked itself into a wrong priority and then\n  cited itself.** Three consecutive entries called the single-cell `TypeError` \"the highest-value\n  known improvement to this artifact\", each citing the previous entry rather than a measurement.\n  It is worth **0 reward on both splits** (23/280 held-out rollouts hit it; 21 of the 23 pass).\n  Meanwhile the actually-largest cluster \u2014 answer EXTENT, \u22485.7 held-out points across 20 tasks \u2014\n  was never named by anyone, because nobody had the held-out failure list. **Beliefs about leverage\n  must be re-grounded in a measurement each iteration, or they calcify.** The same trap in its other\n  form: `rejected.jsonl`'s rows were twice mis-read as \"approach refuted\" when the rejected\n  candidate was an **empty diff** \u2014 always check the `diff.patch` (or its absence) before believing\n  a rejection is about content.\n- **What genuinely helped, mechanically.** (1) **Replaying the scorer's own code** instead of\n  reading its feedback prose \u2014 that is what exposed the benchmark fault, and it also stopped me\n  shipping a confidently-wrong int-vs-float \"correction\" that the feedback string was actively\n  inviting. The two disagree, and only the code counts. (2) **Per-task diffing against the recorded\n  seed baseline**, which revealed that the accepted prose *broke 9 held-out tasks* \u2014 a\n  non-monotonicity that aggregate rewards (0.386 \u2192 0.875) completely hide. (3) **Two read-only\n  subagents in parallel**, with the explicit instruction to *verify or refute* rather than confirm:\n  one corrected an inherited claim from 2 tasks to 1, and one corr \u2026[+1829 chars truncated]", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## From cand_0001 of a spreadsheetbench run (empty-seed iteration)\n- **A sibling completed run sat in the project dir and nothing pointed at it.** The most\n  valuable artifact available to me was `.work/<proj>/reused_seed_run/run_suite/` \u2014 a finished\n  run with `history.jsonl`, `rejected.jsonl`, `splits.json`, `report.md` and five candidates,\n  on a val split **set-identical** to mine. `RUNMAP.md` and `LEDGER.md` document only the\n  current run and both said \"no prior iterations yet\", which reads as \"there is no prior work\"\n  when in fact there was a measured 1.000-on-val / 0.875-on-test capability one directory up.\n  Suggest: have the framework detect sibling runs over the same project+split and list them in\n  `RUNMAP.md` (with their val/test and accept/reject record), or state explicitly that it has\n  not looked. Either is fine; silence invites an optimizer to redraft from scratch what the\n  project already knows, and invites a *less* careful optimizer to find it and not say so.\n- **\"Empty seed \u2014 create from scratch\" over-constrained the framing.** `prompt.md` existed at\n  0 bytes and `task_template.md` was absent, and INSTRUCTIONS read this as \"there is no prior\n  content, invent some\". The honest framing is \"this candidate's capability is empty\"; whether\n  relevant content exists elsewhere is a separate question the instructions should ask the\n  optimizer to answer, not one they should implicitly answer \"no\".\n- **The breadth mandate and the regression gate pull in opposite directions near the ceiling.**\n  INSTRUCTIONS push hard for \"AS MANY real fixes as you can \u2026 a timid one- or two-edit\n  iteration is an under-used iteration\", while the gate rejects any net-zero. On this task the\n  evidence said the correct iteration was *zero new edits on top of a transferred artifact*.\n  The prior run's three rejections are all plausibly this pressure: correct, relevant,\n  well-verified additions that still broke a task. Suggest the instructions name the saturated\n  case explicitly \u2014 \"if the record shows this artifact at or near the metric ceiling,\n  proposing nothing is a legitimate and sometimes optimal iteration\" \u2014 so the breadth mandate\n  is not read as an obligation to manufacture a diff.\n- **Diagnostic feedback is generated post-recalculation while scoring is pre-recalculation.**\n  That made one root cause present itself as four different complaints (\"holds FORMULAS\",\n  \"#N/A error text\", \"int where str expected\", \"written past where the answer ends\") and would\n  mislead an optimizer that clusters on feedback strings. Suggest the feedback say which\n  reading produced it, e.g. \"scored on the saved file (no recalc); description below computed\n  after recalculation\".\n\n## From cand_0002 of the same spreadsheetbench run\n- **Per-task reward is noisy and nothing in the handover files says so.** cand_0001 shipped a\n  prompt pair measured at val 1.000 in a sibling run and scored **0.950** here, failing two tasks\n  that the byte-identical prose had passed. `LEDGER.md`, `JOURNAL.md` and the RESULT stamp all\n  report a single scalar per candidate with no indication of its variance, so an optimizer\n  naturally reads 0.950 vs 1.000 as \"my artifact is worse\" rather than \"same artifact, different\n  draw\". Suggest the RESULT line carry the per-task trial count and, where the harness has run a\n  task more than once anywhere in the run, a flakiness flag \u2014 e.g.\n  `failing={50768 (flaky: 2/5 historical), 59595 (flaky: 3/5)}`. Without it, the `unresolved={}`\n  set (already a nod to measurement error) is the only hint that noise exists, and a candidate\n  can be rejected for noise while its author concludes the *edit* was wrong and designs the next\n  iteration around a false lesson.\n- **The gate's significance bar should be stated in the instructions as a number.** At 38/40\n  passing I had to infer that \"clears a 2\u00b7SE bar\" means roughly a 2-task swing, which completely\n  determines the right strategy (concentrate every edit on the live failures vs. broaden). If the\n  brief printed \"with your current 38/40 and 1 trial per task, the smallest detectable\n  improvement is ~N tasks\", the breadth-vs-concentration decision would stop being guesswork.\n  Related: the brief's \"a timid one- or two-edit iteration is an under-used iteration\" reads as a\n  push toward more *clusters*; near the ceiling the correct reading is more *edits on the same\n  cluster*. Worth disambiguating in the text.\n- **`rejected.jsonl` was absent, not empty, and the brief treats it as always present.** The\n  instructions say to read `.capevolve/run_suite/rejected.jsonl` and make each proposal\n  structurally different from what is in it. On iteration 2 with zero rejections the file does not\n  exist, which is indistinguishable from a path error \u2014 I spent time resolving the absolute path\n  to confirm which it was. Suggest the framework create it empty, or have the brief say \"absent\n  until the first rejection\".\n- **An agent-visible way to read a `.xlsx` would materially improve diagnosis.** `openpyxl` is\n  not importable in the optimizer's own Python, so the gold workbooks and the input workbooks are\n  opaque from here; the only route to a gold value was diffing a failing trajectory against a\n  *passing* rollout of the same task. That worked only because a sibling run's rollouts happened\n  to be present. Suggest exposing a read-only cell dump of the gold/input workbook for failing\n  tasks (values + Python types, which is exactly what the scorer compares) \u2014 it is the single\n  piece of evidence that turns \"this cell is wrong\" into \"this cell should hold `4`\".\n- **Carry the predecessor's confidence, not just its conclusion.** The handover format invites a\n  flat assertion (\"val is saturated; propose nothing\") with no slot for *what measurement would\n  refute it*. Mine did, and it was wrong on arrival. Suggest the JOURNAL shape add one line \u2014\n  `Belief + the observation that would refute it` \u2014 so the next iteration can cheaply re-test an\n  inherited premise instead of either trusting it or re-deriving everything from scratch.\n\n## From iteration 3 (cand_0003) \u2014 the run kept spending iterations after the metric stopped being able to accept anything\n\n- **Stop the run, or change the comparison, when the champion saturates the metric.** The gate is\n  `ACCEPT iff \u0394\u0304 = mean_i(cand_i \u2212 parent_i) > 0.2\u00b7SE`, and the parent's per-task rewards are stored\n  rather than re-measured (`state.json`: `metric_calls = 80` over `iterations = 2` at `n_val = 40` \u21d2\n  40 calls/iteration = the candidate alone). Once the champion holds `reward = 1.0` on **every** val\n  task \u2014 and per-task reward is capped at 1.0 \u2014 `cand_i \u2212 parent_i \u2264 0` for every task and every\n  candidate, so `\u0394\u0304 \u2264 0 \u2264 0.2\u00b7SE` **always**. Iterations 3, 4 and 5 of this run are therefore\n  guaranteed rejections no matter what they contain. `budget.stop_at_reward` exists but defaults to\n  `0.0` (disabled). Suggestions, cheapest first: (a) default `stop_at_reward` to the metric's maximum\n  so a saturated run halts instead of burning three scoring passes; (b) tell the optimizer, in the\n  brief, the parent's **per-task** scores and whether the parent is re-measured, so it can compute\n  the reachable \u0394 itself rather than inferring it from `state.json` and prior-run reason strings;\n  (c) re-measure the parent in the same batch, which converts a saturated comparison from\n  \"impossible\" to \"noise-limited\" and lets a variance-reducing edit win.\n- **A rejection at a saturated metric is indistinguishable from a regression, and the handover\n  format records it as one.** This run inherited \"the single-cell `TypeError` fix regresses val \u2014\n  never re-test\" from prior `cand_0005`. That edit's real gate reason was\n  `paired \u0394\u0304=-0.0250 <= 0.2\u00b7SE=0.0050 (SE=0.0250, n=40, resolvable effect size 2\u00b7SE=0.0500)`: the\n  move is **below its own 2\u00b7SE**, which `LEDGER.md` itself defines as `unresolved` and forbids\n  reasoning about as a regression \u2014 and it would have been rejected whatever it contained, because\n  its parent was already at 1.000. So a *correct* fix for a deterministic defect affecting 17.5% of\n  tasks got permanently blacklisted by two subsequent iterations. Suggest `rejected.jsonl` carry two\n  extra fields the optimizer is told to check: `resolvable` (`|\u0394\u0304| > 2\u00b7SE`) and\n  `acceptance_was_reachable` (was `parent_val` below the metric maximum), and that the brief's\n  \"already-refuted approaches\" instruction say **an unresolvable rejection is not a refutation**.\n  Without that, every saturated run poisons its own search space.\n- **The brief's breadth mandate and the REAL test contradict each other at the ceiling.** The\n  instructions demand \"AS MANY real fixes as you can \u2026 a timid one- or two-edit iteration is an\n  under-used iteration\", while the REAL test requires every kept edit to target a cluster *failing\n  in this iteration's trajectories*. At 40/40 those cannot both be satisfied, and the brief's own\n  focus line (\"No actionable failures in focus\") acknowledges the state without resolving the\n  tension. An optimizer reading the breadth mandate literally will manufacture speculative edits \u2014\n  which the same brief names as the second way iterations get wasted, and which cost the prior run\n  three iterations. Suggest that when the focus block reports no actionable failures, the brief\n  explicitly authorise a **no-op candidate plus a written hand-back** as a valid, successful outcome\n  (it already does this for environment faults; the same clause is what is missing here).\n- **Latent-but-passing defects have nowhere to go.** The two real defects I found this iteration (a\n  deterministic crash in the shipped verify snippet on single-cell ranges, 7/40; a missing\n  create-if-absent sheet idiom, 1/40) cost the agent a round each and are invisible to the score\n  because every val task has spare rounds. They are exactly the kind of fragility that plausibly\n  explains a val\u2192test gap (prior run: val 1.000 vs sealed test 0.875), yet no part of the objective\n  can reward fixing them. Suggest a secondary, non-gating signal the optimizer is shown and can\n  optimise against \u2014 e.g. rounds consumed, or a count of tracebacks in agent/template-authored code\n  \u2014 so robustness work has a measurable home once correctness saturates.\n\n## From iteration cand_0004 \u2014 a saturated gate silently converts every later iteration into a no-op, and fabricates refutations while doing it\n\nConcrete, measured from this run (LEDGER rows 1-3 + `state.json` + `rejected.jsonl`): the parent's\nper-task scores are measured **once and stored** (`metric_calls = 120` over `iterations = 3` at\n`n_val = 40` \u21d2 exactly `n_val` calls per iteration = the candidate alone). The gate is\n`ACCEPT iff \u0394\u0304 = mean_i(cand_i \u2212 parent_i) > 0.2\u00b7SE`. Per-task reward caps at 1.0. So the moment the\nchampion reaches per-task 1.0 on every val task \u2014 which happened at **iteration 2 of 5** \u2014 `\u0394\u0304 \u2264 0`\nfor every possible candidate and **ACCEPT becomes arithmetically impossible for the rest of the\nrun.** Iterations 3, 4 and 5 (60% of the budget, and 60% of the optimizer spend \u2014 ~$14.6 of\n`optimizer_usd` so far) cannot change the outcome no matter what they contain.\n\nWorse, the failure is **silent and actively misleading**:\n\n1. **Iteration 3 shipped an EMPTY diff and was recorded as a regression.** It has no `diff.patch`,\n   yet it measured val 0.975 and LEDGER row 3 reads `broke={50768}`. A reader \u2014 human or the next\n   optimizer \u2014 sees a candidate that \"broke a task\". Nothing was changed. The 2\u00b7SE `unresolved`\n   convention is the right instinct but it did not fire here, because |\u0394\u0304| = 0.025 against\n   2\u00b7SE = 0.050 put 50768 in `broke`, not in `unresolved`.\n2. **`rejected.jsonl` accumulates false refutations that are permanent.** Its only row rejects the\n   empty edit. In the sibling prior run, the openpyxl single-cell `TypeError` fix \u2014 a genuine,\n   verified defect in the capability text, 7/7 tasks, perfect cross-tabulation \u2014 was rejected the\n   same way and is now cited as \"refuted hypothesis (a)\" in **two** JOURNAL entries. The brief tells\n   each optimizer to read `rejected.jsonl` and make proposals structurally different from what is in\n   it, so a saturated gate permanently removes known-good edits from the search space. An\n   append-only handover can annotate this but never retract it.\n\nSuggested changes, cheapest first:\n\n- **Stop the run (or the hill-climb) when ACCEPT becomes impossible.** One check after each gate:\n  if the champion's stored per-task vector is at the metric's maximum on every task and the parent\n  is not re-measured, `\u0394\u0304 \u2264 0` is provable \u2014 emit \"metric saturated, acceptance impossible\" and halt\n  instead of spending three more iterations. This is a few lines and it recovers 60% of this run's\n  budget.\n- **Accept ties at the ceiling, or re-measure the parent.** `\u0394\u0304 > 0.2\u00b7SE` with a stored parent makes\n  `\u0394\u0304 = 0` a rejection, so even a *provably more robust* candidate cannot be adopted. Either accept\n  `\u0394\u0304 \u2265 0` when the parent is at max, or re-measure parent and candidate together each iteration so\n  the comparison is paired on fresh draws (this run's null control shows the same prose spans\n  0.975-1.000, so a stored parent at 1.0 is a lucky draw being treated as a fixed truth).\n- **Record a candidate's diff size in LEDGER/rejected.jsonl, and suppress `broke`/`fixed` for an\n  empty diff.** A row attributing `broke={50768}` to a zero-byte change is the clearest possible\n  demonstration that `broke`/`fixed` need a \"could this edit plausibly have caused it\" guard. At\n  minimum, add the gate's `|\u0394\u0304| vs 2\u00b7SE` verdict and a `diff_bytes` field to each `rejected.jsonl`\n  row so later readers can tell a refutation from an unmeasurable.\n- **Tell the optimizer the gate arithmetic in the brief.** Every iteration of this run spent effort\n  rediscovering `ACCEPT iff \u0394\u0304 > 0.2\u00b7SE` and the stored-parent fact from `state.json` and reason\n  strings. Two sentences in INSTRUCTIONS.md \u2014 the rule, and whether the parent is re-measured \u2014\n  would have let iteration 3 reach its conclusion in one command, and would stop the brief's\n  \"ship as many fixes as you can\" framing from fighting a gate that cannot accept any of them.\n- **Give the brief an honest way to say \"nothing is actionable\".** The focus block here reads\n  *\"No actionable failures in focus \u2014 seek a robustness/generalization gain that does not regress\n  the solid tasks\"*, which pushes toward a speculative edit at exactly the moment speculative edits\n  are pure downside. The prior run lost three consecutive iterations to that reflex. When the metric\n  is saturated the brief should say so and ask for the diagnosis instead.\n\n## Iteration cand_0005 \u2014 four concrete framework fixes, in order of value\n\n### 1. A saturated gate split silently burns every remaining iteration (COST: 3 of 5 iterations here)\nOnce a parent reaches the metric's maximum on the gate split, ACCEPT becomes **arithmetically\nimpossible**: the parent's per-task vector is stored and never re-measured (`state.json` showed\n`metric_calls=160 / iterations=4` at `n_val=40` \u2014 exactly 40 calls per iteration, i.e. candidate\nonly), per-task reward caps at 1.0, so `\u0394\u0304 = mean_i(cand_i \u2212 parent_i) \u2264 0` against a gate requiring\n`\u0394\u0304 > 0`. This run hit val 1.000 at iteration 2 and then spent iterations 3, 4 and 5 on candidates\nthat could not be accepted whatever they contained. **Ask:** detect `best_val >= max_reward` and\neither (a) stop the run and say so, (b) automatically widen the gate split (this project's `train`\nsplit sits at **0.861** with real headroom and is already scored), or (c) tell the optimizer in\nINSTRUCTIONS that the gate is unwinnable so it spends the iteration on diagnosis rather than on\nmanufacturing a diff. Right now INSTRUCTIONS says the opposite \u2014 *\"seek a robustness/generalization\ngain\"* \u2014 while the three TESTS it mandates (REAL requires a cluster failing in **this** iteration's\ntrajectories) make every such edit inadmissible. That contradiction is what three iterations spent\ntheir words resolving.\n\n### 2. `n_trials=1` makes the significance gate fall back to STRICT, so noise exceeds the threshold\nThe gate itself warned: *\"combined/paired SE is 0 (likely n_trials=1 or identical trials) \u2014 the\nsignificance gate cannot distinguish noise from signal and is falling back to STRICT (accept any\n\u0394>0).\"* With binary per-task rewards and one trial, SE is 0 whenever the two vectors agree, and a\nsingle flipped task is \u00b10.025 \u2014 which is how **the identical empty diff measured 0.975 in iteration\n3 and 1.000 in iteration 4**. LEDGER then recorded `broke={50768}` for a candidate that changed\nnothing. **Ask:** default `n_trials >= 2` on the gate split (or re-measure the parent each\niteration), and suppress `broke`/`fixed` attribution entirely when `n_trials == 1`, since LEDGER's\nown 2\u00b7SE rule already classifies such a move as unresolvable. A `broke={...}` row attributed to an\nempty diff is actively misleading to the next iteration.\n\n### 3. `rejected.jsonl` cannot distinguish \"approach refuted\" from \"empty diff rejected\"\nINSTRUCTIONS tells each iteration to read `rejected.jsonl` for \"already-refuted approaches\". In this\nrun **both** rows are rejections of a *byte-identical-to-parent* candidate, yet two JOURNAL entries\nwent on to cite them as evidence against specific edits. **Ask:** record `files_changed` /\n`diff_lines` (or a null-diff flag) in each `rejected.jsonl` row, so a reader can tell content\nrejection from a no-op rejection without hunting for `prior_iterations/<id>/diff.patch`.\n\n### 4. The scorer's `answer_position` parser is unpatched, and it silently breaks 5 held-out tasks\nGrading routes through the vendored `third_party/spreadsheetbench/evaluation/evaluation.py:155\ncompare_workbooks`, which does `answer_position.split(',')` and `.lstrip(\"'\").rstrip(\"'\")` \u2014\n**quotes only, never whitespace**. Replaying those functions verbatim over all 280 test positions:\n`283-32` (`A:G` has no row digits \u2192 `int('')` ValueError), `130-9` (**the sheet name contains\ncommas**, so `split(',')` shreds it), `49300` (**U+00A0** before the quote, which `lstrip(\"'\")`\ncannot touch \u2192 \"worksheet not found\"), `45944` (**spaces after the commas** \u2192 `col_name2num(' G')`\n= \u2212825 \u2192 invalid cell name) return False for **every possible agent output**; `73-45` (`BD2:308` \u2192\nempty `cell_names`) returns True **vacuously, for every output**. Val is affected 0 of 40.\nThe galling part: the adapter's own `_range_cells` (`adapter.py:1674-1721`) already handles six of\nthese quoting families and documents them in its docstring \u2014 but it feeds **feedback and the\nagent-facing `TARGET SIZE` line only, never the grade**. **Ask:** normalise `answer_position` on the\nway into `compare_workbooks` (strip each comma-part, NFKC-normalise U+00A0, strip quotes *after*\nwhitespace, split on commas only outside quotes), resolve a bare `A:G` against the gold's extent or\ndrop the task, and make an empty `cell_names` a hard error instead of a pass. Until then the test\nmetric is understated by ~4 tasks and overstated by ~1 (0.875 \u2192 \u22480.886 on the 276 well-formed ones).\n\n### 5. Minor: surface the seed baseline's per-task vector in the optimizer's working dir\nThe single most useful thing I found was that the accepted prose **broke 9 held-out tasks** relative\nto the unoptimized seed (146 gains, 9 regressions) \u2014 visible only by per-task-diffing\n`final.json`'s `test` against `test_baseline`, in a *prior run's* directory I was not pointed at.\nAggregate rewards (0.386 \u2192 0.875) hide non-monotonicity completely. **Ask:** when a prior ru \u2026[+248 chars truncated]", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0002)", "text": "# PROCESS \u2014 what I did this iteration (explainability; REQUIRED)\n\n**Headline:** both remaining failures are the *same* defect \u2014 the agent let **cells inside\n`answer_position`** decide what its rule should compute, in a case where those cells could not\nsettle the question. 59595 baked the pre-filled placeholder `'n/a'` into its rule as a branch;\n50768 cited a pre-filled example cell on the matrix **diagonal** as \"proof\" of a grid\norientation that the sheet's own axis labels contradicted. Eight additive edits across both files\nmake the sheet's structural evidence the authority and make \"is this example even capable of\ndiscriminating?\" a printed step rather than an assumption.\n\n**The decisive evidence this iteration, found in read-only context.** The prior run at\n`reused_seed_run/run_suite/rollouts/val/` holds rollouts of the **identical** `prompt.md` +\n`task_template.md` pair (its `cand_0003` == my parent `cand_0001`) on **both** of my failing\ntasks,
