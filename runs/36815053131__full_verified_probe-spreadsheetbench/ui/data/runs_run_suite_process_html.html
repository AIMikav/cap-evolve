<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}

d; template untouched):\n  - step 2 partial-fill bullet: typed pre-filled answer cells win \"even when they contradict the literal wording\"; the exception now also covers 'n/a' placeholders and formula outputs (48527).\n  - step 2 new bullet: match the layout of an in-sheet expected block; an output range with exactly one more row than the result holds the header (227-40, a cand_0002 regression).\n  - step 2 new bullet: check every count/total the instruction states, and switch axis/grouping if one fails (45635, a cand_0002 regression).\n  - Working well: only the first code block runs; don't simulate output (45635 fabricated output in round 1).\n  - step 2 new bullet: \"as of / by the end of\" a date = started \u2264 date and ended > date or blank (43436).\n  - step 2 original-formula bullet: exception for references that drift onto blank cells (a fill-down bug); use the fixed populated cell built from the matching input (53647).\n  - step 1 snippet: bind ws_f/ws_v worksheets (the `ws_v[sheet][coord]` ValueError appeared in 7 traces).\n  - step 4: also print old \u2192 new for pre-filled answer cells, the stated counts, and the fill shape vs the expected block.\n- Expected effect + safety: each edit was verified against its trace and the golden file (see PROCESS.md); expected +3 to +5 tasks. All edits are condition-scoped. scan.py over the 40 tasks shows every passing task with changed pre-filled cells falls under the formula/transform/placeholder exception.\n- Building on prior RESULTS: cand_0002 broke 227-40 and 45635. Neither was caused by a rule I removed: both broke through interpretation drift that cand_0001 had got right (header copy; per-column axis). So I added the missing discriminators rather than reverting cand_0002's bullets, which fixed 2768/37456/51-12/560-12.\n- Refuted hypotheses: none (no rejects in the run).\n- Clusters not yet cracked: none known beyond these 5. 43436/48527/53647 had failed in every candidate; if they still fail, they need worked examples rather than rules.\n- Plateau signal: the deltas are +0.375 then +0.050, so the gains are now 1\u20132 tasks per iteration and come from interpretation knowledge. The next lever should be pruning or consolidating the step 2 bullets (the prompt is now ~1600 words) and checking for over-compliance.\n- Focus next iteration (if any): read the RESULT for regressions on tasks with pre-filled answer cells (59595, 142-12, 416-15) and on multi-block repliers (7902).\n\n> **RESULT (framework, measured):** REJECTED (champion unchanged) \u00b7 val=0.875 \u0394=+0.000 \u00b7 fixed={45635, 48527, 53647} \u00b7 broke={37456, 51-12, 80-42} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them). \u2014 its WHOLE batch was reverted; re-introduce only the edits that did NOT break a task above, dropping/redesigning the ones that did.\n<!-- cand_0003: rejected val=0.875 \u0394=+0.000 -->", "template_only": false}, {"name": "INSIGHTS.md", "title": "Insights \u2014 verified findings", "text": "# INSIGHTS \u2014 summarized, verified findings (accumulate across the whole run)\n\nThe JOURNAL is your per-iteration diary; THIS file is the distilled, VERIFIED takeaway a future iteration should read instead of re-reading the whole journal or old sessions/traces. Update it whenever you have a genuinely NEW, confirmed finding (an accepted/rejected RESULT counts as confirmation; a guess does not) \u2014 not every iteration needs a new entry. Structure each addition as:\n\n    ## <task or mechanism name>\n    - What worked (confirmed by a RESULT, cite the candidate id):\n    - What didn't (confirmed by a RESULT, cite the candidate id):\n    - Promising but not yet tried:\n\n## No-recalc grading contract (SpreadsheetBench, hard_no_recalc)\n- What worked (cand_0001, ACCEPTED +0.375, 17 fixed): telling the agent the file is read with data_only and never recalculated, so it computes in Python and writes literals even for \"I need a formula\"/VBA asks. Also openpyxl load-modify-save, a coordinate-printing inspect, and an explicit Verify step.\n- What didn't (cand_0001 broke 2768, 560-12): the generic workflow displaced two instruction-stated details the seed had followed (sort keys; \"put from I3\"). Agents anchor to the top-left of answer_position unless told that a named start cell governs.\n- Promising (cand_0002, unmeasured): a formula-text inspect snippet, a pre-save print of computed vs examples, and a float tolerance for threshold counts.\n\n## Interpretation regressions between candidates (SpreadsheetBench)\n- What worked: cand_0002 (ACCEPTED +0.050) fixed 4 tasks with a formula-aware inspect, a pre-save example print and float tolerance. Its rules also displaced two interpretations cand_0001 got right: copying the expected block's header row (227-40) and the per-column comparison axis implied by \"all three tie\" (45635).\n- What didn't: a single generic \"sheet as spec\" bullet does not tell the agent which way to resolve a conflict between the sheet and the literal instruction. 48527 failed in all three candidates because the agent chose the literal reading over pre-filled answers.\n- Promising (cand_0003, unmeasured): state the conflict resolution explicitly (pre-filled typed cells beat literal wording); check against the stated counts; use as-of-date semantics; treat drifting formula references as a bug.", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001\n- Strategy tried: a full per-failure diagnosis (trace + init/golden cell diff for all 22 failures) before writing anything. Clustering by root cause showed that 13/22 failures share one contract misunderstanding (formula strings under no-recalc scoring), so the first edit is a contract statement with its WHY rather than many task-shaped rules. Outcome not yet known.\n- Plateau/stall signal: n/a (first iteration).\n- What to try next: diff the per-task RESULT against the cluster table in PROCESS.md. Clusters that did not move under a generic workflow nudge (E: semantics) probably need a different lever, such as a stronger \"derive the rule from the pre-filled examples and assert it reproduces them\" step, not more knowledge text.\n\n## Iteration cand_0002\n- Strategy tried: for each regression, diff the parent's trace against the SEED rollout of the same task (`rollouts/val/<id>__seed__t0.json`). It pinpointed the behaviour the new prompt displaced in minutes (seed: stated sort keys / named start cell; parent: extra sort key / answer_position corner). Cheaper and more reliable than re-reading the instruction.\n- Before writing a \"pre-filled cells are examples\" rule, measure its blast radius mechanically: scanning all 40 tasks for answer cells where init == gold vs init != gold split them 11 vs 12 and showed the rule needs a transform/error-cell exception. Without the scan, the obvious rule would have endangered ~12 passing tasks.\n- What to try next: if val plateaus at ~0.85, the remaining misses are interpretation misses with no in-sheet example. Spend the last iteration on pruning/softening and on regressions, not on more rules.\n\n## Iteration cand_0003 (final)\n- Strategy: for every regression, diff three rollouts of the same task (seed / cand_0001 / cand_0002). The passing earlier trace shows exactly which interpretation was lost. For never-solved tasks, recompute gold from init in Python under a hypothesised rule. That turns \"semantic misread\" into a verified one-line rule (43436, 53647) before writing it.\n- Plateau: \u0394 fell from +0.375 to +0.050. The late gains are 1-task interpretation fixes, and each prompt change also perturbs previously passing interpretations (2 broke in cand_0002). With n=1 trial per task, the noise is comparable to the gains.\n- Next time: run \u22652 trials per val task once val passes ~0.85, so a single drift doesn't read as a regression. Spend later iterations pruning and consolidating step 2 as well as adding to it.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## from cand_0001\n- dataset.json ids are ints while task ids are strings; diagnosis scripts need str(d['id']). A small pre-built \"init vs golden vs output cell diff per failing task\" report would save the proposer most of an iteration's diagnosis time.\n- A stale /tmp/struct.py on the runner shadows the stdlib `struct` module for any python started in /tmp; worth cleaning in the runner setup.\n\n## from cand_0002\n- The proposer cannot Read the adapter source via the Read tool (permission prompt) but can via sed in Bash; making the adapter readable (or copying `_task_template_error` + the template-fill call into ./guidance) would avoid the inconsistency. The adapter is also not importable outside the harness (`model_config` missing), so the documented \"import and call _task_template_error\" check needs a string.Formatter fallback.\n\n## from cand_0003\n- PROCESS.md in the new work dir was pre-filled with the PARENT's PROCESS.md (cand_0002 text), not a blank template. A proposer may mistake it for its own, or append to it. Ship a blank template instead.\n- The dataset init/golden files live outside the work dir (~/.cache/capevolve-ci/spreadsheetbench-data/...). Exposing their path in INSTRUCTIONS.md, together with a per-failing-task \"init vs golden vs output\" cell diff, would remove most of the diagnosis time.\n- rejected.jsonl is absent when there are no rejects; creating it empty would avoid a confusing missing-file error.\n- The SpreadsheetBench adapter silently drops every code block after the first in a reply. The agent never learns this, and it sometimes writes \"simulated\" output for the dropped blocks (45635). A one-line feedback note such as \"N extra code blocks were ignored\" would fix this at the source, without spending prompt words on it.\n- Run \u22652 trials per val task once val passes ~0.85: single-trial interpretation drift (227-40, 45635 in cand_0002) is the same size as the per-iteration gains.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0002)", "text": "# PROCESS \u2014 what I did this iteration (explainability; REQUIRED)\n\nCandidate cand_0002, iteration 2 of 3, parent cand_0001 (val 0.825, 33/40). I diagnosed all 7 failures from ./trajectories by reading each trace and diffing the init and golden workbooks with openpyxl (helpers: /tmp/ce_work/snip.py prints the coordinate, formula text and cached value; scan.py gives per-task prefilled/gold stats). For the two cand_0001 regressions (2768, 560-12) I also compared against the seed rollouts. Every failure is a capability failure. All rollouts had error=None, so there is no environment fault.\n\n## Ranked issue list (leverage = # failing tasks it reaches)\n| rank | cluster | tasks | root cause (trace evidence) | tag | lever |\n| --- | --- | --- | --- | --- | --- |\n| 1 | A. Examples not used as test cases (sheet OR instruction text) | 48527, 51-12, 2768, 43436 (4) | 48527: D2/D3 were pre-filled with the expected answers. The agent's rule cleared D2 and left D4/D5 empty. 51-12: row 2 markers 1\u20134 show the count is 4. The code wrote 2, the agent's own final message reasoned 4, and it never compared the two. 2768: the instruction says \"fulfil the first line with 100 pcs followed by balance 20 pcs under the second line\", but the output had H11=0, H12=120. | BEHAVIORAL | STRUCTURE: step 4 prints computed vs every example before saving; the rule for a partially filled answer range is conditioned |\n| 2 | B. Existing formulas never looked at | 53647, 43436 (2) | 53647: init E8:E16 hold `=IF(C8>1,E31,\"\")`, which references E30:E32. The agent inspected only with data_only, used C5/D5 (70/80), and got E7 wrong (gold 8.75). 43436: neighbouring column H holds `=COUNTIFS(B:B,G2,D:D,\"\")`, which shows per-label counts. | KNOWLEDGE | EXAMPLE: a concrete inspect snippet printing formula text and cached value; rule that the user's \"original\" formulas name the intended references |\n| 3 | C. Explicit start cell ignored (regression from cand_0001) | 560-12 (1) | \"The answer should be put from I3 with the Headers\". The agent anchored the headers at I2, the corner of the Sheet-Level answer_position. The seed followed \"from I3\" and passed. | KNOWLEDGE (contract) | CONTRACT line: an instruction-named start cell governs; Sheet-Level answer_position is only the outer limit |\n| 4 | D. Grid of label \u00d7 header answered per record | 43436 (1) | The answer I2:K6 has department labels in G2:G6 and months in I1:K1. The agent wrote 0/1 per-row flags; gold has counts per department and month. | KNOWLEDGE | Add a rule: a grid cell = result for (row label, column header), usually a count/sum |\n| 5 | E. Extra sort keys / text dates (regression from cand_0001) | 2768 (1) | The agent sorted by issued date, then by request del date (a mixed str/datetime column it stringified), then by Line. That served line 2 before line 1. The seed sorted on the stated keys only and passed. | KNOWLEDGE | Add a rule: apply only the stated criteria/priority; parse text dates |\n| 6 | F. Boundary data just outside answer_position | 37456 (1) | Row 15 was left blank because \"no next date\". F16 = the next date lies just below the range, and gold row 15 = 0, 2600, 15, 20. | KNOWLEDGE | Inspect rows past the end of the range; \"next/last row\" means the sheet's data; a Cell-Level blank needs a reason |\n| 7 | G. Float threshold comparison | 51-12 (1) | `110 >= 100*1.1` is False (110.00000000000001), so the count was 2 instead of 4. | KNOWLEDGE | Add a rule with the WHY and a 1-line idiom: use a tolerance |\n\n## Changes made this iteration\n| edit | cluster | lever | file | what |\n| --- | --- | --- | --- | --- |\n| E1 | C | CONTRACT (tighten output contract) | prompt.md \"How your output is judged\" (+ template step 2 \"starting where the instruction says\") | A named start cell governs placement; Sheet-Level answer_position is the outer limit, not the anchor. |\n| E2 | B, F | EXAMPLE + restructure step 1 | prompt.md step 1, template step 1 | A 4-line snippet printing `coordinate, formula, -> cached value` from both workbooks; the inspect scope now includes the answer area and the rows past its end. This replaces the old one-liner and the \"load once normally, once data_only\" sentence, which it now subsumes. |\n| E3 | A, B, D, E, F | RESTRUCTURE (bullets) + add sourced rules with WHY | prompt.md step 2 | Step 2 split into bullets: examples (including the instruction text); a partially filled answer range = expected output, with an exception for fix/transform/clear tasks; original formulas show the references; label \u00d7 header grid; stated criteria only, plus text dates; next/last row means the real data; a Cell-Level blank needs a reason. |\n| E4 | G | KNOWLEDGE + reason | prompt.md step 3 | Use a tolerance for threshold/percentage comparisons, with the `100*1.1` illustration. |\n| E5 | A | STRUCTURE (ordered pre-save check) | prompt.md step 4, template step 2 | Print the computed values next to the examples before saving. If the agent's reasoning disagrees with the printed output, find the bug. |\n| E6 | A | consolidate | prompt.md step 5 | The verify step now also checks against the examples in the instruction. |\n\nThe file was chosen by role. Policy and knowledge go in prompt.md (the system message, re-read every turn). The per-task ordered steps in task_template.md got only two short clauses, so the two files don't diverge. No rule was dropped: the old \"load once normally / once data_only\" constraint is now the snippet, and \"If answer_position already contains some values, infer the rule\" became the conditioned bullet E3.\n\n## Verify (trace evidence each edit addresses) and blast radius\n- **E1 / 560-12.** Verify: the trace wrote `ws['I2']='ITEM'` while the instruction says \"put from I3 with the Headers\"; gold has I3:J3 = headers. Blast radius: the rule applies only when the instruction names a cell. Passing Sheet-Level tasks (142-12, 382-10, 416-15, 395-36, 402-43, 7902, 227-40, 50768) either name no start cell or already start at the corner they name. Bounded.\n- **E2 / 53647.** Verify: in init, `E8 '=IF(C8>1,E31,\"\")'` points at E31/E32, gold E7=8.75=E31, and the trace never printed the formula text. For 37456, F16 lies one row below G12:J15. Blast radius: inspection only, so it adds output and nothing else. Passing runs use 2\u20136 of 30 rounds. The rows-past-end clause only adds context. Bounded.\n- **E3 partial-fill rule / 48527.** Verify: init D2/D3 = gold values (pre-filled examples); the trace cleared D2. Blast radius: scan.py shows pre-filled cells EQUAL to gold in 463-17, 48588, 47798, 54144, 39046, 37378, 59196, 48921, 50768, 53383, 38462; the rule reinforces what those tasks already do. Pre-filled cells DIFFERING from gold in 142-12, 382-10, 416-15, 55049 ('#VALUE!'), 6698 (G4 is the formula the user wants modified), 56563 ('#NUM!'), 267-18, 9726, 9569, 48620, 59595 ('n/a' placeholders), 7902. These are fix/transform/clear tasks or error/placeholder cells, so the exception names them (\"fix, modify, transform, clear, or replace \u2026 e.g. cells showing errors or a formula the user wants changed\"). Residual risk: 59595/48620/9726 have a few stale values that the agent must overwrite. For 9726 and 48620 the old value is an input that the question asks to recompute. 59595's 'n/a' is a placeholder. MODERATE; flagged.\n- **E3 original-formula rule / 53647.** Blast radius: tasks with formulas near the answer (6698, 267-18, 39046, 55979) already followed those references. Bounded.\n- **E3 grid rule / 43436.** Verify: G2:G6 = A\u2013E labels, I1:K1 = months, H2 = `=COUNTIFS(B:B,G2,D:D,\"\")`. Blast radius: grid-shaped passing answers (7902 D3:J6, 142-12) already compute per-cell results. Bounded.\n- **E3 stated-criteria rule / 2768.** Verify: the trace sort key included the 'Request del date' column (stringified); the seed sort `['Order issued Date','Line']` passed; the instruction's own example (100 then 20) contradicts the output. Blast radius: applies only to sorting and prioritizing tasks (560-12 explicit order A006, A004, A005, which it supports). Bounded.\n- **E3 boundary rule / 37456.** Verify: gold has 0/16 blanks, and the trace left row 15 blank with \"last date\". Blast radius: \"Before leaving a Cell-Level answer cell empty, find the reason in the data\". 53647 has legitimately blank gold E9:E16 (the formula returns \"\"), and that reason IS in the data, so the rule does not force filling. Bounded.\n- **E4 / 51-12.** Verify: reproduced in Python, `110 >= 100*1.1` \u2192 False, and the trace's count was 2 vs gold 4. Blast radius: only threshold comparisons. Values exactly on a threshold flip toward Excel's behaviour, and away from it nowhere. Bounded.\n- **E5 / 51-12, 48527, 2768.** Verify: the 51-12 final message says \"the count should be 4\" after the file was saved with 2; a printed compare would have shown the mismatch. Blast radius: one extra print before the save; the round count is unchanged. Bounded.\n- **Template validity:** string.Formatter fields = {answer_position, instruction, instruction_type, max_turns, output_path, spreadsheet_content, spreadsheet_path}, which is exactly required + optional, and `.format(...)` succeeds. prompt.md is read raw (`_read_capability` \u2192 read_text, never .format), so the braces-free snippet is safe.\n\n## Deliberately skipped\n- Reverting the pandas \"prefer openpyxl\" guidance. The 2768/560-12 regressions were not caused by it (both traces fail on ordering/placement logic, not on the writer).\n- Any task-specific value (department letters, 1.1, I3, item codes). The rules are phrased generically, and the `100*1.1` float example illustrates a language fact, not an answer.\n- A global \"fill every answer cell\" rule. Gold blanks are legitimate (53647 has 8/10 blank), so the rule is scoped to \"find the reason in the data\".\n- Moving content into task_template.md beyond two clauses, to avoid duplicating the system prompt.\n\n## Process & features used\n- Subagents / worktrees / parallel: none. I worked serially because the session instructions forbid the Agent tool/workflows unless the user requests them.\n- Prior iterations read: prior_iterations/cand_0001/{PROCESS.md, diff.patch}, LEDGER, JOURNAL; rejected.jsonl is empty.\n- Size: prompt.md went from ~800 to ~1150 words. The growth is all in structured step 2 bullets and one code snippet; there are no repeated emphasis lines and no new ALL-CAPS.\n\n## Good things to PRESERVE\n- The cand_0001 \"write literal values, no recalc\" contract (it fixed 17 tasks), the openpyxl load-modify-save step, the Verify step, and all placeholders.\n\n---\n\n# DIAGNOSIS.json \u2014 machine-readable diagnosis (OPTIONAL but recommended)\n\nIn addition to PROCESS.md, you may write a DIAGNOSIS.json file to make your diagnosis machine-readable for the dashboard. This is optional; if absent, the dashboard will parse PROCESS.md tables when present, or show only outcome data.\n\nThe schema:\n```json\n{\n  \"candidate\": \"cand_NNNN\",\n  \"headline\": \"Brief summary of this iteration's strategy\",\n  \"clusters\": [\n    {\"id\": \"A\", \"name\": \"Short cluster name\",\n     \"detail\": \"Root cause explanation\", \"tasks\": [\"task-id\", ...],\n     \"scope\": \"BOUNDED|WIDESPREAD|SYSTEMIC\", \"latent\": false,\n     \"tag\": \"KNOWLEDGE|BEHAVIORAL|CAPABILITY-GAP\"}\n  ],\n  \"edits\": [\n    {\"id\": \"E1\", \"title\": \"What this edit does\",\n     \"files\": [\"prompt.md\"], \"lever\": \"CONTRACT|KNOWLEDGE|BEHAVIORAL|...\",\n     \"clusters\": [\"A\"], \"blast_radius\": \"BOUNDED|MODERATE|WIDE\",\n     \"verified\": \"How you tested it\"}\n  ],\n  \"skipped\": [{\"title\": \"What was skipped\", \"reason\": \"Why\"}],\n  \"techniques\": [\"technique 1\", \"technique 2\"]\n}\n```\n\nValidation is advisory only and never blocks an iteration. Warnings are recorded when:\n- A task ID in clusters[].tasks is not in the val split\n- An edit references a cluster ID that does not exist\n- An edit references a file that does not exist in the candidate", "template_only": false}]}, "config": {"project_dir": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/.capevolve/project", "spec_missing": false, "spec_groups": [{"group": "Capability", "items": [{"key": "capabilities", "value": ["system-prompt"]}, {"key": "capability_path", "value": "seed_capability"}]}, {"group": "Delivery", "items": [{"key": "intervention", "value": "direct"}]}, {"group": "Algorithm & optimizer", "items": [{"key": "optimizer_skill", "value": "claude-code"}, {"key": "optimizer_model", "value": "aws/claude-opus-5-5"}, {"key": "target_model", "value": "rits/google/gemma-4-31B-it"}, {"key": "target_profile_file", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/spreadsheetbench/full_verified_probe/reader/B_frontier.md"}, {"key": "optimizer_max_turns", "value": 80}, {"key": "optimizer_usd_per_iter", "value": 0}, {"key": "optimizer_instructions_file", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/.\u00abredacted\u00bb.md"}, {"key": "algorithm_skill", "value": "hill-climb"}]}, {"group": "Data & splits", "items": [{"key": "dataset_source", "value": "adapter"}, {"key": "split_ids_file", "value": "inputs/split_ids.json"}, {"key": "split_seed", "value": 0}, {"key": "num_trials", "value": 1}]}, {"group": "Budget & gate", "items": [{"key": "gate_mode", "value": "paired"}, {"key": "gate_k_se", "value": 0.2}, {"key": "max_iterations", "value": 3}, {"key": "stall", "value": 3}]}, {"group": "Other", "items": [{"key": "algorithm_focus", "value": "all"}, {"key": "reuse_baseline", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/reused_seed_run/run_suite"}, {"key": "store", "value": "git"}]}], "project_md": null, "files": [{"path": "adapters/adapter.py", "size": 107263, "preview": "\"\"\"SpreadsheetBench adapter template \u2014 optimize a spreadsheet agent's system prompt.\n\nReady-to-use cap-evolve adapter for SpreadsheetBench\n(https://github.com/RUCKBReasoning/SpreadsheetBench). Supports ANY litellm-compatible\nprovider \u2014 configure via env vars (see model_config.py).\n\nSETUP:\n  1. Get the harness code (Docker/Jupyter sandbox + prompt/scoring helpers). cap-evolve\n     vendors it as a filtered git subtree at third_party/spreadsheetbench \u2014 point at that,\n     or clone+filter upstream yourself (see third_party/spreadsheetbench/NOTICE.md):\n       SPREADSHEETBENCH_HARNESS_DIR=/path/to/cap-evolve/third_party/spreadsheetbench\n\n  2. Fetch the dataset (NOT vendored \u2014 tens of MB of xlsx files, fetched at run time):\n       ci/benchmarks/spreadsheetbench/fetch_data.sh /some/cache/dir\n     then point at the extracted folder (contains dataset.json + spreadsheet/):\n       SPREADSHEETBENCH_DATA_DIR=/some/cache/dir/sample_data_200\n     SPREADSHEETBENCH_VARIANT selects which release: `sample_200`, `full_912` (the original\n     912-task set, 3 graded copies per task) or `verified_400` (the 400-task verified\n     re-release, 1 graded copy per task \u2014 what recent published work evaluates on). The\n     adapter reads the number of graded copies off disk, so all three just work.\n\n  3. Install Docker (required \u2014 each task runs in its own sandboxed container) and,\n     for accurate scoring of formula-bearing outputs, LibreOffice:\n       sudo apt install libreoffice-calc   # Debian/Ubuntu\n       sudo dnf install libreoffice-calc   # RHEL/Fedora\n       brew install --cask libreoffice     # macOS\n     Scoring degrades gracefully (skips recalculation) if LibreOffice is absent \u2014 but\n     silently: a formula-only cell then reads as empty and never matches, so a task the\n     agent actually solved scores 0. Treat the \"LibreOffice not found\" warning as a\n     setup error, not a nicety. Upstream's docstring asks for 7.5+; RHEL 9's 7.1.8.1\n     recalculates correctly through `--convert-to xlsx` and is verified in use.\n\n  4. Install adapter deps: pip install pandas openpyxl docker tornado requests\n\n  5. Copy this directory to .capevolve/project/adapters/, copy model_config.py alongside.\n\n  6. Set env vars (in .env or shell) \u2014 any litellm provider, see model_config.py:\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  7. Optional env vars:\n       SPREADSHEETBENCH_TASK_IDS=59196,58568         # comma-separated subset (default: all 200)\n       SPREADSHEETBENCH_MAX_TURNS=5                  # rounds of code-exec interaction per task\n       SPREADSHEETBENCH_ROWS=5                       # preview rows shown per sheet in the prompt\n       SPREADSHEETBENCH_CONCURRENCY=4                # parallel tasks (each = one Docker container)\n       SPREADSHEETBENCH_EXEC_TIMEOUT=180             # per code-exec call timeout (s)\n       SPREADSHEETBENCH_LIBREOFFICE_BIN=/path/to/soffice\n\n  8. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES \u2014 ALL the text the agent reads, in two files:\n  - prompt.md         the system prompt: who the agent is, how it should work.\n  - task_template.md  the per-task user message: how the job is framed, what the fields\n                      mean, and the interaction contract. Optional \u2014 no file falls back to\n                      the built-in _TASK_TEMPLATE, so older capabilities are unaffected.\n  Keeping the job description frozen in this file used to leave ~60% of the agent's\n  instruction surface un-optimizable, including the line \"once that file exists, you are\n  done\" \u2014 which encourages exactly the dominant failure (a wrong-but-present output file).\n  Per-task VALUES (instruction, paths, preview, answer_position) are still supplied by the\n  adapter through placeholders that live() validates; see _task_template_error.\n\nHOW IT WORKS:\n  - task \u2026[+102965 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 2047, "preview": "{\"train\": [\"10452\", \"105-24\", \"10747\", \"108-24\", \"118-50\", \"11842\", \"141-20\", \"165-23\", \"170-13\", \"1818\", \"192-22\", \"194-19\", \"22-47\", \"247-24\", \"250-20\", \"254-34\", \"262-17\", \"263-1\", \"30930\", \"31011\", \"31915\", \"32023\", \"32255\", \"32337\", \"32438\", \"325-44\", \"32612\", \"32902\", \"34033\", \"3413\", \"35742\", \"36097\", \"370-43\", \"379-36\", \"398-14\", \"39903\", \"39931\", \"408-39\", \"40892\", \"414-20\", \"42354\", \"433-47\", \"43589\", \"45372\", \"46121\", \"46646\", \"472-15\", \"47766\", \"48080\", \"48365\", \"48745\", \"48983\", \"493-18\", \"49333\", \"50916\", \"51090\", \"51249\", \"52216\", \"54085\", \"54638\", \"55060\", \"55421\", \"55427\", \"55965\", \"56274\", \"56427\", \"56786\", \"57113\", \"57445\", \"57558\", \"577-40\", \"57743\", \"58109\", \"58484\", \"58499\", \"585-41\", \"58949\", \"6239\", \"66-24\", \"82-30\"], \"val\": [\"12864\", \"142-12\", \"227-40\", \"267-18\", \"2768\", \"31628\", \"37378\", \"37456\", \"382-10\", \"38462\", \"39046\", \"395-36\", \"402-43\", \"416-15\", \"43436\", \"45635\", \"463-17\", \"46897\", \"47798\", \"48527\", \"48588\", \"48620\", \"48921\", \"50768\", \"51-12\", \"53383\", \"53647\", \"54144\", \"55049\", \"55979\", \"560-12\", \"56563\", \"59196\", \"59595\", \"6698\", \"7902\", \"80-42\", \"8942\", \"9569\", \"9726\"], \"test\": [\"109-21\", \"120-24\", \"130-9\", \"13284\", \"142-19\", \"14240\", \"15387\", \"156-14\", \"157-4\", \"16511\", \"17111\", \"178-22\", \"18645\", \"208-20\", \"24-23\", \"297-42\", \"3002\", \"31202\", \"31746\", \"32562\", \"32789\", \"33157\", \"333-29\", \"334-11\", \"341-40\", \"359-21\", \"36191\", \"36277\", \"367-23\", \"36764\", \"37229\", \"374-18\", \"37554\", \"384-4\", \"38537\", \"39 rk through them all.\n\n## WHAT YOU MAY EDIT \u2014 and the two ways iterations get wasted here\nEdit ONLY the capability files listed in `{{CAP_BRIEF}}` below (the prompt / skill text in\nthis working directory). Everything else you can see is READ-ONLY CONTEXT.\n\n**You may NOT edit the adapter, the harness, the scorer, the benchmark, or the\nenvironment** \u2014 not to make a task pass, not to fix a broken mount or a missing binary,\nnot \"just to unblock the run\". Those files are how your score is MEASURED; changing them\ndoes not improve the capability, and a gain obtained that way is not a result. An\niteration that edits infrastructure has produced NOTHING measurable, however green the\nnumber looks. **If the traces show an ENVIRONMENT fault** (permission denied, missing\nbinary, gateway/network error, timeout, container failure \u2014 the same error on nearly every\ntask, unrelated to the task's content), then the correct and complete action is:\n1. do NOT edit the prompt to work around it (a prose workaround for a broken environment\n   is a speculative edit that fails the REAL test \u2014 the prompt is not the defect), and\n2. state the diagnosis in `PROCESS.md` and `JOURNAL.md` precisely \u2014 the exact error, how\n   many tasks it hit, and what a human must fix \u2014 then STOP. Handing back an accurate\n   \"the environment is broken, here is the evidence\" is a SUCCESSFUL iteration.\n\n**The other way iterations get wasted: another prose rule for a behavior the agent already\nknows.** When the agent has the rule and skips it anyway, adding a second sentence saying\nthe same thing changes nothing \u2014 you must change the STRUCTURE that makes it skippable\n(see the levers below): make the step unavoidable and ordered, make the contract explicit,\nor give a worked example it can pattern-match. Prose is for genuine KNOWLEDGE gaps (a\nfact / format / criterion the agent cannot derive) and for STRUCTURE that changes what the\nagent does \u2014 not for repetition or emphasis.\n\n## The THREE TESTS every change must pass (this is the whole game)\nBefore you keep any edit, confirm all three. Drop any edit that fails even one.\n1. **REAL** \u2014 it targets a cluster that is FAILING in THIS iteration's `./trajectories/`\n   (reward 0, partial-credit, or communication/omission). Never edit for a hypothetical\n   problem, and never edit on account of a task whose failure is an environment fault.\n2. **SAFE (bounded blast radius)** \u2014 the real regression question is *behavioral*:\n   **would this edit change what the agent DOES on ANY currently-passing task?** Two\n   blast-radius classes:\n   - **BOUNDED** \u2014 an ADDITIVE rule that applies only under a stated condition present in\n     the failing cases, or a clarification of an output contract the passing tasks already\n     satisfy. This is the SAFE default \u2014 prefer it.\n   - **UNBOUNDED** \u2014 any edit to a GLOBAL decision/permission/refusal rule, or a \u2026[+13631 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/prompt.md", "size": 0, "preview": "", "truncated": false, "binary": false}]}, "host_session": {}}, "diffs": {"cand_0001": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,20 @@"}, {"t": "add", "l": "+You are an expert spreadsheet engineer. You solve spreadsheet tasks by writing Python (openpyxl, pandas), which is executed for you, one code block per round."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## How your output is judged"}, {"t": "add", "l": "+The saved output file is opened with `openpyxl.load_workbook(output_path, data_only=True)`, and the cells in answer_position are compared with a reference solution. Nothing is recalculated. So:"}, {"t": "add", "l": "+- **Write computed literal values, never formula strings.** A cell set to `\"=SUM(A1:A5)\"` through openpyxl has no cached value and reads back as empty. That scores as wrong even if the formula is correct. This holds even when the user's question says \"I need a formula\": work out what that formula would return in each cell, compute it in Python, and write the resulting value. The same applies to VBA/macro requests: do what the macro would do and write the resulting values."}, {"t": "add", "l": "+- Existing formulas also lose their cached values when openpyxl re-saves the file. If an answer_position cell currently holds a formula, read its value with `data_only=True` and write a literal value into it (the unchanged value, or your new value)."}, {"t": "add", "l": "+- Comparison is per cell and type-sensitive. Numbers are compared as numbers (rounded to 2 decimals), and text as exact text. Write numbers as int/float (not \"12\" or \"12 kg\") unless the expected result is clearly text. Match the text conventions the sheet already uses: capitalization, spacing, and names exactly as written (e.g. a sheet name `Supplier_1` is not \"Supplier 1\"). If a result is empty, leave the cell empty (None), not \"0\" or \"N/A\", unless the task implies otherwise."}, {"t": "add", "l": "+- Only answer_position is checked, but keep everything else intact: do not move, re-header, or overwrite input data."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Workflow"}, {"t": "add", "l": "+1. **Inspect the real cells first.** The spreadsheet_content preview is a pandas view. It hides leading empty rows, renames headers to \"Unnamed: n\", and shows only a few rows. Use openpyxl to print all sheet names, then non-empty cells with their coordinates for the header area and the rows around answer_position, e.g. `for row in ws.iter_rows(min_row=1, max_row=15): print([(c.coordinate, c.value) for c in row if c.value is not None])`. Find which row actually holds the headers and which columns hold the data the question refers to. Load the workbook once normally (to see formulas) and once with `data_only=True` (to see values)."}, {"t": "add", "l": "+2. **Understand the intent, using the sheet as a spec.** These spreadsheets often contain a worked example, a manually filled \"expected\" row or column, highlighted cells, or notes near the target. Treat those as test cases that your logic must reproduce. If answer_position already contains some values, infer the rule that produces them. Decide the rule for every edge case: blanks, zeros, duplicates, numbers stored as text, dates (`datetime`), and Excel error strings like `'#N/A'` or `'#NUM!'` (openpyxl reads these as `str`; skip them where Excel functions like AGGREGATE/IFERROR would)."}, {"t": "add", "l": "+3. **Compute in Python** from the `data_only=True` values, covering every cell of the answer range."}, {"t": "add", "l": "+4. **Write with openpyxl:** `wb = load_workbook(spreadsheet_path)`, set only the answer_position cells, then `wb.save(output_path)`. This preserves the layout, the other sheets, and the cell positions. Prefer this over a pandas `read_excel`/`to_excel` round-trip, which easily shifts rows (header and index handling) and drops other sheets and formatting. Computing with pandas is fine; then write the values into the openpyxl workbook at the right coordinates (pandas row i of a `header=0` frame is usually Excel row i+2 only when the headers are in row 1; check)."}, {"t": "add", "l": "+5. **Verify in the next round:** reopen output_path with `data_only=True` and print the answer_position cells (for large ranges, a sample plus a count of None cells). Check them against the examples in the sheet and against common sense. If any value is None, a formula string, an error, or disagrees with an example, fix it and re-save."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Working well"}, {"t": "add", "l": "+- Always `print` what you need to see; code with no output tells you nothing. If a round errors or shows something unexpected, change the approach. Never resend the same code."}, {"t": "add", "l": "+- Make each code block complete and runnable on its own: re-import and reload every time."}, {"t": "add", "l": "+- When the questi // PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared

function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}

    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}

  closeList();

(function(){

  for(const n of G.nodes){ if(n.status!=='rejected')continue;

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

(function(){

  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));
  const cw=Math.max(10,Math.min(26,Math.floor(1000/iters.length))),ch=16,labW=120;

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

(function(){
  const L=S.cost_ledger; if(!L||!L.rows.length)return;
  const s=sec('Cost ledger — where every dollar went');
  const head=$('div',{style:'display:flex;flex-wrap:wrap;gap:22px;margin-bottom:12px'});
  const stat=(l,v,cls='')=>{const d=$('div');d.append($('div',{class:'eyebrow',text:l}),
    $('div',{class:'num '+cls,style:'font-weight:700;margin-top:2px',text:v}));return d;};
  const off=Math.abs(L.unattributed_usd)>0.0005;
  head.append(stat('total recorded','$'+L.total_usd.toFixed(4),''),
              stat('attributed to events','$'+L.attributed_usd.toFixed(4)),
              stat('unattributed','$'+L.unattributed_usd.toFixed(4),off?'':'muted'),
              stat('rows with no cost recorded',String(L.rows_missing_cost)));
  s.append(head);
  if(off)s.append($('div',{class:'banner',text:
    '$'+Math.abs(L.unattributed_usd).toFixed(4)+' of recorded spend is not accounted for by the rows '+
    'below. That happens when a phase records into the run spend accounting without emitting a '+
    'cost-bearing event (agent-mode commits are the common case). Shown rather than hidden.'}));
  const KC={intake:'var(--muted2)',baseline_eval:'var(--accent)',candidate_eval:'var(--ok)',
            optimizer_call:'var(--champion)',test_eval:'var(--idk)'};
  const PH={intake:'Intake',baseline:'Baseline',optimize:'Optimize',finalize:'Finalize (sealed test)'};
  const maxRow=Math.max(1e-9,...L.rows.map(r=>r.usd||0));
  for(const ph of ['intake','baseline','optimize','finalize']){
    const rows=L.rows.filter(r=>r.phase===ph); if(!rows.length)continue;
    const sum=rows.reduce((a,r)=>a+(r.usd||0),0), miss=rows.filter(r=>r.usd==null).length;
    s.append($('h2',{style:'margin:16px 0 6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)',
      text:`${PH[ph]} — $${sum.toFixed(4)}`+(miss?`  (+${miss} unrecorded)`:'')}));
    const t2=$('table');
    rows.forEach(r=>{
      const label=$('td');
      const line=$('div',{style:'display:flex;align-items:center;gap:8px'});
      line.append($('span',{style:`width:9px;height:9px;border-radius:2px;flex:none;background:${KC[r.kind]||'var(--muted)'}`}),
                  $('span',{text:r.label}));
      label.append(line);
      if(r.note)label.append($('div',{class:'muted',style:'font-size:11px;margin-left:17px',text:r.note}));
      const bar=$('div',{class:'bar',style:'margin:5px 0 0 17px'});
      bar.append($('i',{style:`width:${((r.usd||0)/maxRow*100).toFixed(1)}%;background:${KC[r.kind]||'var(--muted)'}`}));
      label.append(bar);
      t2.append($('tr',{},label,
        $('td',{class:'r num',text:r.usd==null?'—':'$'+(+r.usd).toFixed(4)}),
        $('td',{class:'r num muted',text:dsecs(r.seconds)}),
        $('td',{class:'r num muted',text:r.tokens?(+r.tokens).toLocaleString():'—'})));
    });
    s.append(t2);
  }
  s.append($('div',{class:'legend',html:'<span class="muted">a &ldquo;—&rdquo; is a cost that was never '+
    'recorded; it is never rendered as $0</span>'}));
})();

/* ---------- 9. Activity log — every event, filterable ---------- */
(function(){
  const LOG=S.log||[]; if(!LOG.length)return;
  const s=sec('Activity log — every event this run recorded');
  const bar=$('div',{class:'row',style:'margin-bottom:10px;align-items:center'});
  const q=$('input',{type:'search',placeholder:'search kind, candidate, message…',style:'flex:1;min-width:180px'});
  const phase=$('select'); ['all','intake','baseline','optimize','finalize'].forEach(p2=>
    phase.append($('option',{value:p2,text:p2})));
  const kind=$('select');
  ['all',...[...new Set(LOG.map(r=>r.kind))].sort()].forEach(k=>kind.append($('option',{value:k,text:k})));
  const count=$('span',{class:'muted num'});
  bar.append(q,$('span',{class:'muted',text:'phase'}),phase,$('span',{class:'muted',text:'kind'}),kind,count);
  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));
    if(typeof d.opt_cost_usd==='number')b.push('opt $'+d.opt_cost_usd.toFixed(4));
    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();
    const rows=LOG.filter(r=>{
      if(phase.value!=='all'&&r.phase!==phase.value)return false;
      if(kind.value!=='all'&&r.kind!==kind.value)return false;
      if(!needle)return true;
      return (r.kind+' '+(r.candidate||'')+' '+(r.text||'')+' '+JSON.stringify(r.detail||{}))
        .toLowerCase().includes(needle);
    });
    count.textContent=rows.length+'/'+LOG.length;
    list.innerHTML='';
    if(!rows.length){list.append($('p',{class:'muted',text:'No event matches this filter.'}));return;}
    rows.forEach(r=>{
      const row=$('div',{class:'logrow'});
      row.append($('span',{class:'muted num',text:clock(r.t)}),
        $('span',{class:'muted',style:'font-size:10px;text-transform:uppercase;letter-spacing:.05em',text:r.phase}),
        $('span',{class:'k',style:'color:'+(TONE[r.kind]||'var(--muted2)'),
                  text:r.kind+(r.candidate?' '+r.candidate:'')}),
        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);
      row.addEventListener('click',()=>{
        if(open.has(r.seq)){open.delete(r.seq);det.style.display='none';}
        else{open.add(r.seq);det.style.display='block';}
      });
    });
  }
  q.addEventListener('input',render);phase.addEventListener('change',render);
  kind.addEventListener('change',render);render();
})();

/* ---------- 10. evograph weakness graph (replaces the embedded viewer) ---------- */
(function(){
  const EG=(S.algo_extra||{}).evograph; if(!EG)return;
  const s=sec('Weakness graph — evograph');
  const rounds=(EG.rounds||[]).filter(r=>r.split!=='test');
  const final=(EG.rounds||[]).find(r=>r.split==='test');
  const prim=r=>r.primary_metric?r.metrics[r.primary_metric]:null;
  if(rounds.length){
    const max=Math.max(1e-9,...rounds.map(r=>prim(r)||0),(final?prim(final):0)||0);
    const wrap=$('div',{style:'display:flex;align-items:flex-end;gap:14px;margin-bottom:12px'});
    const col=(label,v,color,note)=>{const d=$('div',{style:'display:flex;flex-direction:column;align-items:center;gap:5px;flex:1'});
      d.append($('span',{class:'num',style:'font-weight:700;font-size:12px',text:v==null?'—':(v*100).toFixed(1)+'%'}),
        $('div',{style:`width:100%;max-width:64px;height:${Math.max(4,(v||0)/max*110)}px;border-radius:4px 4px 0 0;background:${color}`}),
        $('span',{class:'eyebrow',text:label}),$('span',{class:'muted num',style:'font-size:10px',text:note||''}));
      return d;};
    rounds.forEach(r=>wrap.append(col('round '+r.round,prim(r),'var(--accent)',
      (r.num_tasks??'—')+' tasks'+(r.completed_at==null?' · running':''))));
    if(final)wrap.append(col('sealed test',prim(final),'var(--ok)',
      final.cost_usd!=null?'$'+(+final.cost_usd).toFixed(4):''));
    s.append(wrap);
    s.append($('p',{class:'muted',style:'margin:0 0 12px',text:
      'The sealed test sits apart from the rounds on purpose — it is scored once, on data no round touched.'}));
  }
  (EG.weaknesses||[]).forEach(w=>{
    const box=$('div',{class:'dead',style:'border-left-color:var(--accent)'});
    const head=$('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
    head.append($('code',{text:w.slug}),$('span',{class:'badge b-seed',text:String(w.status||'unknown')}));
    (w.tags||[]).forEach(tg=>head.append($('span',{class:'muted',style:'font-size:11px',text:tg})));
    head.append($('span',{class:'muted num',style:'margin-left:auto;font-size:11px',
      text:(w.num_solutions||0)+' solution(s)'}));
    box.append(head);
    const bits=['discovered round '+(w.discovered_in_round??'—')];
    if(w.solved_in_round!=null)bits.push('solved round '+w.solved_in_round);
    if((w.affected_tasks||[]).length)bits.push('affects '+w.affected_tasks.join(', '));
    if((w.related||[]).length)bits.push('related → '+w.related.join(', '));
    box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:bits.join('  ·  ')}));
    s.append(box);
  });
})();

          text:f.path+'  ·  '+bySize(f.size)+

          fdet.append($('p',{class:'muted',style:'margin:4px 0',text:'binary file — not previewed'}));
        }else if(f.preview==null){
          fdet.append($('p',{class:'muted',style:'margin:4px 0',

        }else if(f.preview===''){
          fdet.append($('p',{class:'muted',style:'margin:4px 0',text:'empty file'}));
        }else{
          fdet.append($('div',{class:'diff',style:'max-height:260px',text:f.preview}));
        }
        det.append(fdet);
      });
      s.append(det);
    });
  }
})();

    t.append($('tr',{},$('th',{text:'batch'}),$('th',{class:'r',text:'siblings'}),
      $('th',{text:'candidates'}),$('th',{text:'why < 3'})));
    (AE.round_batches||[]).forEach(r=>{
      const below3=r.n_candidates<3;
      t.append($('tr',{},
        $('td',{},$('code',{text:r.batch_id||'—'})),
        $('td',{class:'r num',text:r.n_candidates},
          below3?$('span',{class:'badge b-rejected',style:'margin-left:6px',text:'<3'}):null),
        $('td',{class:'muted',style:'font-size:11px',text:(r.candidates||[]).join(', ')}),
        $('td',{class:'muted',style:'font-size:11px',text:below3?
          `${r.single_candidate_justification||'—'} (${r.single_candidate_justification_source||'unrecorded'})`
          :'—'})));
    });
    s.append(t);
  }

  if(C.merge_rejects){
    s.append(h3('Merge opportunity — safe-but-rejected candidates'));
    const w=AE.merge_rejects_warning;
    const box=$('div',{class:'dead',style:'border-left-color:'+(w.acted_on?'var(--ok)':'var(--warn)')});
    box.append($('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'},
      $('span',{text:w.safe_reject_candidates.length+' disjoint safe rejects never tried together: '}),
      ...w.safe_reject_candidates.map(cid=>$('code',{style:'margin-right:4px',text:cid})),
      $('span',{class:'badge '+(w.acted_on?'b-accepted':'b-rejected'),
        text:w.acted_on?'✓ merge proposed':'✗ unmerged'})));
    box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:
      'each individually zero-regression with a non-negative gate Δ — run merge_rejects.py '+
      '--propose on a disjoint subset to combine them.'}));
    s.append(box);
    (AE.merge_rejects_proposals||[]).forEach(p=>{
      s.append($('div',{class:'muted',style:'font-size:11px;margin:4px 0 0',text:
        'proposed: '+p.tag+' = '+p.rejects.join(' + ')+(p.built?' (built)':' (failed)')}));
    });
  }

  if(C.screens){
    s.append(h3('Screens — cheap subset evals'));
    (AE.screens||[]).forEach(sc=>{
      const box=$('div',{class:'dead',style:'border-left-color:var(--accent)'});
      const head=$('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
      head.append($('code',{text:sc.candidate}),
        $('span',{class:'badge '+(sc.decision==='pass'?'b-accepted':sc.decision==='fail'?'b-rejected':'b-indecisive'),
          text:String(sc.decision||'—')+(sc.inconclusive?' (inconclusive)':'')}));
      if(sc.tier!=null)head.append($('span',{class:'muted',style:'font-size:11px',text:'tier '+sc.tier}));
      box.append(head);
      const bits=[];
      if((sc.ids||[]).length)bits.push('subset ('+sc.ids.length+'): '+sc.ids.join(', '));
      if((sc.fixed||[]).length)bits.push('fixed: '+sc.fixed.join(', '));
      if((sc.regressed||[]).length)bits.push('regressed: '+sc.regressed.join(', '));
      if(sc.mean_delta!=null)bits.push('Δ='+(+sc.mean_delta).toFixed(3)+(sc.se!=null?' ± '+(+sc.se).toFixed(3):''));
      if(sc.threshold!=null)bits.push('threshold='+sc.threshold);
      box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:bits.join('  ·  ')}));
      if(sc.rationale)box.append($('div',{class:'muted',style:'font-size:11px;margin-top:4px',text:'why this subset: '+sc.rationale}));
      s.append(box);
    });
  }

  [['minibatch','Minibatch'],['gepa','GEPA'],['skillopt','SkillOpt'],['parallel','Parallel']].forEach(([key,label])=>{
    if(!C[key])return;
    s.append(h3(label));
    const rows=AE[key]||[];
    const t=$('table');
    if(key==='minibatch'){
      t.append($('tr',{},$('th',{text:'candidate'}),$('th',{class:'r',text:'reward'}),
        $('th',{class:'r',text:'n tasks'}),$('th',{text:'tasks'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.candidate||'—'})),
        $('td',{class:'r num',text:fmt(r.reward)}),
        $('td',{class:'r num',text:r.n_tasks==null?'—':r.n_tasks}),
        $('td',{class:'muted',text:(r.tasks||[]).join(', ').slice(0,120)}))));
    }else{
      t.append($('tr',{},$('th',{text:'kind'}),$('th',{text:'candidate'}),$('th',{text:'detail'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.kind||'—'})),
        $('td',{},r.candidate||'—'),
        $('td',{class:'muted',style:'font-size:11px',text:JSON.stringify(r.detail||{}).slice(0,200)}))));
    }
    s.append(t);
  });
})();

/* ---------- 8. Candidate leaderboard + git log ---------- */
(function(){
  const s=sec('Candidates'); const t=$('table');
  // "screened" (did this candidate pay for a cheap screen before full-val?) only shown
  // when SOME node has a recorded signal — never rendered as a column of bare "—".
  const showScreened=!!(S.capabilities&&S.capabilities.screened);
  // agent-optimize's cheap screen is OPTIONAL. In a run that never attempted one, every
  // candidate carried a warning-orange "✗ not screened" badge, which reads as a compliance
  // violation when nothing was violated. The badge is only a flag when SOME candidate in the
  // run did screen and this one skipped it; otherwise the column shows "—", the way the seed
  // row already correctly did.
  const anyScreened=G.nodes.some(n=>n.screened===true);
  const byId=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  const hdr=[$('th',{text:'id'}),$('th',{text:'status'}),$('th',{class:'r',text:'val'}),
    $('th',{class:'r',text:'Δ parent'}),$('th',{class:'r',text:'iter'})];
  if(showScreened)hdr.push($('th',{text:'screened'}));
  hdr.push($('th',{text:'reason'}));
  t.append($('tr',{},...hdr));
  G.nodes.slice().sort((a,b)=>(b.val||-1)-(a.val||-1)).forEach(n=>{
    // parent_val is only recorded when the algorithm's round table carried it; when it did
    // not, the parent's OWN val is sitting right there in the same graph, so fall back to it
    // rather than printing "—" for a delta both halves of which are known.
    const pv=n.parent_val!=null?n.parent_val:(n.parent&&byId[n.parent]?byId[n.parent].val:null);
    const dlt=pv!=null&&n.val!=null?(n.val-pv):null;
    const idCell=$('td',{},n.id===S.best_id?'★ '+n.id:n.id);
    // screen+gate bypass (PR #557): a compliance WARNING (never measured), distinct from
    // the accepted/rejected OUTCOME ring the status badge already shows — a different
    // color (b-bypass) so it never reads as a second verdict.
    if(n.bypassed_screen_and_gate){
      const bad=$('span',{class:'badge b-bypass',style:'margin-left:6px',text:'⚠ bypass'});
      bad.addEventListener('mousemove',e=>showTip(e,
        'screen+gate bypass: rejected via driver_judgement with no screen.py record and no '+
        'full-val gate row.\njustification: '+(n.bypassed_gate_justification||'—')));
      bad.addEventListener('mouseleave',hideTip);
      idCell.append(bad);
    }
    const cells=[
      idCell,
      $('td',{},$('span',{class:'badge b-'+n.status,text:n.status})),
      $('td',{class:'r num',text:fmt(n.val)}),
      $('td',{class:'r num',text:dlt==null?'—':(dlt>0?'+':'')+dlt.toFixed(3)}),
      $('td',{class:'r num',text:n.iteration})];
    if(showScreened)cells.push($('td',{},(n.screened==null||(!n.screened&&!anyScreened))?'—':
      $('span',{class:'badge '+(n.screened?'b-accepted':'b-rejected'),text:n.screened?'✓ screened':'✗ not screened'})));
    cells.push($('td',{class:'muted',text:(n.reason||'').slice(0,80)}));
    t.append($('tr',{},...cells));
  });
  s.append(t);
  if(S.git_log&&S.git_log.length){
    s.append($('h2',{text:'Iteration store (git)',style:'margin-top:18px'}));
    const g=$('div',{class:'diff'});
    S.git_log.forEach(r=>g.append($('div',{class:'ctx',text:r.hash+'  '+r.subject})));
    s.append(g);
  }
})();
</script></body></html>
