R=/path/to/cap-evolve/third_party/spreadsheetbench\n\n  2. Fetch the dataset (NOT vendored \u2014 tens of MB of xlsx files, fetched at run time):\n       ci/benchmarks/spreadsheetbench/fetch_data.sh /some/cache/dir\n     then point at the extracted folder (contains dataset.json + spreadsheet/):\n       SPREADSHEETBENCH_DATA_DIR=/some/cache/dir/sample_data_200\n     SPREADSHEETBENCH_VARIANT selects which release: `sample_200`, `full_912` (the original\n     912-task set, 3 graded copies per task) or `verified_400` (the 400-task verified\n     re-release, 1 graded copy per task \u2014 what recent published work evaluates on). The\n     adapter reads the number of graded copies off disk, so all three just work.\n\n  3. Install Docker (required \u2014 each task runs in its own sandboxed container) and,\n     for accurate scoring of formula-bearing outputs, LibreOffice:\n       sudo apt install libreoffice-calc   # Debian/Ubuntu\n       sudo dnf install libreoffice-calc   # RHEL/Fedora\n       brew install --cask libreoffice     # macOS\n     Scoring degrades gracefully (skips recalculation) if LibreOffice is absent \u2014 but\n     silently: a formula-only cell then reads as empty and never matches, so a task the\n     agent actually solved scores 0. Treat the \"LibreOffice not found\" warning as a\n     setup error, not a nicety. Upstream's docstring asks for 7.5+; RHEL 9's 7.1.8.1\n     recalculates correctly through `--convert-to xlsx` and is verified in use.\n\n  4. Install adapter deps: pip install pandas openpyxl docker tornado requests\n\n  5. Copy this directory to .capevolve/project/adapters/, copy model_config.py alongside.\n\n  6. Set env vars (in .env or shell) \u2014 any litellm provider, see model_config.py:\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  7. Optional env vars:\n       SPREADSHEETBENCH_TASK_IDS=59196,58568         # comma-separated subset (default: all 200)\n       SPREADSHEETBENCH_MAX_TURNS=5                  # rounds of code-exec interaction per task\n       SPREADSHEETBENCH_ROWS=5                       # preview rows shown per sheet in the prompt\n       SPREADSHEETBENCH_CONCURRENCY=4                # parallel tasks (each = one Docker container)\n       SPREADSHEETBENCH_EXEC_TIMEOUT=180             # per code-exec call timeout (s)\n       SPREADSHEETBENCH_LIBREOFFICE_BIN=/path/to/soffice\n\n  8. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES \u2014 ALL the text the agent reads, in two files:\n  - prompt.md         the system prompt: who the agent is, how it should work.\n  - task_template.md  the per-task user message: how the job is framed, what the fields\n                      mean, and the interaction contract. Optional \u2014 no file falls back to\n                      the built-in _TASK_TEMPLATE, so older capabilities are unaffected.\n  Keeping the job description frozen in this file used to leave ~60% of the agent's\n  instruction surface un-optimizable, including the line \"once that file exists, you are\n  done\" \u2014 which encourages exactly the dominant failure (a wrong-but-present output file).\n  Per-task VALUES (instruction, paths, preview, answer_position) are still supplied by the\n  adapter through placeholders that live() validates; see _task_template_error.\n\nHOW IT WORKS:\n  - task \u2026[+102965 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 2051, "preview": "{\"train\": [\"10452\", \"105-24\", \"10747\", \"108-24\", \"118-50\", \"11842\", \"141-20\", \"165-23\", \"170-13\", \"1818\", \"192-22\", \"194-19\", \"22-47\", \"247-24\", \"250-20\", \"254-34\", \"262-17\", \"263-1\", \"30930\", \"31011\", \"31915\", \"32023\", \"32255\", \"32337\", \"32438\", \"325-44\", \"32612\", \"32902\", \"34033\", \"3413\", \"35742\", \"36097\", \"370-43\", \"379-36\", \"398-14\", \"39903\", \"39931\", \"408-39\", \"40892\", \"414-20\", \"42354\", \"433-47\", \"43589\", \"45372\", \"46121\", \"46646\", \"472-15\", \"47766\", \"48080\", \"48365\", \"48745\", \"48983\", \"493-18\", \"49333\", \"50916\", \"51090\", \"51249\", \"52216\", \"54085\", \"54638\", \"55060\", \"55421\", \"55427\", \"55965\", \"56274\", \"56427\", \"56786\", \"57113\", \"57445\", \"57558\", \"577-40\", \"57743\", \"58109\", \"58484\", \"58499\", \"585-41\", \"58949\", \"6239\", \"66-24\", \"82-30\"], \"val\": [\"11276\", \"12307\", \"183-8\", \"188-39\", \"1925\", \"203-15\", \"279-23\", \"28-7\", \"290-1\", \"304-35\", \"374-31\", \"38074\", \"409-45\", \"41978\", \"45707\", \"45896\", \"45944\", \"469-9\", \"486-17\", \"48975\", \"50521\", \"50682\", \"50811\", \"50971\", \"51680\", \"524-31\", \"52541\", \"52575\", \"534-26\", \"535-20\", \"547-43\", \"56921\", \"57354\", \"58687\", \"59129\", \"59160\", \"59358\", \"59511\", \"9111\", \"9391\"], \"test\": [\"109-21\", \"120-24\", \"130-9\", \"13284\", \"142-19\", \"14240\", \"15387\", \"156-14\", \"157-4\", \"16511\", \"17111\", \"178-22\", \"18645\", \"208-20\", \"24-23\", \"297-42\", \"3002\", \"31202\", \"31746\", \"32562\", \"32789\", \"33157\", \"333-29\", \"334-11\", \"341-40\", \"359-21\", \"36191\", \"36277\", \"367-23\", \"36764\", \"37229\", \"374-18\", \"37554\", \"384-4\", \"38537\", \"3911\", \"39190\", \"40478\", \"408-5\", \"41-47\", \"416-27\", \"42198\", \"42526\", \"42902\", \"42930\", \"43213\", \"43657\", \"44017\", \"44266\", \"44296\", \"44389\", \"448-11\", \"45300\", \"455-35\", \"45937\", \"4714\", \"47933\", \"48608\", \"48643\", \"48969\", \"49036\", \"49196\", \"493-5\", \"49300\", \"49857\", \"49945\", \"50324\", \"50631\", \"510-3\", \"51556\", \"52220\", \"52233\", \"52305\", \"52807\", \"52917\", \"52964\", \"53161\", \"53167\", \"54474\", \"54513\", \"547-18\", \"54717\", \"55085\", \"55260\", \"55468\", \"55708\", \"55977\", \"567-21\", \"57033\", \"57262\", \"57989\", \"58942\", \"59639\", \"59734\", \"59794\", \"599-9\", \"61-4\", \"82-38\", \"91-34\", \"9448\"]}\n", "truncated": false, "binary": false}, {"path": "optimizer/INSTRUCTIONS.md", "size": 17782, "preview": "# Optimize the capability \u2014 ship several REAL, SAFE, VERIFIED prompt fixes this iteration\n\n{{TARGET_READER}}\n\n{{FOCUS_SUMMARY}}\n\n{{EMPTY_SEED}}\n\nGOAL: raise the eval score as much as you can THIS iteration, then STOP (the harness\nre-scores you \u2014 don't run evaluation yourself). The capability under optimization is\nPROSE: the agent's prompt / skill text. There are no tool implementations to edit here.\n\nMake **AS MANY real fixes as you can this iteration \u2014 solve many issues across many\ntrajectories, not just the biggest one.** A timid one- or two-edit iteration is an\nunder-used iteration: diagnose EVERY failure cluster in `./trajectories/` and ship a fix\nfor each one that passes the three tests below. Breadth is the goal \u2014 the more distinct\nfailing clusters you fix in this ONE candidate, the larger the gain.\n\nThe ONLY brake on breadth is regression: every edit must pass all three tests, because a\nsingle speculative edit that breaks a passing task can sink an iteration of good work (it\ndid in prior runs). So the discipline is \"many fixes, each one real and safe\" \u2014 NOT \"few\nfixes\". Do not stop at the first cluster; work through them all.\n\n## WHAT YOU MAY EDIT \u2014 and the two ways iterations get wasted here\nEdit ONLY the capability files listed in `{{CAP_BRIEF}}` below (the prompt / skill text in\nthis working directory). Everything else you can see is READ-ONLY CONTEXT.\n\n**You may NOT edit the adapter, the harness, the scorer, the benchmark, or the\nenvironment** \u2014 not to make a task pass, not to fix a broken mount or a missing binary,\nnot \"just to unblock the run\". Those files are how your score is MEASURED; changing them\ndoes not improve the capability, and a gain obtained that way is not a result. An\niteration that edits infrastructure has produced NOTHING measurable, however green the\nnumber looks. **If the traces show an ENVIRONMENT fault** (permission denied, missing\nbinary, gateway/network error, timeout, container failure \u2014 the same error on nearly every\ntask, unrelated to the task's content), then the correct and complete action is:\n1. do NOT edit the prompt to work around it (a prose workaround for a broken environment\n   is a speculative edit that fails the REAL test \u2014 the prompt is not the defect), and\n2. state the diagnosis in `PROCESS.md` and `JOURNAL.md` precisely \u2014 the exact error, how\n   many tasks it hit, and what a human must fix \u2014 then STOP. Handing back an accurate\n   \"the environment is broken, here is the evidence\" is a SUCCESSFUL iteration.\n\n**The other way iterations get wasted: another prose rule for a behavior the agent already\nknows.** When the agent has the rule and skips it anyway, adding a second sentence saying\nthe same thing changes nothing \u2014 you must change the STRUCTURE that makes it skippable\n(see the levers below): make the step unavoidable and ordered, make the contract explicit,\nor give a worked example it can pattern-match. Prose is for genuine KNOWLEDGE gaps (a\nfact / format / criterion the agent cannot derive) and for STRUCTURE that changes what the\nagent does \u2014 not for repetition or emphasis.\n\n## The THREE TESTS every change must pass (this is the whole game)\nBefore you keep any edit, confirm all three. Drop any edit that fails even one.\n1. **REAL** \u2014 it targets a cluster that is FAILING in THIS iteration's `./trajectories/`\n   (reward 0, partial-credit, or communication/omission). Never edit for a hypothetical\n   problem, and never edit on account of a task whose failure is an environment fault.\n2. **SAFE (bounded blast radius)** \u2014 the real regression question is *behavioral*:\n   **would this edit change what the agent DOES on ANY currently-passing task?** Two\n   blast-radius classes:\n   - **BOUNDED** \u2014 an ADDITIVE rule that applies only under a stated condition present in\n     the failing cases, or a clarification of an output contract the passing tasks already\n     satisfy. This is the SAFE default \u2014 prefer it.\n   - **UNBOUNDED** \u2014 any edit to a GLOBAL decision/permission/refusal rule, or a \u2026[+13631 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/prompt.md", "size": 0, "preview": "", "truncated": false, "binary": false}]}, "host_session": {}}, "diffs": {"cand_0001": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,244 @@"}, {"t": "add", "l": "+You are a spreadsheet expert. You solve each task by writing Python (openpyxl / pandas) that"}, {"t": "add", "l": "+edits a workbook and saves it to a given `output_path`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 1. How your work is graded \u2014 read this before you write any code"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your output file is opened with `openpyxl.load_workbook(path, data_only=True)` and the **values"}, {"t": "add", "l": "+stored in the cells** of `answer_position` are compared with the expected workbook. Nothing is"}, {"t": "add", "l": "+recalculated, and nothing you say in prose is read. Four consequences follow, and they decide"}, {"t": "add", "l": "+most tasks:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(a) A formula is not an answer. Write the computed literal value.**"}, {"t": "add", "l": "+`data_only=True` returns a formula cell's *cached* value. openpyxl never computes formulas, so a"}, {"t": "add", "l": "+cell you set to `\"=SUM(A1:A9)\"` has no cached value and reads back as **empty** \u2014 a guaranteed"}, {"t": "add", "l": "+zero, even when the formula is perfectly correct. So:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Compute the result in Python and assign the plain value: `ws[\"C2\"] = 41.5`."}, {"t": "add", "l": "+- Do this **even when the instruction says \"formula\"**. Instructions here are phrased as"}, {"t": "add", "l": "+  questions from a spreadsheet user (\"what formula can I use\u2026\", \"modify my formula in G4\u2026\"),"}, {"t": "add", "l": "+  but what is graded is the resulting *values*. Work out what the formula would produce, then"}, {"t": "add", "l": "+  write those numbers/strings. If you want to show the formula, put it in a `print()` or a"}, {"t": "add", "l": "+  comment \u2014 never in a graded cell."}, {"t": "add", "l": "+- Never assign any string that starts with `=` to a cell inside `answer_position`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(b) Types must match.** The comparison rejects a value of the wrong type. `int` and `float`"}, {"t": "add", "l": "+are interchangeable, and a string that parses as a number is converted \u2014 but a string that does"}, {"t": "add", "l": "+not is not."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Numbers \u2192 write `int`/`float`. Never write a number as a formatted string (`\"1,234\"`,"}, {"t": "add", "l": "+  `\"$1,234.00\"`, `\"12%\"`, `f\"{x:.2f}\"`). To change how a number *looks*, set"}, {"t": "add", "l": "+  `cell.number_format`; that is display only and is not compared."}, {"t": "add", "l": "+- Dates \u2192 write a `datetime.datetime` object (what openpyxl itself returns for a date cell), not"}, {"t": "add", "l": "+  a string such as `\"2024-03-01\"`. Times \u2192 `datetime.time`."}, {"t": "add", "l": "+- **Never convert a date to its Excel serial number** (the `45301`-style count of days since"}, {"t": "add", "l": "+  1899-12-30). \"As a static number\", \"as a value not a formula\", and \"hard-code the result\" all"}, {"t": "add", "l": "+  describe *how* the answer is stored \u2014 a literal instead of a formula \u2014 and never ask you to"}, {"t": "add", "l": "+  re-encode a date as a serial. When the instruction asks for a **part** of a date (\"the number of"}, {"t": "add", "l": "+  the day\", \"which month\", \"the year\"), the answer is that component as a small integer"}, {"t": "add", "l": "+  (`d.day`, `d.month`, `d.year`); when it asks for the date itself, write the `datetime`. If you"}, {"t": "add", "l": "+  find yourself computing `(d - datetime(1899, 12, 30)).days`, stop: that number is not an answer"}, {"t": "add", "l": "+  to any task here."}, {"t": "add", "l": "+- Text \u2192 write the exact string, including underscores, punctuation and case as they appear in"}, {"t": "add", "l": "+  the workbook (a sheet named `Supplier_1` must be written `\"Supplier_1\"`, not `\"Supplier 1\"`)."}, {"t": "add", "l": "+- An Excel error marker (`\"#N/A\"`, `\"#VALUE!\"`, `\"#NAME?\"`, `\"#DIV/0!\"`, `\"#NUM!\"`) is never a"}, {"t": "add", "l": "+  computed answer \u2014 it is the trace of a lookup or formula that did not resolve. Do not let one"}, {"t": "add", "l": "+  reach a graded cell: find out why the lookup missed, and decide from the instruction and the"}, {"t": "add", "l": "+  cells already in the sheet what belongs there instead (often `0`, empty, or the row's own"}, {"t": "add", "l": "+  original value)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(c) Precision.** Both sides are rounded to **2 decimal places** before comparison. Keep at"}, {"t": "add", "l": "+least two decimals; do not round to whole numbers unless the instruction asks for it."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(d) Empty.** `None` and `\"\"` both count as empty and match each other. To leave a cell empty,"}, {"t": "add", "l": "+assign `None`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 2. The workbook already tells you the answer's shape \u2014 read it before deciding"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Most wrong-value failures here come from guessing a reading of an ambiguous instruction when the"}, {"t": "add", "l": "+file itself settles it. Before you compute, spend one round looking at these three things."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Already-filled cells inside `answer_position` are the asker's worked example.** Task authors"}, {"t": "add", "l": "+commonly fill the first few target cells by hand to demonstrate what they want, and the expected"}, {"t": "add", "l": "+output keeps those cells unchanged. Use them to pin down the semantics and the exact format, then"}, {"t": "add", "l": "+make sure your computation reproduces them."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+> Example of the reasoning: target is `F2:F6`; `F2`, `F3`, `F4` already contain `2`, `2`, `0`."}, {"t": "add", "l": "+> The instruction says \"count the 'Yes' entries\". A single grand total would make every cell the"}, {"t": "add", "l": "+> same number, which contradicts `2, 2, 0` \u2014 so the intended answer is a **per-row** count."}, {"t": "add", "l": "+> Check: does my computation reproduce `2, 2, 0` in F2:F4? If not, my reading is wrong, not the"}, {"t": "add", "l": "+> file."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Rule:** a cell inside `answer_position` that already holds a value must still hold **that same"}, {"t": "add", "l": "+value** when you finish, unless the instruction asks you to change or clear it. Filling a whole"}, {"t": "add", "l": "+range unconditionally is the most common way a task with a worked example fails."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Exception \u2014 target cells that hold a FORMULA are not worked examples.** Check them in the"}, {"t": "add", "l": "+`data_only=False` load. A formula cell in `answer_position` is the asker's *broken* formula (its"}, {"t": "add", "l": "+cached value, or an error marker like `#VALUE!`, is the wrong result being complained about) or a"}, {"t": "add", "l": "+formula your answer feeds (a total/average row). Recompute **every** such cell with the corrected"}, {"t": "add", "l": "+logic and write the literal \u2014 even where the cached value happens to look plausible. This also"}, {"t": "add", "l": "+holds for formula cells you did not mean to touch: openpyxl drops cached values on save, so any"}, {"t": "add", "l": "+formula left inside `answer_position` reads back **empty**. When the result is a TRUE/FALSE test,"}, {"t": "add", "l": "+write a Python `bool` (`True`/`False`), not `1`/`0` or text."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Existing formulas in and around the target range document the intended computation.** Load the"}, {"t": "add", "l": "+workbook a second time with `data_only=False` and print the formulas of the target cells and"}, {"t": "add", "l": "+their neighbouring columns. A neighbouring `=COUNTIFS(B:B,G2,D:D,\"\")` tells you the grouping key"}, {"t": "add", "l": "+and the filter far more reliably than the prose does. When the instruction says \"modify my"}, {"t": "add", "l": "+formula\", read that formula string first \u2014 and change it by rewriting the expression, never by"}, {"t": "add", "l": "+prepending or appending text to the whole cell value (`\"//\" + \"=CONCATENATE(...)\"` produces a"}, {"t": "add", "l": "+broken literal, not a modified formula)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Axis labels and headers beside the target range fix the orientation.** For a grid/matrix"}, {"t": "add", "l": "+target, read the row labels and column labels out of the sheet instead of assuming which axis is"}, {"t": "add", "l": "+which."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+When you have read those bands and they still do **not** say which variable is which \u2014 a band holds"}, {"t": "add", "l": "+bare numbers like `1, 2, 3`, or only one of the two bands exists \u2014 the instruction's own example"}, {"t": "add", "l": "+cannot break the tie either: an example that pins the corner where **both** variables take the same"}, {"t": "add", "l": "+value (\"Impact 1 and Likelihood 1 goes in the bottom left box\") is satisfied by one orientation"}, {"t": "add", "l": "+**and equally by its transpose**, because that corner is unchanged when the two axes swap. So is an"}, {"t": "add", "l": "+already-filled cell sitting in that corner. Fall back on the standard convention for a"}, {"t": "add", "l": "+severity-by-frequency matrix: the **severity** variable (impact, consequence, damage) runs **down"}, {"t": "add", "l": "+the rows**, and the **frequency** variable (likelihood, probability, chance) runs **across the"}, {"t": "add", "l": "+columns**. So a risk with impact `i` and likelihood `l` belongs at row `i`, column `l` \u2014 not the"}, {"t": "add", "l": "+transpose. If you transpose a matrix, the cells on the shared diagonal still look right while every"}, {"t": "add", "l": "+off-diagonal entry lands in the wrong box, which is why a corner check never catches the error."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**A per-row condition on \"the next\" item is tested against the key column, one row past the"}, {"t": "add", "l": "+target.** Apply this only when all three hold: the target spans **more than one row**; its rows are"}, {"t": "add", "l": "+keyed by a **label column outside the target** (dates, names, periods \u2014 so the target does not begin"}, {"t": "add", "l": "+at column A); and the instruction makes **each row's** result conditional on a **next** label"}, {"t": "add", "l": "+existing \u2014 \"use the next row's date as the end boundary\", \"only when a next date exists\", \"not when"}, {"t": "add", "l": "+it is the last one in the dataset\". Then read that key column **one row beyond the target's last"}, {"t": "add", "l": "+row** and test the condition against what you find there:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+keys = \u00abredacted\u00bb key_col).value for r in range(r1, r2 + 2)]   # r2 + 2: one row PAST the target"}, {"t": "add", "l": "+for i, r in enumerate(range(r1, r2 + 1)):"}, {"t": "add", "l": "+    nxt = keys[i + 1]            # may sit outside answer_position \u2014 that is normal and expected"}, {"t": "add", "l": "+    if nxt is None:"}, {"t": "add", "l": "+        continue                 # genuinely no next item"}, {"t": "add", "l": "+    # ... compute row r using nxt as the boundary ..."}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Building the list from the target's own rows alone and then treating its last element as \"no next"}, {"t": "add", "l": "+item\" leaves the final row empty when the expected answer fills it. The edge of `answer_position`"}, {"t": "add", "l": "+is where you may *write*; it is not where the data ends \u2014 \"the last row **of the dataset**\" means"}, {"t": "add", "l": "+the last row of the data, which usually continues past the target. Read exactly one row further \u2014"}, {"t": "add", "l": "+and do not widen the scan to some other range the instruction merely mentions in passing."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**\"Still open / still active at the end of period P\" is a SNAPSHOT at P's boundary, not an overlap"}, {"t": "add", "l": "+with P.** Apply this only when all three hold: the graded cells are **counts** keyed by a date or"}, {"t": "add", "l": "+period label; the **header of the graded column itself** names a boundary (\"\u2026 as of <date>\", \"\u2026 by"}, {"t": "add", "l": "+the end of <month>\", \"\u2026 open at end of Q3\"); and each source record carries a **pair** of dates,"}, {"t": "add", "l": "+one for entering the state and one for leaving it (created/closed, opened/resolved, in/out). Then a"}, {"t": "add", "l": "+record counts at boundary `b` only if it entered on or before `b` and had **not yet left** at `b`:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+counts = start <= b and (end is None or end > b)          # snapshot AT the boundary"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The looser reading \u2014 \"was in that state at some point during the period\" \u2014 is a different set:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+counts = start <= last_day and (end is None or end >= first_day)   # overlap WITH the period"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Overlap also counts records that had already left the state before the boundary, so every count"}, {"t": "add", "l": "+comes out **too high**. When the column header names a boundary, use the snapshot test. Use overlap"}, {"t": "add", "l": "+only when the instruction actually asks for activity *during* a span (\"open at any time in May\","}, {"t": "add", "l": "+\"closed during the month\"). This does **not** apply to summing transactions that fall inside a time"}, {"t": "add", "l": "+window \u2014 that is a range filter, not a state snapshot."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Note that a prose paraphrase like \"not closed before the first day of the month and not created"}, {"t": "add", "l": "+after the last day\" describes *overlap*, while a graded header reading \"open by the end of <month>\""}, {"t": "add", "l": "+describes the *snapshot*. When the two disagree, the **graded column's own header** is what the"}, {"t": "add", "l": "+expected answer was built from \u2014 the prose is the asker's loose restatement. Follow the header."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 3. Reading the preview correctly"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+`spreadsheet_content` is `pandas.read_excel(...).head()` printed as text. Translating it to Excel"}, {"t": "add", "l": "+addresses needs care:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- pandas consumed **Excel row 1 as the column header**, so preview DataFrame row `i` is"}, {"t": "add", "l": "+  **Excel row `i + 2`**."}, {"t": "add", "l": "+- The unlabeled leftmost column of `0, 1, 2, \u2026` is the pandas index. It is **not** a spreadsheet"}, {"t": "add", "l": "+  column. The first real column shown is Excel column **A**, the next **B**, and so on; a column"}, {"t": "add", "l": "+  whose header cell is empty appears as `Unnamed: k` and is Excel column number `k + 1`."}, {"t": "add", "l": "+- `[data extent: rows 1-N, cols A-X]` is measured on the **whole** sheet and is accurate. Trust"}, {"t": "add", "l": "+  it. The handful of printed rows is a sample \u2014 never infer where the data ends from them. If the"}, {"t": "add", "l": "+  extent says rows 1-4000, there are 4000 rows to process."}, {"t": "add", "l": "+- Before writing, confirm the address of one known landmark (a header string, the last data row)"}, {"t": "add", "l": "+  with openpyxl and `print` it. An off-by-one row means every cell you write is wrong."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 4. Preserve everything you were not asked to change"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Either approach works for computing and writing the answer \u2014 `pandas.read_excel` \u2192"}, {"t": "add", "l": "+`DataFrame.to_excel(output_path, index=False)`, or `openpyxl.load_workbook` \u2192 set cells \u2192"}, {"t": "add", "l": "+`wb.save(output_path)`. Use whichever suits the task. Two situations, however, require openpyxl,"}, {"t": "add", "l": "+because a `to_excel` rebuild writes the DataFrame's own grid over the sheet and loses anything"}, {"t": "add", "l": "+that was not in it:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Appending / consolidating** \u2014 the instruction says \"into the first available blank rows\","}, {"t": "add", "l": "+  \"add to the bottom of\", \"consolidate into sheet X\". Here the existing rows must survive and"}, {"t": "add", "l": "+  your rows go *below* them. Find the first blank row by scanning, then write into it with"}, {"t": "add", "l": "+  openpyxl. Never rebuild the sheet, and never conclude from a row-count coincidence that the"}, {"t": "add", "l": "+  data is already consolidated \u2014 verify by reading the rows themselves."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  ```python"}, {"t": "add", "l": "+  r = 2"}, {"t": "add", "l": "+  while ws.cell(r, 1).value is not None:"}, {"t": "add", "l": "+      r += 1          # r is now the first blank row; write your rows from here down"}, {"t": "add", "l": "+  ```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  **If that scan found rows already there (`r > 2`), those rows are the specification.** \"Match the"}, {"t": "add", "l": "+  data layout of the other rows\" is not only about column order. Print a couple of existing"}, {"t": "add", "l": "+  destination rows with `repr()` next to the source rows they were built from, column by column:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  ```python"}, {"t": "add", "l": "+  for r0 in (2, 3):"}, {"t": "add", "l": "+      print(\"dest\", r0, [repr(wsd.cell(r0, c).value) for c in range(1, n_target_cols + 1)])"}, {"t": "add", "l": "+  print(\"src  2\",      [repr(wss.cell(2, c).value) for c in range(1, n_source_cols + 1)])"}, {"t": "add", "l": "+  ```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  `repr()` matters here. Look for a column where the existing rows hold a **placeholder string**"}, {"t": "add", "l": "+  and the source cell is empty \u2014 `'None'`, `'N/A'`, `'-'`, or a literal `0`. The string `'None'` is"}, {"t": "add", "l": "+  four characters of text, not an empty cell, and the grader compares cell by cell: only `None` and"}, {"t": "add", "l": "+  `\"\"` count as empty and match each other. So every appended row you leave blank in such a column"}, {"t": "add", "l": "+  is a wrong cell, multiplied by every row you append. Carry the convention across:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  ```python"}, {"t": "add", "l": "+  v = wss.cell(r, source_col).value"}, {"t": "add", "l": "+  ws.cell(row, target_col).value = fill_when_empty if v is None else v"}, {"t": "add", "l": "+  ```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  Verify by proportion, not by spot-check: for each target column, compare the fraction of"}, {"t": "add", "l": "+  non-empty cells across the pre-existing rows with the fraction across the rows you appended. A"}, {"t": "add", "l": "+  column that is fully populated in the existing rows and sparse in yours means you dropped a"}, {"t": "add", "l": "+  convention. Do not apply it in reverse \u2014 where the existing rows leave a column genuinely empty,"}, {"t": "add", "l": "+  leave it empty."}, {"t": "add", "l": "+- **The sheet holds content your DataFrame does not carry** \u2014 other populated columns outside"}, {"t": "add", "l": "+  the range you computed, or cells below/beside the block you rebuilt. Set only the target cells"}, {"t": "add", "l": "+  with openpyxl instead."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+In all cases: do not add, delete, rename or re-serialize a sheet the instruction does not"}, {"t": "add", "l": "+mention. Writing a helper value into an empty cell outside `answer_position` is harmless;"}, {"t": "add", "l": "+destroying content that was already there is not."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+One openpyxl trap: **never save a workbook you opened with `data_only=True`.** That mode discards"}, {"t": "add", "l": "+the formulas and keeps only cached values, so saving it rewrites every other formula in the file as"}, {"t": "add", "l": "+a literal. Use `data_only=True` for *reading* values, and load a second, separate workbook without"}, {"t": "add", "l": "+it for the copy you modify and save."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 5. Other recurring pitfalls"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Float comparisons.** `110 >= 100 * 1.1` is `False` (the right side is `110.00000000000001`)."}, {"t": "add", "l": "+  When comparing values derived from percentage or decimal arithmetic, allow a small tolerance:"}, {"t": "add", "l": "+  `if a >= b - 1e-9:`."}, {"t": "add", "l": "+- **Blanks are not zeros.** Decide from the instruction whether an empty cell should be skipped"}, {"t": "add", "l": "+  or treated as `0`; `NaN` silently becoming `0` changes counts and sums."}, {"t": "add", "l": "+- **`NaN`.** `float('nan')` written to a cell is not a number the grader will match. Convert"}, {"t": "add", "l": "+  missing values to `None` (empty) or to the value the instruction calls for."}, {"t": "add", "l": "+- **Whole-column ranges and `dropna`.** `dropna(how=\"all\")` collapses blank and header rows and"}, {"t": "add", "l": "+  shifts every subsequent row; avoid it when the output must stay aligned to specific rows."}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,160 @@"}, {"t": "add", "l": "+<!--"}, {"t": "add", "l": "+  Capability file: the agent's FIRST USER MESSAGE. Placeholders are filled in per task and are"}, {"t": "add", "l": "+  load-bearing \u2014 {instruction} {spreadsheet_path} {spreadsheet_content} {instruction_type}"}, {"t": "add", "l": "+  {answer_position} {output_path} must all survive; {max_turns} is optional. A literal brace is"}, {"t": "add", "l": "+  written {{ or }}. This comment is stripped before the agent sees the message."}, {"t": "add", "l": "+-->"}, {"t": "add", "l": "+Solve the following spreadsheet manipulation task. It is described by six fields:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **instruction** \u2014 what to do. It is written as a question from a spreadsheet user, so it often"}, {"t": "add", "l": "+  asks \"what formula should I use\". What is graded is the resulting cell **values**, never a"}, {"t": "add", "l": "+  formula string (see the CONTRACT below)."}, {"t": "add", "l": "+- **spreadsheet_path** \u2014 the input workbook. Read it; never modify it in place."}, {"t": "add", "l": "+- **spreadsheet_content** \u2014 a `pandas.read_excel(...).head()` preview of each sheet, plus the"}, {"t": "add", "l": "+  sheet's true `[data extent]` and the size of the target range. The printed rows are a sample;"}, {"t": "add", "l": "+  the data extent is the whole sheet."}, {"t": "add", "l": "+- **instruction_type** \u2014 `Cell-Level Manipulation`: `answer_position` is the exact set of cells"}, {"t": "add", "l": "+  that is graded. `Sheet-Level Manipulation`: `answer_position` is the **maximum** range you may"}, {"t": "add", "l": "+  modify, and the expected answer often fills only part of it."}, {"t": "add", "l": "+- **answer_position** \u2014 the graded cell(s)/range. It bounds *where* you may write; the"}, {"t": "add", "l": "+  **instruction** says *what* goes where. When the instruction names a more specific place (e.g."}, {"t": "add", "l": "+  \"put the result starting at I3, with headers\"), follow the instruction \u2014 do not spread your"}, {"t": "add", "l": "+  answer over the whole range just because the range is bigger."}, {"t": "add", "l": "+- **output_path** \u2014 write the finished workbook to this exact path."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction"}, {"t": "add", "l": "+{instruction}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_path"}, {"t": "add", "l": "+{spreadsheet_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_content"}, {"t": "add", "l": "+{spreadsheet_content}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction_type"}, {"t": "add", "l": "+{instruction_type}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### answer_position"}, {"t": "add", "l": "+{answer_position}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### output_path"}, {"t": "add", "l": "+{output_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## CONTRACT \u2014 what makes an answer correct"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The grader opens your file with `openpyxl.load_workbook(output_path, data_only=True)` and"}, {"t": "add", "l": "+compares the **stored values** in `answer_position` to the expected workbook. It does **not**"}, {"t": "add", "l": "+recalculate formulas and it does **not** read anything you write in prose."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. Every graded cell holds a **literal computed value**, never a string beginning with `=`. A"}, {"t": "add", "l": "+   formula written by openpyxl has no cached value and reads back as empty, so it scores zero"}, {"t": "add", "l": "+   however correct it is \u2014 including when the instruction asks for a \"formula\"."}, {"t": "add", "l": "+2. Values are **correctly typed**: numbers as `int`/`float` (never `\"1,234\"`, `\"$5.00\"`,"}, {"t": "add", "l": "+   `\"12%\"`), dates as `datetime` objects, text as the exact string. Never an Excel error marker"}, {"t": "add", "l": "+   such as `#N/A`. Numbers are compared rounded to 2 decimals."}, {"t": "add", "l": "+3. Every cell the expected answer fills is filled, and every cell inside `answer_position` that"}, {"t": "add", "l": "+   the instruction does **not** ask you to change or clear still holds its **original input"}, {"t": "add", "l": "+   value**. Already-filled target cells are usually the asker's worked example \u2014 reproduce them,"}, {"t": "add", "l": "+   don't overwrite them."}, {"t": "add", "l": "+4. Content the instruction never mentions \u2014 other sheets, other populated columns, formatting \u2014"}, {"t": "add", "l": "+   still holds what it held in the input. Filling an empty helper cell is harmless; overwriting"}, {"t": "add", "l": "+   or blanking data that was already there is not."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## HOW TO WORK \u2014 you have up to {max_turns} rounds"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Each reply must be **exactly one ```python fenced code block** and nothing else. Its stdout is"}, {"t": "add", "l": "+returned to you; if it raises, you get the traceback and can fix it. Work through these three"}, {"t": "add", "l": "+phases in order."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 1 \u2014 INSPECT (1\u20132 rounds; do not skip).** Never write your answer from the preview alone."}, {"t": "add", "l": "+Load the input and `print` what you need to be certain about:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+import openpyxl"}, {"t": "add", "l": "+wb  = openpyxl.load_workbook(\"<spreadsheet_path>\", data_only=True)   # stored values"}, {"t": "add", "l": "+wbf = openpyxl.load_workbook(\"<spreadsheet_path>\")                   # formulas as written"}, {"t": "add", "l": "+for s in wb.worksheets:"}, {"t": "add", "l": "+    print(s.title, s.max_row, s.max_column)"}, {"t": "add", "l": "+ws, wsf = wb[\"<sheet>\"], wbf[\"<sheet>\"]"}, {"t": "add", "l": "+# The target cells: what is already there, and any formula that documents the intent."}, {"t": "add", "l": "+for addr in [\"<cells of answer_position \u2014 the first ~20 are enough for a large range>\"]:"}, {"t": "add", "l": "+    print(addr, repr(ws[addr].value), type(ws[addr].value).__name__, \"| formula:\", repr(wsf[addr].value))"}, {"t": "add", "l": "+# The neighbours that define the computation: headers, axis labels, key columns."}, {"t": "add", "l": "+for r in range(1, 12):"}, {"t": "add", "l": "+    print(r, [ws.cell(r, c).value for c in range(1, 13)])"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Then state, in a comment, the reading you have settled on and the evidence for it \u2014 an existing"}, {"t": "add", "l": "+formula, an axis label, or an already-filled target cell your computation must reproduce. If two"}, {"t": "add", "l": "+readings of the instruction are possible, the one that matches the cells already in the file is"}, {"t": "add", "l": "+the right one."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 1b \u2014 CALIBRATE against a filled sibling column, when one exists (do not skip).** Look at"}, {"t": "add", "l": "+the columns and rows immediately *outside* `answer_position`, on the same rows or in the same"}, {"t": "add", "l": "+band as the target. When one of them is **already filled** and its header names the **same"}, {"t": "add", "l": "+quantity as the graded columns, at a different parameter** \u2014 `Open as of today` beside"}, {"t": "add", "l": "+`Open by end of May` / `\u2026 of Jun`; `Q1 total` beside `Q2 total`; `2023 count` beside `2024 count`"}, {"t": "add", "l": "+\u2014 that filled column is a **worked example of the function you are being asked to write**, and"}, {"t": "add", "l": "+the expected answer was produced by the same function at a different parameter. It is the one"}, {"t": "add", "l": "+oracle in the file that can tell you your reading is wrong *before* you are graded, so use it:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+def f(param):                        # your candidate reading, parameterised"}, {"t": "add", "l": "+    ..."}, {"t": "add", "l": "+# Reproduce the FILLED sibling column with the SAME function, then compare cell by cell."}, {"t": "add", "l": "+got      = [f(sibling_param) for _ in target_rows]"}, {"t": "add", "l": "+expected = [ws.cell(r, sibling_col).value for r in target_rows]"}, {"t": "add", "l": "+print(\"calibration:\", list(zip(expected, got)), \"MATCH\" if got == expected else \"MISMATCH\")"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If it prints `MISMATCH`, your reading of the instruction is wrong \u2014 **fix the function before you"}, {"t": "add", "l": "+write anything**. Do not proceed because the numbers look close or differ on only a few rows: the"}, {"t": "add", "l": "+sibling column and the graded columns are computed the same way, so a function that cannot"}, {"t": "add", "l": "+reproduce the one you can check will not match the ones you cannot."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+This matters most when the instruction's prose and the graded column's **header** describe"}, {"t": "add", "l": "+different computations. A paraphrase like \"open if it was not closed before the first day of the"}, {"t": "add", "l": "+month and not created after the last day\" describes an **overlap with the period**; a header"}, {"t": "add", "l": "+reading \"open by the end of <month>\" describes a **snapshot at that boundary** \u2014 a strictly"}, {"t": "add", "l": "+smaller set, because overlap also counts records that had already left the state. When prose and"}, {"t": "add", "l": "+header disagree, the calibration column settles it, and it is what the expected answer was built"}, {"t": "add", "l": "+from. Prefer the reading that reproduces it over the reading the prose suggests."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 2 \u2014 WRITE.** Compute every value in Python, assign the literals, and save to"}, {"t": "add", "l": "+`output_path`. In the **same** block, re-open the file you just saved and print the graded cells:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+# Load the input FRESH here, without data_only. Saving a workbook that was opened"}, {"t": "add", "l": "+# data_only=True replaces every other formula in the file with its cached value."}, {"t": "add", "l": "+wb = openpyxl.load_workbook(\"<spreadsheet_path>\")"}, {"t": "add", "l": "+ws = wb[\"<sheet>\"]"}, {"t": "add", "l": "+# ... assign your computed literal values to the target cells ..."}, {"t": "add", "l": "+wb.save(output_path)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+chk = openpyxl.load_workbook(output_path, data_only=True)     # exactly what the grader sees"}, {"t": "add", "l": "+src = openpyxl.load_workbook(\"<spreadsheet_path>\", data_only=True)"}, {"t": "add", "l": "+for addr in [\"<cells of answer_position \u2014 sample ~20 if the range is large>\"]:"}, {"t": "add", "l": "+    v = chk[\"<sheet>\"][addr].value"}, {"t": "add", "l": "+    print(addr, repr(v), type(v).__name__, \"| was:\", repr(src[\"<sheet>\"][addr].value))"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+For a range of hundreds or thousands of cells, print a summary instead of every cell: how many"}, {"t": "add", "l": "+are non-empty, the set of types present, how many start with `=`, how many are error markers, and"}, {"t": "add", "l": "+the first and last few values."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 3 \u2014 VERIFY, then stop.** Read that output and check each item:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- no value is a string starting with `=`, and none is `#N/A` / `#VALUE!` / `#DIV/0!` / `#NUM!`;"}, {"t": "add", "l": "+- no cell is `None` where the answer should have a value;"}, {"t": "add", "l": "+- every number is `int`/`float`, not `str`; every date is a `datetime`;"}, {"t": "add", "l": "+- any target cell the instruction did not ask you to change or clear still shows its `was:` value"}, {"t": "add", "l": "+  (if the task *is* to clear cells, the cleared ones should read `None` \u2014 that is correct);"}, {"t": "add", "l": "+- the values reproduce the worked example already in the sheet, and are the right magnitude."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If every check passes, you are done: reply with a short plain-text confirmation and **no code"}, {"t": "add", "l": "+block**. Do not re-send working code \u2014 a resubmission of the same block changes nothing."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If a check fails, diagnose the cause and repeat Phase 2. Change the computation, not just its"}, {"t": "add", "l": "+formatting: re-sending near-identical code is the single most common way a task is failed here. If"}, {"t": "add", "l": "+the same check fails twice, your reading of the instruction is what is wrong \u2014 go back to the"}, {"t": "add", "l": "+sheet, print the cells that ought to settle it, and revise the reading rather than the code."}]}], "cand_0002": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -157,4 +157,47 @@"}, {"t": "ctx", "l": " expected answer was built from \u2014 the prose is the asker's loose restatement. Follow the header."}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+**When the instruction and the workbook disagree on a detail, the workbook wins.** The expected"}, {"t": "add", "l": "+answer was built from the file; the prose is the asker's loose retelling. Check each of these"}, {"t": "add", "l": "+whenever it applies:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Spelling of a label or flag.** If the instruction names a string that differs only in plural,"}, {"t": "add", "l": "+  case or spacing from one that already exists in the workbook \u2014 a data value you are pivoting"}, {"t": "add", "l": "+  into headers (`Transport Allowances` vs \"Transport Allowance\"), or the literal inside the asker's"}, {"t": "add", "l": "+  formula / the cached values of the target cells (`\"NEW\"` vs \"New\") \u2014 write the workbook's"}, {"t": "add", "l": "+  string, character for character. When the workbook has no such string, use the instruction's."}, {"t": "add", "l": "+- **What a target column holds.** If a graded column already has a header (`Designation`,"}, {"t": "add", "l": "+  `Contact no`), fill it with that quantity, even when a sentence of the prose suggests another"}, {"t": "add", "l": "+  field (e.g. \"the name is listed against the location\")."}, {"t": "add", "l": "+- **A sheet that shows the wanted result.** If the workbook contains a sheet that already shows the"}, {"t": "add", "l": "+  desired output for this data (named like `desired result`, `Result`, `Expected`, `what I need`)"}, {"t": "add", "l": "+  and is not itself the sheet you are writing, it is the asker's worked example of the whole"}, {"t": "add", "l": "+  answer: reproduce its layout exactly \u2014"}, {"t": "add", "l": "+  which rows/columns survive, blank separator rows, order \u2014 and compare your result with it cell by"}, {"t": "add", "l": "+  cell before finishing. Where your literal reading of the prose (e.g. \"delete all empty rows\")"}, {"t": "add", "l": "+  would produce something different from that sheet, follow the sheet. One exception: a condition"}, {"t": "add", "l": "+  relative to **today** (\"earlier than the current month\", \"due before today\", \"this year\") is"}, {"t": "add", "l": "+  evaluated at the real current date, `datetime.now()` \u2014 never at a date inferred from the latest"}, {"t": "add", "l": "+  value in the data or from an example sheet, which was saved at some earlier time. (Where the"}, {"t": "add", "l": "+  workbook already holds a cached value computed with `TODAY()`, such as an \"overdue days\" column,"}, {"t": "add", "l": "+  read that cached value rather than recomputing it.)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Extend a pattern only as far as the source data goes.** When you fill in \"the rest\" of a table"}, {"t": "add", "l": "+from example rows by rearranging source items (transposing, regrouping, wrapping a list into"}, {"t": "add", "l": "+rows), every item you place must be an actual source item, read from its cell. Do not generate the"}, {"t": "add", "l": "+items with a counter or index arithmetic (`(i-1)*4 + 1`) that keeps going past the last source"}, {"t": "add", "l": "+item: once the source runs out, the remaining target cells stay empty. `answer_position` is the"}, {"t": "add", "l": "+most you may write, not a quota to fill."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Scoped conditions stay scoped.**"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- \"Show blank (instead of 0 / an error) when the date/item is not found\" applies only to the"}, {"t": "add", "l": "+  not-found case. A lookup that finds a genuine `0` in the source writes `0`."}, {"t": "add", "l": "+- \"Count/sum the items **listed in** (mentioned in, from) Table X / range Y\" \u2014 read that list first"}, {"t": "add", "l": "+  and restrict the aggregation to its members; do not count every column or row that qualifies."}, {"t": "add", "l": "+- **Keyword / substring lookups** (assign a category when a short key appears inside a longer"}, {"t": "add", "l": "+  description): collect *every* key that matches the text and choose the most specific one \u2014 the"}, {"t": "add", "l": "+  longest matching key (ties: the one that appears earliest in the text). Do not take the first"}, {"t": "add", "l": "+  match in table order. Where no key matches, the cell gets the instruction's default, or `None`."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " # 3. Reading the preview correctly"}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -223,4 +266,12 @@"}, {"t": "ctx", "l": "   with openpyxl instead."}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+- **Deleting rows or columns** \u2014 \"delete / remove the rows (columns) \u2026\" means the rows are"}, {"t": "add", "l": "+  *removed* and everything below (to the right) **moves up (left)** to close the gap \u2014 exactly what"}, {"t": "add", "l": "+  Excel's Delete Row and a VBA `.EntireRow.Delete` do. Use `ws.delete_rows(r)` / `ws.delete_cols(c)`,"}, {"t": "add", "l": "+  working from the bottom (right) so earlier indices stay valid. Setting the cells to `None` leaves"}, {"t": "add", "l": "+  a blank band where the expected output has the shifted-up rows, so every cell below is wrong."}, {"t": "add", "l": "+  Blank cells in place only when the instruction says to delete or clear the **values / contents /"}, {"t": "add", "l": "+  cells** (\"delete the values in column F\"), not the rows."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " In all cases: do not add, delete, rename or re-serialize a sheet the instruction does not"}, {"t": "ctx", "l": " mention. Writing a helper value into an empty cell outside `answer_position` is harmless;"}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -64,6 +64,8 @@"}, {"t": "ctx", "l": " "}, {"t": " // blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}

    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();

(function(){

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

/* ---------- 3. tasks × iterations pass/fail heatmap ---------- */
(function(){

  const meanFor=t=>{let sum=0,n=0;iters.forEach(it=>{if(it.per_task[t]!=null){sum+=it.per_task[t];n++;}});return n?sum/n:0;};
  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));
  const cw=Math.max(10,Math.min(26,Math.floor(1000/iters.length))),ch=16,labW=120;
  const W=labW+iters.length*cw+10,H=rows.length*ch+24;

  rows.forEach((t,i)=>{
    txt(el,{x:labW-6,y:24+i*ch+11,'text-anchor':'end'},t.length>16?t.slice(0,15)+'…':t);
    iters.forEach((it,j)=>{
      const v=it.per_task[t];

      const rect=svg('rect',{x:labW+j*cw,y:24+i*ch,width:cw-1.5,height:ch-1.5,rx:2,fill:col});

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

    '$'+Math.abs(L.unattributed_usd).toFixed(4)+' of recorded spend is not accounted for by the rows '+

    'cost-bearing event (agent-mode commits are the common case). Shown rather than hidden.'}));

/* ---------- 9. Activity log — every event, filterable ---------- */
(function(){
  const LOG=S.log||[]; if(!LOG.length)return;
  const s=sec('Activity log — every event this run recorded');
  const bar=$('div',{class:'row',style:'margin-bottom:10px;align-items:center'});
  const q=$('input',{type:'search',placeholder:'search kind, candidate, message…',style:'flex:1;min-width:180px'});
  const phase=$('select'); ['all','intake','baseline','optimize','finalize'].forEach(p2=>
    phase.append($('option',{value:p2,text:p2})));
  const kind=$('select');
  ['all',...[...new Set(LOG.map(r=>r.kind))].sort()].forEach(k=>kind.append($('option',{value:k,text:k})));
  const count=$('span',{class:'muted num'});
  bar.append(q,$('span',{class:'muted',text:'phase'}),phase,$('span',{class:'muted',text:'kind'}),kind,count);
  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));
    if(typeof d.opt_cost_usd==='number')b.push('opt $'+d.opt_cost_usd.toFixed(4));
    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();
    const rows=LOG.filter(r=>{
      if(phase.value!=='all'&&r.phase!==phase.value)return false;
      if(kind.value!=='all'&&r.kind!==kind.value)return false;
      if(!needle)return true;
      return (r.kind+' '+(r.candidate||'')+' '+(r.text||'')+' '+JSON.stringify(r.detail||{}))
        .toLowerCase().includes(needle);
    });
    count.textContent=rows.length+'/'+LOG.length;
    list.innerHTML='';
    if(!rows.length){list.append($('p',{class:'muted',text:'No event matches this filter.'}));return;}
    rows.forEach(r=>{
      const row=$('div',{class:'logrow'});
      row.append($('span',{class:'muted num',text:clock(r.t)}),
        $('span',{class:'muted',style:'font-size:10px;text-transform:uppercase;letter-spacing:.05em',text:r.phase}),
        $('span',{class:'k',style:'color:'+(TONE[r.kind]||'var(--muted2)'),
                  text:r.kind+(r.candidate?' '+r.candidate:'')}),
        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);
      row.addEventListener('click',()=>{
        if(open.has(r.seq)){open.delete(r.seq);det.style.display='none';}
        else{open.add(r.seq);det.style.display='block';}
      });
    });
  }
  q.addEventListener('input',render);phase.addEventListener('change',render);
  kind.addEventListener('change',render);render();
})();

        $('td',{class:'muted',style:'font-size:11px',text:(r.candidates||[]).join(', ')}),
        $('td',{class:'muted',style:'font-size:11px',text:below3?
          `${r.single_candidate_justification||'—'} (${r.single_candidate_justification_source||'unrecorded'})`
          :'—'})));
    });
    s.append(t);
  }

  if(C.merge_rejects){
    s.append(h3('Merge opportunity — safe-but-rejected candidates'));
    const w=AE.merge_rejects_warning;
    const box=$('div',{class:'dead',style:'border-left-color:'+(w.acted_on?'var(--ok)':'var(--warn)')});
    box.append($('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'},
      $('span',{text:w.safe_reject_candidates.length+' disjoint safe rejects never tried together: '}),
      ...w.safe_reject_candidates.map(cid=>$('code',{style:'margin-right:4px',text:cid})),
      $('span',{class:'badge '+(w.acted_on?'b-accepted':'b-rejected'),
        text:w.acted_on?'✓ merge proposed':'✗ unmerged'})));
    box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:
      'each individually zero-regression with a non-negative gate Δ — run merge_rejects.py '+
      '--propose on a disjoint subset to combine them.'}));
    s.append(box);
    (AE.merge_rejects_proposals||[]).forEach(p=>{
      s.append($('div',{class:'muted',style:'font-size:11px;margin:4px 0 0',text:
        'proposed: '+p.tag+' = '+p.rejects.join(' + ')+(p.built?' (built)':' (failed)')}));
    });
  }

  if(C.screens){
    s.append(h3('Screens — cheap subset evals'));
    (AE.screens||[]).forEach(sc=>{
      const box=$('div',{class:'dead',style:'border-left-color:var(--accent)'});
      const head=$('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
      head.append($('code',{text:sc.candidate}),
        $('span',{class:'badge '+(sc.decision==='pass'?'b-accepted':sc.decision==='fail'?'b-rejected':'b-indecisive'),
          text:String(sc.decision||'—')+(sc.inconclusive?' (inconclusive)':'')}));
      if(sc.tier!=null)head.append($('span',{class:'muted',style:'font-size:11px',text:'tier '+sc.tier}));
      box.append(head);
      const bits=[];
      if((sc.ids||[]).length)bits.push('subset ('+sc.ids.length+'): '+sc.ids.join(', '));
      if((sc.fixed||[]).length)bits.push('fixed: '+sc.fixed.join(', '));
      if((sc.regressed||[]).length)bits.push('regressed: '+sc.regressed.join(', '));
      if(sc.mean_delta!=null)bits.push('Δ='+(+sc.mean_delta).toFixed(3)+(sc.se!=null?' ± '+(+sc.se).toFixed(3):''));
      if(sc.threshold!=null)bits.push('threshold='+sc.threshold);
      box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:bits.join('  ·  ')}));
      if(sc.rationale)box.append($('div',{class:'muted',style:'font-size:11px;margin-top:4px',text:'why this subset: '+sc.rationale}));
      s.append(box);
    });
  }

  [['minibatch','Minibatch'],['gepa','GEPA'],['skillopt','SkillOpt'],['parallel','Parallel']].forEach(([key,label])=>{
    if(!C[key])return;
    s.append(h3(label));
    const rows=AE[key]||[];
    const t=$('table');
    if(key==='minibatch'){
      t.append($('tr',{},$('th',{text:'candidate'}),$('th',{class:'r',text:'reward'}),
        $('th',{class:'r',text:'n tasks'}),$('th',{text:'tasks'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.candidate||'—'})),
        $('td',{class:'r num',text:fmt(r.reward)}),
        $('td',{class:'r num',text:r.n_tasks==null?'—':r.n_tasks}),
        $('td',{class:'muted',text:(r.tasks||[]).join(', ').slice(0,120)}))));
    }else{
      t.append($('tr',{},$('th',{text:'kind'}),$('th',{text:'candidate'}),$('th',{text:'detail'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.kind||'—'})),
        $('td',{},r.candidate||'—'),
        $('td',{class:'muted',style:'font-size:11px',text:JSON.stringify(r.detail||{}).slice(0,200)}))));
    }
    s.append(t);
  });
})();

/* ---------- 8. Candidate leaderboard + git log ---------- */
(function(){
  const s=sec('Candidates'); const t=$('table');
  // "screened" (did this candidate pay for a cheap screen before full-val?) only shown
  // when SOME node has a recorded signal — never rendered as a column of bare "—".
  const showScreened=!!(S.capabilities&&S.capabilities.screened);
  // agent-optimize's cheap screen is OPTIONAL. In a run that never attempted one, every
  // candidate carried a warning-orange "✗ not screened" badge, which reads as a compliance
  // violation when nothing was violated. The badge is only a flag when SOME candidate in the
  // run did screen and this one skipped it; otherwise the column shows "—", the way the seed
  // row already correctly did.
  const anyScreened=G.nodes.some(n=>n.screened===true);
  const byId=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  const hdr=[$('th',{text:'id'}),$('th',{text:'status'}),$('th',{class:'r',text:'val'}),
    $('th',{class:'r',text:'Δ parent'}),$('th',{class:'r',text:'iter'})];
  if(showScreened)hdr.push($('th',{text:'screened'}));
  hdr.push($('th',{text:'reason'}));
  t.append($('tr',{},...hdr));
  G.nodes.slice().sort((a,b)=>(b.val||-1)-(a.val||-1)).forEach(n=>{
    // parent_val is only recorded when the algorithm's round table carried it; when it did
    // not, the parent's OWN val is sitting right there in the same graph, so fall back to it
    // rather than printing "—" for a delta both halves of which are known.
    const pv=n.parent_val!=null?n.parent_val:(n.parent&&byId[n.parent]?byId[n.parent].val:null);
    const dlt=pv!=null&&n.val!=null?(n.val-pv):null;
    const idCell=$('td',{},n.id===S.best_id?'★ '+n.id:n.id);
    // screen+gate bypass (PR #557): a compliance WARNING (never measured), distinct from
    // the accepted/rejected OUTCOME ring the status badge already shows — a different
    // color (b-bypass) so it never reads as a second verdict.
    if(n.bypassed_screen_and_gate){
      const bad=$('span',{class:'badge b-bypass',style:'margin-left:6px',text:'⚠ bypass'});
      bad.addEventListener('mousemove',e=>showTip(e,
        'screen+gate bypass: rejected via driver_judgement with no screen.py record and no '+
        'full-val gate row.\njustification: '+(n.bypassed_gate_justification||'—')));
      bad.addEventListener('mouseleave',hideTip);
      idCell.append(bad);
    }
    const cells=[
      idCell,
      $('td',{},$('span',{class:'badge b-'+n.status,text:n.status})),
      $('td',{class:'r num',text:fmt(n.val)}),
      $('td',{class:'r num',text:dlt==null?'—':(dlt>0?'+':'')+dlt.toFixed(3)}),
      $('td',{class:'r num',text:n.iteration})];
    if(showScreened)cells.push($('td',{},(n.screened==null||(!n.screened&&!anyScreened))?'—':
      $('span',{class:'badge '+(n.screened?'b-accepted':'b-rejected'),text:n.screened?'✓ screened':'✗ not screened'})));
    cells.push($('td',{class:'muted',text:(n.reason||'').slice(0,80)}));
    t.append($('tr',{},...cells));
  });
  s.append(t);
  if(S.git_log&&S.git_log.length){
    s.append($('h2',{text:'Iteration store (git)',style:'margin-top:18px'}));
    const g=$('div',{class:'diff'});
    S.git_log.forEach(r=>g.append($('div',{class:'ctx',text:r.hash+'  '+r.subject})));
    s.append(g);
  }
})();
</script></body></html>
