<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);

he 19 failing tasks. Safety: every prompt rule is gated on a condition absent from passing traces (checked 11276, 304-35, 374-31, 535-20, 547-43, 52541, 58687, 45896, 59129).\n- Built on: cand_0001 (accepted). Five of its six broken tasks (188-39, 28-7, 48975, 51680, 534-26) are targeted by additive rules; nothing from cand_0001 was removed.\n- Refuted hypotheses: none yet (only one prior RESULT).\n- Not cracked: 486-17 (golden blindly slices header rows), 45944 (lookup direction), 59160, 51680 (hand-typed examples vs recomputed).\n- Plateau signal: n/a. If this is rejected, suspect the template rewrite (widest blast radius) first and re-gate the prompt-only rules on their own.\n- Next focus: whatever stays failing; consider a worked example for the \"filter list into consecutive rows\" class (48975).\n\n> **RESULT (framework, measured):** ACCEPTED (new champion) \u00b7 val=0.725 \u0394=+0.200 \u00b7 fixed={12307, 28-7, 290-1, 409-45, 486-17, 48975, 534-26, 57354, 59160, 9391} \u00b7 broke={11276, 41978} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0002: ACCEPTED val=0.725 \u0394=+0.200 -->\n\n## Iteration cand_0003 \u2014 test-on-filled-cells procedure + SPELLING pre-save check + narrow exceptions to \"keep filled cells\" + lookup/criteria knowledge\n- Changes (1 per line):\n  - task_template Phase 1c: run your function on every already-filled target cell (and on raw\u2192processed twin blocks) and print OK/DIFF before writing. [45707, 279-23, 51680, 11276]\n  - prompt \u00a72: three-outcome rule for a DIFF. Substance \u2192 fix the reading; case/space-only diff on label-built text \u2192 write the built value everywhere; instruction-quoted format beats contradicting filled cells. [51680, 11276, 45707]\n  - prompt \u00a72: a before/after block pair is a demonstration; \"inside the parentheses\" excludes the brackets unless the twin shows them. [279-23]\n  - task_template Phase 2: `SPELLING:` check comparing written strings with the workbook's near-twins (data + formula literals). [203-15, 1925]\n  - prompt \u00a72: formula cells not named by the instruction are evaluated as written (`=AVERAGE(J3:J6)` \u2192 the mean of the new values) or keep cached values. Phase 3 requires the `left` line. [183-8]\n  - prompt \u00a72 header bullet: self-contradicting prose doesn't override a target header; print header\u2194source mapping. [188-39]\n  - prompt \u00a72 keyword bullet: `key in text` anywhere, with a snippet. [524-31]\n  - prompt \u00a75: Excel text criteria are case-insensitive for matching (not writing). [41978]\n  - prompt \u00a72: side-by-side lists, the result keyed by the adjacent list's row. [45944]\n- Expected effect: +3 to 6 of the 11 failing tasks. Safety: every rule is conditioned, and the default preserve-filled-cells rule is unchanged.\n- Built on: cand_0002 (accepted). 11276/41978 (broken by cand_0002) are targeted by narrow exceptions, not by reverting the workbook-wins rules.\n- Refuted hypotheses: none (both prior candidates were accepted). The cand_0002 RESULT shows that unconditioned \"filled cells = worked example\" wording breaks tasks whose filled cells are the complaint (11276).\n- Plateau signal: none.\n- Next focus: if rejected, suspect the Phase 1c overwrite exceptions first (51680-style outcome 2), and re-gate the knowledge bullets alone.\n\n> **RESULT (framework, measured):** ACCEPTED (new champion) \u00b7 val=0.795 \u0394=+0.070 \u00b7 fixed={11276, 188-39, 41978, 45707, 524-31} \u00b7 broke={469-9, 48975, 57354} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0003: ACCEPTED val=0.795 \u0394=+0.070 -->", "template_only": false}, {"name": "INSIGHTS.md", "title": "Insights \u2014 verified findings", "text": "# INSIGHTS \u2014 summarized, verified findings (accumulate across the whole run)\n\nThe JOURNAL is your per-iteration diary; THIS file is the distilled, VERIFIED takeaway a future iteration should read instead of re-reading the whole journal or old sessions/traces. Update it whenever you have a genuinely NEW, confirmed finding (an accepted/rejected RESULT counts as confirmation; a guess does not) \u2014 not every iteration needs a new entry. Structure each addition as:\n\n    ## <task or mechanism name>\n    - What worked (confirmed by a RESULT, cite the candidate id):\n    - What didn't (confirmed by a RESULT, cite the candidate id):\n    - Promising but not yet tried:\n\n## Formula-mode reads (cand_0002, pending RESULT)\n- Observed: 45707, 48975 and 57354 read inputs from `load_workbook(path)` (no data_only), so formula sources were strings, giving empty output and resend loops. The fix is in the task_template Phase 2 code. Not yet confirmed by a RESULT.\n\n## Filled target cells: preserve by default, with narrow exceptions (cand_0002 RESULT)\n- What worked: cand_0002's preserve/\"workbook wins\" rules fixed many tasks (val +0.200).\n- What didn't: the same rules broke 11276 (filled 'TU'/'W' cells are the complaint; golden = `%a` per the instruction's \"Mon, Wed\"). Case-sensitive matching broke 41978 (cand_0001's `.lower()` passed it).\n- Promising (cand_0003, pending): test f on the filled cells (Phase 1c) and a printed SPELLING check instead of prose-only rules, which 203-15/1925/188-39 ignored.", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0002\n- Strategy: parallel read-only diagnosis subagents with access to the golden workbooks (local data cache under ~/.cache/capevolve-ci/spreadsheetbench-data). This pinned the exact mismatch per task and was far more reliable than the grader feedback text.\n- Biggest finding: the prompt's own code template caused 3 zero-scores (inputs read from the formula-mode workbook). Audit templates the agent copies verbatim before adding rules.\n- Next: if accepted, look at the remaining tasks individually; if rejected, split the template edit from the prompt rules.\n\n## Iteration cand_0003\n- Strategy: per-task cell-level diff against golden for every failing trace (solo, scripted), then one bounded edit per verified root cause. Simulated the new pre-save check code on the real init workbooks with the agent's wrong strings before shipping it. A cheap, high-confidence check that a print-only guard actually fires.\n- Stall signal: rules that already existed (workbook spelling, target header) were NOT followed in 3 tasks. Prose rules plateau; converting them into printed checks (SPELLING line, Phase 1c OK/DIFF) is the lever switch.\n- Lesson: a broad rule accepted for its wins (cand_0002 \"filled cells are examples\") silently breaks the counter-case (11276). Ship the narrow exception with the evidence condition instead of reverting.\n- Next: if accepted, the remaining failures are probably single-task idiosyncrasies. Measure the variance on the passing set before adding more rules.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n- (cand_0002) Feedback text misleads: 183-8 says \"answer cells hold FORMULAS\" although the agent wrote none (they were input formulas wiped on save), and TYPE tallies count str-vs-float cells that the real comparator accepts (188-39). Both steer edits wrong. Also, cand_0001's JOURNAL entry was empty; enforce that the optimizer writes one.\n\n- (cand_0003) Give the proposer a ready-made `golden_diff <task>` tool (init value / init formula / golden value / agent output per graded cell). I rebuilt it by hand every iteration, and it was the single most useful diagnostic. Also, the 45707 feedback (\"1 cell CHANGED although the expected value is the cell's own original input\") was the key hint; this per-cell classification is valuable and should be extended to \"your value for an already-filled cell differs from it\".", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0003)", "text": "# PROCESS \u2014 cand_0003 (iteration 3)\n\nDiagnosis was done solo (no subagents). I read all 11 failing traces plus 45707 and checked each claim cell by cell against the init/golden workbooks in the local data cache (`/tmp/w3/cmp.py`: init value, init formula, golden value). Parent cand_0002 is at val 0.725 (29/40). Its LEDGER row broke 11276 and 41978, both passed by cand_0001.\n\n## Ranked issue list\n| rank | cluster | tasks | shared root cause (verified against golden) | tag | change |\n| --- | --- | --- | --- | --- | --- |\n| 1 | Filled target cells misread: kept when they should be recomputed, or not used as the format oracle | 279-23, 45707, 51680, 11276 | 279-23: the processed copy B17:B26 = 'tig' (no brackets); the agent wrote '(tig)'. 45707: filled D32=5 (January's count); the agent's function gives 4 (the next month) and it never checked. 51680: hand-typed G5 'Red purple', G3 'Green' (stripped); golden = header join verbatim ('Green , Red Purple'). 11276: filled 'TU','W' are wrong for the dates; golden = `%a` per the instruction's \"Mon, Wed\" | BEHAVIORAL + STRUCTURE | Phase 1c test-on-filled-cells procedure, plus the three-outcome rule in prompt \u00a72 and the before/after-pair rule |\n| 2 | Instruction spelling over workbook spelling (rule existed, not followed) | 203-15, 1925 | 'Transport Allowance' written vs data 'Transport Allowances'; 'New' vs formula literal \"NEW\" | STRUCTURE (pre-save check) | Phase 2 `SPELLING:` check code + a prompt pointer |\n| 3 | Non-instruction formula cells re-interpreted | 183-8 | J7:L7 `=AVERAGE(J3:J6)`; golden = the mean of the new J3:J6 (21.0197), the agent wrote an overall weighted avg (21.3097). I3:I7 SUMIFS/SUM cached values; the agent skipped the `left` check | KNOWLEDGE + CONTRACT | prompt \u00a72 \"which logic a formula cell gets\"; Phase 3 requires the `left` line |\n| 4 | Header vs self-contradicting prose | 188-39 | result!B header 'Designation'; the agent put Name in it after reasoning through the contradiction | DECISION NARROWING | prompt \u00a72 header bullet: the clause agreeing with the header wins; print header\u2194source mapping |\n| 5 | Substring lookup done as prefix | 524-31 | `startswith` + split on `*` missed keys appearing mid-text | KNOWLEDGE + WORKED SNIPPET | prompt \u00a72 keyword bullet: `key in text` + code |\n| 6 | Case-sensitive criteria emulation | 41978 | `== 'Open'` vs data 'Open'/'open'; golden [..,26,9,2] = case-insensitive (Excel COUNTIFS) | KNOWLEDGE | prompt \u00a75 bullet |\n| 7 | Side-by-side list comparison keyed by the wrong list | 45944 | golden G11:G13 = T,F,T = for D-list row r, look up its name in A:B and compare. The agent did it the other way (T,T,F) | KNOWLEDGE | prompt \u00a72 bullet |\n\n## Changes made (file and lever)\n| cluster | lever | file | generalizes because | blast radius |\n| --- | --- | --- | --- | --- |\n| 1 | ordered procedure (code) | task_template Phase 1c | Any task with already-filled target cells: test f on them before writing | BOUNDED: no-op when nothing is filled. Passing tasks with worked examples already reproduce them, so the test prints OK |\n| 1 | decision narrowing (3 outcomes) | prompt \u00a72 after the Rule | Substance DIFF \u2192 fix f; case/space-only DIFF on label-built text \u2192 overwrite all; instruction-quoted format \u2192 overwrite all | BOUNDED: the overwrite cases need (a) text built from workbook labels with a case/space-only diff, or (b) the instruction quoting an example format the filled cells contradict. The default (preserve) is unchanged |\n| 1 | worked example | prompt \u00a72 before/after pair + Phase 1c paragraph | A raw block and a processed copy with the same index | BOUNDED: requires a duplicate block |\n| 2 | structure (pre-save check code) | task_template Phase 2 | Flags written strings whose normalized form matches a workbook string spelled differently; skips kept input values | BOUNDED: print-only. Simulated on real workbooks: flags 203-15 J1 and 1925 C6, and nothing for a correct 51680 output |\n| 2 | consolidation pointer | prompt \u00a72 spelling bullet | Ties the existing rule to the check | BOUNDED |\n| 3 | knowledge | prompt \u00a72 formula exception | Formula cells not named by the instruction are evaluated as written / keep cached values | BOUNDED: only formula cells inside answer_position. Consistent with cand_0002's `left` rule |\n| 3 | contract | task_template Phase 3 | The checklist needs the `left` output line and no SPELLING line | BOUNDED |\n| 4 | decision narrowing | prompt \u00a72 header bullet | Self-contradicting prose doesn't override a header | BOUNDED: only when a target header exists |\n| 5 | knowledge + snippet | prompt \u00a72 keyword bullet | Substring semantics; the snippet reproduces 52/53 golden cells of 524-31 offline (the 53rd is its default 'amazon' self-row, a header-row quirk) | BOUNDED: keyword-lookup tasks only |\n| 6 | knowledge | prompt \u00a75 | Excel criterion semantics; matching only, writing keeps the exact spelling | BOUNDED: text-criterion counting/lookup. cand_0001 passed 41978 with `.lower()` |\n| 7 | knowledge | prompt \u00a72 side-by-side lists | Result keyed by the adjacent list's row | BOUNDED: two parallel record blocks with the target beside one |\n\n## Verify-the-fix\n- 279-23: the trace wrote '(tig) this is good' \u2192 '(tig)'. Golden B3 = 'tig', the processed twin B17 = 'tig'. The before/after rule plus the Phase 1c raw\u2192processed comparison gives a DIFF ('(tig)' vs 'tig') until the brackets are dropped.\n- 45707: the agent counted the month of the NEXT date (D32 \u2192 Feb = 4) while the filled D32 holds 5 (Jan = 5, verified). Phase 1c prints `D32 5 4 DIFF`; the prompt names \"the next row's month instead of the row's own month\" as the typical cause.\n- 51680: the agent stripped 'Green ' and kept hand-typed G5 'Red purple'. Golden G3 = 'Blue, Green , Red Purple', G5 = 'Red Purple'. Outcome 2 says to write the label-built value everywhere and not strip.\n- 11276: the agent copied 'TU'/'W' styles. Golden = 'Wed','Thu',\u2026 (`%a`). Outcome 3: the instruction quotes \"Mon, Wed\" and the filled cells contradict the dates.\n- 203-15 / 1925: the SPELLING check, run on the real init workbooks with the agent's strings, printed `SPELLING: J1 'Transport Allowance' -> {'Transport Allowances'}` and `SPELLING: C6 'New' -> {'NEW'}`.\n- 183-8: the agent wrote J7 = 21.3097 (overall weighted). Golden 21.0197 = AVERAGE of its own J3:J6. The new bullet says `=AVERAGE(J3:J6)` \u2192 the plain mean. I3:I7 keep cached values.\n- 188-39: trace line \"I will put the Name in the 'Designation' column\". The bullet now addresses exactly the self-contradicting-prose case.\n- 524-31: the agent used prefix matching; `key in text` + the longest-key snippet matches golden for all graded data rows (checked offline).\n- 41978: `== 'Open'` gave 24/8/0 where golden is 26/9/2; the case-insensitive compare reproduces it (cand_0001 evidence).\n- 45944: the agent keyed by the A:B row (T,T,F for block 2); golden T,F,T = keyed by the D:E row. Covered by the side-by-side bullet.\n\n## Process & features used\n- Serial, solo: the system note forbids AgentTool/workflows unless the user asks. Golden-backed offline checks via small scripts in /tmp/w3 (`cmp.py`, `sp.py` simulating the SPELLING snippet on real workbooks). The template still renders with `.format()`, and all six placeholders are present.\n- Read prior_iterations/cand_0001 and cand_0002 (PROCESS + diff). cand_0002's \"workbook wins\" and worked-example rules are kept; this iteration adds the narrow exceptions that broke 11276 instead of removing them.\n\n## Good things to PRESERVE\n- The cand_0002 `vs`/`ws` read/write split, the `left` check, the result-sheet / today / delete-rows / extent rules. The default \"keep filled cells\" rule stays the default; only two narrowly conditioned exceptions were added.\n\n## Deliberately skipped\n- 486-17, 59160 (passing now). No change.\n- I did not loosen the preserve rule globally; that would risk the 29 passing tasks.", "template_only": false}]}, "config": {"project_dir": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/.capevolve/project", "spec_missing": false, "spec_groups": [{"group": "Capability", "items": [{"key": "capabilities", "value": ["system-prompt"]}, {"key": "capability_path", "value": "seed_capability"}]}, {"group": "Delivery", "items": [{"key": "intervention", "value": "direct"}]}, {"group": "Algorithm & optimizer", "items": [{"key": "optimizer_skill", "value": "claude-code"}, {"key": "optimizer_model", "value": "aws/claude-opus-5-5"}, {"key": "target_model", "value": "rits/google/gemma-4-3
