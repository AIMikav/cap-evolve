<html lang="en"><head>

<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}

\n  (`7902` `T4` worked value 1 vs its own `D4*L4` = 3.5999999999999996 \u2014 note the round still\n  closed with \"covered worked cells agree\", a claim the printed evidence does not entitle).\n- **The thinnest margin in the whole split is `9726`:** its single graded cell `J2` was pre-filled\n  with `datetime(2016,5,14)` and the agent wrote `datetime(2016,6,12)`, justified **solely** by\n  the instruction's own stated example, with no second corroborating signal. One cell, no margin.\n  Any future edit that weakens \"a stated example is authoritative\" costs this task \u2014 as does any\n  edit that strengthens \"a pre-filled answer cell is ground truth\" (cand_0001 already proved that\n  direction costs `402-43`).\n- Promising but not yet tried: nothing, until a *failing* example of this class exists. Without\n  one, every available edit here is unverifiable by construction.\n\n## When val saturates, the gate can no longer accept anything\n\n- MECHANISM, arithmetic (confirmed by `rejected.jsonl`'s own formula):  \u2026[+4014 chars truncated]", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001\n- Strategy tried, and whether it moved val: unknown at write time (no LEDGER row yet). The\n  strategy was: cluster all 40 trajectories first, then **read the scorer and the adapter\n  before writing a single word of prompt**. That was the highest-value move of the iteration \u2014\n  the whole dominant cluster is a property of `evaluation.compare_workbooks`\n  (`data_only=True`, no recalc) that no amount of trace-reading alone would have stated\n  precisely, and the exact type-normalisation table came straight out of `transform_value`.\n  Recommend every future iteration on this benchmark re-read the scorer before proposing.\n- Second useful move: **testing my own prompt artifacts** instead of trusting them. Two real\n  defects were caught that way \u2014 (a) the adapter's `_task_template_error` rejected an\n  f-string `{left}` in my verification snippet as an unknown placeholder, which would have\n  scored EVERY task 0; (b) my first verification snippet asserted on a `data_only=True` read,\n  where a leftover formula shows up as `None`, so the assertion could never fire \u2014 it needed a\n  second `data_only=False` load. Both were invisible on inspection. Running\n  `_task_template_error` + `str.format` + `compile()` on the rendered template costs seconds\n  and should be mandatory whenever `task_template.md` is touched.\n- Plateau/stall signal, if any: none yet (iteration 1 of 5).\n- What to try next iteration: let the per-task RESULT decide the lever rather than guessing.\n  If the ~15 \"logic was already right\" tasks flipped, the formula cluster is closed and the\n  residual is logic/scope \u2014 switch from contract text to per-class worked examples and\n  consider PRUNING prompt.md rather than extending it. If they did NOT flip, the contract was\n  read and ignored, which means the lever must become structural (make the agent emit the\n  verification output) rather than more prose.\n\n## Iteration cand_0002\n- Strategy tried, and whether it moved val: unknown at write time. The strategy was **read the\n  parent's `broke={}` first and treat it as the primary signal, ahead of the failing-task list**.\n  LEDGER row 1 (cand_0001 ACCEPT, `broke={402-43}`) turned out to explain *two* of the three\n  residual failures: both `402-43` and `59595` are the parent's own highest-value edit\n  over-applied. That reframed the iteration from \"add fixes for 3 unrelated tasks\" to \"narrow one\n  over-strong rule, then fix the genuine one-off\". **Recommendation for any future iteration: a\n  one-task `broke={}` on an ACCEPTED parent is not noise to be shrugged off because the parent\n  won on net \u2014 it is a named, pre-diagnosed defect with a trace you can read, and it may be\n  under-counted, since a rule stated too absolutely can also be suppressing tasks that were\n  already failing for other reasons.**\n- Second finding, and the one I would most want a future iteration to inherit: **audit BEFORE\n  you ship, not after \u2014 and audit asymmetrically.** I wrote six edits, then ran a blast-radius\n  audit over all 37 passing traces plus a pre-filled-cell census, and the audit changed **four of\n  the six**. The worst was my own draft of the rule check: \"if a pair disagrees, fix the rule\"\n  would have pushed ~10 passing tasks to break a *correct* rule to match a worked cell that is\n  not evidence \u2014 a hand-rounded `0.1707` (`9569`), float noise `106.53999999999999` (`54144`),\n  stale/`#VALUE!` formula caches (`6698`/`48620`/`55049`/`56563`), a neighbouring column computed\n  by a different rule (`8942`/`37456`/`267-18`), and a prose/sheet case difference (`53383`).\n  The asymmetry is the general law here: with 37 passing and 3 failing, **an edit that tells the\n  agent to distrust its own computation is far more dangerous than one that tells it to distrust\n  the sheet**, and it needs the benign-cause census attached before it ships. The census is also\n  what caught `80-42` holding literal `'N/A'` as real data, which killed my first\n  character-list-based placeholder rule and forced a re-derivation-based discriminator.\n- Third: **do not trust subagent reports on load-bearing claims.** I fanned out four read-only\n  subagents (one per failing trace + one auditor), which was the right call for coverage, but I\n  re-derived the two facts my edits actually rest on myself from the benchmark's own workbooks \u2014\n  `43436`'s gold rule (recomputed both candidate rules from the raw XML; they differ in exactly\n  the 5 cells the grader names, which pins the rule uniquely and excluded a rival hypothesis that\n  differs in 9) and the pre-filled-cell census. Both re-derivations changed the edit. Note the\n  method that made this possible with no openpyxl and no `pip` in the analysis sandbox: parse the\n  `.xlsx` as a zip of XML with `xml.etree.ElementTree`, resolve sheets via\n  `xl/_rels/workbook.xml.rels` and strings via `sharedStrings.xml`, and convert serials with\n  `datetime(1899,12,30) + timedelta(days=n)`. Worth doing \u2014 the failing task's *gold rule* is\n  recoverable from the grader's error signature far more often than it looks.\n- Fourth, a cheap discipline: **count the round budget before adding a verification step.** 28 of\n  37 passing tasks finish in 4 assistant turns and 8 in 5 \u2014 i.e. 8 tasks use all 3 of their\n  `VERIFY_TURNS` with zero spare. So every new print this iteration went into the *existing*\n  step-3 script in the same round. An edit that adds a round is a silent regression on those 8.\n- Plateau/stall signal, if any, and the lever switched to: no plateau (one RESULT, +0.575) but the\n  **headroom collapsed to 0.075 while one broken passing task costs 0.025**. The search is now\n  regression-bound, not idea-bound, which inverts the instruction's \"ship as many fixes as\n  possible\": the binding constraint is how many edits I can *prove* bounded, and the audit is the\n  throughput limit. Hence the lever: spend the iteration's budget on the census/audit rather than\n  on generating more candidate edits.\n- What to try next iteration: let the RESULT pick the lever. (1) If `402-43`+`59595` flip, cluster\n  1 is closed and only `43436`-class one-off logic remains \u2014 at that point the honest highest-value\n  move may not be another prose edit at all but **robustness**: nobody has measured the 8 tasks\n  that finish with zero spare verify rounds, and a single trial per task means a task passing at\n  1.0 today is not proven stable. (2) If they do not flip, the discriminating condition was read\n  and not applied, and the lever must go structural \u2014 force the agent to *print* the\n  `existing value \u2192 my rule's value \u2192 decision` triple for every pre-filled answer cell, the way\n  the rule check now forces the worked-value pairs. Restating a condition in prose a third time is\n  the move to refuse. (3) Do not attempt the global \"column header beats the instruction's prose\"\n  precedence rule without first building the prose/header conflict census across all 40 tasks; the\n  audit found `59196` one pre-filled cell away from flipping on it.\n\n## From cand_0003 (iteration 3 of 5, parent cand_0001 after cand_0002 was reverted)\n\n- **The highest-value work in an iteration that follows a REJECT is not designing the next edit \u2014\n  it is attributing the last regression per task, from the broken tasks' own traces.** I fanned\n  out four read-only subagents, one group per failing/broken task, and asked each for verbatim\n  trace quotes plus a ranked attribution rather than a summary. The regression subagent produced\n  the two-mechanism table that now opens PROCESS.md, and that table is what turned this iteration\n  from \"resubmit cand_0002 minus one bullet\" into a redesign: the *direction* cand_0002 pushed was\n  right (its `fixed={59595}` proves it) and only the **discriminator** was wrong (characters \u2192\n  type conflict). Without the attribution I would have thrown away a confirmed finding.\n- **Gate arithmetic should be computed once and then drive ambition.** `rejected.jsonl` spells it\n  out: `paired \u0394\u0304=-0.0250 <= 0.2\u00b7SE=0.0087 (SE=0.0437, n=40, resolvable 2\u00b7SE=0.0873)`. So one task\n  = 0.025 clears the bar at nearly 3\u00d7, while one regression cancels one fix exactly. **The target\n  shape late in a run is +1/\u22120, not +3/\u22121.** This inverts the brief's \"ship as many fixes as\n  possible\": the binding constraint is how many edits I can *prove* bounded, not how many I can\n  think of. I still shipped six, but only because each one's blast radius was checkable against a\n  census that already existed in INSIGHTS.md from iteration 2.\n- **Audit the draft against the tasks it could break, before the draft is finished \u2014 it changed\n  four of six edits this iteration.** Three catches worth generalising:\n  (1) an *affirmative* branch is far more dangerous than a permission. My first type-conflict\n  draft said \"same kind of value \u2192 **leave the cell exactly as it is**\", which would have\n  regressed `6698` (stale numeric formula cache under an instruction to modify it). Deleting the\n  branch and keeping only the narrow overwrite permission made the edit purely additive, so the\n  passing behaviour it does not mention cannot change.\n  (2) Phrase-family regression: a draft of mine read \"never decide a cell's fate from its\n  emptiness alone\" \u2014 a paraphrase of the exact sentence that destroyed `80-42`. **Grep your own\n  draft for the phrase family of every previously-regressing rule, not just the rule.**\n  (3) Context cost is a regression vector, not a style issue. Any \"one line per cell\" print must\n  be scoped to a set you can bound (`clashes` = pre-filled cells the rule covers) rather than to\n  the answer range, because one task in this split has 47 975 of them.\n- **Validate the template contract mechanically, every time, and do it before the handover files.**\n  My step-2 draft wrote the dict as `mine = {coordinate: value}` in prose. `string.Formatter()`\n  parses `{coordinate}` as a placeholder \u2192 `KeyError` inside `str.format` on **every task** \u2192\n  candidate scores 0. Caught only by replicating the adapter's own validation\n  (`Formatter().parse` + `.format(**dummy)` + `compile()` on every python block). A prose edit can\n  break the contract; a contract break is not a prose risk you can eyeball. Make this a reflex.\n- **When the fix is a definition the agent lacks (KNOWLEDGE), prescribe and bound by grep.** For\n  `43436` I wrote the section imperatively, stated its trigger as a *precondition* (per-record\n  start date + end date + a cell labelled with a single moment), and then grepped all 40\n  instructions for the moment/span lexicon to show the precondition is empty elsewhere (one\n  lexical hit, `2768`, which has no dates). That grep is what makes a KNOWLEDGE section shippable\n  rather than speculative, and it took minutes. Do it for every new section.\n- Plateau/stall signal and the lever to switch to next: RESULTs are +0.575, \u22120.025 \u2014 not a\n  plateau, but the headroom is 0.075 and two iterations remain. If this candidate flips 2 of 3,\n  the remaining prose headroom is ~1 task and the honest next lever is **robustness, not more\n  prose**: 8 passing tasks finish with zero spare `VERIFY_TURNS` and every task runs a single\n  trial, so today's 1.0 is not evidence of stability, and nobody has measured it. If the candidate\n  flips 0 of 3 with no regressions, the lever is to make the template's **write set derived from\n  the computed set** (compute `mine`, then write from it) instead of stating the condition in\n  prose a fourth time \u2014 restating a condition that was read and not applied is the move to refuse.\n\n## Iteration cand_0004 (4 of 5) \u2014 the first iteration of this run that could not win, and what to do with one\n\n- **Compute the gate arithmetic before choosing a strategy, not after.** cand_0003's own\n  META note said to do this and it paid off immediately: parent at 1.000, no partial credit,\n  bar `\u0394\u0304 > 0.2\u00b7SE` \u21d2 **\u0394\u0304 \u2264 0 by construction, so no candidate can be accepted.** Five minutes of\n  arithmetic reframed the whole iteration from \"find more fixes\" to \"find the defects whose fix\n  provably changes none of the 40 trajectories\". That inverts the usual selection rule: normally\n  you ask \"might this help?\", here you ask **\"would this have changed any passing trajectory? if\n  yes, drop it.\"** An optimizer that does not do this arithmetic will spend a saturated iteration\n  shipping semantic edits with upside 0 and downside \u22120.025 per broken task.\n- **A saturated val does not mean there is nothing wrong \u2014 it means the metric stopped being the\n  place to look.** Reward is 1.0 on 40/40 and yet the capability ships a line of Python that\n  **raises on 17.5% of tasks, deterministically**. The signal was in the traces' *exception\n  stream*, which no reward number exposes. The generalisable move: when the focus block says \"no\n  actionable failures\", stop reading scores and start counting (a) tracebacks, (b) assertions that\n  fired, (c) round consumption against the real budget, (d) per-round output size. That census\n  took one subagent and found the one thing in the run that is unambiguously broken.\n- **Diagnose by correlating the failure against an input *feature*, not by reading traces one at a\n  time.** The finding only became conclusive once I computed the set of tasks whose\n  `answer_position` has no colon and compared it to the set of tasks with a traceback: identical,\n  7 and 7, with no exceptions in either direction. A perfect two-way correlation turns \"the agent\n  sometimes crashes\" into \"this input shape always crashes\", which is the difference between a\n  guess and a fix. Build the feature census first; it is cheap and it is what makes the blast\n  radius provable.\n- **For a code-shaped prompt edit you can actually get a proof of boundedness \u2014 go and get it.**\n  I re-implemented `range_boundaries`/`get_column_letter` locally (no openpyxl in the analysis\n  sandbox) and asserted that the new `coords()` helper returns an element-identical list to the\n  line it replaces on every multi-cell range in the split. That upgrades \"I think this is safe\" to\n  \"the 33 unaffected tasks see the same `cells` object\". Prose edits can never be verified this\n  way; **edits to code the prompt ships can**, which makes them the best value in a\n  regression-bound regime. Prefer them when both are available.\n- **Trust the subagent for coverage, re-derive for load-bearing claims \u2014 and note that it earned\n  its keep on the two things I had missed.** I had the single-cell/traceback correlation myself;\n  the subagent added (a) that 2 of the 7 crashes are in the agent's *own* round-1 code, not the\n  template's line \u2014 without which the fix would have covered 5 of 7 and I would have believed it\n  was 7 of 7 \u2014 and (b) that the context bomb is entirely a round-1 phenomenon (33 186 chars on\n  `80-42`) while step 3's printing is already capped. Both changed the shipped diff. The pattern\n  that works: ask for a *census with verbatim quotes and counts*, not a summary.\n- **The adapter is capability documentation.** Three of the five edits rest on facts only readable\n  there \u2014 `VERIFY_TURNS=3` with `verify_left -= 1` on any non-writing round (so a *raising* round\n  costs a third of the verification budget), `MAX_TURNS=30` never binding, and\n  `_task_template_error`'s exact validation. cand_0001's META note said \"re-read the scorer before\n  proposing\"; extend it to the adapter's turn loop. Also: the fact that a *rewriting* round is free\n  was deliberately **not** put in the prompt \u2014 knowing a fact does not mean stating it is safe.\n- **Replicate the template validator with its compiled regex, do not retype the pattern.** My\n  first validation run reported a bogus unknown placeholder `{placeholders}` purely because I\n  omitted `re.DOTALL` from the comment-stripping regex and so left the file's own header comment\n  in the text. Copy `_TEMPLATE_COMMENT_RE` verbatim. (The validation itself passed: 6/6 required\n  placeholders, no unknowns, `str.format` OK, the rendered block compiles.)\n- Plateau/stall signal and the lever: **not a plateau \u2014 a ceiling.** +0.575, \u22120.025, +0.075, then\n  1.000. There is no prose lever left that a saturated metric can register. What the run should\n  want next is not another edit but a *measurement*: at n=1 per task, `SE=0.0437` and the\n  resolvable effect size is `2\u00b7SE \u2248 3.5 tasks`, so the run can no longer measure anything it is\n  likely to change.\n- What to try next iteration (the last): **do not go hunting for semantic edits.** If cand_0004 is\n  rejected on a tie, that is the predicted outcome, not evidence its five items are wrong \u2014 read\n  `PROCESS.md`'s equivalence proof before concluding anything. The genuinely valuable remaining\n  move is to score the champion on the **test** split, where single-cell `answer_position` tasks\n  (17.5% here) each burn a verify round under cand_0003. The one semantic cluster left \u2014 the eight\n  `agree? False` overrides, all currently correct, `9726` resting on a single graded cell with no\n  corroborating signal \u2014 is unverifiable until a failing example exists, and is a trap for an\n  optimizer under pressure to ship something.\n\n## From cand_0005 (final iteration of the run)\n\n- **A saturated val split changes the optimizer's job, and the brief does not say so.** At val\n  1.000 the gate can only return \"rejected on a tie\", so the expected-value calculus inverts: an\n  edit cannot win a point, it can only lose one. The correct behaviour is not \"ship nothing\" and\n  not \"ship breadth anyway\" \u2014 it is **\"ship only edits provably inert on the passing\n  trajectories\"**, which in practice means edits to *code the prompt ships that demonstrably\n  cannot run*, since those are the only ones whose blast radius you can prove rather than argue.\n  This iteration found exactly one and shipped exactly one.\n- **The breadth instruction is a liability at the ceiling, and that is now measured twice.** The\n  two candidates that bundled speculative robustness edits cost \u22120.025 (cand_0002, 6 edits) and\n  \u22120.050 (cand_0004, 6 edits); the two that shipped only what the traces proved were +0.575 and\n  +0.075. Breadth is a *symptom* of a split with many failures, not a cause of improvement. Under\n  pressure to ship something, the trap is the \"I already have the file open\" edit \u2014 cand_0005\n  declined a genuine 1-line API fix (multi-part ranges) purely because no val task exercises it.\n- **When a rejected parent bundled N edits, the recoverable question is per-edit, and it is\n  answerable without re-running anything.** `broke={50768, 59595}` named tasks, not edits. Reading\n  the two broken tasks' *current* traces and asking \"which of the six edits could even reach this\n  trajectory?\" exonerated one edit (both tasks are multi-cell, so a single-cell guard is inert on\n  them) and indicted another (both are small-range, so an inspection cap elides their answer rows).\n  **Always do this before discarding a rejected batch wholesale** \u2014 one of cand_0004's six edits\n  was a real, provable fix that would otherwise have been lost with it.\n- **Strategies that stalled, cumulatively:** semantic rule-sharpening is exhausted on this split\n  (the remaining 8 `agree? False` overrides and the `59196` header-vs-prose question are all\n  *currently correct*, so no edit to them can be verified as anything but a risk \u2014 four iterations\n  reached the same conclusion independently, which is itself the signal to stop re-deriving it).\n- **What the search needed and could not get:** more *measurement*, not more propos \u2026[+711 chars truncated]", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## From cand_0001 (spreadsheetbench, empty seed)\n- The optimizer is told \"you may not edit the harness/scorer\", which I followed \u2014 but the\n  single highest-leverage fact in this task (the grader uses `data_only=True` and never\n  recalculates) is only discoverable by READING the scorer. It would be worth saying\n  explicitly in INSTRUCTIONS.md that reading infrastructure to learn the contract is not only\n  allowed but expected, and pointing at the scorer path. I spent several tool calls locating\n  `third_party/spreadsheetbench/evaluation/evaluation.py` by filesystem search.\n- There is no offline way for the optimizer to validate its own candidate. A tiny\n  `scripts/validate_candidate.py` shipped in the working dir \u2014 run `_task_template_error`,\n  `str.format` the template with dummy values, and `compile()` every fenced python block \u2014\n  would have caught both defects I found by hand, and an iteration that misses the first one\n  (an unescaped brace) scores 0 on every task and burns a whole iteration of the run budget\n  for a reason unrelated to the quality of its ideas.\n- `prompt.md` existing-but-empty vs missing is a meaningful distinction in the adapter\n  (`_read_system_prompt`) but is not mentioned in the \"EMPTY SEED\" section of INSTRUCTIONS.md;\n  I had to read the adapter to be sure an empty file meant \"no system message\" rather than\n  \"fall back to the built-in default\", which changes what the 0.350 baseline actually measures.\n\n## From cand_0002 (spreadsheetbench, iteration 2/5)\n- **Seconding cand_0001's `validate_candidate.py` request, with evidence that it is now a run-wide\n  cost.** I rebuilt the same throwaway validator from scratch this iteration (placeholder contract\n  + `str.format` + `compile()` every fenced python block in the *rendered* template) because there\n  is still nowhere to put it: anything I leave in the candidate dir gets snapshotted with the\n  candidate, and `/tmp` does not survive to the next iteration. Every future iteration that\n  touches `task_template.md` will rebuild it again. A `scripts/` directory in the working dir that\n  is explicitly **not** part of the candidate snapshot would fix both halves of this.\n- **INSTRUCTIONS.md should tell the optimizer the per-task score granularity and the trial count.**\n  Whether the remaining 0.075 is 3 all-or-nothing tasks or 40 partially-credited ones completely\n  changes the risk calculus \u2014 with 37/3 and no partial credit, one broken passing task cancels one\n  fixed failing task exactly, which is the single most important number for deciding how\n  aggressive to be. I had to dig it out of `score.raw`/`trial_rewards` myself. One line\n  (\"each task is pass/fail, 1 trial, worth 0.025\") would save every iteration that work.\n- **The \"ship as many fixes as possible\" framing fights the gate once the capability is mostly\n  working.** At 0.925 the binding constraint is not how many edits I can think of but how many I\n  can *prove* bounded against the passing set, and the honest answer was \"six, after an audit that\n  changed four of them\". The instruction reads as though timidity is the main failure mode; late in\n  a run the main failure mode is an unaudited edit. Consider making the ambition line\n  headroom-aware, or stating the brake with equal force (\"an edit you cannot blast-radius is worth\n  less than no edit\").\n- **`unresolved={}` in the RESULT stamp is well-designed and I want to flag it as working.** The\n  parenthetical (\"NOT evidence the edit touched those tasks; do not redesign on them\") is exactly\n  the kind of guard that stops an optimizer from chasing noise. More framework signals should carry\n  their own interpretation like that.\n- **Give the optimizer a read-only way to list the gold/expected values it is NOT allowed to\n  encode.** I spent real effort reconstructing `43436`'s gold rule from the grader's error\n  signature by parsing workbook XML by hand (no openpyxl, no `pip` in the analysis sandbox). That\n  work is legitimate \u2014 it is how I verified the fix rather than guessing \u2014 but it is adjacent to\n  the overfitting line, and an explicit sanctioned read-only \"diagnose against gold, then write a\n  rule that generalises\" affordance (plus openpyxl actually installed in the proposer's sandbox)\n  would make the boundary clearer and the work cheaper.\n\n## From cand_0003\n\n- **`prior_iterations/<id>/diff.patch` is truncated, and it truncated away the half I needed most.**\n  cand_0002's copy ends mid-sentence at `... (truncated)` after three `prompt.md` hunks, so the\n  **entire `task_template.md` side of the rejected batch is absent** \u2014 yet the rejected batch\n  broke `80-42` partly through template-side verification printing. I had to reconstruct those\n  hunks from the JOURNAL prose. A rejected candidate's diff is the single most informative artifact\n  the framework hands forward; truncating it costs real iterations. Either raise the cap a lot, or\n  truncate per-file (keeping every file's header and some hunks) rather than cutting the stream at\n  a byte count, or drop `diff.patch` in favour of the prior candidate's full files, which compress\n  far better than a patch and are what the next proposer actually diffs against.\n- **The RESULT stamp names *which tasks* broke but not *which edit* the framework thinks broke\n  them, and that attribution is re-derived from scratch every iteration.** I spent roughly half\n  this iteration's budget on it (four subagents over the traces). If the harness kept the per-task\n  trace of the rejected candidate alongside the accepted one \u2014 i.e. `prior_iterations/<id>/\n  trajectories/<task>/` for the tasks in `broke={...}` only \u2014 the attribution would be a diff of\n  two traces instead of an inference from one. That is a small artifact (2 tasks here) with a very\n  high information ratio.\n- **Nothing in the framework checks the template contract before scoring, so a prose edit can\n  silently cost the whole candidate.** I caught `{coordinate}` in my own draft only by replicating\n  `_task_template_error` myself. A pre-scoring dry-run that reports `MISSING/UNKNOWN placeholders`\n  (and ideally `compile()`s the fenced python blocks) and *refuses the candidate before burning\n  the eval* would turn a 0.000 into a free retry. The validation code already exists in the\n  adapter; it just is not run at propose time.\n- **Please state the gate arithmetic in INSTRUCTIONS.md, not only in `rejected.jsonl`'s reason\n  string.** \"paired \u0394\u0304 must exceed 0.2\u00b7SE \u2248 0.0087, one task is worth 0.025, so +1/\u22120 clears the\n  bar and +1/\u22121 does not\" is the number that determines how aggressive every edit should be. It is\n  currently discoverable only by reading a rejection you may not have.\n\n## From cand_0004 (the first saturated iteration: val 1.000, 40/40)\n\n- **When the parent's val is at the metric's ceiling, say so in the brief and change what is\n  asked for.** The gate is `paired \u0394\u0304 > 0.2\u00b7SE`; at 1.000 with no partial credit, `\u0394\u0304 \u2264 0` by\n  construction and `\u0394\u0304 = 0` fails the bar \u2014 **no candidate can be accepted, whatever it contains.**\n  Yet the brief still opened with \"raise the eval score as much as you can\", \"ship AS MANY real\n  fixes as you can\", and \"a timid one- or two-edit iteration is an under-used iteration\". That\n  pressure points an optimizer straight at speculative semantic edits whose upside is 0 and whose\n  downside is \u22120.025 per broken task. The focus block *did* say \"no actionable failures \u2014 seek a\n  robustness/generalization gain\", which is the right instruction; it is simply contradicted by\n  ~40 lines of breadth-maximising text above it. Suggestion: detect `parent_val == max_reward`\n  and swap in a saturated-mode brief whose success criterion is **\"ship only changes that provably\n  alter no passing trajectory, and prove it\"** \u2014 plus an explicit statement that a tie-rejection is\n  the expected outcome and not a mark against the candidate.\n- **Surface the exception/traceback stream in the trajectory summary, not just reward.** This split\n  reports 40/40 at 1.0 and *also* contains a line of capability-shipped Python that raises\n  deterministically on 17.5% of tasks. Reward cannot show that; a per-task\n  `tracebacks / asserts_fired / rounds_used / max_round_output` column would have shown it\n  instantly. A cheap, high-value addition for any benchmark where the agent executes code.\n- **Give the optimizer the real round budget, derived.** The brief and the template advertise\n  `MAX_TURNS=30`, which never binds here; the binding constraint is `VERIFY_TURNS=3`, consumed by\n  any round that does not change the output artifact \u2014 **including a round that raises.** The\n  optimizer can only find this by reading the adapter's loop. Reporting \"rounds used / budget, and\n  which budget actually bound\" per task would make round-cost regressions visible instead of\n  silent.\n- **Let a saturated run spend its remaining iterations on trials instead of edits.** At n=1 per\n  task, `SE=0.0437`, so the resolvable effect size is `2\u00b7SE \u2248 3.5 tasks`: the run can no longer\n  measure anything it is plausibly able to change, and `LEDGER.md`'s own `unresolved` column exists\n  because of exactly this. An option to convert an iteration's budget into re-measurement of the\n  champion (more trials, or an early test-split read) would be worth more than a fourth prompt\n  edit, and would let the run distinguish \"1.000 because the capability is good\" from \"1.000\n  because n=1\".\n- **`git` is not usable for self-review in the candidate working dir.** `git status`/`git diff` in\n  `work/cand_0004` report nothing (the dir is not part of the repo's worktree), so there is no\n  built-in way to review one's own capability diff. I had to diff by hand against\n  `run_suite/candidates/cand_0003/`. Dropping a `parent/` symlink (or a pre-computed\n  `parent_diff.patch`) into the working dir would make self-review one command, and the brief does\n  ask the optimizer to verify its own edits.\n\n## From cand_0005 (final iteration)\n\n- **Detect a saturated objective and change the brief.** The focus block said \"No actionable\n  failures in focus \u2014 seek a robustness/generalization gain\", but the surrounding brief still\n  demanded \"AS MANY real fixes as you can\" and warned that timidity wastes the iteration \u2014 while\n  the gate, at val 1.000, can only answer \"rejected on a tie\". Those instructions pull in opposite\n  directions and the measured cost of resolving them in favour of breadth is on the ledger twice\n  (\u22120.025, \u22120.050). When parent val hits the ceiling, the brief should say so explicitly: *no edit\n  can be accepted; ship only changes provably inert on the passing trajectories, or ship nothing\n  and say why.* Better still, stop the run or reallocate the remaining budget to trials per task.\n- **Surface non-scoring failures in the trajectory summary.** 7 of 40 traces (17.5%) crashed on a\n  line of the prompt's own worked example, two of them losing an entire inspection round. The\n  summary reports only reward, so this was invisible \u2014 it is found only by extracting traceback\n  frames from the raw JSON. A per-task `rounds_used` / `exceptions_raised` / `recovered_from_error`\n  column would have pointed straight at the single real defect in a saturated split, and would make\n  \"solid vs flaky\" far more informative than reward alone.\n- **When a rejected candidate bundled several edits, ask the optimizer to attribute per edit.**\n  `broke={...}` names tasks. The instruction \"keep the edits that did NOT appear in its broke={...}\"\n  is not directly executable, since edits and tasks are different types. A real, provable fix in\n  cand_0004 was nearly lost with its batch; recovering it required reading the broken tasks' traces\n  and asking which edits could even reach them. Either ask for a per-edit attribution table in\n  PROCESS.md, or support one-edit-per-candidate / ablation candidates so attribution is measured\n  rather than argued.\n- **`history.jsonl` / `rejected.jsonl` were empty here**, while LEDGER.md and\n  `prior_iterations/<id>/` had everything. The brief leans on `rejected.jsonl` as the\n  already-refuted list (\"read it and make each proposal STRUCTURALLY different\"); if it can be\n  empty mid-run, say that the per-iteration directories are the authoritative record.\n- **Still true from cand_0004: no built-in way to review one's own capability diff.** This\n  candidate's working directory is not inside the git worktree that tracks it (`git diff` returns\n  nothing), so self-review means diffing by hand against\n  `run_suite/candidates/<parent>/`. A `parent/` symlink or a pre-computed `parent_diff.patch` in\n  the working dir would make the brief's own \"verify your edits\" step one command.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0003)", "text": "# PROCESS \u2014 iteration cand_0003 (parent: cand_0001, val 0.925)\n\nParent is **cand_0001**, not cand_0002: cand_0002 was REJECTED (val 0.900, \u0394 \u22120.025,\n`fixed={59595}`, `broke={50768, 80-42}`) and its whole batch was reverted. This iteration\nre-attacks the same three failures with the regression mechanisms of cand_0002 identified\nfirst and designed out.\n\n## Environment faults\n\n**None.** All three failing traces execute cleanly, produce a graded output file, and have\n`test_case_results == test_case_results_no_recalc == [0]` \u2014 wrong *values*, not a\nformula-vs-value artifact and not infrastructure. No permission denials, no missing\nbinaries, no timeouts, no gateway errors anywhere in the 40 traces. Nothing to hand back.\n\n## What actually broke cand_0002 (the first thing I established)\n\nDiagnosed by reading the two broken tasks' full traces, not by guessing from the diff:\n\n| broken task | mechanism | the text responsible |\n| --- | --- | --- |\n| `80-42` (`'Consolidate_ALL'!A2:L8000`, 47 975 pre-filled graded cells) | (a) its solution's **only** decision is `if all(dest.cell(r,c).value is None \u2026): first_blank = r` \u2192 `First blank destination row: 4000`. cand_0002 E2 said \"**Never** decide what to write with `if cell.value is None`\" \u2014 that forbids the step the task is built on. (b) `J2:J3999='N/A'` and `D/E/F='None'` are **real gold data** copied from source sheets; E2's closed stand-in character list (`n/a, N/A, -, \u2026`) told the agent to overwrite 7 996 correct cells. (c) E4's uncapped \"one `worked value \u2192 my rule's value` pair per line\" over 47 975 pre-filled cells truncates or blows the context before the write. | cand_0002 E2, E4, E5 |\n| `50768` (`F12:H14`) | gold is **6 of 9 cells empty** and all 3 filled cells are **strings** (`'4, 6'`, `'1, 3, 5'`, `'2'` \u2014 the single ID as a *str*). Its own verify line reads `graded non-empty: 3 of 9`. cand_0002's anti-shrink guard (\"treat a shrinking answer as a bug\", \"a rewrite that fills fewer answer cells is evidence the rewrite is the mistake\") turns that correct line into a bug signature and pushes step 4 to pad the six empty boxes; E2's aside \"a non-numeric string \u2026 can never equal a number\" primes writing `G14 = 2` (int) over the gold str `'2'`. | cand_0002 E1 (shrink guard), E6, E2 (type aside) |\n\n**Three things I therefore did NOT re-ship, in any form:** the anti-shrink / fill-more\nguard; any closed character list of placeholder tokens; and any prohibition on using\nemptiness in a test (I went further and explicitly *blessed* the emptiness scan as the way\nto find an append point). cand_0002's lesson restated: **a caveat buried inside a long\nbranching rule does not restore a bright line** \u2014 so this iteration leaves cand_0001's\n\"pre-filled cells are ground truth\" bright line standing and hangs one mechanically\ncheckable exception off it.\n\n## Ranked clusters (leverage = failing tasks \u00d7 recoverable score)\n\nRecoverable budget this split is 3 tasks = **0.075**; the gate bar is paired \u0394\u0304 > 0.2\u00b7SE =\n0.0087, i.e. **a net +1 task (0.025) clears it**. One regression costs 0.025 and cancels a\nwin outright, so the binding constraint is regression, not breadth. All three clusters are\naddressed.\n\n| # | cluster | tasks | recoverable | tag | file fixed in |\n| --- | --- | --- | --- | --- | --- |\n| 1 | **Pre-filled answer cell held as \"ground truth\" when its text can never match** \u2014 the agent gates the write on emptiness and leaves text where the gold holds a number | `59595` | 0.025 | CONTRACT (derived from the grader's own normalisation table) | `prompt.md` + `task_template.md` |\n| 2 | **Hand-typed illustration transcribed over a correct computed answer** \u2014 an out-of-range demo block's *blanks* are read as evidence | `402-43` | 0.025 | DECISION, narrowed by condition | `prompt.md` + `task_template.md` |\n| 3 | **\"Open at a moment\" counted as \"open during a span\"** \u2014 a whole column uniformly too high | `43436` | 0.025 | KNOWLEDGE (domain definition) | `prompt.md` |\n| 4 | **Checklist item 4 satisfied by a hardcoded `print(\u2026 \": checked\")`** \u2014 the verify round runs but checks nothing; the mechanism that lets 1\u20133 be skipped | all 3 failures | enabler | STRUCTURE | `task_template.md` |\n\n## Kept edits\n\n### E1 \u2014 the one type-conflict exception to \"pre-filled cells are ground truth\" (cluster 1)\n`prompt.md` \u00a7\"Change only what was asked\". Lever: **tighten the output contract** (skill\nlever 8) \u2014 the rule is derived from the normalisation table already in the prompt, not from\na new judgement about user intent. Compute your rule's value for every cell the instruction\nasks about, pre-filled or not, and compare per cell. The exception fires on **exactly one\ncombination**: your rule produces a number or a date for that cell *and* the cell holds text\nthat does not parse as one \u2192 that cell is already scored wrong whatever you do, so write\nyour value. Everywhere else cand_0001's bullet still governs.\n\n- **VERIFY:** trace `59595` turn 2 printed `C4: date=2020-03-05 cutoff=2020-02-27 total=4\n  existing='n/a'` and then `# Preserve user-provided/example values; fill only currently blank\n  answer cells.` / `if 4 <= r <= 19 and ws.cell(r, 3).value is None:`. Its rule was already\n  *correct* (it reproduced the worked rows `C7:C11 = 18, 26, 32, 26, 14` exactly) and its own\n  computed `4 / 6 / 12` are the gold values; grader: \"3 cell(s) hold a value of the wrong\n  type\". With E1 the `'n/a'` str vs its own `int` is the exception's one combination, so it\n  writes 4/6/12. Contract checked against the **scorer**, not the old prompt:\n  `compare_cell_value` fails on `type(v1) != type(v2)` after `transform_value`, and a\n  non-numeric `str` never becomes a number \u2014 so \"a cell holding `'n/a'` where the rule yields\n  a number is already failing\" is arithmetically true, not a heuristic.\n- **BLAST RADIUS: BOUNDED.** Census over all 24 passing tasks with pre-filled cells inside\n  `answer_position`, checked against each one's own step-1 printout:\n  `80-42` rule *produces* the str `'N/A'` (copy-through) \u2192 no type conflict, carve-out stated\n  explicitly \u00b7 `50768` rule produces `'1, 3, 5'` (str) over an identical str \u2192 no conflict \u00b7\n  `9569` (`0.1707` vs `0.170687841`) and `54144` (`106.54` vs `106.53999999999999`) are\n  number-vs-number \u2192 no conflict, and the text says so \u00b7 `55049` (B3:B23 all `#VALUE!`) and\n  `56563` (`C14 #NUM!`) write `total`, a number, over error text \u2014 they overwrite *today*, so\n  E1 **matches their passing behaviour and removes a live contradiction in cand_0001** \u00b7\n  headers/labels inside the range (`560-12 J3='Qty'`, `142-12`, `382-10`, `463-17`, `395-36`)\n  and input columns inside the range (`7902 D3:G6`) get no value from the rule \u2192 explicitly\n  excluded \u00b7 `47798`/`53383` gate on emptiness but write byte-identical values \u2192 unaffected.\n  **Rewritten mid-iteration after a hazard I found in my own first draft:** that draft had an\n  affirmative \"they agree or are the same kind \u2192 **leave the cell exactly as it is**\" branch.\n  `6698`'s `G4` holds `'=SUM(COUNTIFS(\u2026'` whose *cached value is a number* and whose task is\n  \"**Modify** my formula \u2026 to also include an additional condition\" \u2014 the branch would have\n  told it to keep the stale number. I deleted the branch (the edit is now purely a permission\n  to overwrite, adding no new instruction to leave) and added an explicit exclusion for\n  formula cells and for cells the instruction tells you to update or correct.\n\n### E2 \u2014 an out-of-range worked illustration is a check, never cells to copy (cluster 2)\n`prompt.md` \u00a7\"Change only what was asked\", new bullet. Lever: **add the discriminating\ncondition** (skill lever 4) \u2014 it narrows by *location* rather than loosening the global rule.\ncand_0001's bullet is scoped to \"values already present in **the answer range**\"; nothing\ntold the agent the scope was load-bearing, so it treated a block on another sheet as in-range\nground truth.\n\n- **VERIFY:** `402-43` turn 5 found `Row 14: A='THE ABOVE TABLE WOULD BECOME:'` with the\n  illustration at `Sheet1!A16:AG25` \u2014 **outside** the graded `'Sheet2'!A1:AG10`. Turn 6\n  computed the correct answer (`graded non-empty: 114 of 330`); turn 10's code comment is\n  `# The workbook includes a manually worked expected-result block in Sheet1 rows 16:25.` /\n  `# Copy that literal expected duplicated output to Sheet2!A1:AG10.` \u2192 111 cells. Grader:\n  \"3 cell(s) are empty where a value is expected\". With E2 the block is a check on the rule\n  and the answer is built from the source data, so turn 10 never happens.\n- **BLAST RADIUS: BOUNDED.** Fires only on an illustration *outside* `answer_position`. Every\n  passing task's worked rows are **inside** the range (`37378`, `39046`, `48527`, `48588`,\n  `54144`, `9569`, and `50768`'s `F14`), so the bullet does not reach them. Critically I did\n  **not** re-ship cand_0002's \"an example \u2026 is not authoritative cell by cell\" framing: that\n  is the clause that endangered `50768`, whose in-range `F14 = '1, 3, 5'` is the *only*\n  evidence fixing the matrix orientation.\n\n### E3 \u2014 only the cells an example actually fills are evidence (cluster 2)\n`prompt.md` \u00a7\"Check your logic against the examples you were given\". Lever: **rewrite a rule\npositively + state the condition it does not cover** (levers 1 and 4). A disagreement is \"the\nexample holds a value, you computed a value for that cell, and they differ\". An example that\nis **blank or truncated** where you computed a value \u2014 and the source data plainly holds a\nvalue there \u2014 is the user's omission, so keep your computed value.\n\n- **VERIFY:** `402-43`'s only disagreement was blank-vs-value: turn 7 printed\n  `Mismatches against Sheet1 example rows 16:25: [(1, 5, 'Col5', None), (1, 6, 'Col6', None),\n  (1, 7, 'Col7', None)] count 3` \u2014 the demo header row 16 simply omits E/F/G while the real\n  source header holds `E1='Col5'`, `F1='Col6'`, `G1='Col7'`. The agent \"fixed\" item 4 by\n  deleting them and then froze it as `assert not mismatches`. 111 + 3 = 114, matching the\n  grader's coverage line exactly. E3 makes that case explicitly *not* a disagreement.\n- **BLAST RADIUS: BOUNDED.** Conditioned on *your computation produced a value where the\n  example is blank* AND *the source data holds a value for it*. It never licenses filling a\n  cell whose correct answer is empty, so it cannot touch the tasks that correctly leave cells\n  blank (`227-40`, `382-10`, `142-12`, `50768` at 6 of 9 empty). It contains **no** anti-shrink\n  or fill-more instruction \u2014 that is exactly what broke `50768` under cand_0002 \u2014 and I added\n  the opposite protection in checklist item 3 (\"a mostly-empty graded range is a normal,\n  correct answer \u2014 do not fill cells to raise the non-empty count\").\n\n### E4 \u2014 \"open at time T\" means not yet closed at T (cluster 3)\n`prompt.md`, new section after the Excel-error bullet. Lever: **state the fact the agent\ncannot derive, imperatively** (lever 4 + lever 1). Structurally different from cand_0002's\nrejected E3, which offered **both** rules as a menu behind a classification step the agent had\nalready got wrong \u2014 \"a rule gated on the classification cannot repair a misclassification\".\nThis version names one answer, gives the slip pattern verbatim as a *shape*, and keeps both\ndata-side identities.\n\n- **VERIFY:** `43436` round 2's code is `if rec_dept == dept and created <= last_day and\n  (closed is None or closed >= first_day):` \u2014 pure span overlap. I recomputed the snapshot rule\n  `created <= T and (closed is None or closed > T)` over the 11 records the agent printed: it\n  differs in **exactly 5 of 15 cells, lower in all 5** (`K2 2\u21921`, `I3 4\u21923`, `K3 4\u21922`, `K4 2\u21921`,\n  `I5 1\u21920`), which matches \"5 of 15 cell(s) differ \u2026 5 cell(s) hold a number HIGHER than\n  expected\" uniquely \u2014 `closed >= last_day` gives the identical delta, so the inclusive/exclusive\n  end bound is *not* the discriminator; span-vs-moment is. The column headers the agent printed\n  itself are moment labels (`I1='Open by of end of May 2022'`, `K1='Open by end of Jul 2022'`)\n  while the instruction's own predicate (\"not closed before the first day of the month and \u2026\n  not created after the last day\") spells out the span. E4 tells it the moment governs.\n- **BLAST RADIUS: BOUNDED \u2014 verified by grep, not by assertion.** I searched all 40 tasks'\n  instructions for `as of|by the end|by end|still open|outstanding|year end|month end|end of\n  each|aging|ageing|backlog|not closed|date closed|open at`. **Two hits: `43436` itself, and\n  `2768` on the single word \"outstanding\"** \u2014 inventory allocation with no date window, no\n  start/end dates per record and no open/closed counting, so the section's stated trigger\n  (a start date *and* an end date per record *and* a cell labelled with a single moment) does\n  not fire on it. I deliberately did **not** ship the general \"a column header beats the\n  instruction's prose\" precedence rule this implies \u2014 that is UNBOUNDED and `INSIGHTS.md`\n  records `59196` sitting one cell from flipping on it (prose \"return the heading of that\n  column\" \u2192 `'D'` vs header `H2='MAX'`).\n\n### E5 \u2014 item 4 must be an executed comparison, not a restatement (cluster 4)\n`task_template.md` step 3 + checklist. Lever: **make the skipped step a precondition**\n(ordered-procedure / structure), plus **restructure** (lever 6). Step 2 now requires the rule\nto be one function and its results collected in `mine` *before* deciding what to write; the\nstep-3 snippet prints the `was \u2192 my rule \u2192 wrote` triple for every pre-filled cell the rule\ncovers; items 2 and 4 are judged over `mine`; and the preamble states that a line restating\nyour rule and ending in \"checked\" satisfies no item.\n\n- **VERIFY:** this is the mechanism all three failures used to pass a check they had failed.\n  `43436` item 4 was literally `print(\"4. Counts use the stated rule: created on/before month\n  end and not closed before month start: checked\")` \u2014 a restatement of the rule under\n  suspicion, asserted by a hardcoded print. `59595` item 3/4: \"Checked: pre-existing cells\n  C4:C11 remain as in input, including n/a text\" \u2014 it *saw* `C4 graded: 'n/a' str` in its own\n  verify output and argued past it, because item 2 was scoped to \"cells the instruction asked\n  you to fill\" and it had already redefined that set as the blank ones. Judging item 2 over\n  `mine` removes that escape: `C4` is in `mine` with value `4`, so `'n/a'` fails the item.\n  `402-43` item 4: \"Values agree exactly with the workbook's concrete expected-result example\"\n  \u2014 now a disagreement is defined so that blank-vs-value is not one.\n- **BLAST RADIUS: BOUNDED, and explicitly capped \u2014 the cap is the lesson from `80-42`.** Every\n  new print is folded into the **existing** step-3 round, so no task gains a round: the budget\n  is `MAX_TURNS=30` with `VERIFY_TURNS=3` non-writing rounds after the first write, and 29 of\n  40 traces have 9 trace items (4 assistant turns) and 8 have 11 (5 turns), so 8 tasks run with\n  zero spare verify rounds. Context cost is capped three ways where cand_0002 was unbounded:\n  `mine` is printed as \"size plus the entries that matter, never all of it\"; `clashes` prints\n  first/last 6 of \u226412; and item 4's worked-value set **is** `clashes` (pre-filled cells the\n  rule covers) rather than \"every pre-filled cell in the range\" \u2014 on `80-42` the rule covers\n  only the append rows 4000+, which are empty, so `clashes` is empty and item 4 answers \"no\n  worked value exists\" instead of attempting 47 975 pairs. The four benign-disagreement causes\n  and \"compare the way the grader does (round to 2 dp, coerce numeric strings)\" are kept, so\n  `9569`'s hand-rounded `0.1707` and `54144`'s float noise do not register as disagreements at\n  all. `src` is now guarded for a graded sheet that does not exist in the input (`402-43`'s\n  turn 3 died on `KeyError: \u00abredacted\u00bb Sheet2 does not exist.'`) \u2014 a recovery fix.\n\n### E6 \u2014 append regions and empty answers, stated once (supporting; protects `80-42`/`50768`)\n`prompt.md` \u00a7\"Change only what was asked\", two bullets. Adds the carve-outs that make E1's\nexception safe: cells the rule does not cover keep their input value \u2014 including **data\nalready sitting in a region you were asked to append to**, where \"finding the first free row\nby testing cells for emptiness is the correct way to locate the append point\" \u2014 and a cell\nwhose correct answer is \"nothing\" must come out empty, \"so never pad cells just to fill the\nrange\".\n\n- **VERIFY:** `80-42` passes *because of* `for r in range(2, 8001): if all(dest.cell(r, c).value\n  is None \u2026): first_blank = r` \u2192 `First blank destination row: 4000`, appending rows 4000\u20137997\n  below the 3 998 pre-existing rows; `unchanged original mismatches: 0` and reward 1.0 confirm\n  the gold for rows 2\u20133999 is literally the input. `50768`'s gold is 6 of 9 empty with\n  `graded non-empty: 3 of 9`. Both bullets restate behaviour these tasks already exhibit.\n- **BLAST RADIUS: BOUNDED (additive, and protective).** These are the two places cand_0002\n  measurably regressed; stating them positively is the cheapest insurance that E1/E3 cannot\n  drift into them.\n\n## Deliberately skipped\n\n- **\"A column header beats the instruction's prose.\"** The general rule `43436` implies, and\n  the honest generalisation of E4. UNBOUNDED decision-rule edit; I cannot enumerate the passing\n  tasks whose gold follows the prose, and `59196` is one cell from flipping. E4 covers the\n  verified case under a stated, grepped-empty condition instead. Needs a prose/header conflict\n  census across all 40 tasks before anyone ships it.\n- **The sibling-column falsification test** (\"recompute a pre-filled column measuring the same\n  quantity at a different reference point with the same rule\"). Attractive and general, but I\n  checked it arithmetically on `4343 14 point at that,\n     or clone+filter upstream yourself (see third_party/spreadsheetbench/NOTICE.md):\n       SPREADSHEETBENCH_HARNESS_DIR=/path/to/cap-evolve/third_party/spreadsheetbench\n\n  2. Fetch the dataset (NOT vendored \u2014 tens of MB of xlsx files, fetched at run time):\n       ci/benchmarks/spreadsheetbench/fetch_data.sh /some/cache/dir\n     then point at the extracted folder (contains dataset.json + spreadsheet/):\n       SPREADSHEETBENCH_DATA_DIR=/some/cache/dir/sample_data_200\n     SPREADSHEETBENCH_VARIANT selects which release: `sample_200`, `full_912` (the original\n     912-task set, 3 graded copies per task) or `verified_400` (the 400-task verified\n     re-release, 1 graded copy per task \u2014 what recent published work evaluates on). The\n     adapter reads the number of graded copies off disk, so all three just work.\n\n  3. Install Docker (required \u2014 each task runs in its own sandboxed container) and,\n     for accurate scoring of formula-bearing outputs, LibreOffice:\n       sudo apt install libreoffice-calc   # Debian/Ubuntu\n       sudo dnf install libreoffice-calc   # RHEL/Fedora\n       brew install --cask libreoffice     # macOS\n     Scoring degrades gracefully (skips recalculation) if LibreOffice is absent \u2014 but\n     silently: a formula-only cell then reads as empty and never matches, so a task the\n     agent actually solved scores 0. Treat the \"LibreOffice not found\" warning as a\n     setup error, not a nicety. Upstream's docstring asks for 7.5+; RHEL 9's 7.1.8.1\n     recalculates correctly through `--convert-to xlsx` and is verified in use.\n\n  4. Install adapter deps: pip install pandas openpyxl docker tornado requests\n\n  5. Copy this directory to .capevolve/project/adapters/, copy model_config.py alongside.\n\n  6. Set env vars (in .env or shell) \u2014 any litellm provider, see model_config.py:\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  7. Optional env vars:\n       SPREADSHEETBENCH_TASK_IDS=59196,58568         # comma-separated subset (default: all 200)\n       SPREADSHEETBENCH_MAX_TURNS=5                  # rounds of code-exec interaction per task\n       SPREADSHEETBENCH_ROWS=5                       # preview rows shown per sheet in the prompt\n       SPREADSHEETBENCH_CONCURRENCY=4                # parallel tasks (each = one Docker container)\n       SPREADSHEETBENCH_EXEC_TIMEOUT=180             # per code-exec call timeout (s)\n       SPREADSHEETBENCH_LIBREOFFICE_BIN=/path/to/soffice\n\n  8. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES \u2014 ALL the text the agent reads, in two files:\n  - prompt.md         the system prompt: who the agent is, how it should work.\n  - task_template.md  the per-task user message: how the job is framed, what the fields\n                      mean, and the interaction contract. Optional \u2014 no file falls back to\n                      the built-in _TASK_TEMPLATE, so older capabilities are unaffected.\n  Keeping the job description frozen in this file used to leave ~60% of the agent's\n  instruction surface un-optimizable, including the line \"once that file exists, you are\n  done\" \u2014 which encourages exactly the dominant failure (a wrong-but-present output file).\n  Per-task VALUES (instruction, paths, preview, answer_position) are still supplied by the\n  adapter through placeholders that live() validates; see _task_template_error.\n\nHOW IT WORKS:\n  - task \u2026[+102965 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL         try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() ->
