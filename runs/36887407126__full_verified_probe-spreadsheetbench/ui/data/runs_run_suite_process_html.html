<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);

ulas, so the grader reads them as empty.\n- The golden usually equals the cached value; it differs where the cache is an error (#DIV/0!, #N/A) or depends on changed cells.\n- The template now prints `formula cells left` from a non-data_only reload (cand_0002; RESULT pending).\n- Computing from the non-data_only workbook turns `=A2+1` dates into strings (45707). Always compute from data_only.", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001\n- Strategy tried: for the empty seed, build from an earlier run's accepted capability, compressed for the frontier reader, plus targeted rules for that capability's known regressions on the current val ids. That run's FINAL test rollouts give full traces for every current val task, which makes them a cheap source of counterfactuals (\"what would the known-good prompt do here\").\n- Plateau/stall signal: n/a. Measurement is noisy (single trial; about 24 of 40 val tasks flip between candidates), so judge by cluster-level moves, not single tasks.\n- What to try next iteration:\n  - Diagnose from cand_0001's own val traces.\n  - If a seed-passing task regressed, check whether a \u00a72 rule over-applied and gate it more narrowly; don't delete it wholesale.\n\n## Iteration cand_0002\n- Strategy tried: diagnose from the parent's own val traces plus a per-task diff of init vs golden in answer_position. I also ran a scripted stats pass over all 40 tasks: counts of prefilled, changed and formula cells.\n  - The stats pass made the \"existing formula cells\" class visible in minutes (8 tasks have formula targets; 3 of them fail for that reason).\n  - It also gave a safety check for the protected tasks: for each proposed rule, script the counterfactual over the 24 passing goldens before shipping it.\n- Plateau/stall signal: none.\n  - Lever switch: rules that existed but were skipped (exact text, keep prefilled) were moved from prose into verify-phase CHECKS, i.e. STRUCTURE instead of repetition.\n- What to try next iteration:\n  - Read whether the agent actually printed and acted on the new checks.\n  - If a check is ignored, move it into the Phase 2 code sample (code the agent copies) rather than adding words.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## from cand_0001\n- The work-dir `trajectories/*.json` for the seed carried only score feedback (input {}, no rollout.trace). The full traces were in `.capevolve/run_suite/rollouts/train/`, and the val traces only existed via a reused earlier run. Copying the val traces into `trajectories/` would save the optimizer a search.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0001)", "text": "# PROCESS \u2014 what I did this iteration (explainability; REQUIRED)\n\nIteration cand_0001 (1/3). EMPTY SEED: prompt.md was 0 bytes and there was no task_template.md, so the agent ran on the adapter's built-in template, which says \"once that file exists, you are done\". I created both capability files.\n\nEvidence sources:\n- The work-dir trajectories carry score feedback only, with no traces.\n- Full traces came from two places:\n  - seed train rollouts (`.capevolve/run_suite/rollouts/train/*__seed__t0.json`);\n  - the earlier run's FINAL test rollouts (`reused_seed_run/run_suite/rollouts/test/*__FINAL__t0.json`). These cover every current val task under the earlier run's accepted prompt: 21/40, with 12 seed failures fixed and 7 seed passes broken.\n\n## Ranked issue list (clusters by # failing tasks \u00d7 trials, biggest first)\n| rank | cluster | tasks | shared root cause | tag (KNOWLEDGE / BEHAVIORAL / CAPABILITY-GAP) | planned change class |\n| --- | --- | --- | --- | --- | --- |\n| 1 | F wrong logic/value | 12307, 183-8, 203-15, 279-23, 304-35, 41978, 50682, 524-31, 59358, 9391 | Ambiguous reading. Did not use the worked examples or the formulas in the file; included the total row in per-group sums (183-8). | KNOWLEDGE + BEHAVIORAL | \u00a72 \"workbook tells the shape\" rules, worked-example and calibration steps in the template |\n| 2 | C overwrote originals / wrote past the answer | 290-1, 409-45, 469-9, 535-20, 57354, 58687, 1925, 9111(prior-best) | Filled the whole range unconditionally; compacted results; cleared rows instead of deleting them | KNOWLEDGE | keep-original rule, row alignment, delete_rows/cols shift (\u00a74), CONTRACT item 3 |\n| 3 | A formula written instead of value | 11276, 45707, 56921, 59129, 59160 (+15/80 train) | Agent writes \"=...\" because the instruction asks for a formula; no cached value means it reads back empty | KNOWLEDGE (grader contract) | \u00a71(a) plus CONTRACT item 1 |\n| 4 | D types | 409-45, 535-20 (text parsed to int/date), 57354, 45944 (int instead of bool) | pandas round-trip re-types text; Excel TRUE/FALSE written as 1/0 | KNOWLEDGE | \u00a71(b) keep-type, bool rule, prefer openpyxl (\u00a74) |\n| 5 | E target empty | 38074, 58687, 45707(prior-best) | The \"next item\" logic stopped at the edge of the target; formulas written | KNOWLEDGE | per-row \"next\" rule; literal values |\n| 6 | B error markers / text case | 1925, 45944, 11276 | Lookup did not resolve; status word or label not copied verbatim; instruction's example format ignored | KNOWLEDGE | \u00a71(b) exact text from cells, error markers; \u00a72 Emulate Excel TEXT() plus example-format rule |\n| 7 | G repetition stall | 118-50 (train), many 30-round traces | Re-sends the same block; the built-in template never says how to stop | BEHAVIORAL | Phase 3 stop rule (no code block ends the run); \u00a75 stall note |\n\n## Changes made this iteration (one row per edit \u2014 aim for MULTIPLE classes, incl. a NEW tool when a cluster needs one)\n| cluster | edit class | file / tool | what & why it generalizes | protects passing? |\n| --- | --- | --- | --- | --- |\n| A | CONTRACT/KNOWLEDGE | prompt.md \u00a71(a), template CONTRACT 1 | Explains why a formula reads back empty under data_only; applies to formula/macro/VBA asks | yes. Passing tasks already wrote literals. |\n| D | KNOWLEDGE | prompt.md \u00a71(b) | Logicals as bool; kept or moved data keeps its type; no serial dates; no formatted numbers | yes. Matches gold typing. |\n| B/F | KNOWLEDGE | prompt.md \u00a71(b) text bullet | Copy existing labels and status words verbatim from cells rather than the instruction's paraphrase (203-15 cut-short plurals, 1925 case) | yes |\n| C | KNOWLEDGE | prompt.md \u00a71(d), \u00a72 worked-example, template CONTRACT 3 | Keep pre-filled target cells; nothing written past the answer; no placeholder fill unless asked | yes. Protects 9111 and 57354. |\n| C | KNOWLEDGE | prompt.md \u00a74 delete rows/cols | Deleting means shift (delete_rows/delete_cols, bottom-up), with a readback after | yes. Fixes the prior-best regression on 28-7. |\n| C | KNOWLEDGE | prompt.md \u00a72 row alignment | Per-row derived output stays on its source row and does not compact (469-9) | yes |\n| F/B | KNOWLEDGE | prompt.md \u00a72 Emulate Excel | TEXT ddd/dddd/mmm, ROUND half-up, case-insensitive matching; the instruction's example format wins (11276 \"Mon, Wed\") | yes |\n| E | KNOWLEDGE | prompt.md \u00a72 next-row rule (condensed from the prior accepted prompt) | Read the key one row past the target (45707) | yes |\n| F | KNOWLEDGE | prompt.md \u00a72 \"today\" rule | Current date = today() unless the instruction names one. 534-26 gold deletes all date columns, which needs the real today, not the sample sheet's date. | yes. Seed already passed 534-26 this way; the rule stops the prior-best regression. |\n| F | KNOWLEDGE | prompt.md \u00a75 mixed columns | Skip non-numeric cells and exclude total rows (183-8 hit TypeError on '#DIV/0!' and a total row) | yes |\n| F | BEHAVIORAL | template Phase 1 calibration | Reproduce a filled sibling column before writing | yes |\n| G | BEHAVIORAL | template Phase 3 | The checklist is followed by an explicit stop (plain sentence, no code), using the harness's no-code end; changed code required on retry | yes. Stops wasted rounds. |\n| all | KNOWLEDGE | prompt.md \u00a73 preview mapping | Row i = Excel i+2; Unnamed: k = column k+1; trust the extent | yes |\n\nPer cluster, the file chosen:\n- Grader/value-type contract \u2192 prompt.md \u00a71, restated briefly in the template CONTRACT so it is next to the task data.\n- Procedure (inspect, write with readback, verify, stop) \u2192 task_template.md, because it replaces the built-in \"once that file exists, you are done\".\n- Shape and preservation knowledge \u2192 prompt.md \u00a72 and \u00a74.\n\n## Verify-the-fix (one line per change: the trace it targets \u2192 what the guard/computation/new-tool now does on those exact inputs)\n- 56921/59129/59160/11276/45707 seed and 10747 train wrote '=\u2026'. \u00a71(a) and CONTRACT 1 say the instruction's \"formula\" means the values. The prior accepted prompt with the same rule fixed 56921 and 59129 in FINAL.\n- 45944: the gold expects bool and the seed wrote int. \u00a71(b) logicals bullet \u2192 True/False.\n- 409-45/535-20: feedback said \"int/datetime where str expected\". \u00a71(b) keep-type and \u00a74 prefer openpyxl, and the FINAL rollouts using openpyxl fixed both.\n- 28-7 (prior-best regression): the trace cleared rows rather than deleting them. \u00a74 now requires delete_rows (the shift) plus a readback.\n- 534-26 (prior-best regression): it used the sample \"Result\" sheet's 2020-12 date; the gold expects I1:AQ1 empty, i.e. every date column deleted, which needs today's date. The \u00a72 \"today\" rule covers it.\n- 188-39 (prior-best regression): it wrote 'N/A' strings where the gold has floats. This is not directly fixable since the instruction asks for N/A. \u00a71(d) no-placeholder applies only \"unless the instruction asks\", so it stays neutral, and the seed passed it with no prompt.\n- 9111/57354: these changed pre-filled cells. The \u00a72 worked-example rule keeps the original values.\n- 203-15: header text cut short (\"Transport Allowance\" vs the cell's \"Transport Allowances\"). The \u00a71(b) copy-from-cell rule makes the agent take the H-column strings verbatim.\n- 1925: the instruction says \"New\" while the formula and cells use NEW/case; it also changed originals. The copy-verbatim and keep-original rules apply.\n- 11276: the sheet's M/TU abbreviations were preferred over the instruction's \"Mon, Wed\". The \u00a72 Emulate Excel rule plus example-format wins \u2192 TEXT ddd \u2192 \"Mon\".\n- 183-8: summed the total row and crashed on '#DIV/0!'. \u00a75 mixed columns \u2192 skip non-numeric cells and exclude totals. The remaining value mismatch is a logic question and may still fail.\n- 469-9: compacted debit/credit lists. The \u00a72 row-alignment rule keeps each on its source row.\n- 45707: the next-day check stopped at the target edge. The \u00a72 next-row rule reads past it.\n- 118-50 stall: Phase 3 explicit stop plus changed-code-on-retry.\n- Blast radius: every rule is conditional on a situation (deleting, a pre-filled target, a formula ask, a logical result, a \"today\" ask), so tasks without that situation see only the general CONTRACT. That CONTRACT already matches how the 16 seed-passing tasks are graded.\n\n## Process & features used\n- Subagents / worktrees / parallel features used (or: \"serial fallback because \u2026\"): serial. The session rules say not to call Agent unless the user requests it, and the diagnosis fit in one context.\n- Prior iterations I read from ./prior_iterations/ + ./RUNMAP.md (which, and what I learned): none exist in this run, since RUNMAP is empty. I read the earlier run (reused_seed_run): its accepted cand_0001 prompt and template (val 0.95 there) and its FINAL test rollouts on today's val tasks. I adapted its structure and dropped its narrow, very long risk-matrix and snapshot sections down to one or two lines each. That keeps the text concise for the gemma reader, which tends to over-comply.\n\n## Good things to PRESERVE (do not let a future iteration undo these)\n- Literal-values contract (formula \u2192 value) in both files.\n- task_template.md with an explicit stop rule. The built-in template's \"once that file exists, you are done\" must stay replaced.\n- Keep-original-target-cells and keep-type rules.\n\n## Deliberately skipped (cluster + why \u2014 already-passing / needs gold / infra noise)\n- 12307, 279-23, 304-35, 41978, 50682, 524-31, 59358, 9391 get no task-specific rule. Each is a distinct logic mistake that needs the gold to diagnose, and a narrow rule would be a hardcode. They are covered only by the general worked-example and calibration steps.\n- 188-39 'N/A' vs float: the instruction explicitly asks for N/A, so any rule would be task-specific.\n- No new tools: the capability surface is text-only (prompt.md, task_template.md).\n\n---\n\n# DIAGNOSIS.json \u2014 machine-readable diagnosis (OPTIONAL but recommended)\n\nIn addition to PROCESS.md, you may write a DIAGNOSIS.json file to make your diagnosis machine-readable for the dashboard. This is optional; if absent, the dashboard will parse PROCESS.md tables when present, or show only outcome data.\n\nThe schema:\n```json\n{\n  \"candidate\": \"cand_NNNN\",\n  \"headline\": \"Brief summary of this iteration's strategy\",\n  \"clusters\": [\n    {\"id\": \"A\", \"name\": \"Short cluster name\",\n     \"detail\": \"Root cause explanation\", \"tasks\": [\"task-id\", ...],\n     \"scope\": \"BOUNDED|WIDESPREAD|SYSTEMIC\", \"latent\": false,\n     \"tag\": \"KNOWLEDGE|BEHAVIORAL|CAPABILITY-GAP\"}\n  ],\n  \"edits\": [\n    {\"id\": \"E1\", \"title\": \"What this edit does\",\n     \"files\": [\"prompt.md\"], \"lever\": \"CONTRACT|KNOWLEDGE|BEHAVIORAL|...\",\n     \"clusters\": [\"A\"], \"blast_radius\": \"BOUNDED|MODERATE|WIDE\",\n     \"verified\": \"How you tested it\"}\n  ],\n  \"skipped\": [{\"title\": \"What was skipped\", \"reason\": \"Why\"}],\n  \"techniques\": [\"technique 1\", \"technique 2\"]\n}\n```\n\nValidation is advisory only and never blocks an iteration. Warnings are recorded when:\n- A task ID in clusters[].tasks is not in the val split\n- An edit references a cluster ID that does not exist\n- An edit references a file that does not exist in the candidate", "template_only": false}]}, "config": {"project_dir": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/.capevolve/project", "spec_missing": false, "spec_groups": [{"group": "Capability", "items": [{"key": "capabilities", "value": ["system-prompt"]}, {"key": "capability_path", "value": "seed_capability"}]}, {"group": "Delivery", "items": [{"key": "intervention", "value": "direct"}]}, {"group": "Algorithm & optimizer", "items": [{"key": "optimizer_skill", "value": "claude-code"}, {"key": "optimizer_model", "value": "aws/claude-opus-5-5"}, {"key": "target_model", "value": "rits/google/gemma-4-31B-it"}, {"key": "target_profile_file", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/spreadsheetbench/full_verified_probe/reader/B_frontier.md"}, {"key": "optimizer_max_turns", "value": 80}, {"key": "optimizer_usd_per_iter", "value": 0}, {"key": "optimizer_instructions_file", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/.\u00abredacted\u00bb.md"}, {"key": "algorithm_skill", "value": "hill-climb"}]}, {"group": "Data & splits", "items": [{"key": "dataset_source", "value": "adapter"}, {"key": "split_ids_file", "value": "inputs/split_ids.json"}, {"key": "split_seed", "value": 0}, {"key": "num_trials", "value": 1}]}, {"group": "Budget & gate", "items": [{"key": "gate_mode", "value": "paired"}, {"key": "gate_k_se", "value": 0.2}, {"key": "max_iterations", "value": 3}, {"key": "stall", "value": 3}]}, {"group": "Other", "items": [{"key": "algorithm_focus", "value": "all"}, {"key": "reuse_baseline", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/reused_seed_run/run_suite"}, {"key": "store", "value": "git"}]}], "project_md": null, "files": [{"path": "adapters/adapter.py", "size": 107263, "preview": "\"\"\"SpreadsheetBench adapter template \u2014 optimize a spreadsheet agent's system prompt.\n\nReady-to-use cap-evolve adapter for SpreadsheetBench\n(https://github.com/RUCKBReasoning/SpreadsheetBench). Supports ANY litellm-compatible\nprovider \u2014 configure via env vars (see model_config.py).\n\nSETUP:\n  1. Get the harness code (Docker/Jupyter sandbox + prompt/scoring helpers). cap-evolve\n     vendors it as a filtered git subtree at third_party/spreadsheetbench \u2014 point at that,\n     or clone+filter upstream yourself (see third_party/spreadsheetbench/NOTICE.md):\n       SPREADSHEETBENCH_HARNESS_DIR=/path/to/cap-evolve/third_party/spreadsheetbench\n\n  2. Fetch the dataset (NOT vendored \u2014 tens of MB of xlsx files, fetched at run time):\n       ci/benchmarks/spreadsheetbench/fetch_data.sh /some/cache/dir\n     then point at the extracted folder (contains dataset.json + spreadsheet/):\n       SPREADSHEETBENCH_DATA_DIR=/some/cache/dir/sample_data_200\n     SPREADSHEETBENCH_VARIANT selects which release: `sample_200`, `full_912` (the original\n     912-task set, 3 graded copies per task) or `verified_400` (the 400-task verified\n     re-release, 1 graded copy per task \u2014 what recent published work evaluates on). The\n     adapter reads the number of graded copies off disk, so all three just work.\n\n  3. Install Docker (required \u2014 each task runs in its own sandboxed container) and,\n     for accurate scoring of formula-bearing outputs, LibreOffice:\n       sudo apt install libreoffice-calc   # Debian/Ubuntu\n       sudo dnf install libreoffice-calc   # RHEL/Fedora\n       brew install --cask libreoffice     # macOS\n     Scoring degrades gracefully (skips recalculation) if LibreOffice is absent \u2014 but\n     silently: a formula-only cell then reads as empty and never matches, so a task the\n     agent actually solved scores 0. Treat the \"LibreOffice not found\" warning as a\n     setup error, not a nicety. Upstream's docstring asks for 7.5+; RHEL 9's 7.1.8.1\n     recalculates correctly through `--convert-to xlsx` and is verified in use.\n\n  4. Install adapter deps: pip install pandas openpyxl docker tornado requests\n\n  5. Copy this directory to .capevolve/project/adapters/, copy model_config.py alongside.\n\n  6. Set env vars (in .env or shell) \u2014 any litellm provider, see model_config.py:\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  7. Optional env vars:\n       SPREADSHEETBENCH_TASK_IDS=59196,58568         # comma-separated subset (default: all 200)\n       SPREADSHEETBENCH_MAX_TURNS=5                  # rounds of code-exec interaction per task\n       SPREADSHEETBENCH_ROWS=5                       # preview rows shown per sheet in the prompt\n       SPREADSHEETBENCH_CONCURRENCY=4                # parallel tasks (each = one Docker container)\n       SPREADSHEETBENCH_EXEC_TIMEOUT=180             # per code-exec call timeout (s)\n       SPREADSHEETBENCH_LIBREOFFICE_BIN=/path/to/soffice\n\n  8. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES \u2014 ALL the text the agent reads, in two files:\n  - prompt.md         the system prompt: who the agent is, how it should work.\n  - task_template.md  the per-task user message: how the job is framed, what the fields\n                      mean, and the interaction contract. Optional \u2014 no file falls back to\n                      the built-in _TASK_TEMPLATE, so older capabilities are unaffected.\n  Keeping the job description frozen in this file used to leave ~60% of the agent's\n  instruction surface un-optimizable, including the line \"once that file exists, you are\n  done\" \u2014 which encourages exactly the dominant failure (a wrong-but-present output file).\n  Per-task VALUES (instruction, paths, preview, answer_position) are still supplied by the\n  adapter through placeholders that live() validates; see _task_template_error.\n\nHOW IT WORKS:\n  - task \u2026[+102965 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 2051, "preview": "{\"train\": [\"10452\", \"105-24\", \"10747\", \"108-24\", \"118-50\", \"11842\", \"141-20\", \"165-23\", \"170-13\", \"1818\", \"192-22\", \"194-19\", \"22-47\", \"247-24\", \"250-20\", \"254-34\", \"262-17\", \"263-1\", \"30930\", \"31011\", \"31915\", \"32023\", \"32255\", \"32337\", \"32438\", \"325-44\", \"32612\", \"32902\", \"34033\", \"3413\", \"35742\", \"36097\", \"370-43\", \"379-36\", \"398-14\", \"39903\", \"39931\", \"408-39\", \"40892\", \"414-20\", \"42354\", \"433-47\", \"43589\", \"45372\", \"46121\", \"46646\", \"472-15\", \"47766\", \"48080\", \"48365\", \"48745\", \"48983\", \"493-18\", \"49333\", \"50916\", \"51090\", \"51249\", \"52216\", \"54085\", \"54638\", \"55060\", \"55421\", \"55427\", \"55965\", \"56274\", \"56427\", \"56786\", \"57113\", \"57445\", \"57558\", \"577-40\", \"57743\", \"58109\", \"58484\", \"58499\", \"585-41\", \"58949\", \"6239\", \"66-24\", \"82-30\"], \"val\": [\"11276\", \"12307\", \"183-8\", \"188-39\", \"1925\", \"203-15\", \"279-23\", \"28-7\", \"290-1\", \"304-35\", \"374-31\", \"38074\", \"409-45\", \"41978\", \"45707\", \"45896\", \"45944\", \"469-9\", \"486-17\", \"48975\", \"50521\", \"50682\", \"50811\", \"50971\", \"51680\", \"524-31\", \"52541\", \"52575\", \"534-26\", \"535-20\", \"547-43\", \"56921\", \"57354\", \"58687\", \"59129\", \"59160\", \"59358\", \"59511\", \"9111\", \"9391\"], \"test\": [\"109-21\", \"120-24\", \"130-9\", \"13284\", \"142-19\", \"14240\", \"15387\", \"156-14\", \"157-4\", \"16511\", \"17111\", \"178-22\", \"18645\", \"208-20\", \"24-23\", \"297-42\", \"3002\", \"31202\", \"31746\", \"32562\", \"32789\", \"33157\", \"333-29\", \"334-11\", \"341-40\", \"359-21\", \"36191\", \"36277\", \"367-23\", \"36764\", \"37229\", \"374-18\", \"37554\", \"384-4\", \"38537\", \"3911\", \"39190\", \"40478\", \"408-5\", \"41-47\", \"416-27\", \"42198\", \"42526\", \"42902\", \"42930\", \"43213\", \"43657\", \"44017\", \"44266\", \"44296\", \"44389\", \"448-11\", \"45300\", \"455-35\", \"45937\", \"4714\", \"47933\", \"48608\", \"48643\", \"48969\", \"49036\", \"49196\", \"493-5\", \"49300\", \"49857\", \"49945\", \"50324\", \"50631\", \"510-3\", \"51556\", \"52220\", \"52233\", \"52305\", \"52807\", \"52917\", \"52964\", \"53161\", \"53167\", \"54474\", \"54513\", \"547-18\", \"54717\", \"55085\", \"55260\", \"55468\", \"55708\", \"55977\", \"567-21\", \"57033\", \"57262\", \"57989\", \"58942\", \"59639\", \"59734\", \"59794\", \"599-9\", \"61-4\", \"82-38\", \"91-34\", \"9448\"]}\n", "truncated": false, "binary": false}, {"path": "optimizer/INSTRUCTIONS.md", "size": 17782, "preview": "# Optimize the capability \u2014 ship several REAL, SAFE, VERIFIED prompt fixes this iteration\n\n{{TARGET_READER}}\n\n{{FOCUS_SUMMARY}}\n\n{{EMPTY_SEED}}\n\nGOAL: raise the eval score as much as you can THIS iteration, then STOP (the harness\nre-scores you \u2014 don't run evaluation yourself). The capability under optimization is\nPROSE: the agent's prompt / skill text. There are no tool implementations to edit here.\n\nMake **AS MANY real fixes as you can this iteration \u2014 solve many issues across many\ntrajectories, not just the biggest one.** A timid one- or two-edit iteration is an\nunder-used iteration: diagnose EVERY failure cluster in `./trajectories/` and ship a fix\nfor each one that passes the three tests below. Breadth is the goal \u2014 the more distinct\nfailing clusters you fix in this ONE candidate, the larger the gain.\n\nThe ONLY brake on breadth is regression: every edit must pass all three tests, because a\nsingle speculative edit that breaks a passing task can sink an iteration of good work (it\ndid in prior runs). So the discipline is \"many fixes, each one real and safe\" \u2014 NOT \"few\nfixes\". Do not stop at the first cluster; work through them all.\n\n## WHAT YOU MAY EDIT \u2014 and the two ways iterations get wasted here\nEdit ONLY the capability files listed in `{{CAP_BRIEF}}` below (the prompt / skill text in\nthis working directory). Everything else you can see is READ-ONLY CONTEXT.\n\n**You may NOT edit the adapter, the harness, the scorer, the benchmark, or the\nenvironment** \u2014 not to make a task pass, not to fix a broken mount or a missing binary,\nnot \"just to unblock the run\". Those files are how your score is MEASURED; changing them\ndoes not improve the capability, and a gain obtained that way is not a result. An\niteration that edits infrastructure has produced NOTHING measurable, however green the\nnumber looks. **If the traces show an ENVIRONMENT fault** (permission denied, missing\nbinary, gateway/network error, timeout, container failure \u2014 the same error on nearly every\ntask, unrelated to the task's content), then the correct and complete action is:\n1. do NOT edit the prompt to work around it (a prose workaround for a broken environment\n   is a speculative edit that fails the REAL test \u2014 the prompt is not the defect), and\n2. state the diagnosis in `PROCESS.md` and `JOURNAL.md` precisely \u2014 the exact error, how\n   many tasks it hit, and what a human must fix \u2014 then STOP. Handing back an accurate\n   \"the environment is broken, here is the evidence\" is a SUCCESSFUL iteration.\n\n**The other way iterations get wasted: another prose rule for a behavior the agent already\nknows.** When the agent has the rule and skips it anyway, adding a second sentence saying\nthe same thing changes nothing \u2014 you must change the STRUCTURE that makes it skippable\n(see the levers below): make the step unavoidable and ordered, make the contract explicit,\nor give a worked example it can pattern-match. Prose is for genuine KNOWLEDGE gaps (a\nfact / format / criterion the agent cannot derive) and for STRUCTURE that changes what the\nagent does \u2014 not for repetition or emphasis.\n\n## The THREE TESTS every change must pass (this is the whole game)\nBefore you keep any edit, confirm all three. Drop any edit that fails even one.\n1. **REAL** \u2014 it targets a cluster that is FAILING in THIS iteration's `./trajectories/`\n   (reward 0, partial-credit, or communication/omission). Never edit for a hypothetical\n   problem, and never edit on account of a task whose failure is an environment fault.\n2. **SAFE (bounded blast radius)** \u2014 the real regression question is *behavioral*:\n   **would this edit change what the agent DOES on ANY currently-passing task?** Two\n   blast-radius classes:\n   - **BOUNDED** \u2014 an ADDITIVE rule that applies only under a stated condition present in\n     the failing cases, or a clarification of an output contract the passing tasks already\n     satisfy. This is the SAFE default \u2014 prefer it.\n   - **UNBOUNDED** \u2014 any edit to a GLOBAL decision/permission/refusal rule, or a \u2026[+13631 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/prompt.md", "size": 0, "preview": "", "truncated": false, "binary": false}]}, "host_session": {}}, "diffs": {"cand_0001": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,152 @@"}, {"t": "add", "l": "+You are a spreadsheet expert. You solve each task by writing Python (openpyxl / pandas) that"}, {"t": "add", "l": "+edits a workbook and saves it to a given `output_path`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 1. How your work is graded \u2014 read this before writing any code"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your output file is opened with `openpyxl.load_workbook(path, data_only=True)` and the **values"}, {"t": "add", "l": "+stored in the cells** of `answer_position` are compared with an expected workbook. Nothing is"}, {"t": "add", "l": "+recalculated, and nothing you say in prose is read. Four consequences decide most tasks."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(a) A formula is not an answer \u2014 write the computed literal value.**"}, {"t": "add", "l": "+`data_only=True` returns a formula cell's *cached* value. openpyxl never computes formulas, so a"}, {"t": "add", "l": "+cell you set to `\"=SUM(A1:A9)\"` has no cached value and reads back as **empty**: a guaranteed"}, {"t": "add", "l": "+zero, however correct the formula is."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Compute the result in Python and assign the plain value: `ws[\"C2\"] = 41.5`."}, {"t": "add", "l": "+- Do this **even when the instruction asks for a formula, a macro or VBA**. The instructions are"}, {"t": "add", "l": "+  questions from spreadsheet users (\"what formula can I use\u2026\", \"fix my formula in G4\u2026\", \"write a"}, {"t": "add", "l": "+  macro that\u2026\"); what is graded is the *values* that formula or macro would leave in the cells."}, {"t": "add", "l": "+  Work out those values and write them. If you want to show the formula, put it in a `print()`"}, {"t": "add", "l": "+  or a comment \u2014 never in a cell."}, {"t": "add", "l": "+- Never assign a string starting with `=` to any cell inside `answer_position`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(b) Types must match.** `int` and `float` are interchangeable, and a string that parses as a"}, {"t": "add", "l": "+number is converted \u2014 but nothing else is."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Numbers \u2192 `int`/`float`, never a formatted string (`\"1,234\"`, `\"$5.00\"`, `\"12%\"`,"}, {"t": "add", "l": "+  `f\"{x:.2f}\"`). Display formatting goes in `cell.number_format`, which is not compared."}, {"t": "add", "l": "+- Dates \u2192 `datetime.datetime`; times \u2192 `datetime.time`. Never an Excel serial number (`45301`)"}, {"t": "add", "l": "+  and never a date string, unless the instruction asks for text. A date *part* (\"which month\","}, {"t": "add", "l": "+  \"the day number\") is a small integer (`d.month`, `d.day`)."}, {"t": "add", "l": "+- Logical results (what Excel's `TRUE`/`FALSE` would show) \u2192 Python `True`/`False`, not `1`/`0`"}, {"t": "add", "l": "+  and not the strings `\"TRUE\"`/`\"FALSE\"`."}, {"t": "add", "l": "+- Text \u2192 the exact string. When the value you write already exists somewhere in the workbook \u2014 a"}, {"t": "add", "l": "+  category, a header, an item label, a status word \u2014 copy it character for character from that"}, {"t": "add", "l": "+  cell, with its own spelling, plural, case and spacing. Instructions often paraphrase (a"}, {"t": "add", "l": "+  singular for a plural label, a different capitalisation); the cells, not the paraphrase, are"}, {"t": "add", "l": "+  what the expected answer contains."}, {"t": "add", "l": "+- Data you move, copy or keep stays the type it was. A cell holding the text `\"0012\"` or"}, {"t": "add", "l": "+  `\"2021-03\"` must still hold that text afterwards \u2014 do not let pandas (or your own code) parse it"}, {"t": "add", "l": "+  into an int or a datetime on the way through."}, {"t": "add", "l": "+- An Excel error marker (`\"#N/A\"`, `\"#VALUE!\"`, `\"#DIV/0!\"`, `\"#NAME?\"`, `\"#REF!\"`) is never an"}, {"t": "add", "l": "+  answer; it is the trace of a lookup that did not resolve. Find out why it missed and write what"}, {"t": "add", "l": "+  the instruction says belongs there (often `0`, empty, or a stated fallback word)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(c) Precision.** Both sides are rounded to 2 decimals. Do not round further unless asked."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(d) Empty.** `None` and `\"\"` both count as empty and match each other. To clear a cell, assign"}, {"t": "add", "l": "+`None`. Conversely, a cell the expected answer leaves empty must stay empty: do not fill gaps with"}, {"t": "add", "l": "+`0`, `\"-\"` or other placeholders unless the instruction asks for exactly that."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 2. The workbook tells you the answer's shape \u2014 read it before deciding"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Most wrong-value failures come from guessing a reading of an ambiguous instruction when the file"}, {"t": "add", "l": "+itself settles it."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Already-filled cells inside `answer_position` are the asker's worked example.** Authors often"}, {"t": "add", "l": "+fill the first few target cells by hand, or the cells still hold the cached output of the formula"}, {"t": "add", "l": "+being \"fixed\", and the expected output keeps those cells **unchanged**. Use them to pin down the"}, {"t": "add", "l": "+semantics and the exact format, and make your computation reproduce them. A target cell that"}, {"t": "add", "l": "+already holds a value must hold **that same value** when you finish, unless the instruction"}, {"t": "add", "l": "+explicitly asks to change or clear it. Filling a whole range unconditionally is the most common"}, {"t": "add", "l": "+way such a task fails."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+> Target `D3:G3`; `D3`, `E3` already hold `3`, `2`; `F3`, `G3` are empty. The instruction asks"}, {"t": "add", "l": "+> for a count per column header. Keep `3`, `2`; compute `F3`, `G3` the same way \u2014 and check that"}, {"t": "add", "l": "+> your function also returns `3`, `2` for `D3`, `E3`. If it does not, your reading is wrong, not"}, {"t": "add", "l": "+> the file."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Existing formulas document the intended computation.** Load the workbook a second time without"}, {"t": "add", "l": "+`data_only` and print the formulas in and around the target range. A neighbouring"}, {"t": "add", "l": "+`=COUNTIFS(B:B,G2,D:D,\"\")` tells you the key and the filter more reliably than the prose. When"}, {"t": "add", "l": "+the task is to fix a formula, read that formula first, decide what the corrected version would"}, {"t": "add", "l": "+**display in Excel**, and write those displayed values."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Emulate Excel exactly.** The expected values were produced by Excel, so reproduce Excel's own"}, {"t": "add", "l": "+semantics: `TEXT(d,\"ddd\")` \u2192 `\"Mon\"`, `TEXT(d,\"dddd\")` \u2192 `\"Monday\"`, `TEXT(d,\"mmm\")` \u2192 `\"Jan\"`;"}, {"t": "add", "l": "+`ROUND` rounds halves away from zero; text comparisons in `COUNTIF`/`MATCH`/`=` ignore case;"}, {"t": "add", "l": "+`SUMIF` with no match is `0`. When the instruction gives an example of the desired output"}, {"t": "add", "l": "+(\"for example, Mon, Wed\"), match that example's form exactly, even if other cells in the sheet use"}, {"t": "add", "l": "+a different style."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Headers and axis labels fix orientation.** For a grid target, read the row and column labels"}, {"t": "add", "l": "+from the sheet rather than assuming which axis is which. If the labels do not settle it, a"}, {"t": "add", "l": "+severity-by-frequency matrix puts severity/impact down the rows and frequency/likelihood across"}, {"t": "add", "l": "+the columns."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Results stay aligned with their source rows.** When each output cell is derived from one input"}, {"t": "add", "l": "+row (split a column into two, extract text, look up a key), write it on **that same row**, and"}, {"t": "add", "l": "+leave the row empty when it yields nothing. Do not compact results to the top unless the"}, {"t": "add", "l": "+instruction asks for a list."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**A per-row condition on \"the next\" item reads one row past the target.** When each row's result"}, {"t": "add", "l": "+depends on the next row's key (\"if the next date is the 1st of a month\", \"use the next row's date"}, {"t": "add", "l": "+as the end\"), read the key column through the row after the target's last row: the edge of"}, {"t": "add", "l": "+`answer_position` is where you may write, not where the data ends."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**\"Open/active at the end of period P\" is a snapshot at P's boundary**"}, {"t": "add", "l": "+(`start <= b and (end is None or end > b)`), not an overlap with P \u2014 when the graded column's"}, {"t": "add", "l": "+header names a boundary. Use overlap only when the instruction asks about activity *during* a span."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**\"Today\", \"the current month\", \"this year\" mean the real current date**"}, {"t": "add", "l": "+(`datetime.date.today()`), unless the instruction or a cell names the date to use. If the"}, {"t": "add", "l": "+workbook already has a `TODAY()`-based formula, its cached value shows which date was used."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 3. Reading the preview correctly"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+`spreadsheet_content` is `pandas.read_excel(...).head()` printed as text:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- pandas used **Excel row 1 as the header**, so preview row `i` is **Excel row `i + 2`**."}, {"t": "add", "l": "+- The leftmost `0, 1, 2, \u2026` column is the pandas index, not a sheet column. The first real column"}, {"t": "add", "l": "+  is **A**; a column headed `Unnamed: k` is Excel column number `k + 1`."}, {"t": "add", "l": "+- `[data extent: rows 1-N, cols A-X]` is measured on the whole sheet and is accurate; the printed"}, {"t": "add", "l": "+  rows are only a sample. Process all N rows."}, {"t": "add", "l": "+- Before writing, print one known landmark (a header string, the last data row) with openpyxl to"}, {"t": "add", "l": "+  confirm your addresses. An off-by-one row makes every written cell wrong."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 4. Preserve everything you were not asked to change"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Prefer openpyxl for the write: load the input (without `data_only`), set the target cells, and"}, {"t": "add", "l": "+`wb.save(output_path)`. A `DataFrame.to_excel` rebuild drops anything outside the DataFrame,"}, {"t": "add", "l": "+re-types text that looks like numbers or dates, and renumbers rows \u2014 use it only when you are"}, {"t": "add", "l": "+genuinely producing a fresh, self-contained table."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Appending / consolidating** (\"add to the bottom\", \"first blank row\"): scan for the first blank"}, {"t": "add", "l": "+  row and write below the existing rows. Print a couple of existing destination rows with"}, {"t": "add", "l": "+  `repr()`; if they hold a placeholder (`'None'`, `'N/A'`, `0`) where the source is empty, carry"}, {"t": "add", "l": "+  that convention into the rows you add."}, {"t": "add", "l": "+- **Deleting rows or columns** means the remaining cells **shift up / left**, as Excel's Delete"}, {"t": "add", "l": "+  does. Use `ws.delete_rows(idx, amount)` / `ws.delete_cols(idx, amount)`, working from the"}, {"t": "add", "l": "+  bottom/right so earlier indexes stay valid. Merely clearing cells to `None` leaves gaps where the"}, {"t": "add", "l": "+  expected output has the following data. Afterwards print the rows/columns right after the"}, {"t": "add", "l": "+  deleted block and the sheet's new extent."}, {"t": "add", "l": "+- **Moving or transposing** values: copy the cell values as openpyxl returns them (that keeps"}, {"t": "add", "l": "+  their types), not through strings."}, {"t": "add", "l": "+- Do not add, delete or rename sheets the instruction does not mention; when it asks for a new"}, {"t": "add", "l": "+  sheet, give it the exact name used in `answer_position`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+openpyxl trap: **never save a workbook opened with `data_only=True`** \u2014 that rewrites every other"}, {"t": "add", "l": "+formula in the file as a literal. Read with one `data_only=True` workbook; modify and save a"}, {"t": "add", "l": "+second one loaded without it."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 5. Other recurring pitfalls"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Float comparisons.** `110 >= 100 * 1.1` is `False`. Allow a tolerance: `a >= b - 1e-9`."}, {"t": "add", "l": "+- **Blanks are not zeros.** Decide from the instruction whether an empty cell is skipped or `0`."}, {"t": "add", "l": "+- **`NaN`** is never a valid cell value; convert it to `None` or to what the instruction says."}, {"t": "add", "l": "+- **Mixed columns.** Headers, subtotals and notes sit in the same column as numbers; skip"}, {"t": "add", "l": "+  non-numeric cells explicitly instead of letting `sum()` raise. A total row inside the data is"}, {"t": "add", "l": "+  not another record \u2014 exclude it from per-group computations."}, {"t": "add", "l": "+- **`dropna`** collapses blank rows and shifts later rows; avoid it when output must stay aligned."}, {"t": "add", "l": "+- **Stalls.** Re-sending the same code produces the same result. If a run fails or a check does"}, {"t": "add", "l": "+  not pass, change something specific \u2014 the reading, the range, the key \u2014 and say what in a comment."}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,113 @@"}, {"t": "add", "l": "+<!--"}, {"t": "add", "l": "+  Capability file: the agent's FIRST USER MESSAGE. Placeholders are filled in per task and are"}, {"t": "add", "l": "+  load-bearing \u2014 {instruction} {spreadsheet_path} {spreadsheet_content} {instruction_type}"}, {"t": "add", "l": "+  {answer_position} {output_path} must all survive; {max_turns} is optional. A literal brace is"}, {"t": "add", "l": "+  written {{ or }}. This comment is stripped before the agent sees the message."}, {"t": "add", "l": "+-->"}, {"t": "add", "l": "+Solve the following spreadsheet manipulation task. It is described by six fields:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **instruction** \u2014 what to do, written as a question from a spreadsheet user. It often asks for"}, {"t": "add", "l": "+  a formula or a macro; what is graded is the resulting cell **values** (see the CONTRACT below)."}, {"t": "add", "l": "+- **spreadsheet_path** \u2014 the input workbook. Read it; never modify it in place."}, {"t": "add", "l": "+- **spreadsheet_content** \u2014 a `pandas.read_excel(...).head()` preview of each sheet, plus the"}, {"t": "add", "l": "+  sheet's true `[data extent]` and the size of the target range. The printed rows are a sample."}, {"t": "add", "l": "+- **instruction_type** \u2014 `Cell-Level Manipulation`: `answer_position` is exactly the graded"}, {"t": "add", "l": "+  cells. `Sheet-Level Manipulation`: `answer_position` is the **maximum** range that is graded,"}, {"t": "add", "l": "+  and the expected answer often fills only part of it \u2014 the rest must be empty or unchanged."}, {"t": "add", "l": "+- **answer_position** \u2014 the graded cell(s). It bounds *where* you may write; the instruction says"}, {"t": "add", "l": "+  *what* goes where. Do not spread your answer over the whole range just because it is bigger."}, {"t": "add", "l": "+- **output_path** \u2014 write the finished workbook to this exact path."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction"}, {"t": "add", "l": "+{instruction}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_path"}, {"t": "add", "l": "+{spreadsheet_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_content"}, {"t": "add", "l": "+{spreadsheet_content}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction_type"}, {"t": "add", "l": "+{instruction_type}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### answer_position"}, {"t": "add", "l": "+{answer_position}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### output_path"}, {"t": "add", "l": "+{output_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## CONTRACT \u2014 what makes an answer correct"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The grader opens your file with `openpyxl.load_workbook(output_path, data_only=True)` and"}, {"t": "add", "l": "+compares the **stored values** in `answer_position` with the expected workbook. It does not"}, {"t": "add", "l": "+recalculate formulas and does not read your prose."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. Every graded cell holds a **literal computed value**, never a string beginning with `=` (a"}, {"t": "add", "l": "+   formula written by openpyxl reads back as empty) and never an error marker such as `#N/A`."}, {"t": "add", "l": "+2. Values are **correctly typed**: numbers as `int`/`float`, dates as `datetime`, logicals as"}, {"t": "add", "l": "+   `True`/`False`, text as the exact string found in the workbook. Data you keep or move keeps"}, {"t": "add", "l": "+   its original type. Numbers are compared rounded to 2 decimals."}, {"t": "add", "l": "+3. Every cell the expected answer fills is filled; every target cell the instruction does not ask"}, {"t": "add", "l": "+   you to change still holds its **original value**; nothing is written past where the answer ends."}, {"t": "add", "l": "+4. Content the instruction never mentions \u2014 other sheets, other columns \u2014 is left as it was."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## HOW TO WORK \u2014 you have up to {max_turns} rounds"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Each reply is **exactly one ```python fenced code block**. Its stdout is returned to you; if it"}, {"t": "add", "l": "+raises, you get the traceback. Work through three phases."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 1 \u2014 INSPECT (1\u20132 rounds).** Never write your answer from the preview alone. Print what"}, {"t": "add", "l": "+you need to be certain about:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+import openpyxl"}, {"t": "add", "l": "+wb  = openpyxl.load_workbook(\"<spreadsheet_path>\", data_only=True)   # stored values"}, {"t": "add", "l": "+wbf = openpyxl.load_workbook(\"<spreadsheet_path>\")                   # formulas as written"}, {"t": "add", "l": "+for s in wb.worksheets:"}, {"t": "add", "l": "+    print(s.title, s.max_row, s.max_column)"}, {"t": "add", "l": "+ws, wsf = wb[\"<sheet>\"], wbf[\"<sheet>\"]"}, {"t": "add", "l": "+# The target cells: what is already there, and any formula that documents the intent."}, {"t": "add", "l": "+for addr in [\"<cells of answer_position \u2014 the first ~20 are enough for a large range>\"]:"}, {"t": "add", "l": "+    print(addr, repr(ws[addr].value), \"| formula:\", repr(wsf[addr].value))"}, {"t": "add", "l": "+# The neighbours that define the computation: headers, labels, key columns."}, {"t": "add", "l": "+for r in range(1, 12):"}, {"t": "add", "l": "+    print(r, [ws.cell(r, c).value for c in range(1, 13)])"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Then state in a comment the reading you settled on and its evidence: an existing formula, a"}, {"t": "add", "l": "+header, or an already-filled target cell your computation must reproduce. If a filled column"}, {"t": "add", "l": "+next to the target computes the same quantity for a different parameter (`Q1 total` beside the"}, {"t": "add", "l": "+`Q2 total` you must fill), compute that column with your function too and compare; a mismatch"}, {"t": "add", "l": "+means your reading is wrong \u2014 fix it before writing."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 2 \u2014 WRITE.** Compute every value in Python, assign the literals, save to `output_path`,"}, {"t": "add", "l": "+and in the **same** block re-open the saved file and print what the grader will see:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+wb = openpyxl.load_workbook(\"<spreadsheet_path>\")      # fresh, WITHOUT data_only"}, {"t": "add", "l": "+ws = wb[\"<sheet>\"]"}, {"t": "add", "l": "+# ... assign computed literal values to the target cells ..."}, {"t": "add", "l": "+wb.save(\"<output_path>\")"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+chk = openpyxl.load_workbook(\"<output_path>\", data_only= t": "add", "l": "+  formula or macro over this data, and that can only emit strings the workbook holds. So when"}, {"t": "add", "l": "+  the instruction writes `'Transport Allowance'` and column H holds `'Transport Allowances'`,"}, {"t": "add", "l": "+  write `'Transport Allowances'`. A quoted constant in an existing formula counts too: with"}, {"t": "add", "l": "+  `IFNA(\u2026,\"NEW\")` in the sheet, the fallback is `\"NEW\"` even if the prose says \"New\". (This is"}, {"t": "add", "l": "+  about the same word differing in case, spacing or plural. An explicit example of a different"}, {"t": "add", "l": "+  *format*, such as \"Mon, Wed\", still decides the format, as \u00a72 says.)"}, {"t": "ctx", "l": " - Data you move, copy or keep stays the type it was. A cell holding the text `\"0012\"` or"}, {"t": "ctx", "l": "   `\"2021-03\"` must still hold that text afterwards \u2014 do not let pandas (or your own code) parse it"}, {"t": "hunk", "l": "@@ -66,4 +72,9 @@"}, {"t": "ctx", "l": " > your function also returns `3`, `2` for `D3`, `E3`. If it does not, your reading is wrong, not"}, {"t": "ctx", "l": " > the file."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The worked example can also be a separate, finished block inside `answer_position`. For example,"}, {"t": "add", "l": "+rows 3\u201312 hold the raw input and rows 17\u201326 already show the same items transformed. Make your"}, {"t": "add", "l": "+output look exactly like that block: which characters survive, and whether delimiters such as"}, {"t": "add", "l": "+parentheses are kept."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " **Existing formulas document the intended computation.** Load the workbook a second time without"}, {"t": "hunk", "l": "@@ -102,4 +113,9 @@"}, {"t": "ctx", "l": " (`datetime.date.today()`), unless the instruction or a cell names the date to use. If the"}, {"t": "ctx", "l": " workbook already has a `TODAY()`-based formula, its cached value shows which date was used."}, {"t": "add", "l": <script>
const DATA = JSON.parse(document.getElementById('run-data').textContent);
const G = DATA.graph, S = DATA.summary, DIFFS = DATA.diffs||{};
const $ = (t,a={},...k)=>{const e=document.createElement(t);for(const[p,v]of Object.entries(a)){
  if(p==='html')e.innerHTML=v;else if(p==='text')e.textContent=v;else e.setAttribute(p,v);}
  for(const c of k)if(c!=null)e.append(c);return e;};
const NS='http://www.w3.org/2000/svg';
const svg=(t,a={})=>{const e=document.createElementNS(NS,t);for(const[p,v]of Object.entries(a))e.setAttribute(p,v);return e;};
/* SVG text node WITH content. `el.append(node)` returns undefined, so the old
   `el.append(svg('text',...)).textContent = x` threw a TypeError on the very first axis
   label — which aborted the whole inline script and silently dropped every panel below
   the fitness chart (heatmap, lineage, cost, evaluations, candidates). */
const txt=(el,a,content)=>{const n=svg('text',a);n.textContent=content==null?'':String(content);el.append(n);return n;};
const fmt=v=>v==null?'—':(+v).toFixed(3);
function escN(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}
const main=document.getElementById('main'), tip=document.getElementById('tip');
const STATUS_META={running:['running','var(--accent)'],awaiting_agent:['awaiting agent','var(--idk)'],
  completed:['completed','var(--ok)'],budget_exhausted:['budget exhausted','var(--warn)'],
  stalled:['stalled','var(--warn)'],interrupted:['interrupted','var(--fail)'],failed:['failed','var(--bad)']};
document.getElementById('hdr').textContent =
  `${S.run_id} · ${S.algorithm||'algorithm not recorded'} · ${S.counts.total-1} candidates · ` +
  `${S.test_sealed?'test sealed':'test not sealed'}`;
function showTip(e,txt){tip.textContent=txt;tip.style.display='block';
  tip.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.style.display='none';}
function sec(title){const s=$('section');s.append($('h2',{text:title}));main.append(s);return s;}
function dsecs(v){v=Math.max(0,Math.round(v||0));if(v<60)return v+'s';
  const m=Math.floor(v/60);if(m<60)return m+'m '+(v%60)+'s';return Math.floor(m/60)+'h '+(m%60)+'m';}

/* ---------- 1. KPI strip ---------- */
(function(){
  const s=sec('Summary'); const g=$('div',{class:'kpis'});
  const dpct=S.delta_pct!=null?`${S.delta_pct>0?'+':''}${S.delta_pct}%`:
            (S.delta_abs!=null?`${S.delta_abs>0?'+':''}${S.delta_abs.toFixed(3)}`:'—');
  const kp=(l,v,cls='',s2='')=>{const k=$('div',{class:'kpi'});k.append($('div',{class:'l',text:l}),
    $('div',{class:'v '+cls,text:v}));if(s2)k.append($('div',{class:'s',text:s2}));return k;};
  const c=S.counts, cost=S.cost;
  g.append(
    kp('best val',fmt(S.best_val),'champ',S.best_id),
    kp('baseline',fmt(S.baseline_val)),
    kp('Δ vs baseline',dpct,(S.delta_abs>0?'ok':'')),
    kp('held-out test',fmt(S.test_reward),'',
       // The raw sealed score alone is not the result — the DELTA against the seed's own test
       // score is, and both were already in final.json. A run can lift val and lose test.
       (S.test_delta!=null||S.test_baseline_reward!=null)
         ?((S.test_delta!=null?(S.test_delta>0?'+':'')+S.test_delta.toFixed(3)+' vs seed ':'')+
           (S.test_baseline_reward!=null?fmt(S.test_baseline_reward):'')+
           (S.test_sealed?' · sealed once':''))
         :(S.test_sealed?'sealed once':'not finalized')),
    kp('candidates',c.total-(c.seed||0),'',
       `${c.accepted} accept · ${c.rejected} reject · ${c.indecisive||0} indecisive · ${c.failed} no-measure`),
    kp('frontier',S.frontier,'','gated leaves with no accepted child'),
    kp('wall clock',`${S.wall_clock_seconds}s`,'',`opt ${S.optimizer_seconds}s · run ${S.runner_seconds}s`),
    kp('cost',`$${cost.total_usd.toFixed(4)}`,'',`opt $${cost.optimizer_usd.toFixed(4)} · run $${cost.runner_usd.toFixed(4)}`),
    // Token count without its split reads as implausible next to the dollar figure (a real run:
    // 206M tokens for $4.80). The split explains it: nearly all of them are RUNNER tokens on a
    // self-hosted endpoint that bills $0, and the dollars are the optimizer's.
    kp('tokens',S.tokens.toLocaleString(),'',S.tokens_by_role?
       `run ${S.tokens_by_role.runner.toLocaleString()} · opt ${S.tokens_by_role.optimizer.toLocaleString()}`:''),
    kp('unattributed $',
       S.cost_ledger?`$${S.cost_ledger.unattributed_usd.toFixed(4)}`:'—',
       (S.cost_ledger&&Math.abs(S.cost_ledger.unattributed_usd)>0.0005?'champ':''),
       'recorded spend the events cannot explain'),
    kp('events',S.event_count!=null?S.event_count:'—','','every line in events.jsonl')
  );
  s.append(g);
})();

/* ---------- 1b. Run status + split honesty ---------- */
(function(){
  const s=sec('Run status');
  const meta=STATUS_META[S.status]||['unknown','var(--muted)'];
  const head=$('div',{style:'display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px'});
  const pill=$('span',{class:'pill',style:`color:${meta[1]};border-color:${meta[1]}66`});
  pill.append($('span',{style:`width:8px;height:8px;border-radius:50%;background:${meta[1]}`}),
              $('span',{text:meta[0]}));
  head.append(pill);
  if(S.algorithm)head.append($('span',{class:'pill',style:'color:var(--accent);border-color:#7c5cff66',
    text:S.algorithm+(S.algorithm_source?' · from '+S.algorithm_source:'')}));
  head.append($('span',{class:'pill',text:S.test_sealed?'test sealed':'test not sealed'}));
  if(S.elapsed_seconds!=null)head.append($('span',{class:'muted num',text:dsecs(S.elapsed_seconds)+(S.elapsed_open?' elapsed so far':' elapsed')}));
  s.append(head);
  if(S.status_reason)s.append($('p',{class:'muted',style:'margin:0 0 10px',text:S.status_reason}));
  const sp=S.splits;
  if(sp&&sp.no_holdout){
    s.append($('div',{class:'banner',html:'<b>No holdout.</b> train, val and test hold the same tasks, so the '+
      '&ldquo;test&rdquo; number is NOT a generalization estimate &mdash; the optimizer saw those tasks. '+
      'Read it as a sanity check only.'}));
  }
  if(sp&&sp.warning)s.append($('div',{class:'banner',text:sp.warning}));
  // Background-task mass-kill (PR #558): 2+ backgrounded Bash calls the harness evicted
  // at the identical millisecond — a compliance WARNING distinct from an outcome, so it
  // gets the 'bad' banner treatment (No holdout above uses the same class).
  (S.background_mass_kills||[]).forEach(mk=>{
    s.append($('div',{class:'banner bad',html:
      `<b>Background task mass-kill.</b> ${mk.count} background tasks were evicted at the `+
      `identical timestamp <code>${mk.timestamp}</code> — the harness's concurrent-`+
      `background-task ceiling, not ${mk.count} tasks coincidentally finishing at once. `+
      `Task ids: ${(mk.task_ids||[]).join(', ')}.`}));
  });
  if(sp)s.append($('p',{class:'muted num',style:'margin:10px 0 0',
    text:`splits · train ${sp.train??'—'} · val ${sp.val??'—'} · test ${sp.test??'—'}`+
         (sp.seed!=null?` · seed ${sp.seed}`:'')+
         '   —   val decides selection; test is scored exactly once and never optimized against.'}));
})();

/* ---------- 1c. Phases timeline ---------- */
(function(){
  const c=S.counts, total=c.total, evaluated=c.accepted+c.rejected;
  const hasBase=S.baseline_val!=null, finalized=(S.test_reward!=null)||S.test_sealed;
  const D=b=>b?'done':'pending';
  const phases=[
    {nm:'Intake',st:D(total>0||hasBase),d:'Interview + scaffold project, adapter, seed.'},
    {nm:'Implement & check',st:D(total>0||hasBase),d:'Hard gate before any budget is spent.'},
    {nm:'Baseline',st:D(hasBase),d:`Freeze splits; seed val ${fmt(S.baseline_val)}.`},
    {nm:'Optimize'+(S.algorithm?' · '+S.algorithm:''),st:finalized?'done':(hasBase?'active':'pending'),
     d:`${evaluated} iters · ${c.accepted} accepted · best ${fmt(S.best_val)}.`},
    {nm:'Finalize',st:D(finalized),d:`Sealed test ${fmt(S.test_reward)}.`},
    {nm:'Report',st:D(finalized),d:'This dashboard.'},
  ];
  const s=sec('Pipeline phases'); const g=$('div',{class:'phases'});
  for(const p of phases){const e=$('div',{class:'phase '+p.st});
    e.append($('div',{class:'nm',text:p.nm}),$('div',{class:'st',text:p.st}),$('div',{class:'d',text:p.d}));
    g.append(e);}
  s.append(g);
})();

/* ---------- 1d. Rejected edits, deduplicated by reason ---------- */
(function(){
  const norm=r=>(r||'rejected').replace(/-?\d+\.\d+/g,'N').replace(/-?\d+/g,'N').trim();
  const map=new Map();
  for(const n of G.nodes){ if(n.status!=='rejected')continue;
    const k=norm(n.reason); const cur=map.get(k)||{reason:k,count:0,ex:[]};
    cur.count++; if(cur.ex.length<3)cur.ex.push(n.id); map.set(k,cur);}
  const ends=[...map.values()].sort((a,b)=>b.count-a.count);
  if(!ends.length)return;
  const s=sec('Rejected edits, grouped by the gate reason');
  for(const d of ends){const e=$('div',{class:'dead'});
    if(d.count>1)e.append($('span',{class:'x',text:'×'+d.count}));
    e.append($('div',{class:'muted',text:d.ex.join(', ')}),$('div',{text:d.reason}));
    s.append(e);}
})();

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

/* ---------- 3. tasks × iterations pass/fail heatmap ---------- */
(function(){
  const tasks=S.tasks||[];
  const iters=G.nodes.filter(n=>Object.keys(n.per_task||{}).length).sort((a,b)=>a.iteration-b.iteration);
  if(!tasks.length||iters.length<1)return;
  const s=sec('Per-task pass/fail across iterations');
  // sort rows worst-first by mean reward
  const meanFor=t=>{let sum=0,n=0;iters.forEach(it=>{if(it.per_task[t]!=null){sum+=it.per_task[t];n++;}});return n?sum/n:0;};
  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));
  const cw=Math.max(10,Math.min(26,Math.floor(1000/iters.length))),ch=16,labW=120;
  const W=labW+iters.length*cw+10,H=rows.length*ch+24;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'heat'});
  iters.forEach((it,j)=>txt(el,{x:labW+j*cw+cw/2,y:12,'text-anchor':'middle'},it.iteration));
  rows.forEach((t,i)=>{
    txt(el,{x:labW-6,y:24+i*ch+11,'text-anchor':'end'},t.length>16?t.slice(0,15)+'…':t);
    iters.forEach((it,j)=>{
      const v=it.per_task[t];
      const col=v==null?'var(--card3)':v>=0.999?'var(--ok)':v<=0.001?'var(--bad)':'var(--warn)';
      const rect=svg('rect',{x:labW+j*cw,y:24+i*ch,width:cw-1.5,height:ch-1.5,rx:2,fill:col});
      const fb=(it.feedback&&it.feedback[t])||'';

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();
