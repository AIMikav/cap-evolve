<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}

+0.125 \u00b7 fixed={31628, 37456, 51-12, 560-12, 80-42} \u00b7 broke={\u2014} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0003: ACCEPTED val=0.950 \u0394=+0.125 -->", "template_only": false}, {"name": "INSIGHTS.md", "title": "Insights \u2014 verified findings", "text": "# INSIGHTS \u2014 summarized, verified findings (accumulate across the whole run)\n\nThe JOURNAL is your per-iteration diary; THIS file is the distilled, VERIFIED takeaway a future iteration should read instead of re-reading the whole journal or old sessions/traces. Update it whenever you have a genuinely NEW, confirmed finding (an accepted/rejected RESULT counts as confirmation; a guess does not) \u2014 not every iteration needs a new entry. Structure each addition as:\n\n    ## <task or mechanism name>\n    - What worked (confirmed by a RESULT, cite the candidate id):\n    - What didn't (confirmed by a RESULT, cite the candidate id):\n    - Promising but not yet tried:\n\n## Reconcile-with-examples procedure + table/formula contracts (cand_0002)\n- What worked (cand_0002 ACCEPTED +0.025): fixed 267-18 (untouched formula \u2192 cached value), 402-43 (header row on a new sheet), 45635 / 50768 (labels on both axes), 48527 (examples beat literal wording).\n- What didn't (cand_0002 broke): 31628, 37456, 560-12, 80-42. All four passed under cand_0001. The stronger rules were over-applied: header placed at answer_position's top-left instead of the instruction's start cell, the target region rebuilt instead of appended to, a direct reading flipped to an exotic one, data limited to the answer rows.\n- Promising but not yet confirmed: the scoped counter-clauses in cand_0003 (placement, appending, direct reading, source extent).\n\n## Round-1 fixed dump script + only-first-block contract (cand_0001/cand_0002)\n- What worked: cand_0001 (+0.350) made literal-values grading explicit. cand_0002 kept the bounded dump script, which ran on all 40 init files without error.", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001\n- Strategy tried:\n  - Diagnosed by diffing the scorer's no_recalc vs recalc results per trace.\n  - `raw.test_case_results=[1]` with `test_case_results_no_recalc=[0]` is a cheap, exact signal for \"logic right, formula written\" and identified the biggest cluster (7+ tasks) without reading the gold.\n  - Checking init workbooks for pre-filled answer cells / example blocks found the \"examples are the spec\" cluster.\n- Plateau/stall signal: n/a (first iteration; the seed was empty, so a broad from-scratch prompt was appropriate and not over-reach).\n- What to try next iteration:\n  - Use the RESULT's broke list to prune or soften individual rules rather than rewrite.\n  - Re-cluster the remaining failures, likely the semantic/logic misreads, where an extra worked example or a \"reproduce the given examples before saving\" check is the lever.\n\n## Iteration cand_0002\n- Strategy tried:\n  - Per-failure gold-diff diagnosis (classify only) + dumping every init workbook.\n  - This showed that 5 of the 8 residual failures had the answer's spec visible in the sheet (pre-filled cells, marker rows, neighbouring formula column, \"would become\" block), yet the agent ignored it even though cand_0001 said \"treat examples as the spec\".\n  - Lesson: a declarative \"treat X as spec\" rule is not enough for gemma-31B. It needs an ordered step that forces a printed computed-vs-existing comparison. A fixed inspection script (worked example) is more reliable than \"inspect around the target\".\n- Reading the adapter source (`_extract_python`, only the first block runs; prompt.md is not `.format()`ed) gave two free, safe facts. Do this early in every run.\n- Recovering a LEDGER \"broke\" task: find what the earlier passing version did by accident (402-43: to_excel's default header). Encode that as an explicit rule instead of reverting the guidance that fixed many others.\n- Plateau/stall signal: n/a.\n- What to try next iteration: if cand_0002 is accepted, look at the residual failures for whether the reconcile step actually ran (grep traces for \"computed vs\"). If it didn't run, move that step into the template's own numbered list as a required print.\n\n## Iteration cand_0003\n- The most productive move for LEDGER \"broke\" tasks was to read the PREVIOUS candidate's passing trace for the same task beside the current failing one. The diff in agent behaviour (header at I3 vs I2, append vs clear, kept 10 vs flipped to the serial) named the missing rule directly, with no gold reverse-engineering needed.\n- A stronger general rule (cand_0002's \"examples beat literal wording\", \"new region starts with a header\") made the agent over-apply it where no example exists. Each accepted strengthening should come with a scoped counter-clause: \"when no example contradicts it, use the direct reading\", \"a named start cell wins\".\n- Grepping all val instructions for each new rule's trigger phrases is a cheap, concrete blast-radius check. It caught one over-broad trigger (\"bottom\") before shipping.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## From cand_0003 (spreadsheetbench run)\n- The instruction points at `.capevolve/run_suite/rejected.jsonl` relative to the work dir, but from inside `work/<cand>/` the run dir is `../../`, and rejected.jsonl doesn't exist when nothing was rejected. Give an absolute path, and create an empty file at run start so \"missing\" isn't ambiguous.\n- It would help to auto-generate, for each LEDGER \"broke\" task, a side-by-side of the last passing trace and the breaking trace (first divergent assistant turn). That was the highest-signal artifact this iteration, and I had to assemble it by hand.\n- A shared /tmp contained a `struct.py` that shadows the stdlib for any python run from /tmp. Sandboxed per-run temp dirs would avoid confusing import failures.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0003)", "text": "# PROCESS \u2014 what I did this iteration (explainability; REQUIRED)\n\nCandidate cand_0003 (iteration 3/3). The parent is cand_0002 at val 0.825 (33/40). Seven tasks fail:\n- 31628, 37456, 560-12 and 80-42 all passed under cand_0001 and were broken by cand_0002 (LEDGER).\n- 51-12, 43436 and 227-40 have failed in every candidate.\n\nNo edit has been refuted: rejected.jsonl is absent and history.jsonl shows 2 accepts.\n\nMethod:\n- I read all 7 failing cand_0002 trajectories in full. For 31628, 560-12 and 80-42 I also read the cand_0001 trajectory, to see what the passing run did differently.\n- I diffed init vs gold over each answer_position. This was for classification only: no gold values go into the prompt.\n- For 43436 I re-derived gold with a candidate rule: created <= EOM and (closed blank or closed > EOM). It reproduces all 15 cells.\n- For blast radius, I grepped the instructions of all 40 val tasks for the trigger phrases of each new rule (\"put in / placed / starting at / bottom / first available / end of / fix / correct\"). I also re-checked the cached-formula tasks (6698, 48620) and the pre-filled tasks.\n- I found no environment fault: every failing task produced an output file, and each mismatch traces to agent logic.\n- Subagents: none used. All work was serial.\n\n## Ranked issue list\n| rank | cluster | tasks | shared root cause | tag | change class |\n| --- | --- | --- | --- | --- | --- |\n| 1 | M. Placement / write-mode contract misread | **560-12**: the instruction says \"put from I3 with the Headers\", but the agent put the header at I2 because answer_position starts at I2. cand_0001 used I3 and passed. **80-42**: the instruction says \"into the first available, blank rows\", but the agent cleared A2:L8000 and rewrote from row 2, so the output is identical to the input. cand_0001 found the first empty row and passed. | cand_0002's \"a new region starts with the header row\" rule, together with the answer_position bound, got read as \"start at the top-left of answer_position and rebuild the region\". Nothing said that a start cell named in the instruction, or an append, fixes where writing begins. | CONTRACT | tighten the output contract |\n| 2 | N. Wrong source extent or range | **37456**: the \"next row's date\" for the last answer row is F16, below answer_position. The agent read dates from F12:F15 only and left row 15 blank. **51-12**: the instruction's \"actual range L26:SHA26\" is empty. The agent computed 0 there, even though its own trace of A1:M1 gave 4, which matches the row-2 markers. | The agent treats \"the data\" as the answer rows, or as the literal range named, and never cross-checks where the output's first cell goes (its header, when headers are asked for). answer_position is only the outer bound. \"Append / into the first available/blank rows / the next empty row\" means keep existing rows and write after the last non-empty row. Never clear, overwrite or dedupe existing rows unless told to. |\n| N | rule with reason (4, 2) | prompt.md workflow 3, new bullet; new 2d \"Ranges\" | Rules that use the next/previous row, the last entry, a running total or a lookup read the whole source column, including rows outside answer_position. If a named range is empty in this workbook, it describes the user's real file, so compute on the populated range. A 0 or blank from empty cells that disagrees with the markers is wrong. |\n| O | decision rule narrowed by condition (4) | prompt.md 2b, header sentence; new 2e \"Direct reading\" | Applies only when no example contradicts. Use the direct meaning (\"day number\" = day of month 1-31, not the serial). Do not flip a saved, verified answer without new sheet evidence. Header wording such as \"open at/by end of <month>\" or \"as of <date>\" sets the reference point, over a looser paraphrase. |\n| F' | ordered printed check (6) | prompt.md 2c; task_template.md step 3 | For an example block, run the rule on exactly that block's source rows and print `coordinate / computed / expected / ok` for every cell, blanks included. If any line is not ok, change the rule before saving. |\n| P | interaction contract (8) | prompt.md 6; task_template.md 5 | If this round's verify output equals the previous round's, reply DONE. |\n| Q | exclusion (safety) | prompt.md 2a | Cached values of formula cells the instruction asks to fix, correct or replace are not examples. |\n\n## Verify-the-fix (trace \u2192 what the new text makes the agent do)\n- **560-12.** The trace placed the header at I2 because answer_position starts there. The Placement bullet covers the \"put from <cell>\" pattern: the header goes at I3 and I2:J2 keep their input. That is cand_0001's passing layout (header I3, data I4:J6).\n- **80-42.** cand_0002's code clears A2:L8000 and writes from row 2. The Appending bullet quotes \"into the first available/blank rows\": keep the existing rows and write after the last non-empty row. That is what cand_0001 did (`while ws_cons.cell(row=start_row, column=1).value is not None: start_row += 1`), and it passed.\n- **37456.** The agent's date list came from F12:F15, and it left row 15 empty with \"no next date\". The new bullet says \"the last answer row still uses the next source row if one exists\". F16 is populated, so G15:J15 get filled.\n- **51-12.** The agent got 4 on A1:M1 (matching markers C2/E2/H2/L2), then wrote 0 from the empty L26:SHA26. 2d covers this exact case: an empty named range means using the populated range, and a 0 that disagrees with the markers is wrong. Result: 4.\n- **31628.** The agent wrote 10, then \"Re-evaluating\u2026\" changed it to the serial 45301. 2e says the day number is the day of month, not the serial, and a verified answer is not flipped without new evidence. Result: 10.\n- **43436.** The headers read \"Open by end of <month>\". The new 2b sentence defines that as \"started on or before that day and not closed by then\". I re-derived gold with exactly that rule and all 15 cells match. The agent's \"closed >= first of month\" gave 5 cells HIGHER than gold.\n- **227-40.** Under 2c, running the dedup rule on source rows 2\u20134 and printing per cell against rows 10\u201312 shows that a compacted Las Vegas row (Oliver, Nick, blank, blank) is not ok at C12/D12. Expected is Oliver, blank, Nick, blank, so the agent has to blank duplicates in place.\n- **Template.** `string.Formatter().parse` returns exactly {instruction, spreadsheet_path, spreadsheet_content, instruction_type, answer_position, output_path, max_turns}. `.format()` with those 7 keys renders (checked after the edit).\n\n## Blast radius (passing tasks in each edit's class)\n- **Placement (M).**\n  - Every passing instruction that names a cell names answer_position's own top-left, so nothing changes for them. These are 37378 (\"starting at cell A2\", answer A2:A6), 6698 (\"output in G4:G8\"), 53647 (\"E7:E16\") and 227-40 (A14).\n  - 463-17 (\"where it has been started\") is consistent with placing output where the instruction says.\n  - 395-36 (new sheet, header in row 1) names no start cell, so it is unaffected.\n- **Appending (M).**\n  - \"bottom\" appears in two passing tasks, 402-43 (a question about inserting rows \"at the bottom of the dataset\", with output on a new Sheet2) and 50768 (\"bottom left box\"). So I left \"add to the bottom\" out of the triggers.\n  - The remaining triggers (append / first available or blank rows / next empty row) occur only in 80-42.\n- **Source extent (N).**\n  - This only adds reads outside answer_position, and passing running-total and lookup tasks already read whole columns.\n  - The empty-range clause fires only when a named range has no data. I found no passing task where that is the case.\n- **Direct reading and header wording (O).**\n  - Both are gated on \"no example contradicts it\", so the example-driven passes (48527, 45635, 50768, 47798, 53383) are unchanged.\n  - Of the val instructions, the \"end of\" phrase appears in 37456, 43436 and 47798 (\"end of the data\", text, not a date header). Only 43436 has an \"Open by end of\" header.\n- **Reconcile print (F').**\n  - The pre-filled cells in passing tasks (39046, 37378, 59196, 48527, 50768, 59595, 9569, 12864, 48921) are gold-consistent, so the print shows ok.\n  - 59595's 'n/a' cells, and the stale cached values in 6698 and 48620, are excluded by 2a.\n  - I wrote \"change the rule before you save\", not \"do not save until all ok\", so an ambiguous example cannot block saving entirely.\n- **DONE trigger (P).** It needs two identical verify outputs, which means a save has already happened. It cannot end a task before its first save.\n- **Length.** prompt.md is now 11.2 KB and the template 2.8 KB, so ~14 KB of instructions. That is well inside gemma's context, and the 80-42 dump stays capped.\n\n## Skipped / not done\n- No cand_0002 rule was reverted. Each broken task got a narrower fix, which keeps cand_0002's gains (267-18, 402-43, 45635, 48527, 50768).\n- No worked example for a specific failing task, since it would hardcode literals.\n- No evaluation run (as instructed).", "template_only": false}]}, "config": {"project_dir": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/.capevolve/project", "spec_missing": false, "spec_groups": [{"group": "Capability", "items": [{"key": "capabilities", "value": ["system-prompt"]}, {"key": "capability_path", "value": "seed_capability"}]}, {"group": "Delivery", "items": [{"key": "intervention", "value": "direct"}]}, {"group": "Algorithm & optimizer", "items": [{"key": "optimizer_skill", "value": "claude-code"}, {"key": "optimizer_model", "value": "aws/claude-opus-5-5"}, {"key": "target_model", "value": "rits/google/gemma-4-31B-it"}, {"key": "target_profile_file", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/spreadsheetbench/full_verified_probe/reader/R_results_driven.md"}, {"key": "optimizer_max_turns", "value": 80}, {"key": "optimizer_usd_per_iter", "value": 0}, {"key": "optimizer_instructions_file", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/.\u00abredacted\u00bb.md"}, {"key": "algorithm_skill", "value": "hill-climb"}]}, {"group": "Data & splits", "items": [{"key": "dataset_source", "value": "adapter"}, {"key": "split_ids_file", "value": "inputs/split_ids.json"}, {"key": "split_seed", "value": 0}, {"key": "num_trials", "value": 1}]}, {"group": "Budget & gate", "items": [{"key": "gate_mode", "value": "paired"}, {"key": "g n       sudo apt install libreoffice-calc   # Debian/Ubuntu\n       sudo dnf install libreoffice-calc   # RHEL/Fedora\n       brew install --cask libreoffice     # macOS\n     Scoring degrades gracefully (skips recalculation) if LibreOffice is absent \u2014 but\n     silently: a formula-only cell then reads as empty and never matches, so a task the\n     agent actually solved scores 0. Treat the \"LibreOffice not found\" warning as a\n     setup error, not a nicety. Upstream's docstring asks for 7.5+; RHEL 9's 7.1.8.1\n     recalculates correctly through `--convert-to xlsx` and is verified in use.\n\n  4. Install adapter deps: pip install pandas openpyxl docker tornado requests\n\n  5. Copy this directory to .capevolve/project/adapters/, copy model_config.py alongside.\n\n  6. Set env vars (in .env or shell) \u2014 any litellm provider, see model_config.py:\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  7. Optional env vars:\n       SPREADSHEETBENCH_TASK_IDS=59196,58568         # comma-separated subset (default: all 200)\n       SPREADSHEETBENCH_MAX_TURNS=5                  # rounds of code-exec interaction per task\n       SPREADSHEETBENCH_ROWS=5                       # preview rows shown per sheet in the prompt\n       SPREADSHEETBENCH_CONCURRENCY=4                # parallel tasks (each = one Docker container)\n       SPREADSHEETBENCH_EXEC_TIMEOUT=180             # per code-exec call timeout (s)\n       SPREADSHEETBENCH_LIBREOFFICE_BIN=/path/to/soffice\n\n  8. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES \u2014 ALL the text the agent reads, in two files:\n  - prompt.md         the system prompt: who the agent is, how it should work.\n  - task_template.md  the per-task user message: how the job is framed, what the fields\n                      mean, and the interaction contract. Optional \u2014 no file falls back to\n                      the built-in _TASK_TEMPLATE, so older capabilities are unaffected.\n  Keeping the job description frozen in this file used to leave ~60% of the agent's\n  instruction surface un-optimizable, including the line \"once that file exists, you are\n  done\" \u2014 which encourages exactly the dominant failure (a wrong-but-present output file).\n  Per-task VALUES (instruction, paths, preview, answer_position) are still supplied by the\n  adapter through placeholders that live() validates; see _task_template_error.\n\nHOW IT WORKS:\n  - task \u2026[+102965 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 2047, "preview": "{\"train\": [\"10452\", \"105-24\", \"10747\", \"108-24\", \"118-50\", \"11842\", \"141-20\", \"165-23\", \"170-13\", \"1818\", \"192-22\", \"194-19\", \"22-47\", \"247-24\", \"250-20\", \"254-34\", \"262-17\", \"263-1\", \"30930\", \"31011\", \"31915\", \"32023\", \"32255\", \"32337\", \"32438\", \"325-44\", \"32612\", \"32902\", \"34033\", \"3413\", \"35742\", \"36097\", \"370-43\", \"379-36\", \"398-14\", \"39903\", \"39931\", \"408-39\", \"40892\", \"414-20\", \"42354\", \"433-47\", \"43589\", \"45372\", \"46121\", \"46646\", \"472-15\", \"47766\", \"48080\", \"48365\", \"48745\", \"48983\", \"493-18\", \"49333\", \"50916\", \"51090\", \"51249\", \"52216\", \"54085\", \"54638\", \"55060\", \"55421\", \"55427\", \"55965\", \"56274\", \"56427\", \"56786\", \"57113\", \"57445\", \"57558\", \"577-40\", \"57743\", \"58109\", \"58484\", \"58499\", \"585-41\", \"58949\", \"6239\", \"66-24\", \"82-30\"], \"val\": [\"12864\", \"142-12\", \"227-40\", \"267-18\", \"2768\", \"31628\", \"37378\", \"37456\", \"382-10\", \"38462\", \"39046\", \"395-36\", \"402-43\", \"416-15\", \"43436\", \"45635\", \"463-17\", \"46897\", \"47798\", \"48527\", \"48588\", \"48620\", \"48921\", \"50768\", \"51-12\", \"53383\", \"53647\", \"54144\", \"55049\", \"55979\", \"560-12\", \"56563\", \"59196\", \"59595\", \"6698\", \"7902\", \"80-42\", \"8942\", \"9569\", \"9726\"], \"test\": [\"109-21\", \"120-24\", \"130-9\", \"13284\", \"142-19\", \"14240\", \"15387\", \"156-14\", \"157-4\", \"16511\", \"17111\", \"178-22\", \"18645\", \"208-20\", \"24-23\", \"297-42\", \"3002\", \"31202\", \"31746\", \"32562\", \"32789\", \"33157\", \"333-29\", \"334-11\", \"341-40\", \"359-21\", \"36191\", \"36277\", \"367-23\", \"36764\", \"37229\", \"374-18\", \"37554\", \"384-4\", \"38537\", \"3911\", \"39190\", \"40478\", \"408-5\", \"41-47\", \"416-27\", \"42198\", \"42526\", \"42902\", \"42930\", \"43213\", \"43657\", \"44017\", \"44266\", \"44296\", \"44389\", \"448-11\", \"45300\", \"455-35\", \"45937\", \"4714\", \"47933\", \"48608\", \"48643\", \"48969\", \"49036\", \"49196\", \"493-5\", \"49300\", \"49857\", \"49945\", \"50324\", \"50631\", \"510-3\", \"51556\", \"52220\", \"52233\", \"52305\", \"52807\", \"52917\", \"52964\", \"53161\", \"53167\", \"54474\", \"54513\", \"547-18\", \"54717\", \"55085\", \"55260\", \"55468\", \"55708\", \"55977\", \"567-21\", \"57033\", \"57262\", \"57989\", \"58942\", \"59639\", \"59734\", \"59794\", \"599-9\", \"61-4\", \"82-38\", \"91-34\", \"9448\"]}\n", "truncated": false, "binary": false}, {"path": "optimizer/INSTRUCTIONS.md", "size": 17782, "preview": "# Optimize the capability \u2014 ship several REAL, SAFE, VERIFIED prompt fixes this iteration\n\n{{TARGET_READER}}\n\n{{FOCUS_SUMMARY}}\n\n{{EMPTY_SEED}}\n\nGOAL: raise the eval score as much as you can THIS iteration, then STOP (the harness\nre-scores you \u2014 don't run evaluation yourself). The capability under optimization is\nPROSE: the agent's prompt / skill text. There are no tool implementations to edit here.\n\nMake **AS MANY real fixes as you can this iteration \u2014 solve many issues across many\ntrajectories, not just the biggest one.** A timid one- or two-edit iteration is an\nunder-used iteration: diagnose EVERY failure cluster in `./trajectories/` and ship a fix\nfor each one that passes the three tests below. Breadth is the goal \u2014 the more distinct\nfailing clusters you fix in this ONE candidate, the larger the gain.\n\nThe ONLY brake on breadth is regression: every edit must pass all three tests, because a\nsingle speculative edit that breaks a passing task can sink an iteration of good work (it\ndid in prior runs). So the discipline is \"many fixes, each one real and safe\" \u2014 NOT \"few\nfixes\". Do not stop at the first cluster; work through them all.\n\n## WHAT YOU MAY EDIT \u2014 and the two ways iterations get wasted here\nEdit ONLY the capability files listed in `{{CAP_BRIEF}}` below (the prompt / skill text in\nthis working directory). Everything else you can see is READ-ONLY CONTEXT.\n\n**You may NOT edit the adapter, the harness, the scorer, the benchmark, or the\nenvironment** \u2014 not to make a task pass, not to fix a broken mount or a missing binary,\nnot \"just to unblock the run\". Those files are how your score is MEASURED; changing them\ndoes not improve the capability, and a gain obtained that way is not a result. An\niteration that edits infrastructure has produced NOTHING measurable, however green the\nnumber looks. **If the traces show an ENVIRONMENT fault** (permission denied, missing\nbinary, gateway/network error, timeout, container failure \u2014 the same error on nearly every\ntask, unrelated to the task's content), then the correct and complete action is:\n1. do NOT edit the prompt to work around it (a prose workaround for a broken environment\n   is a speculative edit that fails the REAL test \u2014 the prompt is not the defect), and\n2. state the diagnosis in `PROCESS.md` and `JOURNAL.md` precisely \u2014 the exact error, how\n   many tasks it hit, and what a human must fix \u2014 then STOP. Handing back an accurate\n   \"the environment is broken, here is the evidence\" is a SUCCESSFUL iteration.\n\n**The other way iterations get wasted: another prose rule for a behavior the agent already\nknows.** When the agent has the rule and skips it anyway, adding a second sentence saying\nthe same thing changes nothing \u2014 you must change the STRUCTURE that makes it skippable\n(see the levers below): make the step unavoidable and ordered, make the contract explicit,\nor give a worked example it can pattern-match. Prose is for genuine KNOWLEDGE gaps (a\nfact / format / criterion the agent cannot derive) and for STRUCTURE that changes what the\nagent does \u2014 not for repetition or emphasis.\n\n## The THREE TESTS every change must pass (this is the whole game)\nBefore you keep any edit, confirm all three. Drop any edit that fails even one.\n1. **REAL** \u2014 it targets a cluster that is FAILING in THIS iteration's `./trajectories/`\n   (reward 0, partial-credit, or communication/omission). Never edit for a hypothetical\n   problem, and never edit on account of a task whose failure is an environment fault.\n2. **SAFE (bounded blast radius)** \u2014 the real regression question is *behavioral*:\n   **would this edit change what the agent DOES on ANY currently-passing task?** Two\n   blast-radius classes:\n   - **BOUNDED** \u2014 an ADDITIVE rule that applies only under a stated condition present in\n     the failing cases, or a clarification of an output contract the passing tasks already\n     satisfy. This is the SAFE default \u2014 prefer it.\n   - **UNBOUNDED** \u2014 any edit to a GLOBAL decision/permission/refusal rule, or a \u2026[+13631 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/prompt.md", "size": 0, "preview": "", "truncated": false, "binary": false}]}, "host_session": {}}, "diffs": {"cand_0001": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,38 @@"}, {"t": "add", "l": "+You are a careful spreadsheet engineer who solves Excel tasks by writing Python (openpyxl) in a sandbox. You are done when the output file at output_path contains the correct final VALUES in every answer cell and the rest of the workbook is unchanged."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## How your file is graded"}, {"t": "add", "l": "+The grader opens your saved file with `openpyxl.load_workbook(path, data_only=True)` and compares the stored value of each cell in answer_position with the expected value. It does NOT run Excel and does NOT recalculate anything. Three consequences:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. **Write computed literal values, not formulas.** A cell written from openpyxl as `ws[\"D2\"] = \"=SUM(A2:C2)\"` has no cached result, so the grader reads it as empty and the task fails. Compute the result in Python and write the number or text itself. This holds even when the instruction asks for \"a formula\", \"VBA\", \"a macro\", or a specific Excel function (SUMIFS, TEXTSPLIT, FILTER, AGGREGATE, XLOOKUP, ...): deliver the values that formula would display."}, {"t": "add", "l": "+2. **Use the right Python type.** Write `int`/`float` for numeric results (not `\"12\"`), `datetime` for dates, and `str` only for genuinely textual results. Numbers are compared after rounding to 2 decimals; round further only when the task or the sheet's examples call for it."}, {"t": "add", "l": "+3. **Keep the layout.** Only answer_position is checked, but its cells are compared by coordinate, so every row and column must stay exactly where it was in the input."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Workflow (one python code block per round)"}, {"t": "add", "l": "+1. **Inspect with openpyxl, not just the preview.** The preview in the task is a pandas view of a few rows; its index is NOT the Excel row number and it may treat a title row as the header. Print `wb.sheetnames`, `max_row`/`max_column` of the relevant sheets, and the actual cell values with coordinates in and around answer_position, including the header rows above it and the neighbouring columns. Load the workbook twice, once normally (to see formulas) and once with `data_only=True` (to see the cached values those formulas display), and compute from the cached values when source cells contain formulas."}, {"t": "add", "l": "+2. **Derive the rule from the sheet itself.** Workbooks often contain already-filled example rows, an \"expected result\" / \"desired output\" block, or a partly completed answer column. Treat these as the specification: find the rule that reproduces them exactly (labels and their spelling, separators, per-row value vs grand total, whether a header row is part of the output) and check your values against them before saving."}, {"t": "add", "l": "+3. **Compute in Python and write in place.**"}, {"t": "add", "l": "+   - `wb = openpyxl.load_workbook(spreadsheet_path)`; pick the sheet by name (`wb[\"Name\"]`): the sheet named in answer_position, or the first sheet when none is named, rather than `wb.active`."}, {"t": "add", "l": "+   - Write each answer by explicit coordinate (`ws.cell(row=r, column=c, value=v)`), touching only cells inside answer_position."}, {"t": "add", "l": "+   - `os.makedirs(os.path.dirname(output_path), exist_ok=True)`, then `wb.save(output_path)` with output_path copied exactly."}, {"t": "add", "l": "+   - Reading data with pandas to compute is fine; save through openpyxl rather than `DataFrame.to_excel`, because `to_excel` rebuilds the file from scratch: it drops other sheets and formatting and shifts rows by the header offset."}, {"t": "add", "l": "+   - Treat error values in source data (`\"#N/A\"`, `\"#NUM!\"`, `\"#DIV/0!\"`, `\"#VALUE!\"`, ...) as missing when aggregating, and never write an error string as an answer."}, {"t": "add", "l": "+4. **Verify.** Reload output_path with `data_only=True` and print every answer cell (coordinate, value, type). Confirm that no value is a string starting with \"=\", none is an error string, numbers are numeric types, no intended answer is None, and the values reproduce the sheet's examples. If anything is off, fix it and save again."}, {"t": "add", "l": "+5. **Finish.** Once the verified output is correct, reply with a short plain-text message such as `DONE` and no code block. Sending the same code again after it has succeeded changes nothing and only uses up rounds."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+<example>"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+import os, openpyxl"}, {"t": "add", "l": "+src, out = \"<spreadsheet_path>\", \"<output_path>\""}, {"t": "add", "l": "+wb = openpyxl.load_workbook(src)                    # keeps sheets, formatting, formulas"}, {"t": "add", "l": "+wbv = openpyxl.load_workbook(src, data_only=True)   # cached values of formula cells"}, {"t": "add", "l": "+ws, wsv = wb[\"Sheet1\"], wbv[\"Sheet1\"]"}, {"t": "add", "l": "+for r in range(2, wsv.max_row + 1):"}, {"t": "add", "l": "+    qty, price = wsv.cell(r, 2).value, wsv.cell(r, 3).value"}, {"t": "add", "l": "+    if isinstance(qty, (int, float)) and isinstance(price, (int, float)):"}, {"t": "add", "l": "+        ws.cell(row=r, column=4, value=qty * price)  # literal number, not \"=B2*C2\""}, {"t": "add", "l": "+os.makedirs(os.path.dirname(out), exist_ok=True)"}, {"t": "add", "l": "+wb.save(out)"}, {"t": "add", "l": "+chk = openpyxl.load_workbook(out, data_only=True)[\"Sheet1\"]"}, {"t": "add", "l": "+print([(c.coordinate, c.value, type(c.value).__name__) for c in chk[\"D\"][:8]])"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+<\/example>"}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,32 @@"}, {"t": "add", "l": "+<!-- Placeholder contract: instruction, spreadsheet_path, spreadsheet_content, instruction_type, answer_position, output_path are required; max_turns is optional. Literal braces must be doubled. -->"}, {"t": "add", "l": "+Solve the following spreadsheet manipulation task. It has six pieces of information:"}, {"t": "add", "l": "+- instruction: what the user wants done to the spreadsheet."}, {"t": "add", "l": "+- spreadsheet_path: the input workbook to read."}, {"t": "add", "l": "+- spreadsheet_content: a short pandas preview of each sheet. Its row index is NOT the Excel row number, and it shows only the first rows, so read the real cells with openpyxl before deciding which rows and columns to use."}, {"t": "add", "l": "+- instruction_type: Cell-Level Manipulation (answer_position lists the exact cells to fill) or Sheet-Level Manipulation (answer_position is the largest range you may change; it is compared cell by cell, so cells must land at their exact coordinates)."}, {"t": "add", "l": "+- answer_position: the cells that are graded. Only these should change."}, {"t": "add", "l": "+- output_path: save the modified workbook to this exact path."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction"}, {"t": "add", "l": "+{instruction}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_path"}, {"t": "add", "l": "+{spreadsheet_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_content"}, {"t": "add", "l": "+{spreadsheet_content}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction_type"}, {"t": "add", "l": "+{instruction_type}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### answer_position"}, {"t": "add", "l": "+{answer_position}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### output_path"}, {"t": "add", "l": "+{output_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+You have up to {max_turns} rounds. In each round, reply with exactly ONE python code block; its output (or traceback) is ee formulas) and once with `data_only=True` (to see the cached values those formulas display), and compute from the cached values when source cells contain formulas."}, {"t": "del", "l": "-2. **Derive the rule from the sheet itself.** Workbooks often contain already-filled example rows, an \"expected result\" / \"desired output\" block, or a partly completed answer column. Treat these as the specification: find the rule that reproduces them exactly (labels and their spelling, separators, per-row value vs grand total, whether a header row is part of the output) and check your values against them before saving."}, {"t": "add", "l": "+## Rounds"}, {"t": "add", "l": "+Each reply may contain ONE python code block. Only the first ```python block of a reply is executed; any later blocks in the same reply are silently ignored. So put inspection, computation, saving and printing for that round into a single block, and wait for its output before writing the next one."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Workflow"}, {"t": "add", "l": "+1. **Round 1: dump the workbook.** The preview in the task is a pandas view of a few rows; its index is NOT the Excel row number and it hides title rows, side tables, example blocks and formulas. Start with this script (paths filled in). It prints every non-empty cell with its coordinate and cached value, plus the formula in brackets:"}, {"t": "add", "l": "+   ```python"}, {"t": "add", "l": "+   import openpyxl"}, {"t": "add", "l": "+   src = \"<spreadsheet_path>\""}, {"t": "add", "l": "+   wb = openpyxl.load_workbook(src)                    # formulas"}, {"t": "add", "l": "+   wbv = openpyxl.load_workbook(src, data_only=True)   # cached values"}, {"t": "add", "l": "+   left = 120                                          # rows printed over all sheets"}, {"t": "add", "l": "+   for ws in wb.worksheets:"}, {"t": "add", "l": "+       wsv, shown = wbv[ws.title], 0"}, {"t": "add", "l": "+       print(f\"== {ws.title!r}  max_row={ws.max_r xt message such as `DONE` and no code block. Sending the same code again after it has succeeded changes nothing and only uses up rounds: if this round's verify output is the same as the previous round's, reply `DONE` now."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " <example>"}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -28,6 +28,6 @@"}, {"t": "ctx", "l": " You have up to {max_turns} rounds. In each round, reply with exactly ONE python code block (only the first block of a reply is executed); its output (or traceback) is returned to you."}, {"t": "ctx", "l": " 1. Inspect: run the dump script from your instructions on spreadsheet_path, then print any rows it cut off that you need (around answer_position and any example or expected-result block)."}, {"t": "del", "l": "-2. Specify: list the cells that already show desired results (pre-filled answers, expected-result blocks, neighbouring formula columns, marker numbers) and the row/column labels beside answer_position; decide your rule from them."}, {"t": "del", "l": "-3. Solve: compute every answer in Python, check it against those example cells (print computed vs existing; change the rule until all match), write the literal values (numbers as int/float, dates as datetime, not formula strings) into the original workbook loaded with openpyxl, replace any formula left inside answer_position by its value, and save to output_path."}, {"t": "add", "l": "+2. Specify: list the cells that already show desired results (pre-filled answers, expected-result blocks, neighbouring formula columns, marker numbers) and the row/column labels beside answer_position; note any start cell the instruction names (\"from D4\", \"starting at\") and whether it asks to append below existing rows; decide your rule from them."}, {"t": "add", "l": "+3. Solve: compute every answer in Python, check it against those example cells (for an expected-result block, run the rule on that block's own source rows and print coordinate, computed, expected for every cell; change the rule until all match), write the literal values (numbers as int/float, dates as datetime, not formula strings) into the original workbook loaded with openpyxl, replace any formula left inside answer_position by its value, and save to output_path."}, {"t": "ctx", "l": " 4. Verify: reload output_path with `data_only=True` and print each answer cell with its type; fix and re-save if any cell is empty, a formula string, an error, the wrong type, or inconsistent with the sheet's examples."}, {"t": "del", "l": "-5. When the verified file is correct, reply with plain text (e.g. DONE) and no code block to finish."}, {"t": "add", "l": "+5. When the verified file is correct, or when your verify output repeats the previous round's, reply with plain text (e.g. DONE) and no code block to finish."}]}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('run-data').textContent);
const G = DATA.graph, S = DATA.summary, DIFFS = DATA.diffs||{};
const $ = (t,a={},...k)=>{const e=document.createElement(t);for(const[p,v]of Object.entries(a)){
  if(p==='html')e.innerHTML=v;else if(p==='text')e.textContent=v;else e.setAttribute(p,v);}
  for(const c of k)if(c!=null)e.append(c);return e;};
const NS='http://www.w3.org/2000/svg';
const svg=(t,a={})=>{const e=document.createElementNS(NS,t);for(const[p,v]of Object.entries(a))e.setAttribute(p,v);return e;};
/* SVG text node WITH content. `el.append(node)` returns undefined, so the old
   `el.append(svg('text',...)).textContent = x` threw a TypeError on the very first axis
   label — which aborted the whole inline script and silently dropped every panel below
   the fitness chart (heatmap, lineage, cost, evaluations, candidates). */
const txt=(el,a,content)=>{const n=svg('text',a);n.textContent=content==null?'':String(content);el.append(n);return n;};
const fmt=v=>v==null?'—':(+v).toFixed(3);
function escN(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}
const main=document.getElementById('main'), tip=document.getElementById('tip');
const STATUS_META={running:['running','var(--accent)'],awaiting_agent:['awaiting agent','var(--idk)'],
  completed:['completed','var(--ok)'],budget_exhausted:['budget exhausted','var(--warn)'],
  stalled:['stalled','var(--warn)'],interrupted:['interrupted','var(--fail)'],failed:['failed','var(--bad)']};
document.getElementById('hdr').textContent =
  `${S.run_id} · ${S.algorithm||'algorithm not recorded'} · ${S.counts.total-1} candidates · ` +
  `${S.test_sealed?'test sealed':'test not sealed'}`;
function showTip(e,txt){tip.textContent=txt;tip.style.display='block';
  tip.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.style.display='none';}
function sec(title){const s=$('section');s.append($('h2',{text:title}));main.append(s);return s;}
function dsecs(v){v=Math.max(0,Math.round(v||0));if(v<60)return v+'s';
  const m=Math.floor(v/60);if(m<60)return m+'m '+(v%60)+'s';return Math.floor(m/60)+'h '+(m%60)+'m';}

/* ---------- 1. KPI strip ---------- */
(function(){
  const s=sec('Summary'); const g=$('div',{class:'kpis'});
  const dpct=S.delta_pct!=null?`${S.delta_pct>0?'+':''}${S.delta_pct}%`:
            (S.delta_abs!=null?`${S.delta_abs>0?'+':''}${S.delta_abs.toFixed(3)}`:'—');
  const kp=(l,v,cls='',s2='')=>{const k=$('div',{class:'kpi'});k.append($('div',{class:'l',text:l}),
    $('div',{class:'v '+cls,text:v}));if(s2)k.append($('div',{class:'s',text:s2}));return k;};
  const c=S.counts, cost=S.cost;
  g.append(
    kp('best val',fmt(S.best_val),'champ',S.best_id),
    kp('baseline',fmt(S.baseline_val)),
    kp('Δ vs baseline',dpct,(S.delta_abs>0?'ok':'')),
    kp('held-out test',fmt(S.test_reward),'',
       // The raw sealed score alone is not the result — the DELTA against the seed's own test
       // score is, and both were already in final.json. A run can lift val and lose test.
       (S.test_delta!=null||S.test_baseline_reward!=null)
         ?((S.test_delta!=null?(S.test_delta>0?'+':'')+S.test_delta.toFixed(3)+' vs seed ':'')+
           (S.test_baseline_reward!=null?fmt(S.test_baseline_reward):'')+
           (S.test_sealed?' · sealed once':''))
         :(S.test_sealed?'sealed once':'not finalized')),
    kp('candidates',c.total-(c.seed||0),'',
       `${c.accepted} accept · ${c.rejected} reject · ${c.indecisive||0} indecisive · ${c.failed} no-measure`),
    kp('frontier',S.frontier,'','gated leaves with no accepted child'),
    kp('wall clock',`${S.wall_clock_seconds}s`,'',`opt ${S.optimizer_seconds}s · run ${S.runner_seconds}s`),
    kp('cost',`$${cost.total_usd.toFixed(4)}`,'',`opt $${cost.optimizer_usd.toFixed(4)} · run $${cost.runner_usd.toFixed(4)}`),
    // Token count without its split reads as implausible next to the dollar figure (a real run:
    // 206M tokens for $4.80). The split explains it: nearly all of them are RUNNER tokens on a
    // self-hosted endpoint that bills $0, and the dollars are the optimizer's.
    kp('tokens',S.tokens.toLocaleString(),'',S.tokens_by_role?
       `run ${S.tokens_by_role.runner.toLocaleString()} · opt ${S.tokens_by_role.optimizer.toLocaleString()}`:''),
    kp('unattributed $',
       S.cost_ledger?`$${S.cost_ledger.unattributed_usd.toFixed(4)}`:'—',
       (S.cost_ledger&&Math.abs(S.cost_ledger.unattributed_usd)>0.0005?'champ':''),
       'recorded spend the events cannot explain'),
    kp('events',S.event_count!=null?S.event_count:'—','','every line in events.jsonl')
  );
  s.append(g);
})();

/* ---------- 1b. Run status + split honesty ---------- */
(function(){
  const s=sec('Run status');
  const meta=STATUS_META[S.status]||['unknown','var(--muted)'];
  const head=$('div',{style:'display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px'});
  const pill=$('span',{class:'pill',style:`color:${meta[1]};border-color:${meta[1]}66`});
  pill.append($('span',{style:`width:8px;height:8px;border-radius:50%;background:${meta[1]}`}),
              $('span',{text:meta[0]}));
  head.append(pill);
  if(S.algorithm)head.append($('span',{class:'pill',style:'color:var(--accent);border-color:#7c5cff66',
    text:S.algorithm+(S.algorithm_source?' · from '+S.algorithm_source:'')}));
  head.append($('span',{class:'pill',text:S.test_sealed?'test sealed':'test not sealed'}));
  if(S.elapsed_seconds!=null)head.append($('span',{class:'muted num',text:dsecs(S.elapsed_seconds)+(S.elapsed_open?' elapsed so far':' elapsed')}));
  s.append(head);
  if(S.status_reason)s.append($('p',{class:'muted',style:'margin:0 0 10px',text:S.status_reason}));
  const sp=S.splits;
  if(sp&&sp.no_holdout){
    s.append($('div',{class:'banner',html:'<b>No holdout.</b> train, val and test hold the same tasks, so the '+
      '&ldquo;test&rdquo; number is NOT a generalization estimate &mdash; the optimizer saw those tasks. '+
      'Read it as a sanity check only.'}));
  }
  if(sp&&sp.warning)s.append($('div',{class:'banner',text:sp.warning}));
  // Background-task mass-kill (PR #558): 2+ backgrounded Bash calls the harness evicted
  // at the identical millisecond — a compliance WARNING distinct from an outcome, so it
  // gets the 'bad' banner treatment (No holdout above uses the same class).
  (S.background_mass_kills||[]).forEach(mk=>{
    s.append($('div',{class:'banner bad',html:
      `<b>Background task mass-kill.</b> ${mk.count} background tasks were evicted at the `+
      `identical timestamp <code>${mk.timestamp}</code> — the harness's concurrent-`+
      `background-task ceiling, not ${mk.count} tasks coincidentally finishing at once. `+
      `Task ids: ${(mk.task_ids||[]).join(', ')}.`}));
  });
  if(sp)s.append($('p',{class:'muted num',style:'margin:10px 0 0',
    text:`splits · train ${sp.train??'—'} · val ${sp.val??'—'} · test ${sp.test??'—'}`+
         (sp.seed!=null?` · seed ${sp.seed}`:'')+
         '   —   val decides selection; test is scored exactly once and never optimized against.'}));
})();

/* ---------- 1c. Phases timeline ---------- */
(function(){
  const c=S.counts, total=c.total, evaluated=c.accepted+c.rejected;
  const hasBase=S.baseline_val!=null, finalized=(S.test_reward!=null)||S.test_sealed;
  const D=b=>b?'done':'pending';
  const phases=[
    {nm:'Intake',st:D(total>0||hasBase),d:'Interview + scaffold project, adapter, seed.'},
    {nm:'Implement & check',st:D(total>0||hasBase),d:'Hard gate before any budget is spent.'},
    {nm:'Baseline',st:D(hasBase),d:`Freeze splits; seed val ${fmt(S.baseline_val)}.`},
    {nm:'Optimize'+(S.algorithm?' · '+S.algorithm:''),st:finalized?'done':(hasBase?'active':'pending'),
     d:`${evaluated} iters · ${c.accepted} accepted · best ${fmt(S.best_val)}.`},
    {nm:'Finalize',st:D(finalized),d:`Sealed test ${fmt(S.test_reward)}.`},
    {nm:'Report',st:D(finalized),d:'This dashboard.'},
  ];
  const s=sec('Pipeline phases'); const g=$('div',{class:'phases'});
  for(const p of phases){const e=$('div',{class:'phase '+p.st});
    e.append($('div',{class:'nm',text:p.nm}),$('div',{class:'st',text:p.st}),$('div',{class:'d',text:p.d}));
    g.append(e);}
  s.append(g);
})();

/* ---------- 1d. Rejected edits, deduplicated by reason ---------- */
(function(){
  const norm=r=>(r||'rejected').replace(/-?\d+\.\d+/g,'N').replace(/-?\d+/g,'N').trim();
  const map=new Map();
  for(const n of G.nodes){ if(n.status!=='rejected')continue;
    const k=norm(n.reason); const cur=map.get(k)||{reason:k,count:0,ex:[]};
    cur.count++; if(cur.ex.length<3)cur.ex.push(n.id); map.set(k,cur);}
  const ends=[...map.values()].sort((a,b)=>b.count-a.count);
  if(!ends.length)return;
  const s=sec('Rejected edits, grouped by the gate reason');
  for(const d of ends){const e=$('div',{class:'dead'});
    if(d.count>1)e.append($('span',{class:'x',text:'×'+d.count}));
    e.append($('div',{class:'muted',text:d.ex.join(', ')}),$('div',{text:d.reason}));
    s.append(e);}
})();

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

/* ---------- 3. tasks × iterations pass/fail heatmap ---------- */
(function(){
  const tasks=S.tasks||[];
  const iters=G.nodes.filter(n=>Object.keys(n.per_task||{}).length).sort((a,b)=>a.iteration-b.iteration);
  if(!tasks.length||iters.length<1)return;
  const s=sec('Per-task pass/fail across iterations');
  // sort rows worst-first by mean reward
  const meanFor=t=>{let sum=0,n=0;iters.forEach(it=>{if(it.per_task[t]!=null){sum+=it.per_task[t];n++;}});return n?sum/n:0;};
  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));
  const cw=Math.max(10,Math.min(26,Math.floor(1000/iters.length))),ch=16,labW=120;
  const W=labW+iters.length*cw+10,H=rows.length*ch+24;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'heat'});
  iters.forEach((it,j)=>txt(el,{x:labW+j*cw+cw/2,y:12,'text-anchor':'middle'},it.iteration));
  rows.forEach((t,i)=>{
    txt(el,{x:labW-6,y:24+i*ch+11,'text-anchor':'end'},t.length>16?t.slice(0,15)+'…':t);
    iters.forEach((it,j)=>{
      const v=it.per_task[t];
      const col=v==null?'var(--card3)':v>=0.999?'var(--ok)':v<=0.001?'var(--bad)':'var(--warn)';
      const rect=svg('rect',{x:labW+j*cw,y:24+i*ch,width:cw-1.5,height:ch-1.5,rx:2,fill:col});
      const fb=(it.feedback&&it.feedback[t])||'';
      rect.addEventListener('mousemove',e=>showTip(e,`${t} @ iter ${it.iteration} (${it.id})\nreward=${v==null?'—':v.toFixed(3)}\n${fb.slice(0,180)}`));
      rect.addEventListener('mouseleave',hideTip);
      el.append(rect);
    });
  });
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>pass</span><span><i style="background:var(--bad)"></i>fail</span>'+
    '<span><i style="background:var(--warn)"></i>partial</span><span><i style="background:var(--card3)"></i>not run</span>'+
    '<span class="muted">rows sorted worst-first · hover a cell for feedback</span>'}));
})();

/* ---------- 4. Per-iteration diff view ---------- */
(function(){
  const ids=Object.keys(DIFFS); if(!ids.length)return;
  const s=sec('Diff vs parent');
  const bar=$('div',{class:'row'});
  const sel=$('select'); ids.forEach(id=>sel.append($('option',{value:id,text:id})));

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

(function(){

  const count=$('span',{class:'muted num'});

  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));

    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();

      if(phase.value!=='all'&&r.phase!==phase.value)return false;

        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);

  kind.addEventListener('change',render);render();
