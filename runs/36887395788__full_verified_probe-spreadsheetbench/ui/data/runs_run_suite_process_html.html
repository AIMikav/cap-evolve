<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);

and-typed cells.\n- Expected movers:\n  - Fix: 45707, 55260, 57354, 183-8, 28-7, 534-26, 9111, 52541, 486-17, 188-39.\n  - Risk: tasks where \"current\" means a data-relative date, or where case-sensitive matching was intended.\n- Next: if accepted, check per-task movement in LEDGER. If any protected task broke, bisect by reverting the \u00a72 word list first (the widest-scope edit).\n\n> **RESULT (framework, measured):** ACCEPTED (new champion) \u00b7 val=0.675 \u0394=+0.275 \u00b7 fixed={11276, 12307, 290-1, 304-35, 38074, 41978, 45707, 469-9, 50682, 535-20, 56921, 58687, 59129, 59160, 59358, 9391} \u00b7 broke={188-39, 45896, 48975, 51680, 547-43} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0001: ACCEPTED val=0.675 \u0394=+0.275 -->\n\n## Iteration 2 \u2014 cand_0002 (parent cand_0001; inspection structure + exact-text policy)\n- Intent: the 13 failures are mostly evidence the agent never looked at or never compared against: a desired-result sheet, all pre-filled example rows, formula column letters, an error totals row inside the target, pre-filled cells it overwrote. So most edits are skeleton code and checklist items that surface that evidence. One bounded \u00a72 knowledge block covers exact text, no fuzzy matching, and filter-and-compact.\n- Edits:\n  - Phase 1 prints row 1 as (letter, value) per sheet and dumps sheets titled desired/expected/sample/example/wanted.\n  - A required per-column mapping comment (target header \u2190 source letter/header \u2190 evidence), plus a serial\u2192date cross-check. Lists are read from the sheet, never typed in.\n  - The Phase 2 verify scans the whole answer_position for ERROR LEFT / CHANGED PRE-FILLED.\n  - Phase 3 adds three checks: no leftover error; quote the instruction words for each changed pre-filled cell, otherwise restore; reproduce ALL examples (items, text form, layout).\n  - prompt \u00a72 \"prose is a paraphrase\" block.\n- Expected movers:\n  - Fix: 409-45, 547-43, 45896, 188-39, 183-8, 57354, 279-23, 1925, 203-15, 524-31, 48975.\n  - Risk: \"CHANGED PRE-FILLED \u2192 restore\" on tasks that legitimately rewrite a column (sort/rebuild/fix-and-apply). I listed those classes explicitly to protect 290-1/469-9/535-20-type tasks. The no-fuzzy rule could also hit tasks needing contains-matching, but it is scoped to \"not described by the instruction\".\n- Next: if a protected task breaks, bisect the Phase 3 restore bullet first (the widest behavioral lever), then the \u00a72 no-fuzzy line.\n\n> **RESULT (framework, measured):** ACCEPTED (new champion) \u00b7 val=0.700 \u0394=+0.025 \u00b7 fixed={45896, 48975, 51680, 547-43} \u00b7 broke={486-17, 52575, 59511} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0002: ACCEPTED val=0.700 \u0394=+0.025 -->\n\n## Iteration cand_0003 \u2014 \u26a0 EMPTY HANDOVER, framework-synthesized from the commit reason (the optimizer wrote no entry of its own \u2014 see the `optimizer_context_warning` event):\npaired \u0394\u0304=+0.0000 <= 0.2\u00b7SE=0.0124 (SE=0.0620, n=40, resolvable effect size 2\u00b7SE=0.1240)\n\n> **RESULT (framework, measured):** REJECTED (champion unchanged) \u00b7 val=0.700 \u0394=+0.000 \u00b7 fixed={486-17, 52575, 59511} \u00b7 broke={11276, 45896, 51680} \u00b7 unresolved={\u2014} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them). \u2014 its WHOLE batch was reverted; re-introduce only the edits that did NOT break a task above, dropping/redesigning the ones that did.\n<!-- cand_0003: rejected val=0.700 \u0394=+0.000 -->", "template_only": false}, {"name": "INSIGHTS.md", "title": "Insights \u2014 verified findings", "text": "# INSIGHTS \u2014 summarized, verified findings (accumulate across the whole run)\n\nThe JOURNAL is your per-iteration diary; THIS file is the distilled, VERIFIED takeaway a future iteration should read instead of re-reading the whole journal or old sessions/traces. Update it whenever you have a genuinely NEW, confirmed finding (an accepted/rejected RESULT counts as confirmation; a guess does not) \u2014 not every iteration needs a new entry. Structure each addition as:\n\n    ## <task or mechanism name>\n    - What worked (confirmed by a RESULT, cite the candidate id):\n    - What didn't (confirmed by a RESULT, cite the candidate id):\n    - Promising but not yet tried:\n\n- (unverified until RESULT, cand_0001) Biggest single root cause seen in traces: the agent reads inputs from the non-data_only workbook, gets '=...' strings, and then loops re-sending the same block until MAX_TURNS. The fix is in the template skeleton code (two copies), not in prose. Sibling-run evidence: growing the champion prompt with extra rules regressed val by 0.025-0.1 each time.\n\n## Evidence-surfacing vs rule-adding (cand_0002, unverified until RESULT)\n- Promising but not yet confirmed: most remaining failures are \"the answer was in the workbook but never printed\". Examples: a 'desired result' sheet (409-45), pre-filled example rows beyond the first 5 (547-43), a cached serial in the target revealing the source column (45896), a '#DIV/0!' totals row inside the target (183-8). cand_0002 adds prints and scans for these instead of new rules.", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n- Iteration 1 (cand_0001): with an empty seed, reusing a sibling run's champion (same benchmark, same val split) as the base was far cheaper than writing from scratch. Its FINAL traces doubled as a free diagnosis set: this run's trajectories held only scores. Lesson: when the trajectories lack transcripts, look for sibling-run traces before spawning fresh analysis. The sibling's rejected list showed that every add-on to its champion regressed, so this iteration kept additions under ~400 words and scoped each to explicit instruction words or skeleton code. Prose-only rules were kept to a minimum.\n\n## Iteration 2 (cand_0002)\n- Strategy tried: diagnose every failing trace against golden, then fix with EVIDENCE-SURFACING levers (skeleton prints, a full-range verify scan, a mapping-comment contract) instead of more prose rules. Rationale: 9 of 13 failures had the deciding evidence in the workbook, but the agent's own prints never showed it (partial row samples, an unprinted desired sheet, a verify step that covered only the written cells). Result pending.\n- Signal worth noting: iter1's \"broke\" set (188-39, 45896, 48975, 51680, 547-43) was not caused by its \u00a72 word list, judging from the traces. They are inspection failures that the sibling champion passed by chance. The LEDGER \"broke\" set measures change relative to the sibling base, not necessarily causation.\n- The feedback text can mislead the diagnosis. 183-8's feedback said \"FORMULAS\", but the real cause was an untouched '#DIV/0!' totals row. The \"int where bool\" messages come from the scorer's bool\u2192float transform. Always open the golden before trusting the class in the feedback.\n- What to try next: if this iteration accepts, the remaining cracks are 45944 (comparison direction) and 51680 (golden rewrites the examples). Both are probably not worth an iteration. Instead, check flakiness on the passing set.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n- Adapter: the verify budget only decrements on rounds that leave the output file unchanged. An agent that re-sends its save+verify block changes the stamp every time and runs to MAX_TURNS (seen as 62-message traces). Consider also counting identical-code or identical-stdout rounds against the budget. Separately, store transcripts (not only scores) in this run's trajectories so diagnosis does not have to rely on sibling runs.\n\n- (iter 2) The per-task FEEDBACK classifier reported 183-8 as \"answer cells hold FORMULAS\". The real cause was unfilled '#DIV/0!' cells inside the range, which are error-marker strings, not formulas. Suggest classifying error-marker strings separately from '=' formulas. Also, \"int where bool expected\" type messages are produced by the scorer's own bool\u2192round(float) transform and mislead diagnosis.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0002)", "text": "# PROCESS \u2014 what I did this iteration (explainability; REQUIRED)\n\nParent: cand_0001 (val 0.675). I read all 13 failing traces in full and checked each one against the golden workbook. I used the golden files only to name the failure class; no answer values are written into the capability.\n\n## Ranked issue list (clusters by # failing tasks \u00d7 trials, biggest first)\n| rank | cluster | tasks | shared root cause | tag | planned change class |\n| --- | --- | --- | --- | --- | --- |\n| 1 | A. Examples already in the file are ignored or only partly reproduced | 547-43, 409-45, 279-23, 1925 | The agent printed only a sample (rows 2-6) or never printed the \"desired result\" sheet. It hardcoded a list from that sample, or followed the prose form ('(tig)', 'New') when the same column already held the final form ('tig', 'NEW'). | BEHAVIORAL | Phase 1 skeleton prints desired-result sheets. Phase 3 checklist: reproduce ALL examples (items, text form, layout). Rule: lists are read from the sheet. |\n| 2 | B. Wrong source column: prose or wrong letter mapping beats header / formula | 188-39, 45896 | Wrote \"name\" where the target header says Designation. Mapped ZORD!C:C to the 2nd column. Ignored a cached serial in the target that would have shown which column was meant. | BEHAVIORAL | Phase 1 prints row-1 cells with their column letters. A required per-column mapping comment (target header \u2190 source letter/header \u2190 evidence). Serial\u2192date cross-check. |\n| 3 | C. Exact text replaced by a paraphrase or \"cleaned\" | 203-15, 1925, (51680 partly) | Headers copied from the instruction's paraphrase ('Transport Allowance') instead of the data ('Transport Allowances'). Header text `.strip()`ped. | KNOWLEDGE | prompt \u00a72: labels copied from data are the stored string. |\n| 4 | D. Untouched cells inside answer_position | 183-8 (error totals row), 57354 (overwrote filled B3/C3) | The verify step printed only the cells the agent wrote. A '#DIV/0!' totals row inside the range was never recomputed. Pre-filled cells the instruction did not ask for were overwritten with no flag raised. | BEHAVIORAL | Phase 2 verify code scans the WHOLE range and prints ERROR LEFT and CHANGED PRE-FILLED. Phase 3 requires quoting the instruction words that justify each change, otherwise restore. |\n| 5 | E. Lookup over-match / list alignment | 524-31, 48975 | Invented substring and alnum fuzzy fallbacks, giving 7 false categories. \"Copy rows where yes, skipping others\" was row-aligned to a key instead of compacted. | KNOWLEDGE | prompt \u00a72: no looser matching than the instruction describes; filter-and-compact means consecutive rows. |\n| 6 | F. Pairing direction of a two-list comparison | 45944 | Agent compared in the wrong direction. One task, no generalizable cue. | \u2014 | skipped |\n| 7 | G. Golden rewrites the worked-example cells | 51680 | Expected output overwrites the hand-filled G3/G5/G6. This contradicts the protected worked-example rule. | \u2014 | skipped (except via cluster C) |\n\n## Changes made this iteration (one row per edit \u2014 aim for MULTIPLE classes)\n| cluster | edit class (lever) | file | what & why it generalizes | protects passing? |\n| --- | --- | --- | --- | --- |\n| A, B | SKELETON CODE (inspection) | task_template.md Phase 1 | Each sheet now prints its row-1 cells as (letter, value). A sheet whose title contains desired/expected/sample/example/wanted is printed whole (\u226460\u00d720). This is evidence only and changes nothing in the output. | Yes. It adds prints only. The title filter excludes \"result\"/\"output\" so ordinary target sheets are not dumped. |\n| B, A | EXPLICIT CONTRACT (mapping comment) + worked example | task_template.md, after Phase 1 | A one-line-per-column mapping: target header \u2190 source sheet!letter 'header' \u2190 evidence. Formula letters are mapped via the printed letters. A 5-digit number where a date belongs is converted to a date to find its source column. Lists are read from headers or a lookup, never typed in. The example uses neutral names (Staff/Role, Log/End date). | Yes. It replaces a free-form comment the template already asked for. |\n| D | SKELETON CODE (verify scan) | task_template.md Phase 2 | After save, scans all of answer_position: prints ERROR LEFT for real Excel error markers and a CHANGED PRE-FILLED list (count + first 15). | Yes. It only prints. |\n| D, A | CHECKLIST | task_template.md Phase 3 | Three items: (1) no ERROR LEFT; (2) each CHANGED PRE-FILLED cell needs quoted instruction words, with the legitimate classes listed (column transformation, fix-and-apply, sort/rebuild, delete-shift), otherwise restore; (3) reproduce ALL finished-looking examples \u2014 items, text form, layout. I merged the old \"reproduces the worked example\" bullet into (3), so nothing is restated. | Mostly. Item (2) names the legitimate change classes, so delete/sort/fix-and-apply tasks (290-1, 469-9, 535-20 class) are not pushed to restore. |\n| C, E | KNOWLEDGE (policy with why) | prompt.md \u00a72, new block after the fixed-meaning words | \"The instruction's prose is a paraphrase; the workbook holds the exact text\": (a) copied labels keep the stored string, with no strip or rephrase; (b) an unmatched lookup stays empty, with no fuzzy fallback the instruction does not describe; (c) filter-and-skip into a list means consecutive rows in source order, scanning the full extent. | Bounded. (a) applies only to text copied from data. (b) applies only when the instruction does not describe the looser match. (c) applies only to \"copy rows where X \u2026 skipping\". |\n\n## Verify-the-fix (one line per change: the trace it targets \u2192 what now happens on those exact inputs)\n- 409-45: the sheet 'desired result' matches \"desired\", so its 11 rows print in round 1, including a single blank separator between blocks. Phase 3 item (3) \"blank separator rows kept or removed as there\" then contradicts the agent's delete-all-empty output.\n- 547-43: Phase 1 prints Expected row 1 headers. The mapping rule forbids `target_vars = [...]` typed from rows 2-6, so the list comes from Lookup or Emp headers, which include 'performance'. Phase 3 item (3) \"reproduce ALL pre-filled rows\" covers Expected rows 2-10, which already include performance rows.\n- 45896: the `row 1:` print shows ('C','Valid to'), so ZORD!C:C maps to 'Valid to'. The existing cell I2 '46022,\u2026' converts to 2025-12-31, which equals Valid to. The mapping-comment example uses exactly this pattern with neutral names.\n- 188-39: the mapping line for target column B has to cite its header 'Designation', and the example line \"target header; the prose said 'name'\" covers this case.\n- 183-8: the verify scan over I3:L7 prints `ERROR LEFT J7 #DIV/0!` (and K7, L7). The Phase 3 bullet says such a cell gets its recomputed value (the weighted average of the totals row).\n- 57354: CHANGED PRE-FILLED prints B3 and C3. The instruction asks for \"total revenue and total GP\", which justifies only D3/E3. The checklist example is the same pattern with neutral names, so B3/C3 are restored.\n- 279-23: the was: list shows B17:B26 already in the form 'tig' in the same column. Phase 3 item (3) \"same text form (`abc` vs `(abc)`)\" flags '(tig)'.\n- 1925: existing C14 = 'NEW' and the user formula has \"NEW\". Item (3) \"`NEW` vs `New`\" and \u00a72 paraphrase rule (the example names exactly this) point to 'NEW'.\n- 203-15: \u00a72 (a) \"'Transport Allowance' for a source value 'Transport Allowances'\" \u2014 headers are copied from the column-H strings.\n- 524-31: \u00a72 (b). The agent's rounds 8-16 added substring/alnum fallbacks, which this rule now forbids; the plain prefix rule from the instruction stays.\n- 48975: \u00a72 (c). The 'yes' rows go to B11.. consecutively (Text 1-4, 10, 15, 25), scanning all 33 rows rather than aligning to Output column A.\n- Template placeholders: checked with a regex plus str.format. The set is exactly {instruction, spreadsheet_path, spreadsheet_content, instruction_type, answer_position, output_path, max_turns} and formats without error.\n\n## Process & features used\n- Subagents / worktrees / parallel features used: none. Serial: 13 traces fit in one context, and the instructions discourage Agent/Workflow unless requested.\n- Prior iterations read: RUNMAP, prior_iterations/cand_0001 PROCESS + diff, LEDGER, JOURNAL. Lessons: (1) iter1's \u00a72 word list may have caused regressions 188-39/45896/48975/51680/547-43, but the traces show those regressions come from inspection gaps (partial prints, letter mapping, alignment), not from the word list. So I kept the word list and added inspection structure instead of more rules. (2) The sibling run showed prose growth regresses, so most new content here is skeleton code and checklist, and only one bounded \u00a72 block was added (~170 words).\n- rejected.jsonl: empty. No refuted approaches to avoid.\n\n## Good things to PRESERVE (do not let a future iteration undo these)\n- From iter1: the data_only read copy plus formula write copy, the '=' scrub, the stall breaker, and the print of every non-empty target cell.\n- \u00a71 grading contract, \u00a72 worked-example rule, \u00a72 snapshot/next-item/matrix rules: these protect 9111, 52541, 59511, 50971 and others.\n- New: the full-range verify scan (ERROR LEFT / CHANGED PRE-FILLED). It is pure evidence and cheap.\n\n## Deliberately skipped (cluster + why)\n- 45944 (pairing direction of the outside-list comparison): a single task, and I found no cue in the workbook that a general rule could point to. Any rule would be a guess.\n- 51680's rewrite of the hand-filled example cells: the golden contradicts the worked-example rule that protects many passing tasks. Only the no-strip part (\u00a72 a) is targeted.\n- Reverting iter1's case-insensitive matching rule (possible tension with 1925): the failure in 1925 was the output literal, not the matching, so I left the rule alone.\n\n---\n\n# DIAGNOSIS.json \u2014 machine-readable diagnosis (OPTIONAL but recommended)\n\nIn addition to PROCESS.md, you may write a DIAGNOSIS.json file to make your diagnosis machine-readable for the dashboard. This is optional; if absent, the dashboard will parse PROCESS.md tables when present, or show only outcome data.\n\nThe schema:\n```json\n{\n  \"candidate\": \"cand_NNNN\",\n  \"headline\": \"Brief summary of this iteration's strategy\",\n  \"clusters\": [\n    {\"id\": \"A\", \"name\": \"Short cluster name\",\n     \"detail\": \"Root cause explanation\", \"tasks\": [\"task-id\", ...],\n     \"scope\": \"BOUNDED|WIDESPREAD|SYSTEMIC\", \"latent\": false,\n     \"tag\": \"KNOWLEDGE|BEHAVIORAL|CAPABILITY-GAP\"}\n  ],\n  \"edits\": [\n    {\"id\": \"E1\", \"title\": \"What this edit does\",\n     \"files\": [\"prompt.md\"], \"lever\": \"CONTRACT|KNOWLEDGE|BEHAVIORAL|...\",\n     \"clusters\": [\"A\"], \"blast_radius\": \"BOUNDED|MODERATE|WIDE\",\n     \"verified\": \"How you tested it\"}\n  ],\n  \"skipped\": [{\"title\": \"What was skipped\", \"reason\": \"Why\"}],\n  \"techniques\": [\"technique 1\", \"technique 2\"]\n}\n```\n\nValidation is advisory only and never blocks an iteration. Warnings are recorded when:\n- A task ID in clusters[].tasks is not in the val split\n- An edit references a cluster ID that does not exist\n- An edit references a file that does not exist in the candidate", "template_only": false}]}, "config": {"project_dir": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_probe_spreadsheetbench_proj/.capevolve/project", "spec_missing": false, "spec_groups": [{"group": "Capability", "items": [{"key": "capabilities", "value": ["system-prompt"]}, {"key": "capability_path", "value": "seed_capability"}]}, {"group": "Delivery", "items": [{"key": "intervention", "value": "direct"}]}, {"group": "Algorithm & optimizer", "items": [{"key": "optimizer_skill", "value": "claude-code"}, {"key": "optimizer_model", "value": "aws/claude-opus-5-5"}, {"key": "target_model", "value": "rits/google/gemma-4-31B-it"}, {"key": "target_profile_file", "value": "/vol/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/spreadsheetbench/full_verified_probe/reader/B_frontier.md"}, {"key": "optimizer_max_turns", "value": 80}, {"ke (contains dataset.json + spreadsheet/):\n       SPREADSHEETBENCH_DATA_DIR=/some/cache/dir/sample_data_200\n     SPREADSHEETBENCH_VARIANT selects which release: `sample_200`, `full_912` (the original\n     912-task set, 3 graded copies per task) or `verified_400` (the 400-task verified\n     re-release, 1 graded copy per task \u2014 what recent published work evaluates on). The\n     adapter reads the number of graded copies off disk, so all three just work.\n\n  3. Install Docker (required \u2014 each task runs in its own sandboxed container) and,\n     for accurate scoring of formula-bearing outputs, LibreOffice:\n       sudo apt install libreoffice-calc   # Debian/Ubuntu\n       sudo dnf install libreoffice-calc   # RHEL/Fedora\n       brew install --cask libreoffice     # macOS\n     Scoring degrades gracefully (skips recalculation) if LibreOffice is absent \u2014 but\n     silently: a formula-only cell then reads as empty and never matches, so a task the\n     agent actually solved scores 0. Treat the \"LibreOffice not found\" warning as a\n     setup error, not a nicety. Upstream's docstring asks for 7.5+; RHEL 9's 7.1.8.1\n     recalculates correctly through `--convert-to xlsx` and is verified in use.\n\n  4. Install adapter deps: pip install pandas openpyxl docker tornado requests\n\n  5. Copy this directory to .capevolve/project/adapters/, copy model_config.py alongside.\n\n  6. Set env vars (in .env or shell) \u2014 any litellm provider, see model_config.py:\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  7. Optional env vars:\n       SPREADSHEETBENCH_TASK_IDS=59196,58568         # comma-separated subset (default: all 200)\n       SPREADSHEETBENCH_MAX_TURNS=5                  # rounds of code-exec interaction per task\n       SPREADSHEETBENCH_ROWS=5                       # preview rows shown per sheet in the prompt\n       SPREADSHEETBENCH_CONCURRENCY=4                # parallel tasks (each = one Docker container)\n       SPREADSHEETBENCH_EXEC_TIMEOUT=180             # per code-exec call timeout (s)\n       SPREADSHEETBENCH_LIBREOFFICE_BIN=/path/to/soffice\n\n  8. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES \u2014 ALL the text the agent reads, in two files:\n  - prompt.md         the system prompt: who the agent is, how it should work.\n  - task_template.md  the per-task user message: how the job is framed, what the fields\n                      mean, and the interaction contract. Optional \u2014 no file falls back to\n                      the built-in _TASK_TEMPLATE, so older capabilities are unaffected.\n  Keeping the job description frozen in this file used to leave ~60% of the agent's\n  instruction surface un-optimizable, including the line \"once that file exists, you are\n  done\" \u2014 which encourages exactly the dominant failure (a wrong-but-present output file).\n  Per-task VALUES (instruction, paths, preview, answer_position) are still supplied by the\n  adapter through placeholders that live() validates; see _task_template_error.\n\nHOW IT WORKS:\n  - task \u2026[+102965 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 2051, "preview": "{\"train\": [\"10452\", \"105-24\", \"10747\", \"108-24\", \"118-50\", \"11842\", \"141-20\", \"165-23\", \"170-13\", \"1818\", \"192-22\", \"194-19\", \"22-47\", \"247-24\", \"250-20\", \"254-34\", \"262-17\", \"263-1\", \"30930\", \"31011\", \"31915\", \"32023\", \"32255\", \"32337\", \"32438\", \"325-44\", \"32612\", \"32902\", \"34033\", \"3413\", \"35742\", \"36097\", \"370-43\", \"379-36\", \"398-14\", \"39903\", \"39931\", \"408-39\", \"40892\", \"414-20\", \"42354\", \"433-47\", \"43589\", \"45372\", \"46121\", \"46646\", \"472-15\", \"47766\", \"48080\", \"48365\", \"48745\", \"48983\", \"493-18\", \"49333\", \"50916\", \"51090\", \"51249\", \"52216\", \"54085\", \"54638\", \"55060\", \"55421\", \"55427\", \"55965\", \"56274\", \"56427\", \"56786\", \"57113\", \"57445\", \"57558\", \"577-40\", \"57743\", \"58109\", \"58484\", \"58499\", \"585-41\", \"58949\", \"6239\", \"66-24\", \"82-30\"], \"val\": [\"11276\", \"12307\", \"183-8\", \"188-39\", \"1925\", \"203-15\", \"279-23\", \"28-7\", \"290-1\", \"304-35\", \"374-31\", \"38074\", \"409-45\", \"41978\", \"45707\", \"45896\", \"45944\", \"469-9\", \"486-17\", \"48975\", \"50521\", \"50682\", \"50811\", \"50971\", \"51680\", \"524-31\", \"52541\", \"52575\", \"534-26\", \"535-20\", \"547-43\", \"56921\", \"57354\", \"58687\", \"59129\", \"59160\", \"59358\", \"59511\", \"9111\", \"9391\"], \"test\": [\"109-21\", \"120-24\", \"130-9\", \"13284\", \"142-19\", \"14240\", \"15387\", \"156-14\", \"157-4\", \"16511\", \"17111\", \"178-22\", \"18645\", \"208-20\", \"24-23\", \"297-42\", \"3002\", \"31202\", \"31746\", \"32562\", \"32789\", \"33157\", \"333-29\", \"334-11\", \"341-40\", \"359-21\", \"36191\", \"36277\", \"367-23\", \"36764\", \"37229\", \"374-18\", \"37554\", \"384-4\", \"38537\", \"3911\", \"39190\", \"40478\", \"408-5\", \"41-47\", \"416-27\", \"42198\", \"42526\", \"42902\", \"42930\", \"43213\", \"43657\", \"44017\", \"44266\", \"44296\", \"44389\", \"448-11\", \"45300\", \"455-35\", \"45937\", \"4714\", \"47933\", \"48608\", \"48643\", \"48969\", \"49036\", \"49196\", \"493-5\", \"49300\", \"49857\", \"49945\", \"50324\", \"50631\", \"510-3\", \"51556\", \"52220\", \"52233\", \"52305\", \"52807\", \"52917\", \"52964\", \"53161\", \"53167\", \"54474\", \"54513\", \"547-18\", \"54717\", \"55085\", \"55260\", \"55468\", \"55708\", \"55977\", \"567-21\", \"57033\", \"57262\", \"57989\", \"58942\", \"59639\", \"59734\", \"59794\", \"599-9\", \"61-4\", \"82-38\", \"91-34\", \"9448\"]}\n", "truncated": false, "binary": false}, {"path": "optimizer/INSTRUCTIONS.md", "size": 17782, "preview": "# Optimize the capability \u2014 ship several REAL, SAFE, VERIFIED prompt fixes this iteration\n\n{{TARGET_READER}}\n\n{{FOCUS_SUMMARY}}\n\n{{EMPTY_SEED}}\n\nGOAL: raise the eval score as much as you can THIS iteration, then STOP (the harness\nre-scores you \u2014 don't run evaluation yourself). The capability under optimization is\nPROSE: the agent's prompt / skill text. There are no tool implementations to edit here.\n\nMake **AS MANY real fixes as you can this iteration \u2014 solve many issues across many\ntrajectories, not just the biggest one.** A timid one- or two-edit iteration is an\nunder-used iteration: diagnose EVERY failure cluster in `./trajectories/` and ship a fix\nfor each one that passes the three tests below. Breadth is the goal \u2014 the more distinct\nfailing clusters you fix in this ONE candidate, the larger the gain.\n\nThe ONLY brake on breadth is regression: every edit must pass all three tests, because a\nsingle speculative edit that breaks a passing task can sink an iteration of good work (it\ndid in prior runs). So the discipline is \"many fixes, each one real and safe\" \u2014 NOT \"few\nfixes\". Do not stop at the first cluster; work through them all.\n\n## WHAT YOU MAY EDIT \u2014 and the two ways iterations get wasted here\nEdit ONLY the capability files listed in `{{CAP_BRIEF}}` below (the prompt / skill text in\nthis working directory). Everything else you can see is READ-ONLY CONTEXT.\n\n**You may NOT edit the adapter, the harness, the scorer, the benchmark, or the\nenvironment** \u2014 not to make a task pass, not to fix a broken mount or a missing binary,\nnot \"just to unblock the run\". Those files are how your score is MEASURED; changing them\ndoes not improve the capability, and a gain obtained that way is not a result. An\niteration that edits infrastructure has produced NOTHING measurable, however green the\nnumber looks. **If the traces show an ENVIRONMENT fault** (permission denied, missing\nbinary, gateway/network error, timeout, container failure \u2014 the same error on nearly every\ntask, unrelated to the task's content), then the correct and complete action is:\n1. do NOT edit the prompt to work around it (a prose workaround for a broken environment\n   is a speculative edit that fails the REAL test \u2014 the prompt is not the defect), and\n2. state the diagnosis in `PROCESS.md` and `JOURNAL.md` precisely \u2014 the exact error, how\n   many tasks it hit, and what a human must fix \u2014 then STOP. Handing back an accurate\n   \"the environment is broken, here is the evidence\" is a SUCCESSFUL iteration.\n\n**The other way iterations get wasted: another prose rule for a behavior the agent already\nknows.** When the agent has the rule and skips it anyway, adding a second sentence saying\nthe same thing changes nothing \u2014 you must change the STRUCTURE that makes it skippable\n(see the levers below): make the step unavoidable and ordered, make the contract explicit,\nor give a worked example it can pattern-match. Prose is for genuine KNOWLEDGE gaps (a\nfact / format / criterion the agent cannot derive) and for STRUCTURE that changes what the\nagent does \u2014 not for repetition or emphasis.\n\n## The THREE TESTS every change must pass (this is the whole game)\nBefore you keep any edit, confirm all three. Drop any edit that fails even one.\n1. **REAL** \u2014 it targets a cluster that is FAILING in THIS iteration's `./trajectories/`\n   (reward 0, partial-credit, or communication/omission). Never edit for a hypothetical\n   problem, and never edit on account of a task whose failure is an environment fault.\n2. **SAFE (bounded blast radius)** \u2014 the real regression question is *behavioral*:\n   **would this edit change what the agent DOES on ANY currently-passing task?** Two\n   blast-radius classes:\n   - **BOUNDED** \u2014 an ADDITIVE rule that applies only under a stated condition present in\n     the failing cases, or a clarification of an output contract the passing tasks already\n     satisfy. This is the SAFE default \u2014 prefer it.\n   - **UNBOUNDED** \u2014 any edit to a GLOBAL decision/permission/refusal rule, or a \u2026[+13631 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/prompt.md", "size": 0, "preview": "", "truncated": false, "binary": false}]}, "host_session": {}}, "diffs": {"cand_0001": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,250 @@"}, {"t": "add", "l": "+You are a spreadsheet expert. You solve each task by writing Python (openpyxl / pandas) that"}, {"t": "add", "l": "+edits a workbook and saves it to a given `output_path`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 1. How your work is graded \u2014 read this before you write any code"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your output file is opened with `openpyxl.load_workbook(path, data_only=True)` and the **values"}, {"t": "add", "l": "+stored in the cells** of `answer_position` are compared with the expected workbook. Nothing is"}, {"t": "add", "l": "+recalculated, and nothing you say in prose is read. Four consequences follow, and they decide"}, {"t": "add", "l": "+most tasks:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(a) A formula is not an answer. Write the computed literal value.**"}, {"t": "add", "l": "+`data_only=True` returns a formula cell's *cached* value. openpyxl never computes formulas, so a"}, {"t": "add", "l": "+cell you set to `\"=SUM(A1:A9)\"` has no cached value and reads back as **empty** \u2014 a guaranteed"}, {"t": "add", "l": "+zero, even when the formula is perfectly correct. So:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Compute the result in Python and assign the plain value: `ws[\"C2\"] = 41.5`."}, {"t": "add", "l": "+- Do this **even when the instruction says \"formula\"**. Instructions here are phrased as"}, {"t": "add", "l": "+  questions from a spreadsheet user (\"what formula can I use\u2026\", \"modify my formula in G4\u2026\"),"}, {"t": "add", "l": "+  but what is graded is the resulting *values*. Work out what the formula would produce, then"}, {"t": "add", "l": "+  write those numbers/strings. If you want to show the formula, put it in a `print()` or a"}, {"t": "add", "l": "+  comment \u2014 never in a graded cell."}, {"t": "add", "l": "+- Never assign any string that starts with `=` to a cell inside `answer_position`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(b) Types must match.** The comparison rejects a value of the wrong type. `int` and `float`"}, {"t": "add", "l": "+are interchangeable, and a string that parses as a number is converted \u2014 but a string that does"}, {"t": "add", "l": "+not is not."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Numbers \u2192 write `int`/`float`. Never write a number as a formatted string (`\"1,234\"`,"}, {"t": "add", "l": "+  `\"$1,234.00\"`, `\"12%\"`, `f\"{x:.2f}\"`). To change how a number *looks*, set"}, {"t": "add", "l": "+  `cell.number_format`; that is display only and is not compared."}, {"t": "add", "l": "+- Dates \u2192 write a `datetime.datetime` object (what openpyxl itself returns for a date cell), not"}, {"t": "add", "l": "+  a string such as `\"2024-03-01\"`. Times \u2192 `datetime.time`."}, {"t": "add", "l": "+- **Never convert a date to its Excel serial number** (the `45301`-style count of days since"}, {"t": "add", "l": "+  1899-12-30). \"As a static number\", \"as a value not a formula\", and \"hard-code the result\" all"}, {"t": "add", "l": "+  describe *how* the answer is stored \u2014 a literal instead of a formula \u2014 and never ask you to"}, {"t": "add", "l": "+  re-encode a date as a serial. When the instruction asks for a **part** of a date (\"the number of"}, {"t": "add", "l": "+  the day\", \"which month\", \"the year\"), the answer is that component as a small integer"}, {"t": "add", "l": "+  (`d.day`, `d.month`, `d.year`); when it asks for the date itself, write the `datetime`. If you"}, {"t": "add", "l": "+  find yourself computing `(d - datetime(1899, 12, 30)).days`, stop: that number is not an answer"}, {"t": "add", "l": "+  to any task here."}, {"t": "add", "l": "+- Text \u2192 write the exact string, including underscores, punctuation and case as they appear in"}, {"t": "add", "l": "+  the workbook (a sheet named `Supplier_1` must be written `\"Supplier_1\"`, not `\"Supplier 1\"`)."}, {"t": "add", "l": "+- An Excel error marker (`\"#N/A\"`, `\"#VALUE!\"`, `\"#NAME?\"`, `\"#DIV/0!\"`, `\"#NUM!\"`) is never a"}, {"t": "add", "l": "+  computed answer \u2014 it is the trace of a lookup or formula that did not resolve. Do not let one"}, {"t": "add", "l": "+  reach a graded cell: find out why the lookup missed, and decide from the instruction and the"}, {"t": "add", "l": "+  cells already in the sheet what belongs there instead (often `0`, empty, or the row's own"}, {"t": "add", "l": "+  original value)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(c) Precision.** Both sides are rounded to **2 decimal places** before comparison. Keep at"}, {"t": "add", "l": "+least two decimals; do not round to whole numbers unless the instruction asks for it."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**(d) Empty.** `None` and `\"\"` both count as empty and match each other. To leave a cell empty,"}, {"t": "add", "l": "+assign `None`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 2. The workbook already tells you the answer's shape \u2014 read it before deciding"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Most wrong-value failures here come from guessing a reading of an ambiguous instruction when the"}, {"t": "add", "l": "+file itself settles it. Before you compute, spend one round looking at these three things."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Already-filled cells inside `answer_position` are the asker's worked example.** Task authors"}, {"t": "add", "l": "+commonly fill the first few target cells by hand to demonstrate what they want, and the expected"}, {"t": "add", "l": "+output keeps those cells unchanged. Use them to pin down the semantics and the exact format, then"}, {"t": "add", "l": "+make sure your computation reproduces them."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+> Example of the reasoning: target is `F2:F6`; `F2`, `F3`, `F4` already contain `2`, `2`, `0`."}, {"t": "add", "l": "+> The instruction says \"count the 'Yes' entries\". A single grand total would make every cell the"}, {"t": "add", "l": "+> same number, which contradicts `2, 2, 0` \u2014 so the intended answer is a **per-row** count."}, {"t": "add", "l": "+> Check: does my computation reproduce `2, 2, 0` in F2:F4? If not, my reading is wrong, not the"}, {"t": "add", "l": "+> file."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Rule:** a cell inside `answer_position` that already holds a value must still hold **that same"}, {"t": "add", "l": "+value** when you finish, unless the instruction asks you to change or clear it. Filling a whole"}, {"t": "add", "l": "+range unconditionally is the most common way a task with a worked example fails. (One exception:"}, {"t": "add", "l": "+when the instruction says to fix a formula and apply it to the rest, the hand-typed cells are what"}, {"t": "add", "l": "+gets replaced.)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Some instruction words have one fixed meaning here:**"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- \"Delete\" / \"remove\" rows or columns \u2192 remove them with `ws.delete_rows` / `ws.delete_cols`, so"}, {"t": "add", "l": "+  the rows below (or columns to the right) shift into their place. Blanking the cells in place is a"}, {"t": "add", "l": "+  different, wrong answer."}, {"t": "add", "l": "+- \"Current\", \"today\", \"this month\" \u2192 the real date, `datetime.datetime.now()`, never a date"}, {"t": "add", "l": "+  inferred from the data or from a sample sheet."}, {"t": "add", "l": "+- Text the user's own formula or macro would output (`IFNA(..., \"NEW\")`, `TEXT(d, \"ddd\")` \u2192 `'Wed'`)"}, {"t": "add", "l": "+  is written exactly as that formula would produce it. A transformation the instruction applies to a"}, {"t": "add", "l": "+  column is applied mechanically to **every** cell in it, odd rows included, as Excel would."}, {"t": "add", "l": "+- Text matching (lookups, keys, \"contains\") is case-insensitive, as in Excel (`'bob'` matches"}, {"t": "add", "l": "+  `'Bob'`). A header already in the sheet names what goes in its column."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Existing formulas in and around the target range document the intended computation.** Load the"}, {"t": "add", "l": "+workbook a second time with `data_only=False` and print the formulas of the target cells and"}, {"t": "add", "l": "+their neighbouring columns. A neighbouring `=COUNTIFS(B:B,G2,D:D,\"\")` tells you the grouping key"}, {"t": "add", "l": "+and the filter far more reliably than the prose does. When the instruction says \"modify my"}, {"t": "add", "l": "+formula\", read that formula string first \u2014 and change it by rewriting the expression, never by"}, {"t": "add", "l": "+prepending or appending text to the whole cell value (`\"//\" + \"=CONCATENATE(...)\"` produces a"}, {"t": "add", "l": "+broken literal, not a modified formula)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Axis labels and headers beside the target range fix the orientation.** For a grid/matrix"}, {"t": "add", "l": "+target, read the row labels and column labels out of the sheet instead of assuming which axis is"}, {"t": "add", "l": "+which."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+When you have read those bands and they still do **not** say which variable is which \u2014 a band holds"}, {"t": "add", "l": "+bare numbers like `1, 2, 3`, or only one of the two bands exists \u2014 the instruction's own example"}, {"t": "add", "l": "+cannot break the tie either: an example that pins the corner where **both** variables take the same"}, {"t": "add", "l": "+value (\"Impact 1 and Likelihood 1 goes in the bottom left box\") is satisfied by one orientation"}, {"t": "add", "l": "+**and equally by its transpose**, because that corner is unchanged when the two axes swap. So is an"}, {"t": "add", "l": "+already-filled cell sitting in that corner. Fall back on the standard convention for a"}, {"t": "add", "l": "+severity-by-frequency matrix: the **severity** variable (impact, consequence, damage) runs **down"}, {"t": "add", "l": "+the rows**, and the **frequency** variable (likelihood, probability, chance) runs **across the"}, {"t": "add", "l": "+columns**. So a risk with impact `i` and likelihood `l` belongs at row `i`, column `l` \u2014 not the"}, {"t": "add", "l": "+transpose. If you transpose a matrix, the cells on the shared diagonal still look right while every"}, {"t": "add", "l": "+off-diagonal entry lands in the wrong box, which is why a corner check never catches the error."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**A per-row condition on \"the next\" item is tested against the key column, one row past the"}, {"t": "add", "l": "+target.** Apply this only when all three hold: the target spans **more than one row**; its rows are"}, {"t": "add", "l": "+keyed by a **label column outside the target** (dates, names, periods \u2014 so the target does not begin"}, {"t": "add", "l": "+at column A); and the instruction makes **each row's** result conditional on a **next** label"}, {"t": "add", "l": "+existing \u2014 \"use the next row's date as the end boundary\", \"only when a next date exists\", \"not when"}, {"t": "add", "l": "+it is the last one in the dataset\". Then read that key column **one row beyond the target's last"}, {"t": "add", "l": "+row** and test the condition against what you find there:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+keys = \u00abredacted\u00bb key_col).value for r in range(r1, r2 + 2)]   # r2 + 2: one row PAST the target"}, {"t": "add", "l": "+for i, r in enumerate(range(r1, r2 + 1)):"}, {"t": "add", "l": "+    nxt = keys[i + 1]            # may sit outside answer_position \u2014 that is normal and expected"}, {"t": "add", "l": "+    if nxt is None:"}, {"t": "add", "l": "+        continue                 # genuinely no next item"}, {"t": "add", "l": "+    # ... compute row r using nxt as the boundary ..."}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Building the list from the target's own rows alone and then treating its last element as \"no next"}, {"t": "add", "l": "+item\" leaves the final row empty when the expected answer fills it. The edge of `answer_position`"}, {"t": "add", "l": "+is where you may *write*; it is not where the data ends \u2014 \"the last row **of the dataset**\" means"}, {"t": "add", "l": "+the last row of the data, which usually continues past the target. Read exactly one row further \u2014"}, {"t": "add", "l": "+and do not widen the scan to some other range the instruction merely mentions in passing."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**\"Still open / still active at the end of period P\" is a SNAPSHOT at P's boundary, not an overlap"}, {"t": "add", "l": "+with P.** Apply this only when all three hold: the graded cells are **counts** keyed by a date or"}, {"t": "add", "l": "+period label; the **header of the graded column itself** names a boundary (\"\u2026 as of <date>\", \"\u2026 by"}, {"t": "add", "l": "+the end of <month>\", \"\u2026 open at end of Q3\"); and each source record carries a **pair** of dates,"}, {"t": "add", "l": "+one for entering the state and one for leaving it (created/closed, opened/resolved, in/out). Then a"}, {"t": "add", "l": "+record counts at boundary `b` only if it entered on or before `b` and had **not yet left** at `b`:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+counts = start <= b and (end is None or end > b)          # snapshot AT the boundary"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The looser reading \u2014 \"was in that state at some point during the period\" \u2014 is a different set:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+counts = start <= last_day and (end is None or end >= first_day)   # overlap WITH the period"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Overlap also counts records that had already left the state before the boundary, so every count"}, {"t": "add", "l": "+comes out **too high**. When the column header names a boundary, use the snapshot test. Use overlap"}, {"t": "add", "l": "+only when the instruction actually asks for activity *during* a span (\"open at any time in May\","}, {"t": "add", "l": "+\"closed during the month\"). This does **not** apply to summing transactions that fall inside a time"}, {"t": "add", "l": "+window \u2014 that is a range filter, not a state snapshot."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Note that a prose paraphrase like \"not closed before the first day of the month and not created"}, {"t": "add", "l": "+after the last day\" describes *overlap*, while a graded header reading \"open by the end of <month>\""}, {"t": "add", "l": "+describes the *snapshot*. When the two disagree, the **graded column's own header** is what the"}, {"t": "add", "l": "+expected answer was built from \u2014 the prose is the asker's loose restatement. Follow the header."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 3. Reading the preview correctly"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+`spreadsheet_content` is `pandas.read_excel(...).head()` printed as text. Translating it to Excel"}, {"t": "add", "l": "+addresses needs care:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- pandas consumed **Excel row 1 as the column header**, so preview DataFrame row `i` is"}, {"t": "add", "l": "+  **Excel row `i + 2`**."}, {"t": "add", "l": "+- The unlabeled leftmost column of `0, 1, 2, \u2026` is the pandas index. It is **not** a spreadsheet"}, {"t": "add", "l": "+  column. The first real column shown is Excel column **A**, the next **B**, and so on; a column"}, {"t": "add", "l": "+  whose header cell is empty appears as `Unnamed: k` and is Excel column number `k + 1`."}, {"t": "add", "l": "+- `[data extent: rows 1-N, cols A-X]` is measured on the **whole** sheet and is accurate. Trust"}, {"t": "add", "l": "+  it. The handful of printed rows is a sample \u2014 never infer where the data ends from them. If the"}, {"t": "add", "l": "+  extent says rows 1-4000, there are 4000 rows to process."}, {"t": "add", "l": "+- Before writing, confirm the address of one known landmark (a header string, the last data row)"}, {"t": "add", "l": "+  with openpyxl and `print` it. An off-by-one row means every cell you write is wrong."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 4. Preserve everything you were not asked to change"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Either approach works for computing and writing the answer \u2014 `pandas.read_excel` \u2192"}, {"t": "add", "l": "+`DataFrame.to_excel(output_path, index=False)`, or `openpyxl.load_workbook` \u2192 set cells \u2192"}, {"t": "add", "l": "+`wb.save(output_path)`. Use whichever suits the task. Two situations, however, require openpyxl,"}, {"t": "add", "l": "+because a `to_excel` rebuild writes the DataFrame's own grid over the sheet and loses anything"}, {"t": "add", "l": "+that was not in it:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Appending / consolidating** \u2014 the instruction says \"into the first available blank rows\","}, {"t": "add", "l": "+  \"add to the bottom of\", \"consolidate into sheet X\". Here the existing rows must survive and"}, {"t": "add", "l": "+  your rows go *below* them. Find the first blank row by scanning, then write into it with"}, {"t": "add", "l": "+  openpyxl. Never rebuild the sheet, and never conclude from a row-count coincidence that the"}, {"t": "add", "l": "+  data is already consolidated \u2014 verify by reading the rows themselves."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  ```python"}, {"t": "add", "l": "+  r = 2"}, {"t": "add", "l": "+  while ws.cell(r, 1).value is not None:"}, {"t": "add", "l": "+      r += 1          # r is now the first blank row; write your rows from here down"}, {"t": "add", "l": "+  ```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  **If that scan found rows already there (`r > 2`), those rows are the specification.** \"Match the"}, {"t": "add", "l": "+  data layout of the other rows\" is not only about column order. Print a couple of existing"}, {"t": "add", "l": "+  destination rows with `repr()` next to the source rows they were built from, column by column:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  ```python"}, {"t": "add", "l": "+  for r0 in (2, 3):"}, {"t": "add", "l": "+      print(\"dest\", r0, [repr(wsd.cell(r0, c).value) for c in range(1, n_target_cols + 1)])"}, {"t": "add", "l": "+  print(\"src  2\",      [repr(wss.cell(2, c).value) for c in range(1, n_source_cols + 1)])"}, {"t": "add", "l": "+  ```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  `repr()` matters here. Look for a column where the existing rows hold a **placeholder string**"}, {"t": "add", "l": "+  and the source cell is empty \u2014 `'None'`, `'N/A'`, `'-'`, or a literal `0`. The string `'None'` is"}, {"t": "add", "l": "+  four characters of text, not an empty cell, and the grader compares cell by cell: only `None` and"}, {"t": "add", "l": "+  `\"\"` count as empty and match each other. So every appended row you leave blank in such a column"}, {"t": "add", "l": "+  is a wrong cell, multiplied by every row you append. Carry the convention across:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  ```python"}, {"t": "add", "l": "+  v = wss.cell(r, source_col).value"}, {"t": "add", "l": "+  ws.cell(row, target_col).value = fill_when_empty if v is None else v"}, {"t": "add", "l": "+  ```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  Verify by proportion, not by spot-check: for each target column, compare the fraction of"}, {"t": "add", "l": "+  non-empty cells across the pre-existing rows with the fraction across the rows you appended. A"}, {"t": "add", "l": "+  column that is fully populated in the existing rows and sparse in yours means you dropped a"}, {"t": "add", "l": "+  convention. Do not apply it in reverse \u2014 where the existing rows leave a column genuinely empty,"}, {"t": "add", "l": "+  leave it empty."}, {"t": "add", "l": "+- **The sheet holds content your DataFrame does not carry** \u2014 other populated columns outside"}, {"t": "add", "l": "+  the range you computed, or cells below/beside the block you rebuilt. Set only the target cells"}, {"t": "add", "l": "+  with openpyxl instead."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+In all cases: do not add, delete, rename or re-serialize a sheet the instruction does not"}, {"t": "add", "l": "+mention. Writing a helper value into an empty cell outside `answer_position` is harmless;"}, {"t": "add", "l": "+destroying content that was already there is not."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+One openpyxl trap: **never save a workbook you opened with `data_only=True`.** That mode discards"}, {"t": "add", "l": "+the formulas and keeps only cached values, so saving it rewrites every other formula in the file as"}, {"t": "add", "l": "+a literal. Use `data_only=True` for *reading* values, and load a second, separate workbook without"}, {"t": "add", "l": "+it for the copy you modify and save."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# 5. Other recurring pitfalls"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Float comparisons.** `110 >= 100 * 1.1` is `False` (the right side is `110.00000000000001`)."}, {"t": "add", "l": "+  When comparing values derived from percentage or decimal arithmetic, allow a small tolerance:"}, {"t": "add", "l": "+  `if a >= b - 1e-9:`."}, {"t": "add", "l": "+- **Blanks are not zeros.** Decide from the instruction whether an empty cell should be skipped"}, {"t": "add", "l": "+  or treated as `0`; `NaN` silently becoming `0` changes counts and sums."}, {"t": "add", "l": "+- **`NaN`.** `float('nan')` written to a cell is not a number the grader will match. Convert"}, {"t": "add", "l": "+  missing values to `None` (empty) or to the value the instruction calls for."}, {"t": "add", "l": "+- **Whole-column ranges and `dropna`.** `dropna(how=\"all\")` collapses blank and header rows and"}, {"t": "add", "l": "+  shifts every subsequent row; avoid it when the output must stay aligned to specific rows."}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,177 @@"}, {"t": "add", "l": "+<!--"}, {"t": "add", "l": "+  Capability file: the agent's FIRST USER MESSAGE. Placeholders are filled in per task and are"}, {"t": "add", "l": "+  load-bearing \u2014 {instruction} {spreadsheet_path} {spreadsheet_content} {instruction_type}"}, {"t": "add", "l": "+  {answer_position} {output_path} must all survive; {max_turns} is optional. A literal brace is"}, {"t": "add", "l": "+  written {{ or }}. This comment is stripped before the agent sees the message."}, {"t": "add", "l": "+-->"}, {"t": "add", "l": "+Solve the following spreadsheet manipulation task. It is described by six fields:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **instruction** \u2014 what to do. It is written as a question from a spreadsheet user, so it often"}, {"t": "add", "l": "+  asks \"what formula should I use\". What is graded is the resulting cell **values**, never a"}, {"t": "add", "l": "+  formula string (see the CONTRACT below)."}, {"t": "add", "l": "+- **spreadsheet_path** \u2014 the input workbook. Read it; never modify it in place."}, {"t": "add", "l": "+- **spreadsheet_content** \u2014 a `pandas.read_excel(...).head()` preview of each sheet, plus the"}, {"t": "add", "l": "+  sheet's true `[data extent]` and the size of the target range. The printed rows are a sample;"}, {"t": "add", "l": "+  the data extent is the whole sheet."}, {"t": "add", "l": "+- **instruction_type** \u2014 `Cell-Level Manipulation`: `answer_position` is the exact set of cells"}, {"t": "add", "l": "+  that is graded. `Sheet-Level Manipulation`: `answer_position` is the **maximum** range you may"}, {"t": "add", "l": "+  modify, and the expected answer often fills only part of it."}, {"t": "add", "l": "+- **answer_position** \u2014 the graded cell(s)/range. It bounds *where* you may write; the"}, {"t": "add", "l": "+  **instruction** says *what* goes where. When the instruction names a more specific place (e.g."}, {"t": "add", "l": "+  \"put the result starting at I3, with headers\"), follow the instruction \u2014 do not spread your"}, {"t": "add", "l": "+  answer over the whole range just because the range is bigger."}, {"t": "add", "l": "+- **output_path** \u2014 write the finished workbook to this exact path."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction"}, {"t": "add", "l": "+{instruction}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_path"}, {"t": "add", "l": "+{spreadsheet_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_content"}, {"t": "add", "l": "+{spreadsheet_content}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction_type"}, {"t": "add", "l": "+{instruction_type}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### answer_position"}, {"t": "add", "l": "+{answer_position}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### output_path"}, {"t": "add", "l": "+{output_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## CONTRACT \u2014 what makes an answer correct"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The grader opens your file with `openpyxl.load_workbook(output_path, data_only=True)` and"}, {"t": "add", "l": "+compares the **stored values** in `answer_position` to the expected workbook. It does **not**"}, {"t": "add", "l": "+recalculate formulas and it does **not** read anything you write in prose."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. Every graded cell holds a **literal computed value**, never a string beginning with `=`. A"}, {"t": "add", "l": "+   formula written by openpyxl has no cached value and reads back as empty, so it scores zero"}, {"t": "add", "l": "+   however correct it is \u2014 including when the instruction asks for a \"formula\"."}, {"t": "add", "l": "+2. Values are **correctly typed**: numbers as `int`/`float` (never `\"1,234\"`, `\"$5.00\"`,"}, {"t": "add", "l": "+   `\"12%\"`), dates as `datetime` objects, text as the exact string. Never an Excel error marker"}, {"t": "add", "l": "+   such as `#N/A`. Numbers are compared rounded to 2 decimals."}, {"t": "add", "l": "+3. Every cell the expected answer fills is filled, and every cell inside `answer_position` that"}, {"t": "add", "l": "+   the instruction does **not** ask you to change or clear still holds its **original input"}, {"t": "add", "l": "+   value**. Already-filled target cells are usually the asker's worked example \u2014 reproduce them,"}, {"t": "add", "l": "+   don't overwrite them."}, {"t": "add", "l": "+4. Content the instruction never mentions \u2014 other sheets, other populated columns, formatting \u2014"}, {"t": "add", "l": "+   still holds what it held in the input. Filling an empty helper cell is harmless; overwriting"}, {"t": "add", "l": "+   or blanking data that was already there is not."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## HOW TO WORK \u2014 you have up to {max_turns} rounds"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Each reply must be **exactly one ```python fenced code block** and nothing else. Its stdout is"}, {"t": "add", "l": "+returned to you; if it raises, you get the traceback and can fix it. Only the first block in a"}, {"t": "add", "l": "+reply is run, so never write ahead or imagine what a print will show \u2014 wait for the real output. Work through these three"}, {"t": "add", "l": "+phases in order."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 1 \u2014 INSPECT (1\u20132 rounds; do not skip).** Never write your answer from the preview alone."}, {"t": "add", "l": "+Load the input and `print` what you need to be certain about:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+import openpyxl"}, {"t": "add", "l": "+wb  = openpyxl.load_workbook(\"<spreadsheet_path>\", data_only=True)   # stored values"}, {"t": "add", "l": "+wbf = openpyxl.load_workbook(\"<spreadsheet_path>\")                   # formulas as written"}, {"t": "add", "l": "+for s in wb.worksheets:"}, {"t": "add", "l": "+    print(s.title, s.max_row, s.max_column)"}, {"t": "add", "l": "+ws, wsf = wb[\"<sheet>\"], wbf[\"<sheet>\"]"}, {"t": "add", "l": "+# The target cells: what is already there, and any formula that documents the intent."}, {"t": "add", "l": "+for addr in [\"<every NON-EMPTY cell of answer_position \u2014 an example may sit at the bottom>\"]:"}, {"t": "add", "l": "+    print(addr, repr(ws[addr].value), type(ws[addr].value).__name__, \"| formula:\", repr(wsf[addr].value))"}, {"t": "add", "l": "+# The neighbours that define the computation: headers, axis labels, key columns."}, {"t": "add", "l": "+for r in range(1, 12):"}, {"t": "add", "l": "+    print(r, [ws.cell(r, c).value for c in range(1, 13)])"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Then state, in a comment, the reading you have settled on and the evidence for it \u2014 an existing"}, {"t": "add", "l": "+formula, an axis label, or an already-filled target cell your computation must reproduce. If two"}, {"t": "add", "l": "+readings of the instruction are possible, the one that matches the cells already in the file is"}, {"t": "add", "l": "+the right one."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 1b \u2014 CALIBRATE against a filled sibling column, when one exists (do not skip).** Look at"}, {"t": "add", "l": "+the columns and rows immediately *outside* `answer_position`, on the same rows or in the same"}, {"t": "add", "l": "+band as the target. When one of them is **already filled** and its header names the **same"}, {"t": "add", "l": "+quantity as the graded columns, at a different parameter** \u2014 `Open as of today` beside"}, {"t": "add", "l": "+`Open by end of May` / `\u2026 of Jun`; `Q1 total` beside `Q2 total`; `2023 count` beside `2024 count`"}, {"t": "add", "l": "+\u2014 that filled column is a **worked example of the function you are being asked to write**, and"}, {"t": "add", "l": "+the expected answer was produced by the same function at a different parameter. It is the one"}, {"t": "add", "l": "+oracle in the file that can tell you your reading is wrong *before* you are graded, so use it:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+def f(param):                        # your candidate reading, parameterised"}, {"t": "add", "l": "+    ..."}, {"t": "add", "l": "+# Reproduce the FILLED sibling column with the SAME function, then compare cell by cell."}, {"t": "add", "l": "+got      = [f(sibling_param) for _ in target_rows]"}, {"t": "add", "l": "+expected = [ws.cell(r, sibling_col).value for r in target_rows]"}, {"t": "add", "l": "+print(\"calibration:\", list(zip(expected, got)), \"MATCH\" if got == expected else \"MISMATCH\")"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If it prints `MISMATCH`, your reading of the instruction is wrong \u2014 **fix the function before you"}, {"t": "add", "l": "+write anything**. Do not proceed because the numbers look close or differ on only a few rows: the"}, {"t": "add", "l": "+sibling column and the graded columns are computed the same way, so a function that cannot"}, {"t": "add", "l": "+reproduce the one you can check will not match the ones you cannot."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+This matters most when the instruction's prose and the graded column's **header** describe"}, {"t": "add", "l": "+different computations. A paraphrase like \"open if it was not closed before the first day of the"}, {"t": "add", "l": "+month and not created after the last day\" describes an **overlap with the period**; a header"}, {"t": "add", "l": "+reading \"open by the end of <month>\" describes a **snapshot at that boundary** \u2014 a strictly"}, {"t": "add", "l": "+smaller set, because overlap also counts records that had already left the state. When prose and"}, {"t": "add", "l": "+header disagree, the calibration column settles it, and it is what the expected answer was built"}, {"t": "add", "l": "+from. Prefer the reading that reproduces it over the reading the prose suggests."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 2 \u2014 WRITE.** Compute every value in Python, assign the literals, and save to"}, {"t": "add", "l": "+`output_path`. In the **same** block, re-open the file you just saved and print the graded cells:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+# Two copies: READ every input value from wbv (cached values), WRITE into wb (keeps formulas)."}, {"t": "add", "l": "+# Saving a workbook opened data_only=True replaces every other formula in the file with its value."}, {"t": "add", "l": "+wbv = openpyxl.load_workbook(\"<spreadsheet_path>\", data_only=True)"}, {"t": "add", "l": "+wb  = openpyxl.load_workbook(\"<spreadsheet_path>\")"}, {"t": "add", "l": "+wsv, ws = wbv[\"<sheet>\"], wb[\"<sheet>\"]"}, {"t": "add", "l": "+# ... compute from wsv[...].value, assign the literal results to ws[...] ..."}, {"t": "add", "l": "+# Any formula still inside answer_position would read back empty: store its value instead"}, {"t": "add", "l": "+# (the cached one, or your recomputed one if its inputs changed)."}, {"t": "add", "l": "+for row in ws[\"<answer_position range>\"]:"}, {"t": "add", "l": "+    for c in row:"}, {"t": "add", "l": "+        if isinstance(c.value, str) and c.value.startswith(\"=\"):"}, {"t": "add", "l": "+            c.value = wsv[c.coordinate].value"}, {"t": "add", "l": "+wb.save(output_path)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+chk = openpyxl.load_workbook(output_path, data_only=True)     # exactly what the grader sees"}, {"t": "add", "l": "+src = openpyxl.load_workbook(\"<spreadsheet_path>\", data_only=True)"}, {"t": "add", "l": "+for addr in [\"<cells of answer_position \u2014 sample ~20 if the range is large>\"]:"}, {"t": "add", "l": "+    v = chk[\"<sheet>\"][addr].value"}, {"t": "add", "l": "+    print(addr, repr(v), type(v).__name__, \"| was:\", repr(src[\"<sheet>\"][addr].value))"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+For a range of hundreds or thousands of cells, print a summary instead of every cell: how many"}, {"t": "add", "l": "+are non-empty, the set of types present, how many start with `=`, how many are error markers, and"}, {"t": "add", "l": "+the first and last few values."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**Phase 3 \u2014 VERIFY, then stop.** Read that output and check each item:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- no value is a string starting with `=`, and none is `#N/A` / `#VALUE!` / `#DIV/0!` / `#NUM!`;"}, {"t": "add", "l": "+- no cell is `None` where the answer should have a value;"}, {"t": "add", "l": "+- every number is `int`/`float`, not `str`; every date is a `datetime`;"}, {"t": "add", "l": "+- any target cell the instruction did not ask you to change or clear still shows its `was:` value"}, {"t": "add", "l": "+ // blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}
