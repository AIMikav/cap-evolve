<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);

header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}

.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}

svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}

.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}

.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);

.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}

.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);

readsheet/):\n       SPREADSHEETBENCH_DATA_DIR=/some/cache/dir/sample_data_200\n     SPREADSHEETBENCH_VARIANT selects which release: `sample_200`, `full_912` (the original\n     912-task set, 3 graded copies per task) or `verified_400` (the 400-task verified\n     re-release, 1 graded copy per task \u2014 what recent published work evaluates on). The\n     adapter reads the number of graded copies off disk, so all three just work.\n\n  3. Install Docker (required \u2014 each task runs in its own sandboxed container) and,\n     for accurate scoring of formula-bearing outputs, LibreOffice:\n       sudo apt install libreoffice-calc   # Debian/Ubuntu\n       sudo dnf install libreoffice-calc   # RHEL/Fedora\n       brew install --cask libreoffice     # macOS\n     Scoring degrades gracefully (skips recalculation) if LibreOffice is absent \u2014 but\n     silently: a formula-only cell then reads as empty and never matches, so a task the\n     agent actually solved scores 0. Treat the \"LibreOffice not found\" warning as a\n     setup error, not a nicety. Upstream's docstring asks for 7.5+; RHEL 9's 7.1.8.1\n     recalculates correctly through `--convert-to xlsx` and is verified in use.\n\n  4. Install adapter deps: pip install pandas openpyxl docker tornado requests\n\n  5. Copy this directory to .capevolve/project/adapters/, copy model_config.py alongside.\n\n  6. Set env vars (in .env or shell) \u2014 any litellm provider, see model_config.py:\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  7. Optional env vars:\n       SPREADSHEETBENCH_TASK_IDS=59196,58568         # comma-separated subset (default: all 200)\n       SPREADSHEETBENCH_MAX_TURNS=5                  # rounds of code-exec interaction per task\n       SPREADSHEETBENCH_ROWS=5                       # preview rows shown per sheet in the prompt\n       SPREADSHEETBENCH_CONCURRENCY=4                # parallel tasks (each = one Docker container)\n       SPREADSHEETBENCH_EXEC_TIMEOUT=180             # per code-exec call timeout (s)\n       SPREADSHEETBENCH_LIBREOFFICE_BIN=/path/to/soffice\n\n  8. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES \u2014 ALL the text the agent reads, in two files:\n  - prompt.md         the system prompt: who the agent is, how it should work.\n  - task_template.md  the per-task user message: how the job is framed, what the fields\n                      mean, and the interaction contract. Optional \u2014 no file falls back to\n                      the built-in _TASK_TEMPLATE, so older capabilities are unaffected.\n  Keeping the job description frozen in this file used to leave ~60% of the agent's\n  instruction surface un-optimizable, including the line \"once that file exists, you are\n  done\" \u2014 which encourages exactly the dominant failure (a wrong-but-present output file).\n  Per-task VALUES (instruction, paths, preview, answer_position) are still supplied by the\n  adapter through placeholders that live() validates; see _task_template_error.\n\nHOW IT WORKS:\n  - task \u2026[+102965 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 310, "preview": "{\"train\": [\"250-20\", \"262-17\", \"32438\", \"32902\", \"47766\", \"48365\", \"48745\", \"493-18\", \"52216\", \"54638\"], \"val\": [\"250-20\", \"262-17\", \"32438\", EASURED; changing them\ndoes not improve the capability, and a gain obtained that way is not a result. An\niteration that edits infrastructure has produced NOTHING measurable, however green the\nnumber looks. **If the traces show an ENVIRONMENT fault** (permission denied, missing\nbinary, gateway/network error, timeout, container failure \u2014 the same error on nearly every\ntask, unrelated to the task's content), then the correct and complete action is:\n1. do NOT edit the prompt to work around it (a prose workaround for a broken environment\n   is a speculative edit that fails the REAL test \u2014 the prompt is not the defect), and\n2. state the diagnosis in `PROCESS.md` and `JOURNAL.md` precisely \u2014 the exact error, how\n   many tasks it hit, and what a human must fix \u2014 then STOP. Handing back an accurate\n   \"the environment is broken, here is the evidence\" is a SUCCESSFUL iteration.\n\n**The other way iterations get wasted: another prose rule for a behavior the agent already\nknows.** When the agent has the rule and skips it anyway, adding a second sentence saying\nthe same thing changes nothing \u2014 you must change the STRUCTURE that makes it skippable\n(see the levers below): make the step unavoidable and ordered, make the contract explicit,\nor give a worked example it can pattern-match. Prose is for genuine KNOWLEDGE gaps (a\nfact / format / criterion the agent cannot derive) and for STRUCTURE that changes what the\nagent does \u2014 not for repetition or emphasis.\n\n## The THREE TESTS every change must pass (this is the whole game)\nBefore you keep any edit, confirm all three. Drop any edit that fails even one.\n1. **REAL** \u2014 it targets a cluster that is FAILING in THIS iteration's `./trajectories/`\n   (reward 0, partial-credit, or communication/omission). Never edit for a hypothetical\n   problem, and never edit on account of a task whose failure is an environment fault.\n2. **SAFE (bounded blast radius)** \u2014 the real regression question is *behavioral*:\n   **would this edit change what the agent DOES on ANY currently-passing task?** Two\n   blast-radius classes:\n   - **BOUNDED** \u2014 an ADDITIVE rule that applies only under a stated condition present in\n     the failing cases, or a clarification of an output contract the passing tasks already\n     satisfy. This is the SAFE default \u2014 prefer it.\n   - **UNBOUNDED** \u2014 any edit to a GLOBAL decision/permission/refusal rule, or a \u2026[+13631 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/prompt.md", "size": 965, "preview": "You are a spreadsheet expert who can manipulate spreadsheets through Python code.\n\nSolve the given spreadsheet manipulation question precisely:\n- Read the instruction, spreadsheet content preview, instruction type, and answer position carefully before writing any code.\n- For Cell-Level Manipulation questions, modify or fill in values ONLY within the exact cell(s) given in answer_position.\n- For Sheet-Level Manipulation questions, modify or fill in values ONLY within the cell range given in answer_position \u2014 never touch cells outside that range.\n- Prefer computing and writing LITERAL values (e.g. with pandas/openpyxl) over live spreadsheet formulas, so the result is unambiguous when the file is re-opened for grading.\n- Always save your result to the exact output_path given, creating any missing parent directories first.\n- If code execution returns an error, read the traceback carefully and fix the code \u2014 do not repeat a failing approach unchanged.\n", "truncated": false, "binary": false}, {"path": "seed_capability/task_template.md", "size": 2453, "preview": "<!--\n  THE AGENT'S JOB DESCRIPTION \u2014 editable capability text, same as prompt.md.\n\n  Everything below is sent to the agent as its first user message, so it is part of the\n  skill you are optimizing: reword it, restructure it, add or remove guidance, change the\n  interaction contract. This comment block is STRIPPED before the agent sees it.\n\n  LOAD-BEARING PLACEHOLDERS \u2014 these are filled in per task and must SURVIVE any edit:\n    {instruction} {spreadsheet_path} {spreadsheet_content} {instruction_type}\n    {answer_position} {output_path}\n  Optional: {max_turns}. No other {braces} are allowed.\n\n  If a required placeholder goes missing, or an unknown one appears, the candidate is\n  REJECTED before any task runs \u2014 the agent would otherwise be told to write its answer to\n  a path it was never given. A literal brace must be doubled: {{ or }}.\n-->\nYou need to solve the following spreadsheet manipulation question. It contains six pieces of information:\n- instruction: the question about spreadsheet manipulation.\n- spreadsheet_path: the path of the spreadsheet file you need to manipulate.\n- spreadsheet_content: the target range's total size, the location of the other graded copies\n  of this workbook, each sheet's real data extent, and the first few rows of the content.\n- instruction_type: Cell-Level Manipulation (answer_position is exact cell(s)) or Sheet-Level Manipulation (answer_position is the maximum range you may modify).\n- answer_position: the cell(s)/range you must modify or fill in.\n- output_path: write the modified spreadsheet file to this exact path.\n\n### instruction\n{instruction}\n\n### spreadsheet_path\n{spreadsheet_path}\n\n### spreadsheet_content\n{spreadsheet_content}\n\n### instruction_type\n{instruction_type}\n\n### answer_position\n{answer_position}\n\n### output_path\n{output_path}\n\nYou have up to {max_turns} rounds of interaction. In each round, reply with exactly ONE python code block:\n1. Information-gathering code (e.g. inspecting the file) \u2014 the execution result is returned to you.\n2. Solution code that writes the modified file to output_path.\n3. Verification code: re-open output_path and print the values you wrote in answer_position,\n   to confirm they are correct before finishing. If they are wrong, fix your code and write again.\nReply without a code block when you are satisfied the saved file is correct.\nIf your code raises an error, the traceback will be returned to you; fix the code and try again.\n", "truncated": false, "binary": false}]}, "host_session": {}}, "diffs": {"cand_0001": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -6,4 +6,6 @@"}, {"t": "ctx", "l": " - For Sheet-Level Manipulation questions, modify or fill in values ONLY within the cell range given in answer_position \u2014 never touch cells outside that range."}, {"t": "ctx", "l": " - Prefer computing and writing LITERAL values (e.g. with pandas/openpyxl) over live spreadsheet formulas, so the result is unambiguous when the file is re-opened for grading."}, {"t": "add", "l": "+- **Crucial: Write values using their native Python types (e.g., int, float, datetime.datetime, datetime.time) rather than as strings, unless the data is explicitly text. This ensures Excel recognizes them as numbers or dates.**"}, {"t": "ctx", "l": " - Always save your result to the exact output_path given, creating any missing parent directories first."}, {"t": "ctx", "l": " - If code execution returns an error, read the traceback carefully and fix the code \u2014 do not repeat a failing approach unchanged."}, {"t": "add", "l": "+- **Output Contract: You must reply with exactly ONE ```python fenced code block containing runnable code. Do not use XML tags (like <|python_interpreter|>) or any other wrapper; only standard markdown python blocks.**"}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -45,6 +45,5 @@"}, {"t": "ctx", "l": " 1. Information-gathering code (e.g. inspecting the file) \u2014 the execution result is returned to you."}, {"t": "ctx", "l": " 2. Solution code that writes the modified file to output_path."}, {"t": "del", "l": "-3. Verification code: re-open output_path and print the values you wrote in answer_position,"}, {"t": "del", "l": "-   to confirm they are correct before finishing. If they are wrong, fix your code and write again."}, {"t": "add", "l": "+3. Verification code: re-open output_path and print the values you wrote in answer_position, and verify that the number of modified cells matches your expectation. If they are wrong or incomplete, fix your code and write again."}, {"t": "ctx", "l": " Reply without a code block when you are satisfied the saved file is correct."}, {"t": "ctx", "l": " If your code raises an error, the traceback will be returned to you; fix the code and try again."}]}]}}</script>

// A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}

/* ---------- 1d. Rejected edits, deduplicated by reason ---------- */
(function(){
  const norm=r=>(r||'rejected').replace(/-?\d+\.\d+/g,'N').replace(/-?\d+/g,'N').trim();
  const map=new Map();
  for(const n of G.nodes){ if(n.status!=='rejected')continue;
    const k=norm(n.reason); const cur=map.get(k)||{reason:k,count:0,ex:[]};
    cur.count++; if(cur.ex.length<3)cur.ex.push(n.id); map.set(k,cur);}
  const ends=[...map.values()].sort((a,b)=>b.count-a.count);
  if(!ends.length)return;
  const s=sec('Rejected edits, grouped by the gate reason');
  for(const d of ends){const e=$('div',{class:'dead'});
    if(d.count>1)e.append($('span',{class:'x',text:'×'+d.count}));
    e.append($('div',{class:'muted',text:d.ex.join(', ')}),$('div',{text:d.reason}));
    s.append(e);}
})();

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

/* ---------- 3. tasks × iterations pass/fail heatmap ---------- */
(function(){
  const tasks=S.tasks||[];
  const iters=G.nodes.filter(n=>Object.keys(n.per_task||{}).length).sort((a,b)=>a.iteration-b.iteration);
  if(!tasks.length||iters.length<1)return;
  const s=sec('Per-task pass/fail across iterations');
  // sort rows worst-first by mean reward
  const meanFor=t=>{let sum=0,n=0;iters.forEach(it=>{if(it.per_task[t]!=null){sum+=it.per_task[t];n++;}});return n?sum/n:0;};
  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));
  const cw=Math.max(10,Math.min(26,Math.floor(1000/iters.length))),ch=16,labW=120;
  const W=labW+iters.length*cw+10,H=rows.length*ch+24;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'heat'});
  iters.forEach((it,j)=>txt(el,{x:labW+j*cw+cw/2,y:12,'text-anchor':'middle'},it.iteration));
  rows.forEach((t,i)=>{
    txt(el,{x:labW-6,y:24+i*ch+11,'text-anchor':'end'},t.length>16?t.slice(0,15)+'…':t);
    iters.forEach((it,j)=>{
      const v=it.per_task[t];
      const col=v==null?'var(--card3)':v>=0.999?'var(--ok)':v<=0.001?'var(--bad)':'var(--warn)';
      const rect=svg('rect',{x:labW+j*cw,y:24+i*ch,width:cw-1.5,height:ch-1.5,rx:2,fill:col});
      const fb=(it.feedback&&it.feedback[t])||'';
      rect.addEventListener('mousemove',e=>showTip(e,`${t} @ iter ${it.iteration} (${it.id})\nreward=${v==null?'—':v.toFixed(3)}\n${fb.slice(0,180)}`));
      rect.addEventListener('mouseleave',hideTip);
      el.append(rect);
    });
  });
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>pass</span><span><i style="background:var(--bad)"></i>fail</span>'+
    '<span><i style="background:var(--warn)"></i>partial</span><span><i style="background:var(--card3)"></i>not run</span>'+
    '<span class="muted">rows sorted worst-first · hover a cell for feedback</span>'}));
})();

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

/* ---------- 9. Activity log — every event, filterable ---------- */
(function(){
  const LOG=S.log||[]; if(!LOG.length)return;
  const s=sec('Activity log — every event this run recorded');
  const bar=$('div',{class:'row',style:'margin-bottom:10px;align-items:center'});
  const q=$('input',{type:'search',placeholder:'search kind, candidate, message…',style:'flex:1;min-width:180px'});
  const phase=$('select'); ['all','intake','baseline','optimize','finalize'].forEach(p2=>
    phase.append($('option',{value:p2,text:p2})));
  const kind=$('select');
  ['all',...[...new Set(LOG.map(r=>r.kind))].sort()].forEach(k=>kind.append($('option',{value:k,text:k})));
  const count=$('span',{class:'muted num'});
  bar.append(q,$('span',{class:'muted',text:'phase'}),phase,$('span',{class:'muted',text:'kind'}),kind,count);
  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));
    if(typeof d.opt_cost_usd==='number')b.push('opt $'+d.opt_cost_usd.toFixed(4));
    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();
    const rows=LOG.filter(r=>{
      if(phase.value!=='all'&&r.phase!==phase.value)return false;
      if(kind.value!=='all'&&r.kind!==kind.value)return false;
      if(!needle)return true;
      return (r.kind+' '+(r.candidate||'')+' '+(r.text||'')+' '+JSON.stringify(r.detail||{}))
        .toLowerCase().includes(needle);
    });
    count.textContent=rows.length+'/'+LOG.length;
    list.innerHTML='';
    if(!rows.length){list.append($('p',{class:'muted',text:'No event matches this filter.'}));return;}
    rows.forEach(r=>{
      const row=$('div',{class:'logrow'});
      row.append($('span',{class:'muted num',text:clock(r.t)}),
        $('span',{class:'muted',style:'font-size:10px;text-transform:uppercase;letter-spacing:.05em',text:r.phase}),
        $('span',{class:'k',style:'color:'+(TONE[r.kind]||'var(--muted2)'),
                  text:r.kind+(r.candidate?' '+r.candidate:'')}),
        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);
      row.addEventListener('click',()=>{
        if(open.has(r.seq)){open.delete(r.seq);det.style.display='none';}
        else{open.add(r.seq);det.style.display='block';}
      });
    });
  }
  q.addEventListener('input',render);phase.addEventListener('change',render);
  kind.addEventListener('change',render);render();
})();

    row.append($('span',{class:'muted num',text:clock}),
      $('span',{class:'k',style:'color:var(--accent)',text:tn.role}),
      $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                text:gist}));
    list.append(row);
    const det=$('div',{class:'logdet'});
    det.textContent=tn.text; // model-authored — never parsed as markup
    det.style.display='none';
    list.append(det);
    row.addEventListener('click',()=>{det.style.display=det.style.display==='block'?'none':'block';});
  });
  if(HS.transcript_truncated)s.append($('p',{class:'muted',style:'margin-top:8px',text:
    'Showing the first '+turns.length+' of '+HS.transcript_total_lines+' turns — full record at '+
    HS.transcript_path}));
})();

/* ---------- 10e. agent-optimize internals — screens/compliance/minibatch/gepa/skillopt/parallel (#433) ---------- */
(function(){
  const C=S.capabilities||{}, AE=S.algo_extra||{};
  if(!(C.screens||C.compliance||C.minibatch||C.gepa||C.skillopt||C.parallel||
       C.round_batches||C.merge_rejects))return;
  const s=sec('agent-optimize internals');
  s.append($('p',{class:'muted',style:'margin:0 0 12px',text:
    "Signals the algorithm computed about its own process — which subset of tasks a cheap screen "+
    "evaluated, whether the discipline of screening before a full-val eval was actually followed, "+
    "and any minibatch/gepa/skillopt/parallel bookkeeping this run recorded."}));
  const h3=(t)=>$('h2',{style:'margin:16px 0 6px;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)',text:t});

  if(C.compliance){
    s.append(h3('Screen-before-full-val compliance'));
    const t=$('table');
    t.append($('tr',{},$('th',{text:'candidate'}),$('th',{class:'r',text:'iteration'}),
      $('th',{text:'screened before full-val'}),$('th',{text:'why skipped'})));
    (AE.compliance||[]).forEach(r=>t.append($('tr',{},
      $('td',{},$('code',{text:r.candidate})),
      $('td',{class:'r num',text:r.iteration}),
      $('td',{},$('span',{class:'badge '+(r.screened_before_fullval?'b-accepted':'b-rejected'),
        text:r.screened_before_fullval?'✓ yes':'✗ no'})),
      $('td',{class:'muted',style:'font-size:11px',text:r.skip_justification||'—'}))));
    s.append(t);
  }

  if(C.round_batches){
    s.append(h3('Round batches — sibling-count enforcement'));
    s.append($('p',{class:'muted',style:'margin:0 0 8px;font-size:11.5px',text:
      'agent-optimize\'s default is N≥ 3 sibling candidates per round.py invocation; '+
      'fewer requires a recorded reason (an explicit justification, or an unaffordable budget '+
      'detected from spend.py).'}));
    const t=$('table');
    t.append($('tr',{},$('th',{text:'batch'}),$('th',{class:'r',text:'siblings'}),
      $('th',{text:'candidates'}),$('th',{text:'why < 3'})));
    (AE.round_batches||[]).forEach(r=>{
      const below3=r.n_candidates<3;
      t.append($('tr',{},
        $('td',{},$('code',{text:r.batch_id||'—'})),
        $('td',{class:'r num',text:r.n_candidates},
          below3?$('span',{class:'badge b-rejected',style:'margin-left:6px',text:'<3'}):null),
        $('td',{class:'muted',style:'font-size:11px',text:(r.candidates||[]).join(', ')}),
        $('td',{class:'muted',style:'font-size:11px',text:below3?
          `${r.single_candidate_justification||'—'} (${r.single_candidate_justification_source||'unrecorded'})`
          :'—'})));
    });
    s.append(t);
  }

  if(C.merge_rejects){
    s.append(h3('Merge opportunity — safe-but-rejected candidates'));
    const w=AE.merge_rejects_warning;
    const box=$('div',{class:'dead',style:'border-left-color:'+(w.acted_on?'var(--ok)':'var(--warn)')});
    box.append($('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'},
      $('span',{text:w.safe_reject_candidates.length+' disjoint safe rejects never tried together: '}),
      ...w.safe_reject_candidates.map(cid=>$('code',{style:'margin-right:4px',text:cid})),
      $('span',{class:'badge '+(w.acted_on?'b-accepted':'b-rejected'),
        text:w.acted_on?'✓ merge proposed':'✗ unmerged'})));
    box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:
      'each individually zero-regression with a non-negative gate Δ — run merge_rejects.py '+
      '--propose on a disjoint subset to combine them.'}));
    s.append(box);
    (AE.merge_rejects_proposals||[]).forEach(p=>{
      s.append($('div',{class:'muted',style:'font-size:11px;margin:4px 0 0',text:
        'proposed: '+p.tag+' = '+p.rejects.join(' + ')+(p.built?' (built)':' (failed)')}));
    });
  }

  if(C.screens){
    s.append(h3('Screens — cheap subset evals'));
    (AE.screens||[]).forEach(sc=>{
      const box=$('div',{class:'dead',style:'border-left-color:var(--accent)'});
      const head=$('div',{style:'display:flex;flex-wrap:wrap;gap:8px;align-items:center'});
      head.append($('code',{text:sc.candidate}),
        $('span',{class:'badge '+(sc.decision==='pass'?'b-accepted':sc.decision==='fail'?'b-rejected':'b-indecisive'),
          text:String(sc.decision||'—')+(sc.inconclusive?' (inconclusive)':'')}));
      if(sc.tier!=null)head.append($('span',{class:'muted',style:'font-size:11px',text:'tier '+sc.tier}));
      box.append(head);
      const bits=[];
      if((sc.ids||[]).length)bits.push('subset ('+sc.ids.length+'): '+sc.ids.join(', '));
      if((sc.fixed||[]).length)bits.push('fixed: '+sc.fixed.join(', '));
      if((sc.regressed||[]).length)bits.push('regressed: '+sc.regressed.join(', '));
      if(sc.mean_delta!=null)bits.push('Δ='+(+sc.mean_delta).toFixed(3)+(sc.se!=null?' ± '+(+sc.se).toFixed(3):''));
      if(sc.threshold!=null)bits.push('threshold='+sc.threshold);
      box.append($('div',{class:'muted num',style:'font-size:11px;margin-top:4px',text:bits.join('  ·  ')}));
      if(sc.rationale)box.append($('div',{class:'muted',style:'font-size:11px;margin-top:4px',text:'why this subset: '+sc.rationale}));
      s.append(box);
    });
  }

  [['minibatch','Minibatch'],['gepa','GEPA'],['skillopt','SkillOpt'],['parallel','Parallel']].forEach(([key,label])=>{
    if(!C[key])return;
    s.append(h3(label));
    const rows=AE[key]||[];
    const t=$('table');
    if(key==='minibatch'){
      t.append($('tr',{},$('th',{text:'candidate'}),$('th',{class:'r',text:'reward'}),
        $('th',{class:'r',text:'n tasks'}),$('th',{text:'tasks'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.candidate||'—'})),
        $('td',{class:'r num',text:fmt(r.reward)}),
        $('td',{class:'r num',text:r.n_tasks==null?'—':r.n_tasks}),
        $('td',{class:'muted',text:(r.tasks||[]).join(', ').slice(0,120)}))));
    }else{
      t.append($('tr',{},$('th',{text:'kind'}),$('th',{text:'candidate'}),$('th',{text:'detail'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.kind||'—'})),
        $('td',{},r.candidate||'—'),
        $('td',{class:'muted',style:'font-size:11px',text:JSON.stringify(r.detail||{}).slice(0,200)}))));
    }
    s.append(t);
  });
})();

/* ---------- 8. Candidate leaderboard + git log ---------- */
(function(){
  const s=sec('Candidates'); const t=$('table');
  // "screened" (did this candidate pay for a cheap screen before full-val?) only shown
  // when SOME node has a recorded signal — never rendered as a column of bare "—".
  const showScreened=!!(S.capabilities&&S.capabilities.screened);
  // agent-optimize's cheap screen is OPTIONAL. In a run that never attempted one, every
  // candidate carried a warning-orange "✗ not screened" badge, which reads as a compliance
  // violation when nothing was violated. The badge is only a flag when SOME candidate in the
  // run did screen and this one skipped it; otherwise the column shows "—", the way the seed
  // row already correctly did.
  const anyScreened=G.nodes.some(n=>n.screened===true);
  const byId=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  const hdr=[$('th',{text:'id'}),$('th',{text:'status'}),$('th',{class:'r',text:'val'}),
    $('th',{class:'r',text:'Δ parent'}),$('th',{class:'r',text:'iter'})];
  if(showScreened)hdr.push($('th',{text:'screened'}));
  hdr.push($('th',{text:'reason'}));
  t.append($('tr',{},...hdr));
  G.nodes.slice().sort((a,b)=>(b.val||-1)-(a.val||-1)).forEach(n=>{
    // parent_val is only recorded when the algorithm's round table carried it; when it did
    // not, the parent's OWN val is sitting right there in the same graph, so fall back to it
    // rather than printing "—" for a delta both halves of which are known.
    const pv=n.parent_val!=null?n.parent_val:(n.parent&&byId[n.parent]?byId[n.parent].val:null);
    const dlt=pv!=null&&n.val!=null?(n.val-pv):null;
    const idCell=$('td',{},n.id===S.best_id?'★ '+n.id:n.id);
    // screen+gate bypass (PR #557): a compliance WARNING (never measured), distinct from
    // the accepted/rejected OUTCOME ring the status badge already shows — a different
    // color (b-bypass) so it never reads as a second verdict.
    if(n.bypassed_screen_and_gate){
      const bad=$('span',{class:'badge b-bypass',style:'margin-left:6px',text:'⚠ bypass'});
      bad.addEventListener('mousemove',e=>showTip(e,
        'screen+gate bypass: rejected via driver_judgement with no screen.py record and no '+
        'full-val gate row.\njustification: '+(n.bypassed_gate_justification||'—')));
      bad.addEventListener('mouseleave',hideTip);
      idCell.append(bad);
    }
    const cells=[
      idCell,
      $('td',{},$('span',{class:'badge b-'+n.status,text:n.status})),
      $('td',{class:'r num',text:fmt(n.val)}),
      $('td',{class:'r num',text:dlt==null?'—':(dlt>0?'+':'')+dlt.toFixed(3)}),
      $('td',{class:'r num',text:n.iteration})];
    if(showScreened)cells.push($('td',{},(n.screened==null||(!n.screened&&!anyScreened))?'—':
      $('span',{class:'badge '+(n.screened?'b-accepted':'b-rejected'),text:n.screened?'✓ screened':'✗ not screened'})));
    cells.push($('td',{class:'muted',text:(n.reason||'').slice(0,80)}));
    t.append($('tr',{},...cells));
  });
  s.append(t);
  if(S.git_log&&S.git_log.length){
    s.append($('h2',{text:'Iteration store (git)',style:'margin-top:18px'}));
    const g=$('div',{class:'diff'});
    S.git_log.forEach(r=>g.append($('div',{class:'ctx',text:r.hash+'  '+r.subject})));
    s.append(g);
  }
})();
</script></body></html>
