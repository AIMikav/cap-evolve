r sandbox + prompt/scoring helpers). cap-evolve\n     vendors it as a filtered git subtree at third_party/spreadsheetbench \u2014 point at that,\n     or clone+filter upstream yourself (see third_party/spreadsheetbench/NOTICE.md):\n       SPREADSHEETBENCH_HARNESS_DIR=/path/to/cap-evolve/third_party/spreadsheetbench\n\n  2. Fetch the dataset (NOT vendored \u2014 tens of MB of xlsx files, fetched at run time):\n       ci/benchmarks/spreadsheetbench/fetch_data.sh /some/cache/dir\n     then point at the extracted folder (contains dataset.json + spreadsheet/):\n       SPREADSHEETBENCH_DATA_DIR=/some/cache/dir/sample_data_200\n     SPREADSHEETBENCH_VARIANT selects which release: `sample_200`, `full_912` (the original\n     912-task set, 3 graded copies per task) or `verified_400` (the 400-task verified\n     re-release, 1 graded copy per task \u2014 what recent published work evaluates on). The\n     adapter reads the number of graded copies off disk, so all three just work.\n\n  3. Install Docker (required \u2014 each task runs in its own sandboxed container) and,\n     for accurate scoring of formula-bearing outputs, LibreOffice:\n       sudo apt install libreoffice-calc   # Debian/Ubuntu\n       sudo dnf install libreoffice-calc   # RHEL/Fedora\n       brew install --cask libreoffice     # macOS\n     Scoring degrades gracefully (skips recalculation) if LibreOffice is absent \u2014 but\n     silently: a formula-only cell then reads as empty and never matches, so a task the\n     agent actually solved scores 0. Treat the \"LibreOffice not found\" warning as a\n     setup error, not a nicety. Upstream's docstring asks for 7.5+; RHEL 9's 7.1.8.1\n     recalculates correctly through `--convert-to xlsx` and is verified in use.\n\n  4. Install adapter deps: pip install pandas openpyxl docker tornado requests\n\n  5. Copy this directory to .capevolve/project/adapters/, copy model_config.py alongside.\n\n  6. Set env vars (in .env or shell) \u2014 any litellm provider, see model_config.py:\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  7. Optional env vars:\n       SPREADSHEETBENCH_TASK_IDS=59196,58568         # comma-separated subset (default: all 200)\n       SPREADSHEETBENCH_MAX_TURNS=5                  # rounds of code-exec interaction per task\n       SPREADSHEETBENCH_ROWS=5                       # preview rows shown per sheet in the prompt\n       SPREADSHEETBENCH_CONCURRENCY=4                # parallel tasks (each = one Docker container)\n       SPREADSHEETBENCH_EXEC_TIMEOUT=180             # per code-exec call timeout (s)\n       SPREADSHEETBENCH_LIBREOFFICE_BIN=/path/to/soffice\n\n  8. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES \u2014 ALL the text the agent reads, in two files:\n  - prompt.md         the system prompt: who the agent is, how it should work.\n  - task_template.md  the per-task user message: how the job is framed, what the fields\n                      mean, and the interaction contract. Optional \u2014 no file falls back to\n                      the built-in _TASK_TEMPLATE, so older capabilities are unaffected.\n  Keeping the job description frozen in this file used to leave ~60% of the agent's\n  instruction surface un-optimizable, including the line \"once that file exists, you are\n  done\" \u2014 which encourages exactly the dominant failure (a wrong-but-present output file).\n  Per-task VALUES (instruction, paths, preview, answer_position) are still supplied by the\n  adapter through placeholders that live() validates; see _task_template_error.\n\nHOW IT WORKS:\n  - task \u2026[+102965 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper f __).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 3698, "preview": "{\"train\": [\"10452\", \"105-24\", \"10747\", \"108-24\", \"118-50\", \"11842\", \"141-20\", \"165-23\", \"170-13\", \"1818\", \"192-22\", \"194-19\", \"22-47\", \"247-24\", \"250-20\", \"254-34\", \"262-17\", \"263-1\", \"30930\", \"31011\", \"31915\", \"32023\", \"32255\", \"32337\", \"32438\", \"325-44\", \"32612\", \"32902\", \"34033\", \"3413\", \"35742\", \"36097\", \"370-43\", \"379-36\", \"398-14\", \"39903\", \"39931\", \"408-39\", \"40892\", \"414-20\", \"42354\", \"433-47\", \"43589\", \"45372\", \"46121\", \"46646\", \"472-15\", \"47766\", \"48080\", \"48365\", \"48745\", \"48983\", \"493-18\", \"49333\", \"50916\", \"51090\", \"51249\", \"52216\", \"54085\", \"54638\", \"55060\", \"55421\", \"55427\", \"55965\", \"56274\", \"56427\", \"56786\", \"57113\", \"57445\", \"57558\", \"577-40\", \"57743\", \"58109\", \"58484\", \"58499\", \"585-41\", \"58949\", \"6239\", \"66-24\", \"82-30\"], \"val\": [\"12864\", \"142-12\", \"227-40\", \"267-18\", \"2768\", \"31628\", \"37378\", \"37456\", \"382-10\", \"38462\", \"39046\", \"395-36\", \"402-43\", \"416-15\", \"43436\", \"45635\", \"463-17\", \"46897\", \"47798\", \"48527\", \"48588\", \"48620\", \"48921\", \"50768\", \"51-12\", \"53383\", \"53647\", \"54144\", \"55049\", \"55979\", \"560-12\", \"56563\", \"59196\", \"59595\", \"6698\", \"7902\", \"80-42\", \"8942\", \"9569\", \"9726\"], \"test\": [\"109-21\", \"11276\", \"120-24\", \"12307\", \"13-1\", \"130-9\", \"13284\", \"142-19\", \"14240\", \"146-49\", \"147-48\", \"15380\", \"15387\", \"156-14\", \"1563\", \"15671\", \"157-4\", \"160-6\", \"16511\", \"168-17\", \"17-35\", \"17111 eration of good work (it\ndid in prior runs). So the discipline is \"many fixes, each one real and safe\" \u2014 NOT \"few\nfixes\". Do not stop at the first cluster; work through them all.\n\n## WHAT YOU MAY EDIT \u2014 and the two ways iterations get wasted here\nEdit ONLY the capability files listed in `{{CAP_BRIEF}}` below (the prompt / skill text in\nthis working directory). Everything else you can see is READ-ONLY CONTEXT.\n\n**You may NOT edit the adapter, the harness, the scorer, the benchmark, or the\nenvironment** \u2014 not to make a task pass, not to fix a broken mount or a missing binary,\nnot \"just to unblock the run\". Those files are how your score is MEASURED; changing them\ndoes not improve the capability, and a gain obtained that way is not a result. An\niteration that edits infrastructure has produced NOTHING measurable, however green the\nnumber looks. **If the traces show an ENVIRONMENT fault** (permission denied, missing\nbinary, gateway/network error, timeout, container failure \u2014 the same error on nearly every\ntask, unrelated to the task's content), then the correct and complete action is:\n1. do NOT edit the prompt to work around it (a prose workaround for a broken environment\n   is a speculative edit that fails the REAL test \u2014 the prompt is not the defect), and\n2. state the diagnosis in `PROCESS.md` and `JOURNAL.md` precisely \u2014 the exact error, how\n   many tasks it hit, and what a human must fix \u2014 then STOP. Handing back an accurate\n   \"the environment is broken, here is the evidence\" is a SUCCESSFUL iteration.\n\n**The other way iterations get wasted: another prose rule for a behavior the agent already\nknows.** When the agent has the rule and skips it anyway, adding a second sentence saying\nthe same thing changes nothing \u2014 you must change the STRUCTURE that makes it skippable\n(see the levers below): make the step unavoidable and ordered, make the contract explicit,\nor give a worked example it can patter or a formula is describing a METHOD, not the deliverable.**"}, {"t": "add", "l": "+   \"I need a formula that\u2026\", \"use INDEX/MATCH\", \"how do I write a VLOOKUP\", \"adapt this macro\","}, {"t": "add", "l": "+   \"a VBA loop\" \u2014 all of them mean *give me the result I would get*. Work out what that formula"}, {"t": "add", "l": "+   would evaluate to for each cell and write that value. You are never penalised for not using"}, {"t": "add", "l": "+   the function the user named, and you must never write prose, code, or an explanation into a"}, {"t": "add", "l": "+   cell."}, {"t": "add", "l": "+2. **A formula sitting in an answer cell cannot stand as your answer either** \u2014 once you save"}, {"t": "add", "l": "+   with openpyxl its cached result is gone, so that cell becomes `None`. Decide what the cell"}, {"t": "add", "l": "+   should contain and write it as a literal. Usually that is what the formula evaluated to; if"}, {"t": "add", "l": "+   the instruction says that cell should end up blank or hold something else, follow the"}, {"t": "add", "l": "+   instruction."}, {"t": "add", "l": "+3. **To recover what an existing formula evaluated to, open the input a second time read-only:**"}, {"t": "add", "l": "+   `openpyxl.load_workbook(IN, data_only=True)` returns cached results instead of formula text."}, {"t": "add", "l": "+   Read values from that handle, and edit and save the ordinary (`data_only=False`) one. Never"}, {"t": "add", "l": "+   save the `data_only=True` workbook \u2014 that would freeze every other formula in the file."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Rule 2 \u2014 write the right TYPE"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The grader rounds numbers to 2 decimals and then requires the value to have the **same Python"}, {"t": "add", "l": "+type** as the expected one. A right number of the wrong type scores zero."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+| the answer is | write | never write |"}, {"t": "add", "l": "+| --- | --- | --- |"}, {"t": "add", "l": "+| a number | `int` / `float` \u2014 `42`, `3.5` | the text `\"42\"` |"}, {"t": "add", "l": "+| a date or time | a real `datetime.datetime` / `date` / `time` | the text `\"2016-06-12\"` |"}, {"t": "add", "l": "+| text | `str`, with the source text passed through unchanged | `int(\"001\")`, or a date parsed out of `\"3-4\"` |"}, {"t": "add", "l": "+| nothing | leave the cell `None` (`\"\"` is also accepted) | an invented filler like `\"#N/A\"` or `\"ERROR\"` |"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Where the expected value is text, copy the original string through as it is \u2014 do not strip,"}, {"t": "add", "l": "+re-case, round or re-parse it. Where it is a number, make sure it is a real number and not a"}, {"t": "add", "l": "+numeric-looking string produced by `str()`, an f-string or `\"\".join(...)`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+When you match on keys, normalise **only the comparison** \u2014 `str(a).strip().lower() =="}, {"t": "add", "l": "+str(b).strip().lower()`, and coerce numeric-looking text with `float()` before comparing, since"}, {"t": "add", "l": "+`2014` and `\"2014\"` are different objects. Always write back the original value in its original"}, {"t": "add", "l": "+type, never the normalised form you compared with."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The comparison is on cell values, so put your effort there rather than on appearance. But when"}, {"t": "add", "l": "+the instruction explicitly asks for formatting \u2014 \"left align the answer range\", \"no fill"}, {"t": "add", "l": "+colours\", \"add a filter\", a particular number format \u2014 carry that out as well, once the values"}, {"t": "add", "l": "+are right."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Rule 3 \u2014 `answer_position` is the range that gets CHECKED, not a box to fill in"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Every cell in `answer_position` is compared against the expected workbook \u2014 in both Cell-Level"}, {"t": "add", "l": "+and Sheet-Level tasks. Cells outside it are ignored. Therefore:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Do not blanket-overwrite the range.** A cell inside it that neither the instruction nor the"}, {"t": "add", "l": "+  instruction's rule applied uniformly reaches must still hold its original value at the end."}, {"t": "add", "l": "+  (Clearing or rewriting a cell the instruction does not name individually is right when the"}, {"t": "add", "l": "+  rule you were given covers it \u2014 \"delete every value in column A that isn't `comments`\" covers"}, {"t": "add", "l": "+  the whole column, including a stale formula left in it.)"}, {"t": "add", "l": "+- **Cells already filled in are usually the user's own worked EXAMPLE.** Spreadsheet users"}, {"t": "add", "l": "+  typically do the first few rows by hand and ask you to continue. Print those cells before you"}, {"t": "add", "l": "+  compute, make your rule reproduce them exactly \u2014 that is free validation of your reading of"}, {"t": "add", "l": "+  the instruction \u2014 then apply the same rule to the cells that are still empty, and leave the"}, {"t": "add", "l": "+  example cells as they are."}, {"t": "add", "l": "+- **A cell whose correct answer is \"nothing\" stays empty.** When the instruction describes a"}, {"t": "add", "l": "+  layout \u2014 a matrix, a grid of buckets, a category table \u2014 usually only some of its boxes have"}, {"t": "add", "l": "+  content. Fill those and leave the rest `None`; filling every cell of the rectangle is a common"}, {"t": "add", "l": "+  way to fail an otherwise correct answer. Do not invent a filler value of your own. If,"}, {"t": "add", "l": "+  however, the neighbouring rows of the same table already spell absence a particular way \u2014 a"}, {"t": "add", "l": "+  literal `None`, `N/A`, `-` or `0` in that column \u2014 then match that existing convention exactly"}, {"t": "add", "l": "+  rather than leaving your rows blank: consistency with the table you are extending is what the"}, {"t": "add", "l": "+  user expects."}, {"t": "add", "l": "+- **Never write outside `answer_position`**, and never rename, add, remove or reorder sheets."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Rule 4 \u2014 which sheet"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If `answer_position` names a sheet (`'Sheet2'!B2:B12`), that is the sheet \u2014 take the part before"}, {"t": "add", "l": "+the `!` and strip any `'` from either end (the quoting is sometimes lopsided, as in"}, {"t": "add", "l": "+`worksheet2'!C3:C6`, and the sheet there is `worksheet2`). Match it against `wb.sheetnames`. If"}, {"t": "add", "l": "+it names no sheet (`B2:B43`), the graded sheet is the **first sheet in the workbook** \u2014"}, {"t": "add", "l": "+`wb[wb.sheetnames[0]]`. Do not use `wb.active`: the active sheet is whichever one happened to be"}, {"t": "add", "l": "+selected when the file was last saved, and it is often not the first."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Rule 5 \u2014 produce the output file from the real workbook"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Load the input, change only the cells you must, and save to `output_path`, creating parent"}, {"t": "add", "l": "+directories first. Do **not** write the output with `DataFrame.to_excel` or `pd.ExcelWriter`:"}, {"t": "add", "l": "+that rebuilds the workbook from a frame, which renames the sheet (the grader then finds no sheet"}, {"t": "add", "l": "+by that name and scores zero), drops the other sheets, changes cell types, and blanks every cell"}, {"t": "add", "l": "+pandas read as `NaN` \u2014 including cells whose correct answer was their own original content. Use"}, {"t": "add", "l": "+pandas freely to *read* and compute; if you do, `pd.read_excel(path, header=None, dtype=object,"}, {"t": "add", "l": "+keep_default_na=False)` stops text like `NA`, `None` or `-` becoming blanks. For structural"}, {"t": "add", "l": "+edits use openpyxl's `ws.delete_cols`, `ws.insert_rows` and friends. If openpyxl genuinely"}, {"t": "add", "l": "+cannot express an edit, editing the `.xlsx`'s XML through `zipfile` is an acceptable fallback \u2014"}, {"t": "add", "l": "+just keep every other part of the archive intact."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Working style and recovery"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Read the instruction to the end before coding: a clause about duplicates, ties, precision, or"}, {"t": "add", "l": "+which rows pair up is part of the requirement, not commentary. It was written by a spreadsheet"}, {"t": "add", "l": "+user about their own file, so it names things loosely \u2014 a range it quotes may be narrower than"}, {"t": "add", "l": "+the data, and a criterion it quotes may differ in case or spacing from the cells. Settle such"}, {"t": "add", "l": "+ambiguity against the file rather than by assumption: print the cells, and prefer the reading"}, {"t": "add", "l": "+that reproduces a figure the workbook already fixes. The header text over the target column, and"}, {"t": "add", "l": "+any example the user left nearby \u2014 a worked formula in the next column, a hand-filled row, a row"}, {"t": "add", "l": "+of markers \u2014 specify the job more tightly than the prose does, and they win where the two"}, {"t": "add", "l": "+disagree."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Comparisons against a computed threshold need care: `value >= ref * 1.10` misses exact 10%"}, {"t": "add", "l": "+steps, because `100 * 1.10` is `110.00000000000001`. Scale to integers (`value * 10 >= ref * 11`)"}, {"t": "add", "l": "+or allow a small tolerance whenever a percentage, rate or ratio decides a count."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Each code block runs under a time limit, so keep loops bounded. Note that reading a cell with"}, {"t": "add", "l": "+`ws[f\"A{row}\"]` *creates* it, which makes `ws.max_row` grow as you loop \u2014 read `max_row` once"}, {"t": "add", "l": "+into a variable before iterating, or you will loop forever. If a block raises or times out, read"}, {"t": "add", "l": "+the traceback and fix the cause; never re-run the same block unchanged."}]}, {"file": "task_template.md", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,167 @@"}, {"t": "add", "l": "+<!--"}, {"t": "add", "l": "+  THE AGENT'S JOB DESCRIPTION \u2014 editable capability text, same as prompt.md."}, {"t": "add", "l": "+  This comment block is STRIPPED before the agent sees it."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+  LOAD-BEARING PLACEHOLDERS \u2014 filled in per task, must SURVIVE any edit:"}, {"t": "add", "l": "+    {instruction} {spreadsheet_path} {spreadsheet_content} {instruction_type}"}, {"t": "add", "l": "+    {answer_position} {output_path}"}, {"t": "add", "l": "+  Optional: {max_turns}. No other {braces}. A literal brace must be doubled: {{ or }}."}, {"t": "add", "l": "+-->"}, {"t": "add", "l": "+Solve the following spreadsheet manipulation question."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction"}, {"t": "add", "l": "+{instruction}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_path"}, {"t": "add", "l": "+{spreadsheet_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### spreadsheet_content"}, {"t": "add", "l": "+{spreadsheet_content}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### instruction_type"}, {"t": "add", "l": "+{instruction_type}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### answer_position"}, {"t": "add", "l": "+{answer_position}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### output_path"}, {"t": "add", "l": "+{output_path}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## What these fields mean"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **instruction** \u2014 the change to make, written by the owner of the file. Read it to the end. Any"}, {"t": "add", "l": "+  method it names (a specific Excel function, an array formula, a macro) is a preference about how"}, {"t": "add", "l": "+  they imagined doing it, never part of the deliverable: you are graded on the resulting cell"}, {"t": "add", "l": "+  values, so solve it whichever way is reliable in Python."}, {"t": "add", "l": "+- **spreadsheet_path** \u2014 the input workbook. Read it; never modify it in place."}, {"t": "add", "l": "+- **spreadsheet_content** \u2014 the target range's size, each sheet's real data extent, and a pandas"}, {"t": "add", "l": "+  preview of the first rows. In that preview the leftmost column is a 0-based pandas index and"}, {"t": "add", "l": "+  sheet row 1 was consumed as the header, so **preview row `i` is Excel row `i + 2`**, and pandas"}, {"t": "add", "l": "+  column position `j` is Excel column `j + 1`. Columns shown as `Unnamed: N` are real columns whose"}, {"t": "add", "l": "+  header cell is blank \u2014 not columns to skip; and if *every* column comes back `Unnamed: N`, then"}, {"t": "add", "l": "+  sheet row 1 is not the header row at all \u2014 the real headers sit further down, so find them by"}, {"t": "add", "l": "+  printing cells before you anchor anything to a row number. The preview is only the first few rows;"}, {"t": "add", "l": "+  derive the ranges you actually use from cells you print yourself."}, {"t": "add", "l": "+- **instruction_type** \u2014 `Cell-Level Manipulation`: `answer_position` is the exact cell(s)."}, {"t": "add", "l": "+  `Sheet-Level Manipulation`: `answer_position` is the MAXIMUM range you may modify. Either way"}, {"t": "add", "l": "+  every cell in `answer_position` is checked, and nothing outside it is."}, {"t": "add", "l": "+- **answer_position** \u2014 the only cells you may change, and the only ones that are graded."}, {"t": "add", "l": "+- **output_path** \u2014 write the finished workbook here, at exactly this path."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Set up: two loads, two purposes"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+import os, datetime, openpyxl"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+IN, OUT = \"{spreadsheet_path}\", \"{output_path}\""}, {"t": "add", "l": "+SHEET = \"SheetNameFromAnswerPosition\"   # or wb.sheetnames[0] when answer_position names none"}, {"t": "add", "l": "+RANGE = \"B2:B43\"                        # answer_position with any 'Sheet'! prefix removed"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+wb  = openpyxl.load_workbook(IN)                            # EDIT and SAVE this one"}, {"t": "add", "l": "+ws  = wb[SHEET]"}, {"t": "add", "l": "+wsv = openpyxl.load_workbook(IN, data_only=True)[SHEET]     # READ cached values from this one"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+`ws[a1].value` gives a formula back as TEXT (`'=SUM(C5)/(C19+C20)'`), not a number \u2014 anything you"}, {"t": "add", "l": "+derive from that string is wrong from the start. The computed number lives in `wsv`. Never save"}, {"t": "add", "l": "+`wsv`'s workbook."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Round 1 \u2014 READ before you compute"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Print, with `repr()` and type, every cell you will read from, key off, or anchor to, plus the"}, {"t": "add", "l": "+distinct values of any column you will filter on:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+for a1 in [\"A2\", \"C5\", \"H2\"]:"}, {"t": "add", "l": "+    print(a1, \"formula:\", repr(ws[a1].value), \"| value:\", repr(wsv[a1].value))"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+vals = [wsv[f\"G{{r}}\"].value for r in range(2, 40)]"}, {"t": "add", "l": "+print(\"distinct:\", sorted({{(repr(v), type(v).__name__) for v in vals}})[:20])"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Print the cells of `answer_position` as they arrive in the input, too. **Any that already hold a"}, {"t": "add", "l": "+value are a worked example of the intended answer**: your rule must reproduce them exactly, and"}, {"t": "add", "l": "+that same rule then has to keep running over the cells that are still empty. Leave those example"}, {"t": "add", "l": "+cells as they are, unless one holds a formula \u2014 which cannot survive the save and so must be"}, {"t": "add", "l": "+replaced by the value it stood for."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Years, ids and codes are stored as numbers in one column and as text in another, so"}, {"t": "add", "l": "+`2014 == '2014'` is False, and text criteria differ in case and trailing spaces. Normalise both"}, {"t": "add", "l": "+sides when matching, and note that `''` is a present, empty value, not a failed lookup."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Where the prose is loose, the sheet is precise. The **header text over the target column** and any"}, {"t": "add", "l": "+**example the user left in a neighbouring column or row** \u2014 a worked formula, a hand-filled answer,"}, {"t": "add", "l": "+a row of markers \u2014 are a tighter specification than the sentence you were given, and they win when"}, {"t": "add", "l": "+the two disagree. A header reading \"Open by end of May\" settles a prose clause about \"not closed"}, {"t": "add", "l": "+before the first day of the month\"; it means the state at one instant, not activity across a period."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Round 2 \u2014 SOLVE"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Compute the values in Python, assign only the cells the instruction asks for, and save:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+os.makedirs(os.path.dirname(OUT), exist_ok=True)"}, {"t": "add", "l": "+ws[\"B19\"] = 16        # a literal int / float / datetime / str \u2014 never a string starting with \"=\""}, {"t": "add", "l": "+wb.save(OUT)"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Round 3 \u2014 CHECK the saved file (required; this is what \"done\" means)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Re-open the file you saved and verify it, addressing cells by their literal A1 names rather than by"}, {"t": "add", "l": "+the indices you wrote with:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+```python"}, {"t": "add", "l": "+from openpyxl.utils import range_boundaries, get_column_letter"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+chk = openpyxl.load_workbook(OUT)[SHEET]    # data_only=False, so any formula shows as text"}, {"t": "add", "l": "+src = openpyxl.load_workbook(IN)[SHEET]"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+c0, r0, c1, r1 = range_boundaries(RANGE)              # works for \"B2:B12\" and for \"B4\""}, {"t": "add", "l": "+r1 = min(r1, max(chk.max_row, r0))                    # a range may extend far past the real data"}, {"t": "add", "l": "+cells = [f\"{{get_column_letter(c)}}{{r}}\" for r in range(r0, r1 + 1) for c in range(c0, c1 + 1)]"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+formulas = [a1 for a1 in cells if isinstance(chk[a1].value, str) and chk[a1].value.startswith(\"=\")]"}, {"t": "add", "l": "+changed  = [a1 for a1 in cells if chk[a1].value != src[a1].value]"}, {"t": "add", "l": "+filled   = [a1 for a1 in cells if chk[a1].value not in (None, \"\")]"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+print(f\"{{len(cells)}} checked (rows {{r0}}-{{r1}}) | {{len(filled)}} non-empty | {{len(changed)}} changed\")"}, {"t": "add", "l": "+assert not formulas, f\"these cells still hold formulas: {{formulas[:10]}}\""}, {"t": "add", "l": "+for a1 in changed[:40]:"}, {"t": "add", "l": "+    print(a1, repr(chk[a1].value), type(chk[a1].value).__name__)"}, {"t": "add", "l": "+print(\"changed:\", changed[:80])"}, {"t": "add", "l": "+```"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Each block runs under a time limit, so keep this bounded: the clip to `chk.max_row` above stops you"}, {"t": "add", "l": "+walking thousands of empty rows, and the slices stop the printout flooding. For a very large range,"}, {"t": "add", "l": "+print the counts plus a sample of the first and last populated rows rather than every cell."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Read the output and confirm all four:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. **No cell in the range holds a formula** (the assert above), and none holds an Excel error"}, {"t": "add", "l": "+   string such as `#N/A`, `#NAME?`, `#VALUE!` or `#NUM!`."}, {"t": "add", "l": "+2. **Every type is the type the answer should be** \u2014 numbers as `int`/`float`, dates as `datetime`,"}, {"t": "add", "l": "+   text as `str`, and cells whose answer is nothing left as `None`."}, {"t": "add", "l": "+3. **`changed` is exactly the set of cells the instruction asked you to compute**, plus any cell"}, {"t": "add", "l": "+   that previously held a formula. If it is larger, you have overwritten cells whose expected value"}, {"t": "add", "l": "+   was their own original content; if it is smaller, you have skipped cells you were asked to fill."}, {"t": "add", "l": "+4. **At least one written value agrees with a figure you did not compute yourself** \u2014 a pre-filled"}, {"t": "add", "l": "+   cell of the target range, a cached result elsewhere in the sheet (via `wsv`), or a total the"}, {"t": "add", "l": "+   sheet already contains."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## The interaction contract"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+You have up to {max_turns} rounds. Each reply is exactly ONE ```python fenced code block \u2014 nothing"}, {"t": "add", "l": "+outside the fence, and no second block. Work through the rounds above in order; take extra rounds"}, {"t": "add", "l": "+when you need to read more or to correct a write."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+An output file existing is **not** being done, and neither is a check that prints the right SHAPE \u2014"}, {"t": "add", "l": "+the expected count of non-empty cells, all of the right type \u2014 over wrong values. You are done when"}, {"t": "add", "l": "+the Round-3 output is all-clear. Reply then with no code block, and that ends the task. Once the"}, {"t": "add", "l": "+readback matches what you intended, stop: do not save the file again."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If the check shows a problem, the next block must be diagnostic \u2014 print the source cells with"}, {"t": "add", "l": "+`repr()` and their types, and the intermediate lookups \u2014 and then a corrected write. Never re-send"}, {"t": "add", "l": "+the same block, and never \"fix\" it by narrowing the write so that it stops touching the cells that"}, {"t": "add", "l": "+came out wrong: a correction fixes the rule, not which cells the rule is responsible for. A cell you"}, {"t": "add", "l": "+leave alone is still graded, as a claim that its original contents were the expected answer. If your"}, {"t": "add", "l": "+code raises an error, the traceback comes back to you; fix the cause rather than re-running it."}]}], "cand_0002": [{"file": "prompt.md", "rows": [{"t": "hunk", "l": "@@ -36,17 +36,60 @@"}, {"t": "ctx", "l": " ## Rule 2 \u2014 write the right TYPE"}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-The grader rounds numbers to 2 decimals and then requires the value to have the **same Python"}, {"t": "del", "l": "-type** as the expected one. A right number of the wrong type scores zero."}, {"t": "add", "l": "+The grader normalises each value and then requires the two to have the **same Python type**. A"}, {"t": "add", "l": "+right number of the wrong type scores zero."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " | the answer is | write | never write |"}, {"t": "ctx", "l": " | --- | --- | --- |"}, {"t": "del", "l": "-| a number | `int` / `float` \u2014 `42`, `3.5` | the text `\"42\"` |"}, {"t": "del", "l": "-| a date or time | a real `datetime.datetime` / `date` / `time` | the text `\"2016-06-12\"` |"}, {"t": "del", "l": "-| text | `str`, with the source text passed through unchanged | `int(\"001\")`, or a date parsed out of `\"3-4\"` |"}, {"t": "add" <script>
const DATA = JSON.parse(document.getElementById('run-data').textContent);
const G = DATA.graph, S = DATA.summary, DIFFS = DATA.diffs||{};
const $ = (t,a={},...k)=>{const e=document.createElement(t);for(const[p,v]of Object.entries(a)){
  if(p==='html')e.innerHTML=v;else if(p==='text')e.textContent=v;else e.setAttribute(p,v);}
  for(const c of k)if(c!=null)e.append(c);return e;};
const NS='http://www.w3.org/2000/svg';
const svg=(t,a={})=>{const e=document.createElementNS(NS,t);for(const[p,v]of Object.entries(a))e.setAttribute(p,v);return e;};
/* SVG text node WITH content. `el.append(node)` returns undefined, so the old
   `el.append(svg('text',...)).textContent = x` threw a TypeError on the very first axis
   label — which aborted the whole inline script and silently dropped every panel below
   the fitness chart (heatmap, lineage, cost, evaluations, candidates). */
const txt=(el,a,content)=>{const n=svg('text',a);n.textContent=content==null?'':String(content);el.append(n);return n;};
const fmt=v=>v==null?'—':(+v).toFixed(3);
function escN(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}
const main=document.getElementById('main'), tip=document.getElementById('tip');
const STATUS_META={running:['running','var(--accent)'],awaiting_agent:['awaiting agent','var(--idk)'],
  completed:['completed','var(--ok)'],budget_exhausted:['budget exhausted','var(--warn)'],
  stalled:['stalled','var(--warn)'],interrupted:['interrupted','var(--fail)'],failed:['failed','var(--bad)']};
document.getElementById('hdr').textContent =
  `${S.run_id} · ${S.algorithm||'algorithm not recorded'} · ${S.counts.total-1} candidates · ` +
  `${S.test_sealed?'test sealed':'test not sealed'}`;
function showTip(e,txt){tip.textContent=txt;tip.style.display='block';
  tip.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.style.display='none';}
function sec(title){const s=$('section');s.append($('h2',{text:title}));main.append(s);return s;}
function dsecs(v){v=Math.max(0,Math.round(v||0));if(v<60)return v+'s';
  const m=Math.floor(v/60);if(m<60)return m+'m '+(v%60)+'s';return Math.floor(m/60)+'h '+(m%60)+'m';}

/* ---------- 1. KPI strip ---------- */
(function(){
  const s=sec('Summary'); const g=$('div',{class:'kpis'});
  const dpct=S.delta_pct!=null?`${S.delta_pct>0?'+':''}${S.delta_pct}%`:
            (S.delta_abs!=null?`${S.delta_abs>0?'+':''}${S.delta_abs.toFixed(3)}`:'—');
  const kp=(l,v,cls='',s2='')=>{const k=$('div',{class:'kpi'});k.append($('div',{class:'l',text:l}),
    $('div',{class:'v '+cls,text:v}));if(s2)k.append($('div',{class:'s',text:s2}));return k;};
  const c=S.counts, cost=S.cost;
  g.append(
    kp('best val',fmt(S.best_val),'champ',S.best_id),
    kp('baseline',fmt(S.baseline_val)),
    kp('Δ vs baseline',dpct,(S.delta_abs>0?'ok':'')),
    kp('held-out test',fmt(S.test_reward),'',
       // The raw sealed score alone is not the result — the DELTA against the seed's own test
       // score is, and both were already in final.json. A run can lift val and lose test.
       (S.test_delta!=null||S.test_baseline_reward!=null)
         ?((S.test_delta!=null?(S.test_delta>0?'+':'')+S.test_delta.toFixed(3)+' vs seed ':'')+
           (S.test_baseline_reward!=null?fmt(S.test_baseline_reward):'')+
           (S.test_sealed?' · sealed once':''))
         :(S.test_sealed?'sealed once':'not finalized')),
    kp('candidates',c.total-(c.seed||0),'',
       `${c.accepted} accept · ${c.rejected} reject · ${c.indecisive||0} indecisive · ${c.failed} no-measure`),
    kp('frontier',S.frontier,'','gated leaves with no accepted child'),
    kp('wall clock',`${S.wall_clock_seconds}s`,'',`opt ${S.optimizer_seconds}s · run ${S.runner_seconds}s`),
    kp('cost',`$${cost.total_usd.toFixed(4)}`,'',`opt $${cost.optimizer_usd.toFixed(4)} · run $${cost.runner_usd.toFixed(4)}`),
    // Token count without its split reads as implausible next to the dollar figure (a real run:
    // 206M tokens for $4.80). The split explains it: nearly all of them are RUNNER tokens on a
    // self-hosted endpoint that bills $0, and the dollars are the optimizer's.
    kp('tokens',S.tokens.toLocaleString(),'',S.tokens_by_role?
       `run ${S.tokens_by_role.runner.toLocaleString()} · opt ${S.tokens_by_role.optimizer.toLocaleString()}`:''),
    kp('unattributed $',
       S.cost_ledger?`$${S.cost_ledger.unattributed_usd.toFixed(4)}`:'—',
       (S.cost_ledger&&Math.abs(S.cost_ledger.unattributed_usd)>0.0005?'champ':''),
       'recorded spend the events cannot explain'),
    kp('events',S.event_count!=null?S.event_count:'—','','every line in events.jsonl')
  );
  s.append(g);
})();

/* ---------- 1b. Run status + split honesty ---------- */
(function(){
  const s=sec('Run status');
  const meta=STATUS_META[S.status]||['unknown','var(--muted)'];
  const head=$('div',{style:'display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px'});
  const pill=$('span',{class:'pill',style:`color:${meta[1]};border-color:${meta[1]}66`});
  pill.append($('span',{style:`width:8px;height:8px;border-radius:50%;background:${meta[1]}`}),
              $('span',{text:meta[0]}));
  head.append(pill);
  if(S.algorithm)head.append($('span',{class:'pill',style:'color:var(--accent);border-color:#7c5cff66',
    text:S.algorithm+(S.algorithm_source?' · from '+S.algorithm_source:'')}));
  head.append($('span',{class:'pill',text:S.test_sealed?'test sealed':'test not sealed'}));
  if(S.elapsed_seconds!=null)head.append($('span',{class:'muted num',text:dsecs(S.elapsed_seconds)+(S.elapsed_open?' elapsed so far':' elapsed')}));
  s.append(head);
  if(S.status_reason)s.append($('p',{class:'muted',style:'margin:0 0 10px',text:S.status_reason}));
  const sp=S.splits;
  if(sp&&sp.no_holdout){
    s.append($('div',{class:'banner',html:'<b>No holdout.</b> train, val and test hold the same tasks, so the '+
      '&ldquo;test&rdquo; number is NOT a generalization estimate &mdash; the optimizer saw those tasks. '+
      'Read it as a sanity check only.'}));
  }
  if(sp&&sp.warning)s.append($('div',{class:'banner',text:sp.warning}));
  // Background-task mass-kill (PR #558): 2+ backgrounded Bash calls the harness evicted
  // at the identical millisecond — a compliance WARNING distinct from an outcome, so it
  // gets the 'bad' banner treatment (No holdout above uses the same class).
  (S.background_mass_kills||[]).forEach(mk=>{
    s.append($('div',{class:'banner bad',html:
      `<b>Background task mass-kill.</b> ${mk.count} background tasks were evicted at the `+
      `identical timestamp <code>${mk.timestamp}</code> — the harness's concurrent-`+
      `background-task ceiling, not ${mk.count} tasks coincidentally finishing at once. `+
      `Task ids: ${(mk.task_ids||[]).join(', ')}.`}));
  });
  if(sp)s.append($('p',{class:'muted num',style:'margin:10px 0 0',
    text:`splits · train ${sp.train??'—'} · val ${sp.val??'—'} · test ${sp.test??'—'}`+
         (sp.seed!=null?` · seed ${sp.seed}`:'')+
         '   —   val decides selection; test is scored exactly once and never optimized against.'}));
})();

/* ---------- 1c. Phases timeline ---------- */
(function(){
  const c=S.counts, total=c.total, evaluated=c.accepted+c.rejected;
  const hasBase=S.baseline_val!=null, finalized=(S.test_reward!=null)||S.test_sealed;
  const D=b=>b?'done':'pending';
  const phases=[
    {nm:'Intake',st:D(total>0||hasBase),d:'Interview + scaffold project, adapter, seed.'},
    {nm:'Implement & check',st:D(total>0||hasBase),d:'Hard gate before any budget is spent.'},
    {nm:'Baseline',st:D(hasBase),d:`Freeze splits; seed val ${fmt(S.baseline_val)}.`},
    {nm:'Optimize'+(S.algorithm?' · '+S.algorithm:''),st:finalized?'done':(hasBase?'active':'pending'),
     d:`${evaluated} iters · ${c.accepted} accepted · best ${fmt(S.best_val)}.`},
    {nm:'Finalize',st:D(finalized),d:`Sealed test ${fmt(S.test_reward)}.`},
    {nm:'Report',st:D(finalized),d:'This dashboard.'},
  ];
  const s=sec('Pipeline phases'); const g=$('div',{class:'phases'});
  for(const p of phases){const e=$('div',{class:'phase '+p.st});
    e.append($('div',{class:'nm',text:p.nm}),$('div',{class:'st',text:p.st}),$('div',{class:'d',text:p.d}));
    g.append(e);}
  s.append(g);
})();

/* ---------- 1d. Rejected edits, deduplicated by reason ---------- */
(function(){
  const norm=r=>(r||'rejected').replace(/-?\d+\.\d+/g,'N').replace(/-?\d+/g,'N').trim();
  const map=new Map();
  for(const n of G.nodes){ if(n.status!=='rejected')continue;
    const k=norm(n.reason); const cur=map.get(k)||{reason:k,count:0,ex:[]};
    cur.count++; if(cur.ex.length<3)cur.ex.push(n.id); map.set(k,cur);}
  const ends=[...map.values()].sort((a,b)=>b.count-a.count);
  if(!ends.length)return;
  const s=sec('Rejected edits, grouped by the gate reason');
  for(const d of ends){const e=$('div',{class:'dead'});
    if(d.count>1)e.append($('span',{class:'x',text:'×'+d.count}));
    e.append($('div',{class:'muted',text:d.ex.join(', ')}),$('div',{text:d.reason}));
    s.append(e);}
})();

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

(function(){

  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

  const LOG=S.log||[]; if(!LOG.length)return;
  const s=sec('Activity log — every event this run recorded');
  const bar=$('div',{class:'row',style:'margin-bottom:10px;align-items:center'});
  const q=$('input',{type:'search',placeholder:'search kind, candidate, message…',style:'flex:1;min-width:180px'});
  const phase=$('select'); ['all','intake','baseline','optimize','finalize'].forEach(p2=>
    phase.append($('option',{value:p2,text:p2})));
  const kind=$('select');
  ['all',...[...new Set(LOG.map(r=>r.kind))].sort()].forEach(k=>kind.append($('option',{value:k,text:k})));
  const count=$('span',{class:'muted num'});
  bar.append(q,$('span',{class:'muted',text:'phase'}),phase,$('span',{class:'muted',text:'kind'}),kind,count);
  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));
    if(typeof d.opt_cost_usd==='number')b.push('opt $'+d.opt_cost_usd.toFixed(4));
    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();
    const rows=LOG.filter(r=>{
      if(phase.value!=='all'&&r.phase!==phase.value)return false;
      if(kind.value!=='all'&&r.kind!==kind.value)return false;
      if(!needle)return true;
      return (r.kind+' '+(r.candidate||'')+' '+(r.text||'')+' '+JSON.stringify(r.detail||{}))
        .toLowerCase().includes(needle);
    });
    count.textContent=rows.length+'/'+LOG.length;
    list.innerHTML='';
    if(!rows.length){list.append($('p',{class:'muted',text:'No event matches this filter.'}));return;}
    rows.forEach(r=>{
      const row=$('div',{class:'logrow'});
      row.append($('span',{class:'muted num',text:clock(r.t)}),
        $('span',{class:'muted',style:'font-size:10px;text-transform:uppercase;letter-spacing:.05em',text:r.phase}),
        $('span',{class:'k',style:'color:'+(TONE[r.kind]||'var(--muted2)'),
                  text:r.kind+(r.candidate?' '+r.candidate:'')}),
        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);
      row.addEventListener('click',()=>{
        if(open.has(r.seq)){open.delete(r.seq);det.style.display='none';}
        else{open.add(r.seq);det.style.display='block';}
      });
    });
  }
  q.addEventListener('input',render);phase.addEventListener('change',render);
  kind.addEventListener('change',render);render();
})();

/* ---------- 10. evograph weakness graph (replaces the embedded viewer) ---------- */
(function(){
  const EG=(S.algo_extra||{}).evograph; if(!EG)return;
  const s=sec('Weakness graph — evograph');
  const rounds=(EG.rounds||[]).filter(r=>r.split!=='test');
  const final=(EG.rounds||[]).find(r=>r.split==='test');
  const prim=r=>r.primary_metric?r.metrics[r.primary_metric]:null;
  if(rounds.length){
    const max=Math.max(1e-9,...rounds.map(r=>prim(r)||0),(final?prim(final):0)||0);
    const wrap=$('div',{style:'display:flex;align-items:flex-end;gap:14px;margin-bottom:12px'});
    const col=(label,v,color,note)=>{const d=$('div',{style:'display:flex;flex-direction:column;align-items:center;gap:5px;flex:1'});
      d.append($('span',{class:'num',style:'font-weight:700;font-size:12px',text:v==null?'—':(v*100).toFixed(1)+'%'}),
        $('div',{style:`width:100%;max-width:64px;height:${Math.max(4,(v||0)/max*110)}px;border-radius:4px 4px 0 0;background:${color}`}),
        $('span',{class:'eyebrow',text:label}),$('span',{class:'muted num',style:'font-size:10px',text:note||''}));

    rounds.forEach(r=>wrap.append(col('round '+r.round,prim(r),'var(--accent)',
      (r.num_tasks??'—')+' tasks'+(r.completed_at==null?' · running':''))));
    if(final)wrap.append(col('sealed test',prim(final),'var(--ok)',

    s.append($('p',{class:'muted',style:'margin:0 0 12px',text:

    }else{
      t.append($('tr',{},$('th',{text:'kind'}),$('th',{text:'candidate'}),$('th',{text:'detail'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.kind||'—'})),
        $('td',{},r.candidate||'—'),

/* ---------- 8. Candidate leaderboard + git log ---------- */
(function(){
  const s=sec('Candidates'); const t=$('table');
  // "screened" (did this candidate pay for a cheap screen before full-val?) only shown
  // when SOME node has a recorded signal — never rendered as a column of bare "—".
  const showScreened=!!(S.capabilities&&S.capabilities.screened);
  // agent-optimize's cheap screen is OPTIONAL. In a run that never attempted one, every
  // candidate carried a warning-orange "✗ not screened" badge, which reads as a compliance
  // violation when nothing was violated. The badge is only a flag when SOME candidate in the
  // run did screen and this one skipped it; otherwise the column shows "—", the way the seed
  // row already correctly did.
  const anyScreened=G.nodes.some(n=>n.screened===true);
  const byId=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  const hdr=[$('th',{text:'id'}),$('th',{text:'status'}),$('th',{class:'r',text:'val'}),
    $('th',{class:'r',text:'Δ parent'}),$('th',{class:'r',text:'iter'})];
  if(showScreened)hdr.push($('th',{text:'screened'}));
  hdr.push($('th',{text:'reason'}));
  t.append($('tr',{},...hdr));
  G.nodes.slice().sort((a,b)=>(b.val||-1)-(a.val||-1)).forEach(n=>{
    // parent_val is only recorded when the algorithm's round table carried it; when it did
    // not, the parent's OWN val is sitting right there in the same graph, so fall back to it
    // rather than printing "—" for a delta both halves of which are known.
    const pv=n.parent_val!=null?n.parent_val:(n.parent&&byId[n.parent]?byId[n.parent].val:null);
    const dlt=pv!=null&&n.val!=null?(n.val-pv):null;
    const idCell=$('td',{},n.id===S.best_id?'★ '+n.id:n.id);
    // screen+gate bypass (PR #557): a compliance WARNING (never measured), distinct from
    // the accepted/rejected OUTCOME ring the status badge already shows — a different
    // color (b-bypass) so it never reads as a second verdict.
    if(n.bypassed_screen_and_gate){
      const bad=$('span',{class:'badge b-bypass',style:'margin-left:6px',text:'⚠ bypass'});
      bad.addEventListener('mousemove',e=>showTip(e,
        'screen+gate bypass: rejected via driver_judgement with no screen.py record and no '+
        'full-val gate row.\njustification: '+(n.bypassed_gate_justification||'—')));
      bad.addEventListener('mouseleave',hideTip);
      idCell.append(bad);
    }
    const cells=[
      idCell,
      $('td',{},$('span',{class:'badge b-'+n.status,text:n.status})),
      $('td',{class:'r num',text:fmt(n.val)}),
      $('td',{class:'r num',text:dlt==null?'—':(dlt>0?'+':'')+dlt.toFixed(3)}),
      $('td',{class:'r num',text:n.iteration})];
    if(showScreened)cells.push($('td',{},(n.screened==null||(!n.screened&&!anyScreened))?'—':
      $('span',{class:'badge '+(n.screened?'b-accepted':'b-rejected'),text:n.screened?'✓ screened':'✗ not screened'})));
    cells.push($('td',{class:'muted',text:(n.reason||'').slice(0,80)}));
    t.append($('tr',{},...cells));
  });
  s.append(t);
  if(S.git_log&&S.git_log.length){
    s.append($('h2',{text:'Iteration store (git)',style:'margin-top:18px'}));
    const g=$('div',{class:'diff'});
    S.git_log.forEach(r=>g.append($('div',{class:'ctx',text:r.hash+'  '+r.subject})));
    s.append(g);
  }
})();
</script></body></html>
