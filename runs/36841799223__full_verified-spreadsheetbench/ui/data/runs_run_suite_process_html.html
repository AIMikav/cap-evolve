<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}

 tasks whose behaviour a plausible rule would break (verified in the passing traces)\n\nThese are the landmines. Each one is a *passing* task that depends on the opposite of a rule it is\ntempting to write:\n\n- **80-42** passes *because* it writes the literal strings `\"None\"` (cols D\u2013I) and `\"N/A\"` (col J)\n  into ~7000 graded cells, matching the convention of the existing rows. A blanket \"never write a\n  filler like `N/A` into a cell whose answer is nothing\" is a deterministic regression.\n- **382-10** must **clear** `A18`, which holds `=IFERROR(#REF!/#REF!,0)`, to `None` \u2014 and the\n  instruction never names A18. So \"replace a formula with its computed value\" and \"cells the\n  instruction doesn't name keep their original value\" are *both* wrong as absolutes.\n- **463-17 and 6698** pass by editing the xlsx's XML through `zipfile`, not through openpyxl\n  (463-17 only after its openpyxl attempt hit the 60-second limit). \"Edit the loaded workbook and\n  save it\" would regress both.\n- **463-17 and 416-15** depend on writing the *original* value, not the normalised key they matched\n  on \u2014 so scope any normalisation advice to the comparison only.\n- **560-12, 6698, 80-42** do explicitly-requested formatting work. \"Formatting is not graded\" is\n  true of the comparator but must not be phrased as \"ignore formatting instructions\".\n\n## The \"#N/A error text\" diagnostic is misleading (verified against the saved artifacts)\n\nSix tasks' feedback says the cells contain Excel error text. None of them wrote an `\"#N/A\"` literal\nand none used `data_only=True`. They wrote post-2007 functions **bare** (`AGGREGATE`, `UNIQUE`,\n`TEXTJOIN`, `FILTER`, `TEXTSPLIT`, `MAXIFS`); the xlsx grammar requires these as `_xlfn.*`, so the\nLibreOffice recalc used to produce the diagnostic resolved them to `#NAME?`/`#VALUE!`. They are\ncluster A (formula-instead-of-value), seen through the recalculated copy. **Do not spend an\niteration adding an `_xlfn.` rule** \u2014 it only helps an answer that is a formula, which is the losing\nstrategy on the primary metric.\n\n## Where the ground truth was sitting in the file (pattern, verified in 3 of 4 non-formula failures)\n\nSpreadsheetBench instructions are written by the file's owner, who usually did the first rows by\nhand. 59196's `H3` already held the correct `'D'` (the agent overwrote it); 43436's column header\n*\"Open by of end of May 2022\"* plus the user's neighbouring `H2=COUNTIFS(B:B,G2,D:D,\"\")` disambiguate\nthe prose clause the agent got wrong; 51-12's row 2 held the markers `1,2,3,4`. **A pre-filled cell\ninside `answer_position` is free validation of your reading of the instruction** \u2014 and\nsimultaneously a cell you must not overwrite.\n\n## Promising but not yet tried\n\n- Making the Round-3 `changed`-set comparison an **assert** (it is currently a printout the agent has\n  to interpret). Same for a declared type expectation. Code enforcement beat prose on the formula\n  rule; it should beat prose on the over-write rule too.\n- If Rule 1 under-performs, relocating the formula ban from `prompt.md` into `task_template.md` right\n  beside the write step \u2014 placement next to the action may matter more than wording for this reader.\n- A layout/matrix sub-rule for the hardest cluster-B case (9 boxes, 6 of which must stay blank).\n\n---\n\n> Added at iteration 2, after cand_0001 was stamped **ACCEPTED val=0.925 \u0394=+0.575,\n> fixed={24 tasks}, broke={560-12}**. The items above are now RESULT-confirmed where noted.\n\n## cand_0001's big rule is CONFIRMED (gate RESULT, cand_0001)\n\n- **What worked:** the formula-is-always-`None` rule plus the mandatory Round-3 CHECK fixed **24 of\n  26** tasks in one move (val 0.350 \u2192 0.925). The \"read the scorer, not the scorer's error messages\"\n  method is vindicated: the 6 tasks whose feedback blamed *\"Excel error text\"* were all in the 24\n  fixed, exactly as predicted, and **no `_xlfn.` rule was ever needed**. Do not re-open that.\n- **What didn't:** the rule's *side text* broke **560-12**. The sentence *\"Cells already filled in are\n  usually the user's own worked EXAMPLE \u2026 leave the example cells as they are\"* is a liability \u2014 it\n  also caused 59595. A \"leave what's already there\" instruction with no condition attached will be\n  read as \"those cells are out of scope\".\n- **Confirmed safe after a full passing-trace audit:** all four at-risk carve-outs held \u2014 80-42\n  (literal `\"None\"`/`\"N/A\"` across ~7000 cells), 382-10 (must clear A18), 463-17 and 6698 (XML\n  surgery). None appears in `broke`. **The carve-outs are load-bearing; do not \"simplify\" them.**\n\n## The type contract is looser than it looks (verified in source; corrects the iteration-1 entry)\n\n`transform_value` sends `int`, `float` **and** any `float()`-parseable `str` through\n`round(float(v), 2)` before `compare_cell_value` checks `type(v1) == type(v2)`. Therefore:\n\n- **`int` vs `float` NEVER matters, and a numeric string equals a number** \u2014 `42`, `42.0`, `\"42\"` are\n  one value. Any prompt text asking the agent to normalise integral floats to `int` is pure waste, and\n  ~21 passing tasks write `int` happily.\n- The type errors that **do** cost cells are exactly two: a string `float()` cannot parse (`'n/a'`,\n  `'-'`, `'TBD'`, an error text) sitting where a number is expected, and a number parsed out of text\n  where non-numeric text is expected.\n- **Corollary that matters more than the type rule itself:** because the grader rounds to 2 dp, any\n  self-chosen rounding to 3 or 4 dp can only *create* `x.xx5` tie-breaks that flip the wrong way.\n  This is the entire cause of 9569's 1261/1280 wrong cells \u2014 its selection rule matched gold exactly.\n\n## `answer_position` is a bounding box and the corner is not the anchor (verified in the traces)\n\n- **10 of 40 tasks have gold-EMPTY cells inside `answer_position`**, and several have padding cells\n  holding pre-existing content that must survive. So padding is *\"exactly what it arrived as\"* \u2014\n  never \"usually empty\".\n- **The anchor is set by the instruction, not by the box.** 560-12: *\"The answer should be put from\n  I3\"* with `answer_position` `I2:J7` \u2014 gold has I2/J2 empty, headers at I3/J3, data I4:J6.\n- **Three addresses that look like anchors and are not** (each one is a real passing task that an\n  unqualified anchor rule would break): an address inside a quoted formula or naming source data; a\n  **schematic sketch** of column order (**2768** sketches column F while the real destination is\n  column H); and the far end of a destination **range** (**53647** is given E7:E16 and gold **E15 is\n  empty** \u2014 a range fixes only the *start*).\n\n## Measurements that constrain any future edit (verified in the 37 passing traces)\n\n- **16 of the 37 passing tasks do read + write + check in ONE code block** (they save in round 1).\n  **Any edit that mandates a read-only first block is therefore UNBOUNDED** and is the single most\n  likely way to lose a large chunk of 0.925. I rejected it on the SAFE test; do not re-propose it.\n- **6698 passes by overwriting a pre-filled cached figure that was itself WRONG.** So \"your answer\n  must agree with a figure the sheet already contains\" can only ever be *soft corroboration* \u2014\n  turning it into an `assert` deterministically breaks 6698.\n- **395-36 and 402-43 both ADD a sheet and pass**, so `prompt.md` Rule 3's *\"never rename, add,\n  remove or reorder sheets\"* is literally false. It is harmless today (no failing task needs it) but\n  it is a wrong statement sitting in the prompt \u2014 fix it in an iteration with spare capacity.\n\n## Promising but not yet tried\n\n- If `PLAN` (cand_0002) lands, the same trick is available one level up: have the agent print the\n  **rule** it derived in words in Round 1 and assert the rule reproduces every pre-filled cell. That\n  attacks \"the plan is complete but wrong\", which is the one failure mode `assert not offplan` cannot\n  catch by construction.\n- Hoisting the `PLAN` requirement from `task_template.md` into `prompt.md` as a contract, if the\n  template version is built but not honoured. Placement is still an untested variable on this reader.\n- A rule for openpyxl serialising `0.0` as the string `\"0\"` \u2014 observed in 9569 but it has never been\n  the deciding defect, so it is not worth an iteration on its own.\n\n## From iteration cand_0003 (attribution of cand_0002's mixed rejection; VERIFIED against traces + scorer source)\n\n**VERIFIED \u2014 the grader's 2-dp rounding does not forgive your rounding; it compounds it.**\n`transform_value` does `round(float(v), 2)` on **both** sides, which tempts you into thinking an\nintermediate round to 3 or 4 decimals is harmless. It is not: your round plus the grader's is\n**double rounding**, and it breaks `x.xx5` ties the opposite way. Measured on task 9569 (1280 cells):\nrounding to 4 dp first produced **9 wrong cells**, and 9 is as fatal as 1261 under all-or-nothing\nrange grading. Gold `0.145021572`\u2192`0.15` but `0.145`\u2192`0.14`; `0.075000259`\u2192`0.08` but `0.075`\u2192`0.07`;\n`0.034966941`\u2192`0.03` but `0.035`\u2192`0.04`; `0.264999741`\u2192`0.26` but `0.265`\u2192`0.27`. **Rule: assign the\nworkbook's value object straight through; round only when the instruction asks you to.**\n\n**VERIFIED \u2014 a worked example's digit count is not part of the specification.** Spreadsheet owners\ntype what their number format displays, so a pre-filled cell can hold a rounded transcription of a\nsource value the sheet stores at full precision \u2014 and the **full value** is what the gold answer\nholds (9569: gold `AO9 = 0.170687841`, the owner's cell held `0.1707`, confirmed against the golden\nworkbook). *\"Make your rule reproduce the example exactly\"* is therefore a trap: it is what drove\ncand_0001 to round. Reproduce an example's **rule**, never its digit count \u2014 and if your rule only\nmatches once you round, the rounding is wrong, not the rule.\n\n**VERIFIED \u2014 \"is this pre-filled cell an example or a placeholder?\" is ONE decision class with\nOPPOSITE correct answers, and the discriminator is the column, not the cell.** 59595 needs the\npre-filled `'n/a'` **overwritten** (its neighbours `C7:C11` hold real computed integers, so the\nmarker is the odd one out); 80-42 needs `\"None\"`/`\"N/A\"` **preserved** (they are the convention\nacross ~1000 existing rows). cand_0002 rewrote the class-wide rule and therefore traded one for the\nother \u2014 it fixed 59595 and broke 80-42, exactly as the diagnose skill predicts for a class-wide\nchange. **The discriminating condition that separates them: does the marker recur down the rest of\nthat column (\u21d2 it is the table's way of writing \"no value\", keep it), or is it the odd one out among\nreal computed entries (\u21d2 it is a placeholder for the value you were asked to compute, overwrite it)?**\n\n**VERIFIED \u2014 `answer_position` is a bounding BOX, and the answer's anchor inside it is a separate\nquestion from the box's corner.** Three-step precedence, in order: a cell/row/column the instruction\nnames **inside** the box wins (560-12: box `I2:J7`, instruction says *\"put the answer from I3\"*, so\n`I2:J2` keeps its original contents); failing that, a place the instruction *describes* (\"into the\nfirst available blank rows\" \u2014 80-42; \"continue under the last entry\"); only failing both does the\nanswer start at the box's top-left. **And the anchor fixes only where the answer STARTS.** Which\nvalue lands in which row and column is fixed by the labels the sheet prints along the box's edges,\nplus any orientation the instruction states. 50768 is the proof of the converse: told to print an\nanchor conclusion for a 3\u00d73 matrix whose instruction names no address, the agent invented a \"matrix\nconvention\" and **transposed the axes, overriding labels it had itself printed**. Never lay out a\ngrid from convention while the sheet labels its own axes.\n\n**VERIFIED \u2014 the `PLAN`/`LEAVE` dict + `assert not offplan` apparatus does not work on this\nbenchmark, and the reason is specific enough to generalize.** It was vacuous on all three tasks it\nwas built for (59595's fix appeared in the agent's **first** code block, before `PLAN` existed), and\nit was actively harmful twice: on 9569 `assert not offplan` fired on openpyxl float round-tripping\n(`('AO79','0.373369645','0.37336964500000003')`) and cost a round \u2014 and note its natural \"fix\" is to\nround, the one thing that loses that task; on 80-42 the added machinery coincided with the agent\ncollapsing into a single silent code block with no exploration round at all. **An assert over\nfloating-point cell values has a false-positive rate that an agent pays for in rounds, and the\ncheapest way for it to silence that assert is the behaviour you most need to forbid.**\n\n**REFUTED, do not re-test:** (a) cand_0001's `number_format = \"0.00%\"` overwrite is **not** why 9569\nlost \u2014 colour/fill/font comparison in `evaluation.py` is **commented out** (lines 140\u2013151) and only\n`compare_cell_value` runs, so no formatting is ever compared; (b) **int-vs-float can never decide a\ncell**, so the harness feedback *\"hold int where float was expected \u2014 match the expected type\nexactly\"* is a pre-normalisation diagnostic and is **misleading** \u2014 both go through\n`round(float(v), 2)`. The type check only ever bites a string that `float()` cannot parse (`n/a`,\n`-`, `TBD`), which type-mismatches any number and scores 0.\n\n**Still-known-false statements left in `prompt.md` on purpose** (both fail the REAL test today \u2014 no\ntask fails because of them \u2014 so they are pruning work for an iteration with headroom, not fixes):\n*\"never rename, add, remove or reorder sheets\"* (passing tasks **395-36** and **402-43** both add a\nsheet) and the Rule 2 table row claiming the text `\"42\"` never works where a number is expected (the\nscorer parses numeric-looking strings, so it does work; writing a real number is still better advice).\n\n## From iteration cand_0004 \u2014 the pre-filled-cell cluster, third attempt (VERIFIED against the golden workbook)\n\n**VERIFIED \u2014 \"does the marker recur down the column?\" is NOT a usable discriminator, and the RESULT\nproves it.** `cand_0003` shipped exactly that condition and its RESULT is `fixed={560-12, 9569}` \u2014 59595\nuntouched. The trace shows why: the marker `'n/a'` occupies **C4, C5 and C6**, so *\"if the same marker\nrecurs in the other rows \u2026 you keep it\"* was satisfied on its own terms and selected the wrong branch.\nA frequency test over the column cannot separate 59595 from 80-42. Do not re-propose it in any wording.\n\n**VERIFIED \u2014 the discriminator that gold actually encodes is the INSTRUCTION'S SCOPE.** Read out of\n`1_59595_golden.xlsx` (sheet XML via `zipfile`; openpyxl is not installed in the optimizer shell):\ngold `C4=4, C5=6, C6=12 \u2026 C19=34`, and the owner's own formula is a **shared formula with\n`ref=\"C4:C19\"`** \u2014 one rule applied uniformly to all 16 rows, including the three `'n/a'` rows. Gold\ntracks what the instruction's rule covers, never which cells arrived filled. The four keep-reasons that\nmake this safe across the suite: (1) the instruction scopes the work to the *blank/new/remaining* rows\n(80-42: *\"into the first available, blank rows\"*); (2) the rule is **conditional** and its condition is\nfalse there (142-12: *\"Whenever these conditions are met\u2026\"*); (3) the rule only **reads** that cell \u2014\na key, a criterion, an amount compared (142-12's `G:J`); (4) the rule's value is *nothing* (53647's\ngold-empty `E15`).\n\n**VERIFIED \u2014 the failure was a RETREAT after a clean save, and the check's own wording caused it.**\n59595 wrote the gold values in round 2 (`16 checked | 16 non-empty | 11 changed`), then wrote\n`# Keep the sheet's established convention\u2026` + `ws[f\"C{r}\"] = wsv[f\"C{r}\"].value` and shipped\n`8 changed`. The clause responsible was `task_template.md` Round-3 point 3: *\"If it is larger, you have\noverwritten cells whose expected value was their own original content.\"* **A size test on `changed` is\nnot a correctness test** \u2014 audited over all 40 traces, exactly one task's `changed` decreases between\nrounds and it is the failing one; every passing task with a huge `changed` (80-42 47975, 48921 4448,\n9569 1280, 395-36 300) saved once and passed. The other half of the clause is false too: **37378**\npasses with `changed: ['A4']`, 1 of 5 in-scope cells, because `A2`/`A3` already held the rule's output.\n**Absence from `changed` is agreement, not omission.** General lesson worth more than the fix: ask\n*which instruction the agent was acting on at the moment it went wrong* \u2014 three iterations edited the\npolicy prose while the defect lived in the verification step.\n\n**VERIFIED \u2014 80-42 was never protected by the marker rule.** Its trace finds `start_row = 4000` by\nscanning for the first all-blank row and copies source values through verbatim\n(`vals = [sws_v.cell(sr, c).value for c in src_cols]`); the recurring `'N/A'` in column J is incidental\nand no agent reasoning references the marker heuristic. Its **append logic** is the protection. Corollary\nfor anyone re-reading `cand_0002`'s `broke={80-42}`: what broke it was banning reasoning from emptiness,\nbecause \u2026[+6152 chars truncated]", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001\n\n- **Strategy tried, and whether it moved val:** cannot cite a LEDGER row \u2014 this is iteration 1 and\n  the ledger is empty. The strategy was: (a) cluster all 26 failures before writing a single word,\n  (b) derive every contract claim from the **scorer and adapter source** rather than from the\n  feedback strings, (c) run a **passing-trace regression audit** of each drafted rule *before*\n  committing it, and (d) prefer one piece of code enforcement over more prose. Outcome unknown until\n  the RESULT lands; what is certain is that (b) and (c) each changed the candidate materially.\n- **What (b) bought:** the feedback string for 6 of the 26 tasks points at the wrong cause (\"Excel\n  error text\") and would have sent me to write an `_xlfn.` rule \u2014 i.e. a rule that helps formulas\n  survive, in a benchmark where formulas cannot survive. Reading `evaluation.py` and `adapter.py`\n  instead gave the real contract (`data_only=True`, no recalc, `type()` equality,\n  `sheetnames[0]`) and collapsed a 3-cluster picture into one 25-task cluster. **Generalizable\n  lesson: read the scorer, not the scorer's error messages.**\n- **What (c) bought:** three of my drafted rules were deterministic regressions on *passing* tasks\n  (80-42, 382-10, 463-17/6698) and a fourth was a timeout risk I introduced myself (my verification\n  snippet walked a 95,988-cell range on a passing task). All four were found by auditing the 14\n  passing traces against the draft, none by re-reading the failing ones. **Generalizable lesson: the\n  failing traces tell you what to add; only the passing traces tell you what it will cost. Budget a\n  full pass on them, and treat your own verification code as an edit with a blast radius.**\n- **Plateau/stall signal:** none yet. The one stall *within* the iteration was diagnostic: I spent\n  effort on two wrong hypotheses for the `#N/A` cluster before delegating it. Fanning out 3 read-only\n  subagents (mechanism / non-formula root causes / regression audit) in parallel resolved all three\n  questions faster than serial investigation, and the audit was the highest-value of the three.\n- **Verification limit to plan around:** `openpyxl` is not installed in the optimizer environment and\n  `pip` is unavailable, so I could not execute the snippet I ship. Substitute that worked: enumerate\n  the real `answer_position` shapes from the trajectories (33 rects + 7 single cells, no comma-lists,\n  no full columns) to learn exactly which branches must work, then test the logic against a faithful\n  `Worksheet.__getitem__` stub. That caught the single-cell branch and the 95,988-cell blow-up.\n  **Do this before shipping any code block to the agent** \u2014 a snippet that raises costs a round, and\n  one that times out can lose a passing task.\n- **What to try next iteration:**\n  1. Read the RESULT and `broke={...}` first; check it against the four at-risk passing tasks named\n     in `INSIGHTS.md` before touching any carve-out.\n  2. If the big rule landed, **do not add more prose** \u2014 convert the Round-3 printouts that the agent\n     has to *interpret* (the `changed` set, the types) into asserts. Code enforcement is the lever\n     that this reader tier responds to, and it is only half-used so far.\n  3. If the big rule did not land, the problem is compliance rather than knowledge: test **placement**\n     (formula ban in `task_template.md` next to the write step) as a distinct hypothesis from wording.\n     Treat that as a one-variable experiment so the RESULT is attributable.\n  4. Keep the iteration-1 move single-lever where possible from now on. This one necessarily changed\n     everything at once (empty seed), which means a negative RESULT will be hard to attribute \u2014 the\n     per-edit blast-radius notes in `PROCESS.md` are the only way back to attribution, so keep them.\n\n## Iteration cand_0002\n\n- **Strategy tried:** the search regime changed shape, and recognising that was the main decision.\n  Iteration 1 was *breadth under ignorance* \u2014 26 failures, an empty capability, one huge move.\n  Iteration 2 is *precision under asymmetry*: LEDGER row `cand_0001: ACCEPTED val=0.925 \u0394=+0.575,\n  fixed={24}, broke={560-12}` leaves **3 failures and +0.075 of headroom against a 2\u00b7SE bar on 40\n  tasks**. One regression now costs more than fixing all three remaining tasks gains. So I inverted\n  the iteration-1 budget: instead of clustering-then-auditing, I ran **root-cause on all 3 failures\n  and two passing-trace regression audits in parallel from the start**, and treated every candidate\n  rule as guilty until a named carve-out acquitted it. Four carve-outs survived that process (2768,\n  53647, 50768, 6698); two whole ideas did not.\n- **The lever that iteration 1 pointed at was the right one.** `META_INSIGHTS` item 2 said: if the big\n  rule lands, don't add prose \u2014 convert the Round-3 printouts the agent has to *interpret* into\n  asserts. It landed, and the diagnosis independently arrived at the same place: all three remaining\n  failures **ran the check and passed it**, because the agent supplied both the answer and the\n  standard. Writing the intent down *before* the save (`PLAN`) and asserting the file against it is\n  the only structural way to break that circularity. **Generalizable lesson: when a failing trace\n  shows the agent self-certifying, the missing thing is not a rule \u2014 it is a record the check can\n  disagree with.**\n- **What the 'ship breadth' mandate actually bought at 3 failures:** less than it did at 26. Three of\n  the nine edits (the verdict table, `PLAN`, `assert not offplan`) carry nearly all the expected\n  value; the rest are small knowledge/wording fixes riding along. The honest read is that **breadth\n  and safety trade off directly once the failure set is small** \u2014 every extra edit is another chance\n  to regress 37 tasks for at most 0.025 of upside. I kept the small edits only because each one is\n  provably non-action-changing on passing tasks (a removed obligation, a softened claim, a corrected\n  fact), not because breadth was asked for.\n- **A failure mode of my own prose, found by tracing:** 59595 was caused by a sentence *I wrote in\n  cand_0001* \u2014 *\"Cells already filled in are usually the user's own worked EXAMPLE \u2026 leave the\n  example cells as they are.\"* A \"leave what's there\" instruction with **no discriminating condition**\n  reads as \"those cells are out of scope\". This is the DECISION/PERMISSION lever from the guidance,\n  applied to my own text: the fix was not to delete the advice but to attach the condition (a 5-row\n  verdict table). **Lesson: audit your own previous iteration's prose as a suspect, not as a given \u2014\n  `broke={}` and the surviving failures both point at it.**\n- **Verification limit, handled as prescribed and worth keeping:** openpyxl still isn't installed and\n  pip is still unavailable. The stub route from iteration 1 worked again and caught real things: I ran\n  all three shipped snippets against a faithful `Worksheet.__getitem__`/`range_boundaries` stub over\n  six shapes, including two **negative** controls \u2014 the `\"\"`\u2194`None` round-trip (the assert must *not*\n  fire; it doesn't) and a deliberately skipped cell (it *must* fire; it does). **Adding negative\n  controls is the upgrade over iteration 1** \u2014 \"it doesn't crash\" is not evidence an assert has\n  discriminating power, and an assert without discriminating power is a passing-task hazard for free.\n- **Plateau signal:** none in the score (one ACCEPT at +0.575), but the *information* rate has\n  collapsed \u2014 3 tasks is a very noisy signal against a 2\u00b7SE bar, so the next RESULT may be\n  unattributable even if the edits are right. Mitigation: `PROCESS.md` records a per-edit blast-radius\n  class with named passing tasks, so a `broke={}` set can be mapped back to a specific edit.\n- **What to try next iteration:**\n  1. Read `broke={...}` and check it against the eight named carve-out tasks (2768, 53647, 50768,\n     6698, 463-17, 80-42, 142-12, 382-10) **before** editing any rule that mentions them.\n  2. **With only 3 tasks in play, prefer ONE change over many.** The marginal edit now has negative\n     expected value unless it is provably non-action-changing. If this candidate is rejected, the\n     right response is to re-propose the `PLAN` machinery *alone*, stripped of the four small prose\n     edits, so the RESULT is attributable.\n  3. If `PLAN` is built but not honoured, the open variable is **placement** (template vs\n     `prompt.md`), still untested on this reader after two iterations.\n  4. Spend spare capacity on the one known-false statement in the prompt (*\"never add sheets\"*, which\n     passing tasks 395-36 and 402-43 both violate). It fails the REAL test today, so it is explicitly\n     a *spare-capacity* item, not a fix.\n\n## Iteration cand_0003\n\n- **Strategy tried, and whether it moved val:** cannot cite my own LEDGER row yet, but the strategy\n  was chosen *because of* one: `cand_0002: REJECTED val=0.925 \u0394=+0.000, fixed={560-12, 59595, 9569},\n  broke={402-43, 50768, 80-42}`. A batch that fixes 3 and breaks 3 is the single most informative\n  rejection shape available, and the right response is **not** to re-propose a subset by intuition \u2014\n  it is to spend the iteration on **1:1 attribution** (which sentence moved which task) and let the\n  edit fall out mechanically. I ran six read-only subagents, one per moved task, and the attribution\n  came back clean on all six. That is now the run's most valuable artifact.\n- **The generalizable method: a rejected batch is a natural experiment, and the framework hands you\n  the instrumentation.** `rollouts/val/` contains the *post-edit* traces of the rejected candidate, so\n  for every task that moved you can read what the agent did **under the new text**. That turns\n  \"3 fixed, 3 broken, net zero\" from a dead end into six independent, individually-attributable\n  observations. **Do this before proposing anything after a mixed rejection** \u2014 it is strictly more\n  informative than re-reading the failing tasks, and it is the only way to separate fixing text from\n  breaking text that shipped as one batch.\n- **The decisive attribution trick: check WHEN in the trajectory the behaviour appeared.** 59595's fix\n  showed up in the agent's **first** code block (`if 4 <= r <= 19`), before any output file existed \u2014\n  which proves the Round-2 `PLAN` machinery, which had not run yet, cannot have caused it. One\n  timestamp argument retired a whole apparatus that three other observations had only made look\n  suspicious. **Temporal position inside the trace is evidence that prose comparison cannot give you.**\n- **What the attribution overturned, including my own prior note.** `META_INSIGHTS` for cand_0002 said:\n  if rejected, re-propose the `PLAN` machinery *alone*, stripped of the small prose edits. The traces\n  say the opposite \u2014 `PLAN` was **vacuous on all three fixes** and the small prose edits carried them\n  all. So I dropped `PLAN` and shipped the prose with narrowing conditions. **Lesson: a\n  `what-to-try-next` note is written before the evidence exists; when the evidence arrives, let it\n  overrule the note, and say so explicitly rather than honouring the plan.**\n- **The real lesson about the DECISION/PERMISSION lever, learned the expensive way.** 59595 and 80-42\n  are the *same* decision (\"is this pre-filled cell an example or a placeholder?\") with **opposite**\n  correct answers. cand_0002 rewrote the class-wide rule and therefore could not avoid trading one for\n  the other \u2014 fixing 59595 *necessarily* broke 80-42. The diagnose skill says this in advance (\"fix the\n  exact discriminating condition, never the class-wide rule\") and cand_0002's own PROCESS.md quoted it;\n  it still shipped the class-wide rewrite. **Generalizable: when two tasks in one decision class need\n  opposite actions, no amount of rule *strength* helps \u2014 the edit must be a condition that separates\n  them, and if you cannot name that condition from the data, you do not yet have the edit.** Here the\n  condition was findable and cheap: *does the marker recur down the column, or is it the odd one out?*\n- **A sampling error I made, and the guard against it.** I spent real effort convinced cand_0002's\n  9569 rationale was refuted by the scorer source, because `transform_value` rounds **both** sides to\n  2 dp and the first ~10 rows of the range agree under either rounding. The losing rows were at 39,\n  49, 310, 574, 578, 592, 630, 893, 1077 \u2014 9 `x.xx5` ties out of 1280. **Guard: on an all-or-nothing\n  range metric, never refute a mechanism from a sample; compute the comparison over the whole range,\n  which for a 1280-cell range costs one subagent and seconds.** More generally: a normalisation that\n  collapses *most* differences does not collapse all of them, and 9 fatal cells are invisible to\n  eyeballing while being exactly as fatal as 1261.\n- **Verification limit, unchanged and still handled the same way:** `openpyxl` is absent from the\n  optimizer environment and `pip` is unavailable, so shipped snippets cannot be executed here. This\n  iteration needed less of that than the last two because **I changed no code block** \u2014 all three\n  edits are prose. That is itself a finding: *prose-only edits are cheaper to verify in this\n  environment than snippet edits*, and with a 0.0124 bar and 3 tasks, cheap-to-verify is worth a lot.\n- **Plateau signal:** score is flat (+0.575, then +0.000) but this is **not** an information plateau \u2014\n  the flat iteration produced the attribution that made this one possible. The honest risk is\n  different: at 37/40 passing, the *measurement* is the bottleneck, not the ideas. Three tasks against\n  a 2\u00b7SE bar means a correct candidate can still land unattributable.\n- **What to try next iteration:**\n  1. **Read `broke={...}` against the per-edit carve-out lists in `PROCESS.md` first** (50768, 2768,\n     53647, 80-42, 382-10, 142-12, 38462). Each edit names the passing tasks it was shaped around, so\n     a regression maps straight back to one of three edits instead of a whole batch. This is the\n     payoff of keeping the candidate to three independently-attributable edits.\n  2. **If all three target tasks moved, stop adding and start pruning.** `prompt.md` has gone\n     8585 \u2192 11973 chars across three iterations. Two statements are known-false and are the natural\n     prune targets: *\"never rename, add, remove or reorder sheets\"* (passing tasks 395-36 and 402-43\n     both add a sheet) and the Rule 2 table row claiming the text `\"42\"` never works for a number.\n     Both fail the REAL test today, which is exactly why they are *pruning* work for an iteration with\n     headroom rather than fixes.\n  3. **If a discrimination edit fails again, switch from condition-stating to evidence-printing.**\n     The untested lever on this reader is making the agent *print the column's value distribution*\n     beside each pre-filled cell in Round 1, so the discriminating fact is on screen when the decision\n     is made. That is strictly weaker than an assert \u2014 and cand_0002 established that asserts on this\n     benchmark regress passing tasks (float noise, over-wide ranges), so weaker is the point.\n  4. **Do not spend another iteration on structural machinery in Round 2.** Two iterations of evidence\n     now: the `PLAN`/`LEAVE`/`offplan` apparatus was vacuous where it was supposed to help and harmful\n     where it was not. The levers that have actually moved tasks on this benchmark are (a) a stated\n     mechanism the agent lacked, and (b) a narrowing condition on a decision it was already making.\n\n## Iteration 4 \u2014 the search-process lesson: ask WHICH instruction the agent was obeying when it went wrong\n\n- **What helped most, by a wide margin:** re-reading the failing trace for **when** the wrong value\n  appeared, not just **what** was wrong. 59595 had been read three times as \"the agent preserves a\n  marker it should overwrite\", and all three iterations therefore edited the *policy* prose in\n  `prompt.md` Rule 3. The trace actually shows the agent writing the **gold** answer in round 2, the\n  check printing clean, and the agent then *undoing it* \u2014 acting on `task_template.md`'s Round-3\n  point 3 (*\"If it is larger, you have overwritten cells\u2026\"*), a sentence in a different file and a\n  different section from everything three iterations had been editing. **Generalised heuristic: for\n  any behavioural failure, locate the turn where the trajectory diverges and read the instruction that\n  governs THAT turn.** A policy rule and a verification rule can disagree, and the verification rule\n  wins because it runs last.\n- **Meta-lesson about this benchmark's prompt surface:** the two editable files are not \"system prompt\"\n  and \"framing\". `prompt.md` is the *policy*; `task_template.md` contains the *procedure and the\n  checks*, and the checks are what the agent acts on immediately before finishing. An iteration that\n  only edits `prompt.md` can be defeated by a check sentence that tells the agent to undo the policy.\n  Grep both files for text governing the same decision before editing either.\n- **A size test is not a correctness test, and it had a second false alarm nobody had noticed.** The\n  removed clause's other half (*\"if it is smaller, you have skipped cells you were asked to fill\"*) is\n  false on passing task 37378 (`changed: ['A4']`, 1 of 5 in-scope cells, because two already held the\n  rule's output). It survived three iterations because the task passes anyway. **When you delete a\n  clause for one failure, check its other half against the passing set \u2014 you may be fixing two bugs.**\n- **What worked procedurally:** three parallel read-only subagents, each with ONE narrow question and\n  an explicit \"quote verbatim, recommend nothing\" instruction. The highest-value output was not the\n  confirmation I expected but a landmine I had not considered: the preserved-cell audit found that\n  **142-12**'s rule is *conditional* and its loop nominally covers every row, so the scope rule I was\n  about to write would have overwritten 43 cells and lost the task. Keep-reasons 2 and 3 exist because\n  an audit ran **before** the edit was written, not after. **Audit the blast radius before drafting,\n  not to validate a draft** \u2014 drafting first biases you toward confirming your wording.\n- **What stalled / was retired:** condition-stating on marker *frequency* (`cand_0003`) is now refuted\n  by a RESULT, joining class-wide flips (`cand_0002`) and asserts over cell values. Three of the four\n  designs for this one cluster are dead. The remaining untried lever is **evidence-printing** \u2014 have\n  Round 1 print, per in-range cell, `in-scope` / `out-of-scope: <reason>` before any write, so a\n  retreat has to contradict the agent's own printout. I did not take it this iteration because the\n  retreat had a simpler, documented cause worth removing first, and stacking both would have made the\n  result unattributable.\n- **On restraint at 39/40:** I skipped the two known-false statements again, for the third iteration\n  running. At one failing task and a 0.0124 bar, the value of a *clean, single-cluster, attributable*\n  diff exceeds the value of cosmetic correctness with no measurable effect. If iteration 5 inherits a\n  1.000 val, that is the iteration to prune in \u2014 with nothing else in the diff.\n- **Standing advice for iteration 5:** check `broke={...}` against **142-12** (conditional rule,\n  read-only columns) and **80-42** (blank-row scop \u2026[+4034 chars truncated]", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## From cand_0001 (spreadsheetbench, empty seed)\n\n1. **The optimizer environment lacks the library the capability is about.** `openpyxl` is not\n   installed and `pip` is unavailable, so I could not execute the verification snippet I was shipping\n   into `task_template.md` \u2014 and that snippet is code the agent will run under a 60-second limit on\n   40 tasks, including passing ones. I substituted a hand-written `Worksheet.__getitem__` stub, which\n   did catch two real defects (a single-cell range branch, and a 95,988-cell enumeration that would\n   have risked a timeout on a *passing* task), but a stub is not a test. **Suggestion:** give the\n   proposer a read-only scratch venv containing the benchmark's own runtime dependencies (or just\n   permit `pip install --user` into a throwaway dir), so code destined for the agent can be executed\n   once before it ships. This is cheap and strictly reduces wasted iterations.\n\n2. **Per-task feedback strings can point away from the real cause, and there is no way to flag that.**\n   Six of my 26 failures were reported as *\"the answer cells contain Excel error text (e.g. #N/A)\"*.\n   That description is produced from a **recalculated** copy of the file, while the primary metric\n   (`hard_no_recalc`) never recalculates. The actual defect in all six was the same as in the other\n   19 \u2014 a formula where a literal value was needed \u2014 and the error text was an artifact of\n   LibreOffice resolving bare post-2007 function names (`UNIQUE`, `TEXTJOIN`, \u2026) that the xlsx grammar\n   requires as `_xlfn.*`. Taken at face value, the message leads a proposer to spend an iteration\n   making formulas *recalculate better*, which cannot help the metric being optimized.\n   **Suggestion:** label which metric each feedback line was computed under (e.g. prefix\n   `[recalc-diagnostic]` vs `[primary]`), or suppress recalc-derived diagnostics when\n   `REWARD_RECALC=0`. The information is useful, but it needs its provenance attached.\n\n3. **Nothing in the brief says whether the seed is an empty *control* or a tuned starting point, and\n   the difference changes the whole strategy.** I had to read `adapter.py` to learn that an empty\n   `prompt.md` means *no system message is sent at all* and a missing `task_template.md` falls back to\n   a built-in template \u2014 which, in this case, contained the single most harmful line in the baseline\n   (\"once that file exists, you are done\"). Until I found that, the 0.350 baseline looked like\n   evidence that prompting buys little here. **Suggestion:** when a capability file is empty or\n   absent, state in the iteration brief what the harness substitutes, and include the substituted\n   text. Otherwise iteration 1 is partly spent rediscovering the control condition.\n\n4. **The \"VERIFIED\" test asks for a trace quote, but a trace quote is often the weakest available\n   evidence.** My strongest verifications came from reading the scorer and the adapter (which proved\n   *why* the cells read back empty) and from auditing the 14 *passing* traces (which is what caught\n   three regressions). The failing traces only showed the symptom. **Suggestion:** make the\n   passing-trace blast-radius audit an explicit, named step in the brief's checklist rather than\n   something a proposer has to invent \u2014 and allow source citations to satisfy VERIFIED on equal\n   footing with trace lines. One sentence in the brief would have saved me a near-miss on 80-42.\n\n## From cand_0002 (spreadsheetbench, 3 failures left of 40)\n\n5. **The \"ship as many fixes as possible\" mandate is correct early and actively harmful late, and the\n   brief does not scale it.** At iteration 1 I had 26 failures and breadth was obviously right. At\n   iteration 2 I have **3 failures and +0.075 of headroom against a 2\u00b7SE significance bar**, so each\n   additional edit risks 37 passing tasks for at most 0.025 of upside, and a multi-edit candidate makes\n   a `broke={...}` result nearly unattributable. The brief's wording (\"breadth is the goal; the only\n   brake is regression\") pushed the same direction in both regimes. **Suggestion:** make the breadth\n   instruction a function of the remaining failure count \u2014 e.g. above ~20% failing, ask for breadth;\n   below ~10%, ask for *one* structurally-isolated change plus an explicit attributability argument.\n   The framework knows the failure count when it writes the brief, so this is free.\n\n6. **There is no way to propose a two-candidate A/B within one iteration, which is what a small failure\n   set actually needs.** My three remaining failures have two independent causes (geometry/anchoring,\n   and self-certification of a wrong plan). Shipping both means one RESULT for two hypotheses. Shipping\n   one wastes an iteration out of five. **Suggestion:** let an iteration emit two sibling candidates\n   scored against the same champion, with the budget counting it as one iteration if both are cheap.\n   Attribution is the scarce resource at this stage, not compute.\n\n7. **`unresolved={\u2014}` is reported but its threshold is not.** The brief warns that unresolved tasks\n   \"moved less than 2\u00b7SE of their own measurement \u2014 NOT evidence the edit touched those tasks\", which\n   is exactly the right caution, but I cannot tell how close a task came to that bar. A task that moved\n   1.9\u00b7SE and one that did not move at all are very different signals for designing the next edit.\n   **Suggestion:** report the per-task delta and its SE alongside the verdict, or at least bucket them\n   (`moved-but-insignificant` vs `flat`).\n\n8. **Negative controls should be part of the VERIFIED test when the edit ships code.** Iteration 1's\n   advice (test your snippet against a stub before shipping) was good but incomplete: this iteration I\n   added two *negative* controls \u2014 one input where a new `assert` must NOT fire (the `\"\"`\u2194`None`\n   round-trip) and one where it MUST (a deliberately skipped cell). \"It doesn't crash\" is not evidence\n   that an assert discriminates, and a non-discriminating assert is a pure downside risk on passing\n   tasks. **Suggestion:** when a candidate adds an assertion to agent-facing code, require both\n   directions in the PROCESS write-up.\n\n## From iteration cand_0003\n\n- **`prior_iterations/<id>/diff.patch` is truncated, which breaks the one workflow the file exists\n  for.** `prior_iterations/cand_0002/diff.patch` ends with a literal `... (truncated)` at line 112 and\n  the **entire `task_template.md` half of the diff is absent**. Since `task_template.md` is ~60% of the\n  words the agent reads, that is most of the prior iteration's edit missing from the artifact whose\n  stated purpose is \"read the ones targeting your cluster BEFORE proposing, so you build on prior work\n  instead of repeating it\". I recovered it with `diff -u candidates/cand_0001/* candidates/cand_0002/*`,\n  which works only because `candidates/<id>/` happens to retain full copies. **Suggested fix:** do not\n  truncate `diff.patch` at all (these are two text files \u2014 the full diff is a few KB), or if a cap is\n  needed, truncate **per-file** so every edited file is represented, and say in `CLAUDE.md` that\n  `candidates/<id>/` holds the authoritative full text.\n- **The gate's feedback string contains a diagnostic that is actively misleading, and a candidate can\n  be built on it.** `TYPE: N cell(s) hold int where float was expected \u2014 match the expected type\n  exactly` is computed **before** the scorer's own normalisation, and `transform_value` sends both\n  `int` and `float` through `round(float(v), 2)`, so int-vs-float can *never* decide a cell. Two\n  iterations in a row I had to go read `evaluation.py` to discover the message was wrong. **Suggested\n  fix:** compute the TYPE line post-`transform_value`, so it only reports type mismatches that\n  actually scored 0 (in practice: a string `float()` cannot parse, sitting where a number is expected).\n  That one change would have saved real iteration budget both times.\n- **Consider surfacing a per-task `fixed`/`broke` attribution hint when a candidate's RESULT is mixed.**\n  `fixed={3} broke={3} \u0394=+0.000` is the most informative rejection shape there is, but extracting it\n  cost this iteration six subagents reading post-edit traces by hand. The framework already copies the\n  rejected candidate's trajectories into `rollouts/val/`, which is what made the attribution possible \u2014\n  that is a genuinely good design choice and worth keeping. A cheap addition: for each task in\n  `broke={...}`/`fixed={...}`, record the first trajectory **turn index** at which the new behaviour\n  appears. Temporal position inside the trace is what let me prove the Round-2 `PLAN` machinery could\n  not have caused 59595's fix (the behaviour appeared in the agent's *first* block), and it is\n  mechanical to compute.\n\n## From iteration 4\n\n- **The optimizer shell has no `openpyxl`, on a benchmark whose every artifact is an `.xlsx`.** Reading\n  the golden workbook is the single highest-value verification step available here \u2014 it is what turned\n  *\"the discarded round-2 output would probably have passed\"* into proof this iteration, and what\n  refuted two earlier hypotheses in `cand_0003`. Doing it requires hand-parsing\n  `xl/worksheets/sheet1.xml` + `xl/sharedStrings.xml` through `zipfile`, which costs a tool round and is\n  easy to get wrong (shared formulas, the shared-string table, serial dates). **Suggested fix:** install\n  `openpyxl` in the optimizer environment, or ship a tiny read-only `dump_xlsx.py` helper in\n  `guidance/`. Note the *agent* environment has openpyxl; only the *optimizer's* does not, which is a\n  surprising asymmetry given the optimizer is the one told to \"read the answer/expected artifact\".\n- **`INSTRUCTIONS.md` pushes hard for breadth (\"ship AS MANY real fixes as you can\") in a run state\n  where breadth is unavailable and actively risky.** At 39/40 passing with a 0.2\u00b7SE bar, there is one\n  failing cluster, and every additional edit is by definition aimed at a non-failing task \u2014 which the\n  same document correctly forbids under the REAL test. The two instructions pull in opposite\n  directions, and resolving it took real reasoning time in three consecutive iterations. **Suggested\n  fix:** scale the breadth language to the measured state \u2014 when the framework knows there is 1 failing\n  task, say so (\"one cluster remains; depth and attributability matter more than breadth\") instead of\n  emitting the same \"a timid one- or two-edit iteration is an under-used iteration\" text.\n- **The `## (a) ALWAYS-failing` summary block is truncated mid-sentence** (`TYP`), cutting off exactly\n  the TYPE diagnostic line that names the defect. The full string is available in the trajectory's\n  `score.feedback`, so no information is lost \u2014 but the truncated block is the first thing the\n  optimizer reads, and a reader who trusted it would have the key fact amputated. Truncate on a\n  sentence boundary, or raise the limit for the single-failing-task case.\n\n## Iteration 5 (final) \u2014 cross-run suggestions for cap-evolve itself\n\n- **`prior_iterations/<id>/diff.patch` is TRUNCATED mid-hunk, silently.** `cand_0004`'s copy ends with\n  a literal `... (truncated)` in the middle of a `<example>` block, so two of its five edits (the\n  Round-3 check rewrite and the interaction-contract clause) were **invisible** in the artifact the\n  framework provides for exactly this purpose. I only recovered them because `work/cand_0004/*.md`\n  happened to still exist and I could diff it myself. On a run where the previous candidate's working\n  dir had been cleaned, the mandated workflow (\"read the rejected candidate's diff, keep the edits\n  that did not break a task\") would have been **impossible to execute**. Please either stop truncating\n  `diff.patch`, truncate per-file rather than mid-hunk with a pointer to the full artifact, or state\n  in `RUNMAP.md` where the untruncated version lives.\n\n- **Give the optimizer the regressed task's POST-EDIT trace explicitly.** The decisive artifact this\n  iteration was `rollouts/val/<task>__<rejected_cand>__t0.json` \u2014 the regressed run itself. Nothing in\n  `INSTRUCTIONS.md`, `RUNMAP.md` or `CLAUDE.md` points at it; `./trajectories/` contains only the\n  *champion's* traces, and `RUNMAP.md` mentions `rollouts/<split>/` once, parenthetically, as\n  something you might want. For a rejected parent, the `broke={...}` traces are the single\n  highest-value input in the run. Suggest copying them into\n  `./prior_iterations/<id>/broke/<task>.json` and naming them in the instructions.\n\n- **The `(a) ALWAYS-failing task(s)` summary in the prompt is truncated mid-word** (`...3 cell(s) hold\n  a value of the wrong type. TYP`). The full `score.feedback` is recoverable from the trace, so no\n  information is permanently lost, but it is the first thing the optimizer reads. Truncate on a\n  sentence boundary.\n\n- **The instructions ask for BREADTH (\"fix EVERY failing cluster, a timid one- or two-edit iteration\n  is an under-used iteration\") in a situation where breadth is mathematically unavailable and\n  actively harmful.** At 39/40 with a 0.2\u00b7SE bar, there is one cluster worth +0.025 and every\n  speculative extra edit has negative expected value, because one regression cancels the win exactly.\n  Two of the four iterations in this run were rejected for precisely this reason. Suggest the\n  breadth instruction be conditioned on the number of failing tasks \u2014 e.g. below ~3 failing tasks,\n  switch the emphasis to \"one cluster, maximum collateral control, and name the passing tasks you\n  audited\" rather than \"as many clusters as you can\".\n\n- **A task that has now been broken twice by two structurally different candidates (50768) deserves a\n  flag in the prompt.** The framework knows which tasks have historically regressed; surfacing\n  \"fragile: broken in iterations 2 and 4\" next to the protect-list would have pointed me at the right\n  trace an hour earlier. Likewise, per-task trial counts of 1 make `broke`/`fixed` at 2\u00b7SE hard to\n  distinguish from sampling noise on a near-coin-flip task; for the handful of tasks that have flipped\n  before, more trials would buy more than another candidate.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0003)", "text": "# PROCESS \u2014 what I did this iteration (explainability; REQUIRED)\n\n**Iteration 3/5 \u00b7 candidate `cand_0003` \u00b7 parent: `cand_0001` (champion, val 0.925) \u00b7 bar: paired\n\u0394\u0304 > 0.2\u00b7SE = 0.0124 (SE 0.0620, n=40)**\n\n## The situation this iteration inherits\n\n`cand_0002` **fixed all three remaining failures and broke three passing tasks**, netting exactly\n0.000 and being reverted whole:\n\n> RESULT: REJECTED \u00b7 val=0.925 \u0394=+0.000 \u00b7 fixed={560-12, 59595, 9569} \u00b7 broke={402-43, 50768, 80-42}\n\nSo the diagnosis this iteration is **not** \"which tasks fail\" \u2014 it is **\"which sentence of cand_0002\nmoved which task\"**. A 1:1 attribution is the whole deliverable, because the fixing text and the\nbreaking text were shipped as one batch. I built that attribution from the `cand_0002` trajectories\n(which the framework copied into `rollouts/val/`, giving me the *post-edit* traces for all six moved\ntasks) plus a direct `diff -u` of `candidates/cand_0001/*` against `candidates/cand_0002/*`.\n\n## Attribution table \u2014 the actual ranked issue list\n\n| task | moved | the text that moved it | verdict |\n| --- | --- | --- | --- |\n| **59595** | 0\u21921 | Placeholder-discrimination **prose alone** (Rule 3 verdict row + Rule 2 non-parseable-string fact). Decisive proof: the agent wrote `if 4 <= r <= 19` in its **first** block, before any output file existed and with zero deliberation prose \u2014 so the `PLAN` machinery had not run yet and cannot be the cause. | **RESHIP, narrowed** |\n| **9569** | 0\u21921 | Rule 2b's *\"assign that value object through, unrounded\"*. cand_0001 did `ans = round(float(v), 4)`; cand_0002 did `ans = v`. | **RESHIP, de-contaminated** |\n| **560-12** | 0\u21921 | The **ANCHOR** text alone (the `PLAN`/`LEAVE` dict machinery was vacuous here). Note: the **seed also passed 560-12**, so `cand_0001` was a regression on it. | **RESHIP, narrowed** |\n| **50768** | 1\u21920 | The **ANCHOR** text. Forced to print a prose `ANCHOR:` conclusion on an instruction that names no address, the agent invented a \"matrix convention\" and **transposed the axes**, overriding axis labels it had itself printed. | **cause removed** |\n| **402-43** | 1\u21920 | The Rule 3 **verdict-table / PRE-FILLED rewrite**. With no pre-filled cells inside `answer_position` (Sheet2 absent), branch 3 sent the agent *hunting outside the box*; it found a `THE ABOVE TABLE WOULD BECOME:` illustration and copied that as the deliverable. | **cause removed** |\n| **80-42** | 1\u21920 | **Deleting** *\"leave the example cells as they are\"* and adding the blanket bans *\"never by which cells happen to be empty\"* / *\"never write `if cell.value is None`\"*. cand_0001 passes 80-42 **by** that construct \u2014 the instruction says \"into the first available, **blank** rows\", so emptiness *is* the spec. Output came back byte-identical to input. | **cause removed** |\n\nTags: 59595 and 80-42 are **DECISION/PERMISSION** (same decision class \u2014 \"is this pre-filled cell an\nexample or a placeholder?\" \u2014 with *opposite* correct answers, which is exactly why cand_0002's\nclass-wide rewrite fixed one and broke the other). 9569 is **KNOWLEDGE**. 560-12/50768 are\n**KNOWLEDGE** about where inside the box the answer goes, again with opposite failure directions.\n\n**No ENVIRONMENT fault found.** Every one of the six moves is explained by text in the two editable\nfiles; the grader and adapter behaved consistently across all three runs. Nothing outside\n`prompt.md` and `task_template.md` was touched.\n\n## Changes made this iteration (3 edits, all in the two editable files)\n\n| # | cluster | edit class (skill \u00a7) | file(s) | what it says, and why it generalizes |\n| --- | --- | --- | --- | --- |\n| **A** | 560-12 / 50768 | add a sourced rule + add the reason (\u00a74, \u00a72) + one `<example>` (\u00a75) | `prompt.md` Rule 3 (2 bullets); `task_template.md` `answer_position` bullet + `<example>` | `answer_position` is a **bounding box**, so the answer has its own anchor inside it, by a 3-step precedence: a cell the instruction names *inside the box* \u2192 a place the instruction *describes* (\"the first blank rows\", \"under the last entry\") \u2192 else the box's top-left. **Plus the narrowing second bullet that is the whole point:** the anchor fixes only where the answer *starts*; which value lands in which row/column is fixed by **the labels the sheet prints along the box's edges** plus any orientation the instruction states, and you must never lay out a grid from a convention while the sheet labels its own axes. |\n| **B** | 59595 / 80-42 | add a **narrowing condition** on an existing rule (\u00a74) | `prompt.md` Rule 3; `task_template.md` Round 1 | Keeps *\"leave the example cells as they are\"* **verbatim**, and adds the discriminator: when a pre-filled cell **contradicts your rule**, look down the rest of its column. Marker recurs down the column \u2192 it is the table's absence convention, keep it. Marker is the **odd one out** among real computed entries \u2192 it is a placeholder for the value you were asked to compute, overwrite it. |\n| **C** | 9569 | add a sourced rule + add the reason (\u00a74, \u00a72) | `prompt.md` Rule 2; `task_template.md` Round 1 + Round-3 point 4 | **Never round a value on its way into a cell**, *because* the grader rounds both sides to 2 dp itself, so your round is a **second** rounding and double rounding breaks ties the opposite way. Plus: a worked example's **digit count is not part of the spec** (owners type what their number format displays), so reproduce an example's *rule*, never its digit count \u2014 and \"agreement you had to round to obtain is not agreement\". |\n\n### Dropped, and never to be re-introduced\n\nAll of these are `cand_0002` text that my attribution shows was **vacuous on all three fixes** while\nbeing implicated in all three regressions:\n\n- the Round-2 `PLAN` / `LEAVE` dict machinery and `assert set(PLAN) == set(CELLS)`;\n- `assert not offplan` \u2014 on 9569 it **fired on float round-tripping noise**\n  (`('AO79', '0.373369645', '0.37336964500000003')`) and cost a whole round; worse, its natural\n  \"fix\" is to round, which is the exact failure Edit C forbids;\n- the Round-3 restructure that hoisted `CELLS` into Round 1 and clipped with `ws.max_row` (the\n  **input**, 3999 rows for 80-42) instead of `chk.max_row` (the **saved file**, 7997) \u2014 a latent bug\n  that silently excludes an append destination from the checked range;\n- the unconditional deletion of *\"leave the example cells as they are\"*;\n- the blanket ban on `if cell.value is None`;\n- the mandatory prose `ANCHOR:` print, and the `<example>` that was **task 560-12 verbatim**;\n- Rule 2b's shipped *rationale* for the pre-filled-decimals paragraph, whose illustration was\n  `0.1707` / `0.170687841` \u2014 literally AO9 and G9 of task 9569. I kept the principle and wrote it\n  with no task's numbers in it, which is what makes it a general rule rather than a memorized answer.\n\n## Verify-the-fix (one line per change, against the traces)\n\n- **A, fixes 560-12** \u2014 `answer_position` is `'\u5de5\u4f5c\u88681'!I2:J7` and the instruction says *\"The answer\n  should be put **from I3** with the Headers\u2026\"*. The box starts at I2, the answer starts at I3, and\n  `I2:J2` must keep its original contents. Edit A's step 1 (\"a cell the instruction names inside the\n  box wins\u2026 the box's own first row then has to keep its original contents\") states exactly this.\n  cand_0002's anchor text alone moved this task 0\u21921, so the mechanism is demonstrated, not predicted.\n- **A, does NOT break 50768** \u2014 `F12:H14`, a 3\u00d73 matrix, instruction: *\"Impact of 1 and Likelihood of\n  1 \u2192 the **bottom left** box\"*. cand_0002's failure was inventing an axis convention while the\n  sheet printed its own Impact/Likelihood labels. Edit A's **second bullet** is written against this\n  exact failure (\"fixed by the labels the sheet prints along the box's edges, plus any orientation\n  the instruction states (\\\"the bottom-left box\\\" \u2026). Never lay a grid out from a convention \u2026 while\n  the sheet labels its own axes\"), and I dropped the forced prose `ANCHOR:` print that produced the\n  invention.\n- **A, does NOT break 2768** \u2014 the instruction contains a schematic sketch naming column **F** while\n  the real destination is `'Sheet1'!H2:H18`. Edit A scopes the naming clause to a cell *\"the\n  instruction names **inside** the box\"*, so F (outside) is never licensed. This scoping is the one\n  wording change I C's rationale is the true mechanism, stated generally.\n- **C, does NOT break 38462** \u2014 this is the **only** passing val task whose instruction asks for\n  rounding (*\"round up time \u2026 to the nearest whole hour\"*). I grepped all 40 val instructions for\n  rounding/decimal/precision language to find it. My first draft said \"round only when the\n  instruction asks for *a set number of decimals*\", which would not clearly cover \"nearest whole\n  hour\"; I widened the carve-out to *\"Round only when the instruction itself asks you to \u2014 'to the\n  nearest whole hour', 'to two decimals', 'as a whole percent' \u2014 in which case the rounding is the\n  requirement and you apply it.\"*\n- **402-43 needs no edit at all.** It broke under cand_0002 because branch 3 of the verdict table\n  sent it hunting outside the box. I dropped that branch; the correct action is *not re-introducing\n  the cause*, not adding a counter-rule. (See Deliberately skipped.)\n- **Template contract (mechanical, run before anything else)** \u2014 reproduced the adapter's own\n  validator exactly (`_TEMPLATE_COMMENT_RE.sub(..., count=1)` then `string.Formatter().parse`):\n  comment stripped, **all 6 required placeholders present**, `{max_turns}` present, **0 unknown**\n  placeholders, `str.format` renders, and **all 4** embedded python blocks `compile()` cleanly with\n  braces correctly doubled. One scare worth recording: a naive check flags `{braces}` as an unknown\n  placeholder, but it lives inside the leading HTML comment, which `_read_task_template` strips with\n  `count=1` **before** parsing \u2014 I confirmed that in `adapter.py:868,908` rather than assuming it,\n  since an unknown placeholder raises `KeyError` on every task and scores the whole run 0.\n\n## Blast radius \u2014 per edit, with the named passing tasks checked\n\n| edit | class | passing tasks in the decision class, and what happens to them |\n| --- | --- | --- |\n| **A** anchor | **BOUNDED** \u2014 only changes behaviour when the box is larger than the answer | **50768** (axis-labels clause is written to protect it), **2768** (naming scoped to *inside* the box), **53647** (`E7:E16` with gold `E15` empty \u2014 \"any row the answer never reaches keeps its original contents\" agrees), **80-42** (\"in the first available, blank rows\" is the *described place* branch, which points the right way), **382-10**, **142-12**. No rule here fires when the answer fills its box. |\n| **B** placeholder | **BOUNDED** \u2014 fires only on a pre-filled cell *inside* the box that **contradicts the agent's rule** | **80-42** (branch 1 \u2192 keep the column-wide `None`/`N/A` convention \u2192 still passes), **382-10**, **53647**. It is a *narrowing condition added to* an existing rule, never a class-wide flip \u2014 exactly the DECISION/PERMISSION discipline the diagnose skill prescribes, and the discipline cand_0002 violated. |\n| **C** no-rounding | **BOUNDED by enumeration** \u2014 I enumerated every val instruction mentioning rounding | **38462** is the only passing task affected, and the widened carve-out explicitly licenses its rounding. For every other task the rule removes an operation that could only ever lose precision. |\n\nLength: `prompt.md` 8585 \u2192 11973 chars, `task_template.md` 168 \u2192 192 lines. For comparison\ncand_0002 took the prompt to **13541** chars and the template to 307 lines, and on 80-42 its agent\ncollapsed into a single silent code block with no prints and no exploration round. Staying well\nunder that ceiling was a deliberate constraint, not an accident.\n\n**No constraint-bearing line was dropped.** Two rewrites deliberately *weaken* one clause: *\"make\nyour rule reproduce them exactly\"* \u2192 *\"check your rule against them\"*, in both files. That is Edit C\nitself (the word \"exactly\" is what drove cand_0001 to round), and the constraint it carried survives\nas \"agreement is free validation of your reading of the instruction\" plus the new digit-count\nparagraph. Everything else is pure addition; the formula carve-out, the absence convention, and\n*\"leave the example cells as they are\"* all survive verbatim.\n\n## Deliberately skipped\n\n- **The known-false *\"never rename, add, remove or reorder sheets\"*** in Rule 3. Passing tasks\n  **395-36** and **402-43** both add a sheet and pass, so it is a false statement sitting in the\n  prompt \u2014 but it **fails the REAL test** (no task fails because of it today), and rewriting a rule\n  that two passing tasks already violate harmlessly is an unbounded change for zero expected gain.\n  `META_INSIGHTS` flagged it as a spare-capacity item; with 3 tasks in play and a 0.0124 bar, there\n  is no spare capacity. Left for a future iteration with headroom.\n- **An \"an illustration block elsewhere in the sheet is not the deliverable\" rule for 402-43.**\n  402-43 **currently passes**; the rule would fail the REAL test, and it would also *conflict* with\n  the surviving and load-bearing rule that *\"an example the user left nearby \u2026 wins where the two\n  disagree\"*. Stacking two rules that give opposite verdicts on the same input is the failure mode\n  the capability skill names explicitly. The correct action was removing the cause.\n- **Re-proposing the `PLAN` machinery alone**, which `META_INSIGHTS` suggested as the fallback if\n  cand_0002 was rejected. I dropped it instead, because the attribution evidence that arrived after\n  that note was written contradicts it: `PLAN` was **vacuous on all three fixes** (59595 was fixed in\n  the agent's first block, before `PLAN` existed), and on 9569 its `assert` fired on float noise and\n  cost a round. Re-proposing it alone would spend an iteration re-measuring something the traces\n  already answer.\n- **Nothing was skipped for lack of time.** Every cluster the traces show for this iteration got an\n  edit, and each of the three regressions got its cause removed.\n\n## Process & features used\n\n- **Six read-only subagents in parallel** for the 1:1 attribution \u2014 one per moved task. This was the\n  right shape because the six questions are independent and each needs a deep read of two or three\n  long traces. The highest-value single finding: 59595's fix landed in the agent's **first** code\n  block, which is what falsified `PLAN` as the cause and let me drop the machinery that broke 80-42.\n- **A self-correction worth recording.** I initially judged cand_0002's 9569 rationale (the `x.xx5`\n  tie story) **refuted**, because I sampled the first ~10 rows of the range and `round(0.1707, 2) ==\n  round(0.170687841, 2)` on every one of them. That was a sampling error: the losing rows are at\n  39, 49, 310, 574, 578, 592, 630, 893, 1077. A subagent re-ran the full 1280-cell comparison and\n  found the 9 ties, and I verified four of them by direct computation before shipping. **Lesson: a\n  normalisation that collapses *most* differences does not collapse all of them, and with 1280 cells\n  and all-or-nothing grading, 9 is as fatal as 1261 \u2014 never refute a mechanism from a sample.**\n- **Grounding in source, not feedback strings.** Confirmed from\n  `third_party/spreadsheetbench/evaluation/evaluation.py` that colour/fill/font comparison is\n  **commented out** (lines 140\u2013151) and only `compare_cell_value` runs \u2014 which eliminated my\n  competing hypothesis that cand_0001's `number_format = \"0.00%\"` overwrite caused the 9569 loss, and\n  is why Edit C is about rounding and says nothing about formatting. Also re-confirmed that the\n  harness feedback *\"hold int where float was expected \u2014 match the expected type exactly\"* is a\n  **pre-normalisation diagnostic and is misleading**: `transform_value` sends both `int` and `float`\n  through `round(float(v), 2)`, so int-vs-float can never decide a cell.\n- **Non-overfitting check, run mechanically at the end \u2014 and it caught me.** I grepped both capability\n  files for every val task id, every carve-out task id, and the gold values I had quoted while\n  reasoning. It fired: my first draft of Edit C illustrated double rounding with\n  `round(0.145021572, 2)`, and `0.145021572` is **task 9569's gold value for row 39** \u2014 an eval-set\n  answer pasted into the prompt, which is exactly what the non-overfitting rule forbids, and the same\n  mistake in kind that I criticised cand_0002's `0.1707`/`0.170687841` paragraph for. Replaced with an\n  invented value, `round(0.1250004, 2)` is `0.13` vs `0.12` double-rounded, verified to demonstrate\n  the identical behaviour. Final grep over both files for task ids, gold values, and sheet names\n  (`\u5de5\u4f5c\u88681`, `Consolidate_ALL`) returns nothing. **Lesson: a value you quoted while diagnosing will\n  try to follow you into the prompt \u2014 grep for it, don't trust that you'd notice.**\n- **Prior iterations read in full** before proposing: `LEDGER.md`, both `JOURNAL.md` entries,\n  `INSIGHTS.md`, `META_INSIGHTS.md`, `RUNMAP.md`, `prior_iterations/cand_0001/` and\n  `prior_iterations/cand_0002/`, and `rejected.jsonl`. `prior_iterations/cand_0002/diff.patch` is\n  **truncated** (literal `... (truncated)` at line 112; the whole `task_template.md` half is\n  missing), so I diffed `candidates/cand_0001/*` against `candidates/cand_0002/*` directly \u2014 noted\n  in `FRAMEWORK_IMPROVEMENTS.md`.\n- **Structural difference from `rejected.jsonl`:** cand_0002's rejected entry is the `PLAN`/verdict-\n  table/assert batch. This candidate ships **none** of it. The two ideas that genuinely fixed tasks\n  are re-proposed with a *narrowing condition attached to each* \u2014 which is the structural change,\n  not a re-proposal: cand_0002 changed the class-wide rule, this changes only the condition that\n  discriminates the failing case from the passing one.", "template_only": false}]}, "config": {"project_dir": "/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_full_verified_spreadsheetbench_p
